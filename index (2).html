nResposta: Tudo vem de Deus, e das Suas mãos Lho damos.\n\n## 2. Em que nível de importância a Bíblia coloca dízimos e ofertas, como elementos de adoração?\n\n> Leia Malaquias 3:8 e responda: Em que nível de importância a Bíblia coloca dízimos e ofertas, como elementos de adoração?\n\nResposta: No mesmo nível: Deus diz que é roubado “nos dízimos e nas ofertas”.\n\nDízimos e ofertas têm sentidos diferentes, mas são complementares e estão em pé de igualdade como atos de adoração.\n\n## 3. Quais são os critérios que a Bíblia apresenta para a separação das ofertas, em nossa adoração?\n\n> Leia Deuteronômio 16:17; 1 Coríntios 16:2; 2 Coríntios 9:5. Marque V ou F: ( ) Dt 16:17: a oferta deve ser individual e voluntária. ( ) 1Co 16:2; 2Co 9:5: a oferta deve ser planejada. ( ) 1Co 16:2: a oferta deve ser regular e sistemática. ( ) Dt 16:17; 1Co 16:2: a oferta deve ser proporcional às bênçãos recebidas.\n\nResposta: Todas são verdadeiras: a oferta deve ser individual e voluntária, planejada, regular e sistemática, e proporcional às bênçãos recebidas.\n\n## 4. Como devem ser usadas as ofertas e como a Igreja Adventista do Sétimo Dia as distribui?\n\n> Leia Êxodo 36:3 e responda: Como devem ser usadas as ofertas e como a Igreja Adventista do Sétimo Dia as distribui?\n\nResposta: Para a obra do santuário, isto é, a casa e a obra de Deus.\n\nA Igreja Adventista destina as ofertas alçadas para a construção e manutenção de templos, bem como no apoio à pregação do evangelho em regiões pobres, consideradas campos missionários.\n\n## 5. Antes de adorar a Deus com a devolução fiel e sistemática dos dízimos e ofertas, o que devemos entregar-Lhe?\n\n> Leia 2 Coríntios 8:5. Os cristãos macedônios, em primeiro lugar ____ ao Senhor.\n\nResposta: Deram-se a si mesmos, primeiro ao Senhor.\n\nPor isso, ofertavam com alegria e generosidade (2 Coríntios 8:2), resultando em superabundância na fé e na palavra (2 Coríntios 8:7).\n\n## 6. Define a Bíblia o percentual de nossas ofertas a Deus?\n\n> Leia Deuteronômio 16:17. “Cada um oferecerá ____; segundo a ____”.\n\nResposta: “Cada um oferecerá na proporção em que possa dar, segundo a bênção que o Senhor seu Deus lhe houver concedido.”\n\nCada pessoa deve planejar de acordo com esse critério e estabelecer um percentual de suas rendas como oferta. A diferença, em relação ao dízimo, é que esse percentual é definido pela pessoa.\n\n## 7. Qual deve ser a motivação para ofertarmos?\n\n> Leia 1 Coríntios 13:1-3; João 3:16. ( ) Enriquecer a Deus. ( ) Ser reconhecido como generoso. ( ) Amor a Deus e a Sua causa.\n\nResposta: Amor a Deus e à Sua causa.\n\n## Recapitulação\n\nOfertas são a expressão do coração agradecido e generoso. O crente pode decidir quanto a elas, obedecendo aos critérios bíblicos, segundo os quais a oferta deve ser: a) individual e voluntária, b) planejada, c) regular e sistemática e d) proporcional às bênçãos. Antes e acima da entrega material, conforme o exemplo dos macedônios, está a entrega do próprio coração ao Senhor. Nenhuma outra motivação, a não ser o amor, deve nos levar a ofertar.\n\nComo dizimar e ofertar na Igreja Adventista do Sétimo Dia: o doador preenche um formulário com o valor do dízimo e da oferta e entrega na igreja. O tesoureiro devolve para o doador o recibo correspondente e envia 100% dos dízimos e 40% das ofertas para a Associação, que os administra para a pregação do evangelho. A igreja local fica com 60% das ofertas para seus projetos e manutenção. Dos 40% enviados à Associação/Missão, 20% vão para as missões mundiais e 20% para o evangelismo na Associação local. Solicite ao seu instrutor bíblico o envelope e o formulário.\n\n## Compromisso de fé\n\n[ ] Compreendo e aceito o ensino bíblico quanto a dizimar e ofertar.\n\n[ ] Reconheço que tenho sido abençoado por Deus.\n\n[ ] Estou decidido a manifestar minha gratidão a Ele, sendo liberal na doação de ofertas."}, {"titulo": "Como identificar a igreja verdadeira", "refs": "João 7:17 · Efésios 2:19, 20 · Atos 16:30, 31 · João 14:1-3", "conteudo": "A Enciclopédia das Religiões afirma que existem nove grandes religiões no mundo. Entre essas, está o cristianismo que, por sua vez, está dividido em mais de 35 mil grupos. Como distinguir, entre esses grupos, a igreja verdadeira? Somente a Bíblia pode nos ajudar.\n\n## 1. Qual é a recomendação da Bíblia para encontrar a igreja verdadeira?\n\n> Leia João 7:17; 1 Timóteo 3:15 e responda: Qual é a recomendação da Bíblia para encontrar a igreja verdadeira?\n\nA igreja verdadeira é conhecida pela doutrina. João usa a palavra doutrina e Paulo a palavra coluna. A seguir, veremos oito colunas bíblicas que mantêm a igreja do Deus vivo na Terra.\n\n## 2. Qual é a primeira coluna que sustenta a igreja de Deus?\n\n> Leia Efésios 2:19, 20 e responda: Qual é a primeira coluna que sustenta a igreja de Deus?\n\nFundamento dos apóstolos: Novo Testamento. Fundamento dos profetas: Antigo Testamento, sendo Jesus Cristo a pedra principal. A igreja verdadeira aceita toda a Bíblia como única regra de fé e prática.\n\n## 3. Segunda coluna\n\n> Leia Atos 16:30, 31; 4:12 e responda: Segunda coluna\n\nA igreja verdadeira ensina que a salvação é unicamente pela fé em Cristo (1 Timóteo 2:5).\n\n## 4. Terceira coluna\n\n> Leia João 14:1-3 e responda: Terceira coluna\n\nÉ o ensino da volta de Jesus, com milhares de anjos. Todo olho O verá, os mortos ressuscitarão e reinarão com Cristo por mil anos. A igreja verdadeira ensina essa verdade.\n\n## 5. Quarta coluna\n\n> Leia João 14:15; Apocalipse 12:17 e responda: Quarta coluna\n\nPor ensinar e pregar a validade da Lei, a igreja de Deus é objeto da ira de Satanás (Apocalipse 14:12; leia também 1 João 2:3, 4).\n\n## 6. Quinta coluna\n\n> Leia Apocalipse 12:17; 19:10 e responda: Quinta coluna\n\n“O testemunho de Jesus” é o Espírito de Profecia, ou dom de profecia. Esse dom é característica da igreja de Deus nos últimos dias.\n\n## 7. Sexta coluna\n\n> Leia Isaías 58:13; Ezequiel 20:12, 20 e responda: Sexta coluna\n\nA igreja do Deus vivo ensina a vigência do sábado como verdadeiro dia de adoração, como expressão de amor e sinal de fidelidade Àquele que nos salvou.\n\n## 8. Sétima coluna\n\n> Leia Mateus 24:14; Apocalipse 14:6 e responda: Sétima coluna\n\nA Bíblia descreve três anjos (mensageiros) voando pelo meio do céu pregando a toda nação, tribo, língua e povo. Portanto, a igreja de Deus é um movimento mundial.\n\n## 9. Oitava coluna\n\n> Leia 1 Coríntios 3:16, 17; 6:19, 20 e responda: Oitava coluna\n\nA igreja verdadeira segue os princípios bíblicos de saúde (Gênesis 1:29; Levítico 11).\n\n## 10. Qual é o apelo que Deus faz a Seus filhos sinceros que ainda participam de grupos religiosos que não ensinam toda a verdade bíblica?\n\n> Leia Mateus 7:21-23; João 10:16; Apocalipse 18:4 e responda: Qual é o apelo que Deus faz a Seus filhos sinceros que ainda participam de grupos religiosos que não ensinam toda a verdade bíblica?\n\nResposta: “Sai dela, povo Meu”: Jesus tem outras ovelhas e deseja reuni-las num só rebanho, sob um só pastor.\n\n## Recapitulação\n\nSão estas as oito colunas que identificam a igreja verdadeira: 1) aceita toda a Bíblia como regra de fé; 2) ensina a salvação unicamente pela fé em Cristo; 3) ensina a volta de Jesus; 4) ensina a validade da Lei de Deus; 5) tem o dom de profecia; 6) guarda o sábado; 7) é um movimento mundial que prega a todo o mundo; 8) segue os princípios bíblicos de saúde.\n\n## Compromisso de fé\n\n[ ] Reconheço que a Igreja Adventista do Sétimo Dia possui as oito colunas da verdade.\n\n[ ] Estou feliz porque Deus me guiou a essa igreja.\n\n[ ] Desejo me unir à igreja de Deus."}, {"titulo": "Por que devo ser batizado", "refs": "Efésios 4:5 · Romanos 6:3-4 · Marcos 1:9-10 · Mateus 3:13-15", "conteudo": "Certo dia, Jesus deixou a oficina de carpintaria na vila de Nazaré e Se dirigiu ao rio Jordão, onde Seu primo João Batista estava pregando. Ali, pediu a João que O batizasse, porque, assim, disse Ele, convinha “cumprir toda a justiça” (Mateus 3:13-15). O batismo é um aspecto da justiça do qual as pessoas podem participar. Uma vez que Cristo, que não conheceu pecado, foi batizado para “cumprir toda a justiça”, nós, como pecadores, devemos fazer o mesmo. O exemplo de Jesus e o ensino da Bíblia realçam a importância do batismo.\n\n## 1. Quantas espécies de batismo são reconhecidas na Bíblia?\n\n> Leia Efésios 4:5. Há um ____ Senhor, uma só ____, um só ____.\n\nResposta: Há um só Senhor, uma só fé, um só batismo.\n\n## 2. Qual o significado do batismo na Bíblia?\n\n> Leia Romanos 6:3-4; Colossenses 2:12. a) ____ b) ____ c) ____\n\nResposta: a) Morte para o pecado. b) Sepultamento da velha vida. c) Ressurreição para uma nova vida em Cristo.\n\nA palavra batismo (do grego baptizo) significa mergulhar, imergir, afundar.\n\n## 3. De que forma Cristo foi batizado por João?\n\n> Leia Marcos 1:9-10. Marque V ou F: ( ) Aspersão ( ) Imersão\n\nResposta: Por imersão: Jesus “saiu da água”.\n\n## 4. Que razão Jesus apresentou para ser batizado?\n\n> Leia Mateus 3:13-15. Marque V ou F: ( ) Porque era pecador. ( ) Para dar o exemplo. ( ) Para cumprir a justiça.\n\nResposta: Verdadeiro: para dar o exemplo e para cumprir toda a justiça. Falso: Jesus nunca pecou.\n\n## 5. De acordo com Pedro, no dia de Pentecostes, de que maneira o povo deveria mostrar seu arrependimento?\n\n> Leia Atos 2:38 e responda: De acordo com Pedro, no dia de Pentecostes, de que maneira o povo deveria mostrar seu arrependimento?\n\nResposta: “Arrependei-vos, e cada um de vós seja batizado em nome de Jesus Cristo para remissão dos vossos pecados.”\n\n## 6. Quão essencial é que a pessoa seja batizada nas águas?\n\n> Leia João 3:5; Marcos 16:16. Quem não nascer da ____ e do ____ não pode entrar no reino de Deus. Quem crer e for ____ será salvo.\n\nResposta: Quem não nascer da água e do Espírito não pode entrar no reino de Deus. Quem crer e for batizado será salvo.\n\n## 7. O que Paulo foi orientado a fazer, quando entendeu o plano da salvação?\n\n> Leia Atos 22:16 e responda: O que Paulo foi orientado a fazer, quando entendeu o plano da salvação?\n\nResposta: “Levanta-te, recebe o batismo e lava os teus pecados, invocando o nome dEle.”\n\n## 8. Quando devo tomar a decisão de entregar-me a Deus através do batismo?\n\n> Leia Hebreus 3:15; 2 Coríntios 6:2. ( ) Hoje ( ) Amanhã ( ) Algum dia\n\nResposta: Hoje: “eis, agora, o tempo sobremodo oportuno”.\n\nMateus 28:20 nos ensina que antes do batismo a pessoa precisa ser ensinada sobre as verdades bíblicas e aceitá-las.\n\n## 9. Que dizer então de meu passado, quando vivia em desobediência a Deus?\n\n> Leia Atos 17:30. Não levou Deus em ____ os tempos da ____.\n\nResposta: Deus não levou em conta os tempos da ignorância.\n\n## 10. O que acontecerá se atendermos a ordem de Jesus?\n\n> Leia Apocalipse 22:14. Teremos direito à árvore da ____ e entraremos na cidade pelas ____.\n\nResposta: Teremos direito à árvore da vida e entraremos na cidade pelas portas.\n\nApelo: “Mas a todos quantos O receberam, deu-lhes o poder de serem feitos filhos de Deus, a saber, aos que creem no Seu nome” (João 1:12).\n\n## Compromisso de fé\n\n[ ] Creio no batismo por imersão.\n\n[ ] Desejo ser uma nova criatura.\n\n[ ] Quero entregar minha vida publicamente a Deus através do batismo."}, {"titulo": "Princípios de vida cristã", "refs": "João 5:39 · Isaías 58:13, 14 · Efésios 4:25 · 1 Pedro 3:3, 4", "conteudo": "O cristão é uma “nova criatura”. Em sua vida, “as coisas antigas já passaram; eis que se fizeram novas” (2 Coríntios 5:17). Embora esteja no mundo, não tem compromisso com interesses mundanos. É cidadão e embaixador do reino celestial. Por preceito e exemplo, deve influenciar outras pessoas, oferecendo-lhes um estilo de vida melhor. Não faz isso com extremismo, afetação ou ar de superioridade, mas porque tem Cristo no coração e espalha Seu amor. A Bíblia ensina como tal experiência é vista no dia a dia do cristão.\n\n## 1. Que práticas frequentes contribuem para a manutenção e fortalecimento da fé, e do crescimento espiritual do crente?\n\n> Leia João 5:39; Colossenses 4:2; Hebreus 10:25; Marcos 5:18-20. Leia e anote: a) João 5:39; b) Colossenses 4:2; c) Hebreus 10:25; d) Marcos 5:18-20.\n\nResposta: a) Estudar as Escrituras. b) Perseverar na oração. c) Congregar-se com os irmãos (frequentar a igreja). d) Testemunhar o que Jesus fez por nós.\n\n## 2. Como devemos viver as horas do sábado?\n\n> Leia Isaías 58:13, 14; Lucas 4:16, 31 e responda: Como devemos viver as horas do sábado?\n\nResposta: Como dia santo e deleitoso: deixando os interesses próprios, honrando a Deus e participando do culto, como Jesus fazia.\n\nO exemplo de Cristo nos ensina que o sábado não é um dia de não fazer nada, mas um dia de adoração, comunhão e serviço desinteressado ao semelhante. Os limites do sábado vão desde o pôr do sol de sexta-feira ao pôr do sol do sábado (Neemias 13:19; Lucas 23:50-56). Nesse período, as atividades materiais dão lugar às espirituais.\n\n## 3. Como devem os membros da igreja se comportar em relação a seus irmãos?\n\n> Leia Efésios 4:25; Gálatas 5:13; 6:1, 10. Marque V ou F: ( ) Falar a verdade. ( ) Servir uns aos outros. ( ) Fazer o bem.\n\nResposta: Todas são verdadeiras: falar a verdade, servir uns aos outros pelo amor e fazer o bem a todos.\n\n## 4. Que princípios a Bíblia estabelece para o vestuário feminino?\n\n> Leia 1 Pedro 3:3, 4; 1 Timóteo 2:9. As mulheres devem se vestir com ____ e bom ____.\n\nResposta: Com modéstia e bom senso, valorizando o adorno interior do coração.\n\n## 5. Qual é a atitude do cristão para com o casamento?\n\n> Leia 1 Coríntios 7:10-14; Mateus 19:8, 9; Hebreus 13:4 e responda: Qual é a atitude do cristão para com o casamento?\n\nResposta: Honrá-lo e mantê-lo puro: o casamento é para toda a vida, e o leito conjugal deve ser sem mácula.\n\n## 6. Que diz a Bíblia sobre costumes e diversões mundanos?\n\n> Leia 1 João 2:15-17; Tiago 4:4 e responda: Que diz a Bíblia sobre costumes e diversões mundanos?\n\nResposta: Não devemos amar o mundo nem as coisas do mundo: a amizade do mundo é inimizade contra Deus.\n\n## 7. Que princípios a Bíblia estabelece para orientar o comportamento sexual?\n\n> Leia Êxodo 20:14; 1 Coríntios 6:9, 18 e responda: Que princípios a Bíblia estabelece para orientar o comportamento sexual?\n\nResposta: Não adulterar e fugir da imoralidade sexual: o sexo é para o casamento.\n\n## 8. Qual deve ser o comportamento cristão em relação às autoridades?\n\n> Leia Romanos 13:1-4; 1 Pedro 2:13-14; Atos 5:29 e responda: Qual deve ser o comportamento cristão em relação às autoridades?\n\nResposta: Respeitar e obedecer às autoridades, desde que suas ordens não contrariem as de Deus, pois antes importa obedecer a Deus.\n\n## 9. Que cerimônias foram instituídas por Jesus para os cristãos, e o que elas significam?\n\n> Leia João 13:4, 5, 15; 1 Coríntios 11:23-28 e responda: Que cerimônias foram instituídas por Jesus para os cristãos, e o que elas significam?\n\nSanta Ceia: comemora a morte de Jesus, e nossa morte para o pecado. Lava-pés: cerimônia da humildade; mostra que todos somos iguais perante Deus e igualmente necessitados dEle para a salvação. Pão: representa o corpo de Jesus que foi sacrificado por nós. Suco da uva: simboliza o sangue de Cristo vertido pelos nossos pecados.\n\n## Recapitulação\n\nO cristão deve nutrir sua fé através do estudo diário da Palavra de Deus e da prática da oração. Devemos amar nossos irmãos, frequentar a igreja e testemunhar de Jesus para os outros. As mulheres devem se vestir com modéstia e bom senso. Costumes e diversões mundanos são inimizade contra Deus. Os casados não devem adulterar e os solteiros devem se manter puros. Na Santa Ceia, celebramos a morte de Jesus. O lava-pés é a cerimônia da humildade.\n\n## Compromisso de fé\n\n[ ] Comungar diariamente com Deus, lendo a Bíblia e orando.\n\n[ ] Frequentar regularmente a igreja, participar dos cultos e testemunhar de Cristo.\n\n[ ] Revelar modéstia e bom senso no vestuário.\n\n[ ] Deixar de usar adornos.\n\n[ ] Amar os irmãos.\n\n[ ] Participar sempre da Santa Ceia.\n\n[ ] Não me envolver com as diversões mundanas.\n\n[ ] Manter-me puro no casamento ou como jovem."}, {"titulo": "Educação cristã", "refs": "Jó 36:22 · Gênesis 2:15-17 · 2 Reis 6:1-7 · Mateus 4:18-25", "conteudo": "Educar é desenvolver as faculdades físicas, mentais e espirituais do ser humano. Por esse mesmo caminho, vai a redenção. As duas têm como objetivo a restauração do ser humano ao plano originalmente estabelecido por Deus: a semelhança com Ele. Portanto, não se pode isolar a educação da redenção. As Escrituras têm normas que ajudam a orientar a busca e aquisição da educação verdadeira, cujos benefícios são eternos.\n\n## 1. Por que é importante seguir os conselhos de Deus a respeito da educação de nossos filhos?\n\n> Leia Jó 36:22 e responda: Por que é importante seguir os conselhos de Deus a respeito da educação de nossos filhos?\n\nResposta: Porque Deus é o maior de todos os mestres: “Quem é Mestre como Ele?”\n\n## 2. Qual foi o método original de ensino utilizado por Deus?\n\n> Leia Gênesis 2:15-17; 3:8-10. Marque V ou F: ( ) Deus transmitia Seus ensinos face a face. ( ) Deus ensinava através da natureza.\n\nResposta: Ambas verdadeiras: Deus ensinava face a face e através da natureza, no jardim.\n\n## 3. Qual foi o antecedente bíblico para as modernas escolas cristãs?\n\n> Leia 2 Reis 6:1-7 e responda: Qual foi o antecedente bíblico para as modernas escolas cristãs?\n\nResposta: As escolas dos profetas, como a dirigida por Eliseu.\n\n## 4. De que modo funcionava a escola que Cristo dirigiu durante Seu ministério terrestre?\n\n> Leia Mateus 4:18-25 e responda: De que modo funcionava a escola que Cristo dirigiu durante Seu ministério terrestre?\n\nResposta: Jesus chamou discípulos para andarem com Ele e aprenderem no dia a dia.\n\nCristo chamou discípulos e os levou consigo, ministrando-lhes ensinamentos, enquanto eles O observavam curar, pregar, ensinar e relacionar-Se com as pessoas.\n\n## 5. Que diferença existe entre a educação cristã e a educação secular?\n\n> Leia 1 Coríntios 2:12; 3:19. A sabedoria deste mundo é ____ diante de Deus.\n\nResposta: Loucura diante de Deus.\n\n## 6. Quais são os perigos enfrentados por estudantes cristãos em instituições seculares?\n\n> Leia Colossenses 2:8; 1 Timóteo 6:20, 21. Filosofias e ____, conforme a ____ dos homens, conforme os ____. E tu, ó Timóteo, guarda o que te foi confiado, evitando os ____ e as ____ do saber.\n\nResposta: Filosofias e vãs sutilezas, conforme a tradição dos homens, conforme os rudimentos do mundo. Evitar os falatórios inúteis e profanos e as contradições do falsamente chamado saber.\n\n## 7. Qual é o conselho que a Bíblia dá aos pais com respeito à educação dos filhos?\n\n> Leia Deuteronômio 6:5-9; Efésios 6:4 e responda: Qual é o conselho que a Bíblia dá aos pais com respeito à educação dos filhos?\n\nResposta: Amar a Deus e ensinar Suas palavras aos filhos em todo tempo, criando-os na disciplina e na admoestação do Senhor.\n\n## 8. Quais são os objetivos que o Senhor tem para nossas crianças e nossos jovens?\n\n> Leia Isaías 54:13; 49:25 e responda: Quais são os objetivos que o Senhor tem para nossas crianças e nossos jovens?\n\nResposta: Que todos sejam ensinados do Senhor e tenham grande paz; e Ele mesmo salvará os nossos filhos.\n\n## 9. Qual é o resultado da educação ministrada aos filhos, segundo os caminhos do Senhor?\n\n> Leia Provérbios 22:6. Ensina a ____ no caminho em que deve ____ e, ainda quando for velho não se ____ dele.\n\nResposta: Ensina a criança no caminho em que deve andar, e, ainda quando for velho, não se desviará dele.\n\nA Igreja Adventista do Sétimo Dia mantém uma rede educacional, que vai do ensino fundamental ao superior. Buscamos a excelência na formação acadêmica; porém, sobretudo primamos pela formação moral, ética e espiritual dos alunos. Formamos cidadãos para este mundo e a pátria superior.\n\n## Recapitulação\n\nA Bíblia oferece orientações sobre como podemos obter e possibilitar verdadeira educação, para nós e nossos filhos. A educação cristã e a redenção andam de mãos dadas, com o mesmo objetivo de restaurar o ser humano à imagem de Deus. Por isso, devemos descartar os ensinos materialistas, humanistas e liberais que nos são oferecidos. Eles nos afastam de Deus, que é o centro e a razão de tudo. Nenhum modelo de educação que não esteja centralizado nEle e em Sua Palavra deve ser adotado.\n\n## Compromisso de fé\n\n[ ] Decido seguir a orientação bíblica com respeito à aquisição da verdadeira educação para mim e para meus filhos.\n\n[ ] Preciso da ajuda de Deus para viver esses princípios."}, {"titulo": "A vida no Espírito", "refs": "João 14:16 · Atos 1:4, 12-14 · Atos 2:1-4 · Atos 5:3, 4", "conteudo": "Somente através do Espírito Santo o cristianismo se torna um poder vivificante e transformador na vida dos filhos de Deus. Como Paulo afirmou, “ninguém pode dizer: Senhor Jesus!, senão pelo Espírito Santo” (1 Coríntios 12:3). Sem o Espírito, nossa religião jamais será uma experiência viva. As Escrituras Sagradas nos informam como esse Agente divino nos conduz à plenitude dessa experiência com Jesus.\n\n## 1. Que promessa Jesus fez aos discípulos antes de Sua ascensão?\n\n> Leia João 14:16; Lucas 24:49. E Eu ____ ao Pai, e Ele vos dará outro ____.\n\nResposta: E Eu rogarei ao Pai, e Ele vos dará outro Consolador.\n\n## 2. O que os discípulos fizeram após a ascensão de Cristo?\n\n> Leia Atos 1:4, 12-14. Marque V ou F: ( ) Testemunharam. ( ) Oraram e esperaram. ( ) Se separaram.\n\nResposta: Oraram e esperaram, unânimes, em Jerusalém.\n\n## 3. Quando se cumpriu a promessa?\n\n> Leia Atos 2:1-4 e responda: Quando se cumpriu a promessa?\n\nResposta: No dia de Pentecostes, quando todos ficaram cheios do Espírito Santo.\n\n## 4. Como o Espírito Santo é apresentado na Bíblia?\n\n> Leia Atos 5:3, 4; Mateus 28:19. ( ) Ente divino. ( ) É uma força impessoal. ( ) Não existe.\n\nResposta: Como um Ser divino, uma Pessoa da Divindade: mentir ao Espírito Santo é mentir a Deus.\n\n## 5. Quais são as funções desempenhadas pelo Espírito Santo?\n\n> Leia João 14:26; 16:8-13; 1 Samuel 10:6. Marque V ou F: ( ) Ensinar algumas coisas. ( ) Guiar em toda a verdade. ( ) Convencer do pecado, da justiça e do juízo. ( ) Mudar a natureza humana.\n\nResposta: Verdadeiro: guiar em toda a verdade, convencer do pecado, da justiça e do juízo, e mudar a natureza humana. Falso: Ele ensina todas as coisas, não apenas algumas.\n\n## 6. Quando uma pessoa é batizada com o Espírito Santo?\n\n> Leia João 3:5; Mateus 3:16. Quando é batizada nas ____.\n\nResposta: Quando é batizada nas águas.\n\nA Bíblia associa o batismo do Espírito Santo ao batismo nas águas, mas essa deve ser uma experiência renovada diariamente na vida daqueles que se entregaram a Deus e foram batizados.\n\n## 7. Como podemos saber se o crente possui ou não o Espírito Santo?\n\n> Leia Atos 5:32; Gálatas 5:22-23. Marque V ou F: ( ) Ama a Deus, obedece aos Seus mandamentos e à Sua Palavra (João 14:15). ( ) Sua vida apresenta o fruto, ou as virtudes do Espírito. ( ) Fala em línguas estranhas.\n\nResposta: Verdadeiro: ama a Deus e obedece aos Seus mandamentos, e sua vida apresenta o fruto do Espírito. Falso: falar em línguas estranhas não é a prova.\n\n## 8. O que devemos pedir hoje a Jesus?\n\n> Leia Lucas 11:13. ( ) Espírito Santo ( ) Alegria ( ) Nada\n\nResposta: O Espírito Santo.\n\nO batismo do Espírito Santo deve ser uma experiência diária na vida dos filhos de Deus. Essa experiência está associada a três atividades diárias: estudo da Bíblia, com disposição para obedecer, oração e testemunho aos que ainda não conhecem Jesus.\n\n## Recapitulação\n\nJesus prometeu que nos daria outro Consolador. Após Sua ascensão, os discípulos oraram, confessaram os pecados e esperaram o cumprimento da promessa, no dia de Pentecostes. A Bíblia apresenta o Espírito Santo como um Ser divino. Sua função é nos convencer do pecado, da justiça e do juízo. Ele também muda a natureza humana. Quem possui o Espírito Santo obedece a Deus e aos Seus mandamentos.\n\n## Compromisso de fé\n\n[ ] Dedicarei tempo, todos os dias, ao estudo da Bíblia e à oração, para que seja batizado diariamente com o Espírito Santo. Dessa forma, espero ser poderoso em palavras e ações, bem como no testemunho de minha fé aos semelhantes."}, {"titulo": "Um ministério para todos", "refs": "Mateus 5:13, 14 · Atos 1:8 · Gálatas 5:22-23 · Efésios 4:11-15", "conteudo": "Todo cristão verdadeiro nasce no reino de Deus como missionário, ou seja, toda pessoa que foi salva tem como seu primeiro impulso ou desejo o de salvar alguém. Na verdade, Deus nos chamou também para a tarefa de trabalhar lado a lado com Ele na salvação dos nossos semelhantes. Não só os pastores devem fazer isso. O Espírito Santo capacita todo crente a fim de que, segundo os dons recebidos, possa cumprir sua parte no projeto missionário de Deus. Esse é o ensino da Bíblia.\n\n## 1. O que, de acordo com a afirmação de Jesus, devemos ser?\n\n> Leia Mateus 5:13, 14. Sal da terra e ____ do ____.\n\nResposta: Sal da terra e luz do mundo.\n\n## 2. Quando é que o crente se torna luz no mundo?\n\n> Leia Atos 1:8. Mas, recebereis ____ ao descer sobre vós o Espírito Santo, e sereis Minhas ____.\n\nResposta: Recebereis poder e sereis Minhas testemunhas.\n\n## 3. Qual é a dádiva do Espírito Santo àqueles que O aceitam?\n\n> Leia Gálatas 5:22-23; 1 Coríntios 12:7-11. Fruto e ____ espirituais.\n\nResposta: Fruto e dons espirituais.\n\n## 4. Quais são os dons de capacitação na igreja e qual o seu objetivo?\n\n> Leia Efésios 4:11-15 e responda: Quais são os dons de capacitação na igreja e qual o seu objetivo?\n\nResposta: Apóstolos, profetas, evangelistas, pastores e mestres, para o aperfeiçoamento dos santos, o desempenho do serviço e a edificação do corpo de Cristo.\n\n## 5. Assinale o dom que Deus considera mais importante.\n\n> Leia 1 Coríntios 13:1-3, 13. ( ) Dom de curar. ( ) Dom de línguas. ( ) Dom do amor.\n\nResposta: O amor.\n\n## 6. O que Deus espera de mim quando descubro meus dons?\n\n> Leia 1 Timóteo 4:14. Não te faças ____ para com o dom que há em ____.\n\nResposta: Não te faças negligente para com o dom que há em ti.\n\n## 7. O que a Bíblia diz que somos após o batismo?\n\n> Leia 1 Pedro 2:9. Marque V ou F: ( ) Membros passivos da igreja. ( ) Tornamo-nos ministros ou sacerdotes de Deus.\n\nResposta: Tornamo-nos sacerdócio real, ministros de Deus.\n\n## 8. Qual é a missão que recebemos de Jesus hoje?\n\n> Leia Mateus 28:19-20. Portanto, ide e ____.\n\nResposta: Ide e fazei discípulos de todas as nações, batizando-os e ensinando-os a guardar todas as coisas que Jesus ordenou.\n\nPara crescer espiritualmente, todo crente deve estudar diariamente a Bíblia, orar e trabalhar para levar pessoas a Cristo, seja pela oração intercessora, testemunho pessoal ou ensino da Bíblia. Tal experiência não é mera opção; é condição para recebermos o batismo do Espírito Santo, essencial à nossa caminhada rumo ao Céu. Ou fazemos essas coisas, ou morremos espiritualmente.\n\n## Recapitulação\n\nJesus afirmou que devemos ser o sal da terra e a luz do mundo. Torno-me luz do mundo quando tenho comunhão diária com Deus e o poder do Espírito Santo em minha vida. Todos os que aceitam a Cristo recebem dons e ministérios. Há, na igreja, vários dons de capacitação. O dom mais importante, para Deus, é o amor. Quando descubro meus dons, Deus espera de mim fidelidade no uso deles. Após o batismo, nos tornamos ministros de Deus. O batismo é a ordenação do crente ao ministério. Jesus nos confiou a missão de pregar o evangelho.\n\n## Compromisso de fé\n\n[ ] Quero ser um membro ativo na igreja.\n\n[ ] Quero usar os meus dons e glorificar a Deus.\n\n[ ] Aceito a missão de Jesus e estou disposto a pregar o evangelho."}, {"titulo": "Apêndices", "refs": "Apocalipse 20 · Êxodo 20 · 2 Crônicas 20:20", "conteudo": "Material de apoio citado ao longo dos estudos: o diagrama do milênio, o santuário, os dez mandamentos, mudanças ocorridas na história e a biografia de Ellen G. White.\n\n## Apêndice 1 · O milênio bíblico (Apocalipse 20:1-9)\n\nÚltimos dias (início dos mil anos, na primeira ressurreição): volta de Jesus; ressurreição dos justos; ascensão dos vivos; morte dos ímpios vivos; aprisionamento de Satanás; Terra desolada.\n\nDurante os 1000 anos: justos no Céu; ímpios mortos não ressuscitam; Satanás circunstancialmente preso; Terra em descanso.\n\nEternidade (fim dos mil anos, na segunda ressurreição): a santa cidade desce para a Terra; os ímpios mortos ressuscitam; Satanás é solto; julgamento final; destruição final; Nova Terra.\n\n## Apêndice 1 · O santuário\n\nPátio: 1) pia; 2) altar de sacrifício.\nLugar Santo: 3) candelabro; 4) altar de incenso; 5) mesa com pães.\nSantíssimo: 6) arca da aliança.\n\n## Apêndice 2 · Os Dez Mandamentos segundo a Bíblia (Êxodo 20:3-17)\n\n1. Não terás outros deuses diante de Mim.\n2. Não farás para ti imagens de escultura; não as adorarás.\n3. Não tomarás o nome do Senhor teu Deus em vão.\n4. Lembra-te do dia de sábado para o santificar.\n5. Honra teu pai e tua mãe, para que se prolonguem os teus dias na Terra.\n6. Não matarás.\n7. Não adulterarás.\n8. Não furtarás.\n9. Não dirás falso testemunho contra o teu próximo.\n10. Não cobiçarás a casa do teu próximo. Não cobiçarás a mulher do teu próximo...\n\nEstes mandamentos foram escritos pelo dedo de Deus (Êxodo 31:18). Os primeiros quatro mandamentos enfatizam nosso amor a Deus. Os seis últimos enfatizam nosso amor pelo semelhante (Mateus 22:37-40).\n\nNa lista do catecismo, o mandamento que proíbe a adoração de imagens foi retirado, a guarda do sábado foi substituída pela guarda de domingos e festas, e o décimo mandamento foi dividido em dois para conservar o número dez. “O catecismo segue a divisão dos mandamentos estabelecidos por Santo Agostinho e que se tornou tradicional na Igreja Católica.” (Catecismo da Igreja Católica, Edições Loyola, julho de 2000, p. 545). Diante disso, devemos seguir o conselho dos apóstolos (Atos 5:29; Tito 1:14).\n\n## Apêndice 3 · Mudanças ocorridas na História, durante o período de 1650 anos\n\nOrações pelos mortos, cerca de 300 d.C. Prática do sinal da cruz, a partir de 300. Utilização de velas de cera, a partir de 320. Primeiro decreto dominical, promulgado pelo imperador romano Constantino, em 7/3/321. Mudança do sábado para o domingo, como dia de repouso, pelo Concílio de Laodiceia, em 364. Veneração dos anjos e de santos, e utilização de imagens, em 370. Começo da exaltação de Maria e uso da expressão Mãe de Deus, a partir do Concílio de Éfeso, em 431. Sacerdotes começaram a se vestir de forma distinta dos leigos, em 500. Prática da extrema-unção, 526. Doutrina do purgatório, por Gregório I, em 593. Orações dirigidas a Maria, santos mortos e anjos, em 600. Título de Papa ou Bispo Universal, dado a Bonifácio III pelo imperador Focas, em 607. Prática de beijar o pé do papa, em 709. Culto à cruz, imagens e relíquias, em 786. Água benta, em 850. Primeira canonização de santos mortos, pelo papa João XV, em 995. Jejum às sextas-feiras durante a Quaresma, em 998. Celibato sacerdotal, decretado por Gregório VII (Hildebrando), em 1079. Inquisição, instituída pelo Concílio de Verona, em 1184. Venda de indulgências, em 1190. Transubstanciação, proclamada pelo papa Inocêncio III, em 1215. Confissão auricular de pecados ao sacerdote, no Concílio de Latrão, em 1215. Proibição do acesso dos leigos à Bíblia, pelo Concílio de Valência, em 1229. Dogma do purgatório, pelo Concílio de Florença, em 1439. Confirmação da doutrina dos Sete Sacramentos, em 1439. Ave Maria, em 1508. Tradição declarada pelo Concílio de Trento como autoridade igual à da Bíblia, em 1545. Livros apócrifos acrescentados à Bíblia pelo Concílio de Trento, em 1546. Imaculada Conceição de Maria, proclamada pelo papa Pio IX, em 1854. Sílabo de erros, proclamado por Pio IX, em 1864. Infalibilidade papal em matéria de fé e de moral, pelo Concílio Vaticano, em 1870. Assunção de Maria, proclamada por Pio XII, em 1950. Proclamação de Maria como mãe da Igreja, pelo papa Paulo VI, em 1965.\n\n## Semana de adoração dos romanos\n\nDomingo, dia do Sol (o “Dia do Sol” era feriado pagão). Segunda-feira, dia da Lua. Terça-feira, dia de Marte. Quarta-feira, dia de Mercúrio. Quinta-feira, dia de Júpiter. Sexta-feira, dia de Vênus. Sábado, dia de Saturno.\n\n## Apêndice 4 · Ellen G. White\n\nEllen Gould Harmon nasceu em 26/11/1827, nos Estados Unidos. Aos nove anos, foi atingida por uma pedra jogada por uma colega de escola, acidente este que quase lhe custou a vida. Durante três semanas, permaneceu inconsciente e, finalmente, teve que abandonar os estudos. Aos 12 anos de idade, foi batizada, juntamente com vários familiares, em uma igreja metodista. Depois de assistir a várias reuniões adventistas em Portland, em 1842, aceitou plenamente os ensinamentos apresentados e, por isso, foi desligada da igreja metodista. Em dezembro de 1844, teve sua primeira visão, na qual contemplou a jornada do povo adventista rumo à cidade de Deus.\n\nCasou-se com o jovem pregador Tiago White, tornando-se assim Ellen G. White. Dessa união, nasceram quatro filhos. Tiago White faleceu em 1881. O casal White aceitou a verdade do sábado, depois de estudarem um livro intitulado O Sábado do Sétimo Dia: Um Sinal Perpétuo. Logo a seguir, em abril de 1847, ela teve uma visão na qual aparecia a lei de Deus com uma luz incidindo sobre o quarto mandamento.\n\nEllen G. White foi submetida a vários testes bíblicos sobre a autenticidade de um profeta, e foi aprovada em todos eles. Viveu e ensinou de acordo com a Palavra de Deus. Seus escritos estimulam a obediência aos mandamentos e nos orientam a compreender melhor a Bíblia. Ela sempre confessou que Jesus Cristo veio em carne. Também foi aprovada em testes físicos: durante as visões, perdia a força natural e recebia força sobrenatural; mantinha os olhos abertos e não respirava.\n\nEllen White viveu 88 anos, recebeu mais de duas mil visões e sonhos e escreveu mais de cem mil páginas. Está entre os autores mais traduzidos do mundo, com escritos divulgados em mais de 150 idiomas. Suas obras mais conhecidas são: Vida de Jesus, Caminho a Cristo, O Desejado de Todas as Nações e O Grande Conflito. Embora não tivesse alto nível de escolaridade, era estudiosa e escreveu com autoridade sobre diversos temas: religião, saúde, educação, família, profecias, entre outros.\n\nSeu único propósito foi levar o leitor a sentir profundo amor por Cristo, compreender Sua Palavra e ajudá-lo a viver em santificação. Ela escreveu: “Tomo a Bíblia tal como ela é, como a Palavra Inspirada... apegai-vos à Bíblia, tal como ela reza” (Mensagens Escolhidas, v. 1, p. 17). O Senhor deu uma luz menor (seus escritos) para guiar homens e mulheres à luz maior (a Bíblia). “Crede no Senhor, vosso Deus, e estareis seguros; crede nos Seus profetas e prosperareis” (2 Crônicas 20:20)."}], "prova": [{"pergunta": "Segundo Jesus, em João 17:17, o que é a Palavra de Deus?", "opcoes": ["Um livro de sabedoria humana", "A verdade", "Uma tradição dos antigos", "Um conjunto de lendas"], "correta": 1, "grupo": "Estudo 1 · A Bíblia Sagrada"}, {"pergunta": "Qual é a maneira correta de estudar a Bíblia, segundo Isaías 28:10?", "opcoes": ["Ler só o Novo Testamento", "Estudar sem pedir a ajuda do Espírito Santo", "Um pouco aqui, um pouco ali, comparando textos do mesmo assunto", "Ler apenas um versículo isolado"], "correta": 2, "grupo": "Estudo 1 · A Bíblia Sagrada"}, {"pergunta": "Como o Universo foi formado, segundo Hebreus 11:3 e Salmo 33:6, 9?", "opcoes": ["Por acaso, ao longo de milhões de anos", "Pela Palavra de Deus: Ele falou, e tudo se fez", "Por uma grande explosão sem causa", "Pelos anjos, sem a participação de Deus"], "correta": 1, "grupo": "Estudo 2 · A beleza da criação divina"}, {"pergunta": "Em quantos dias Deus criou os céus e a Terra, segundo Êxodo 20:11?", "opcoes": ["Seis dias", "Sete anos", "Mil anos" const CURSO_FORMACAO = {"id": "curso-formacao", "titulo": "Curso de Formação de Obreiros Bíblicos", "descricao": "2ª turma · 2026 · IASD Aldeota, Ministério Pessoal. Prof. Nadirlan Fontinele. Oito estudos de caso sobre evangelismo (Jesus, Pedro, Paulo, Filipe, André, Barnabé, Ananias, Priscila e Áquila) e um capítulo de metodologia com o passo a passo do estudo bíblico. Etapa obrigatória para todos os obreiros.", "notaMinima": 7, "oficial": true, "formacao": true, "professor": "Nadirlan Fontinele", "licoes": [{"titulo": "Apresentação do curso", "refs": "Mateus 28:18-20; 2 Timóteo 2:2; Atos 1:8", "conteudo": "“Ide, portanto, fazei discípulos de todas as nações, batizando-os em nome do Pai, e do Filho, e do Espírito Santo; ensinando-os a guardar todas as coisas que vos tenho ordenado. E eis que estou convosco todos os dias até à consumação do século.” (Mateus 28:19, 20)\n\nSeja bem-vindo ao Curso de Formação de Obreiros Bíblicos da Igreja Adventista do Sétimo Dia da Aldeota. Este curso é a porta de entrada da sua trilha de obreiro. Antes de ensinar qualquer estudo bíblico, todo obreiro passa por esta formação comum, para que todos falem a mesma linguagem, sigam o mesmo método e tenham o mesmo coração missionário.\n\n## Objetivo geral\n\nCapacitar membros para atuar como obreiros bíblicos voluntários, desenvolvendo competências de evangelismo pessoal, visitação missionária, apresentação de estudos bíblicos, acompanhamento de interessados e formação de novos discípulos.\n\nAo final do curso, você deverá ser capaz de:\n• aproximar-se das pessoas com o método de Cristo, criando amizade e confiança;\n• identificar oportunidades e perceber a direção do Espírito Santo;\n• fazer convites pessoais e conduzir a primeira conversa com um interessado;\n• aplicar a aula de diagnóstico e escolher o estudo bíblico mais adequado;\n• conduzir cada encontro de estudo bíblico do começo ao fim, com segurança;\n• fazer apelos com amor e acompanhar decisões até o batismo;\n• cuidar do novo membro depois do batismo e prepará-lo para também ser um obreiro.\n\n## O método do curso\n\nO curso segue quatro movimentos, que se repetem em todas as aulas:\n\nAPRENDER: estudamos um personagem bíblico como estudo de caso e extraímos dele princípios de evangelismo.\n\nPRATICAR: cada aula termina com um exercício prático para a semana. O obreiro não aprende só lendo; aprende fazendo.\n\nAVALIAR: perguntas de autoavaliação ajudam você a medir o que já sabe e o que precisa melhorar. No fim, a prova avaliativa confirma o aprendizado.\n\nMULTIPLICAR: o alvo final não é apenas levar uma pessoa ao batismo, mas formar um discípulo que também fará discípulos. “E o que de minha parte ouviste através de muitas testemunhas, isso mesmo transmite a homens fiéis e também idôneos para instruir a outros.” (2 Timóteo 2:2)\n\n## Conteúdo programático\n\nAula 1 · Jesus: o modelo do evangelista\nAula 2 · Pedro: o evangelho sem barreiras\nAula 3 · Paulo: o evangelho para todos\nAula 4 · Filipe: sensível à voz do Espírito\nAula 5 · André: evangelismo individual\nAula 6 · Barnabé: discipulado e encorajamento\nAula 7 · Ananias: disposição para servir\nAula 8 · Priscila e Áquila: evangelismo em equipe\nMetodologia · O passo a passo do estudo bíblico\nProva avaliativa\n\n## Como estudar este curso\n\nSepare um horário fixo na semana para cada aula. Leia com a Bíblia aberta e procure cada texto citado. Responda por escrito às perguntas dos quadros “Para estudar na Bíblia”. Faça o exercício prático antes de seguir para a próxima aula. Ao terminar todas as aulas, faça a prova avaliativa. A aprovação exige nota 7 ou mais. Aprovado, você recebe o certificado do curso e destrava os estudos bíblicos: estuda cada um, é aprovado na prova dele e então fica liberado para ensiná-lo aos interessados.\n\n## Uma palavra de encorajamento\n\nNinguém nasce pronto para dar estudos bíblicos. Pedro era pescador, André era um homem simples, Ananias era um discípulo quase anônimo. O que os tornou obreiros eficazes não foi talento, mas convivência com Jesus e disposição para obedecer. “Todo verdadeiro discípulo nasce no reino de Deus como missionário.” (Ellen G. White, O Desejado de Todas as Nações, p. 195)\n\n> Leia Atos 1:8. De onde vem o poder para testemunhar? Por onde começa o testemunho, e até onde ele deve chegar?\n\n> Leia Mateus 28:18-20. Quais são os verbos da grande comissão? Qual deles é o alvo principal e quais são os meios para alcançá-lo?\n\n[ ] Quero ser um obreiro bíblico e me comprometo a concluir esta formação com dedicação e oração."}, {"titulo": "Aula 1 · Jesus: o modelo do evangelista", "refs": "João 3:1-21; João 4:1-42; Lucas 19:1-10; Lucas 5:1-11; Mateus 9:9", "conteudo": "“Porque o Filho do Homem veio buscar e salvar o perdido.” (Lucas 19:10)\n\nAntes de olhar para qualquer outro evangelista, olhamos para Jesus. Ele não apenas pregou o evangelho: Ele é o evangelho. E a forma como Jesus tratava as pessoas é o padrão para todo obreiro bíblico. Nesta aula, veremos Jesus em quatro encontros muito diferentes, e em todos eles perceberemos o mesmo método: abordagem individualizada, relacionamento e discipulado.\n\n“Unicamente os métodos de Cristo trarão verdadeiro êxito no aproximar-se do povo. O Salvador misturava-Se com os homens como uma pessoa que lhes desejava o bem. Manifestava simpatia por eles, ministrava-lhes às necessidades e granjeava-lhes a confiança. Ordenava então: ‘Segue-Me.’” (Ellen G. White, A Ciência do Bom Viver, p. 143)\n\n## APRENDER · Estudo de caso 1: Nicodemos, o líder religioso (João 3:1-21)\n\nNicodemos era fariseu, mestre em Israel e membro do Sinédrio. Ele procurou Jesus à noite, talvez por medo da opinião dos colegas. Jesus não o expôs, não o repreendeu por vir escondido e não perdeu tempo com elogios. Foi direto à necessidade mais profunda daquele homem: “Se alguém não nascer de novo, não pode ver o reino de Deus” (João 3:3).\n\nRepare no método. Jesus partiu do que Nicodemos conhecia: usou a história da serpente levantada no deserto (Números 21), que todo mestre judeu conhecia, para apontar para a cruz (João 3:14, 15). Com um homem instruído, Jesus usou as Escrituras. E não exigiu uma decisão naquela noite. A semente cresceu devagar: Nicodemos defendeu Jesus diante do Sinédrio (João 7:50, 51) e, depois da crucifixão, levou cerca de cem libras de mirra e aloés para sepultá-Lo (João 19:39).\n\nLição para o obreiro: algumas pessoas vêm com perguntas intelectuais e muito conhecimento religioso. Respeite o tempo delas, use a Bíblia, vá ao coração do assunto e confie que o Espírito continuará trabalhando depois do estudo.\n\n## Estudo de caso 2: a mulher samaritana, a pessoa rejeitada (João 4:1-42)\n\nOs judeus evitavam passar por Samaria, mas “era-Lhe necessário atravessar a província de Samaria” (João 4:4). Jesus foi ao encontro de uma mulher que buscava água ao meio-dia, a hora mais quente, provavelmente para não encontrar ninguém. Ela era samaritana, mulher e tinha um passado complicado: três barreiras que um rabino da época não atravessaria.\n\nJesus começou pedindo um favor: “Dá-Me de beber” (João 4:7). Ao pedir ajuda, Ele a valorizou. Depois, partiu do assunto do momento, a água, para falar da “água viva”. Quando tocou na ferida da vida dela, os cinco maridos, não a condenou. Quando ela tentou desviar a conversa para uma polêmica religiosa (o lugar de adoração), Jesus respondeu com respeito, mas trouxe a conversa de volta ao essencial: adorar em espírito e em verdade. E então se revelou: “Eu o sou, Eu que falo contigo” (João 4:26).\n\nO resultado foi imediato. Ela deixou o cântaro, voltou à cidade e disse: “Vinde comigo e vede um homem que me disse tudo quanto tenho feito. Será este, porventura, o Cristo?” (João 4:29). Muitos samaritanos creram por causa do testemunho dela, e depois disseram: “Já agora não é pelo que disseste que nós cremos; mas porque nós mesmos temos ouvido” (João 4:42).\n\nLição para o obreiro: comece onde a pessoa está, com algo do cotidiano dela. Não condene; revele o Salvador. Evite discussões sobre temas periféricos e volte sempre a Jesus. E lembre: quem tem um encontro real com Cristo logo quer contar aos outros.\n\n## Estudo de caso 3: Zaqueu, o pecador conhecido (Lucas 19:1-10)\n\nZaqueu era chefe dos publicanos em Jericó, rico e desprezado pelo povo. Baixo de estatura, subiu num sicômoro para ver Jesus passar. Jesus parou, olhou para cima, chamou-o pelo nome e disse: “Zaqueu, desce depressa, pois Me convém ficar hoje em tua casa” (Lucas 19:5).\n\nJesus não fez um sermão sobre honestidade. Ele ofereceu amizade e entrou na casa de Zaqueu, enquanto o povo murmurava. A aceitação veio antes da mudança, e a mudança veio como fruto da aceitação: “Senhor, resolvo dar aos pobres a metade dos meus bens; e, se nalguma coisa tenho defraudado alguém, restituo quatro vezes mais” (Lucas 19:8). Jesus então declarou: “Hoje, houve salvação nesta casa” (Lucas 19:9).\n\nLição para o obreiro: chamar pelo nome, visitar a casa e aceitar a pessoa antes de esperar mudanças é o caminho de Cristo. O arrependimento verdadeiro nasce do amor recebido, não da pressão.\n\n## Estudo de caso 4: o chamado dos discípulos (Lucas 5:1-11; Mateus 4:18-22; Mateus 9:9)\n\nJesus chamou Pedro, André, Tiago e João no ambiente de trabalho deles. Primeiro pediu emprestado o barco de Pedro para pregar (Lucas 5:3). Depois, mandou lançar as redes, e a pesca foi tão grande que as redes se rompiam. Pedro caiu aos pés de Jesus: “Senhor, retira-Te de mim, porque sou pecador” (Lucas 5:8). E Jesus respondeu: “Não temas; doravante serás pescador de homens” (Lucas 5:10).\n\nJesus usou a linguagem da profissão deles: pescadores seriam pescadores de homens. Com Mateus, o cobrador de impostos, foi ainda mais simples: “Segue-Me” (Mateus 9:9). E Mateus, em seguida, ofereceu um banquete e convidou outros publicanos para conhecer Jesus.\n\nRepare também que Jesus não apenas chamou: Ele conviveu. Os discípulos andaram com Ele por cerca de três anos e meio, viram como Ele orava, como tratava as pessoas e como respondia às críticas. Jesus os enviou em duplas para praticar (Marcos 6:7) e depois avaliou com eles o que tinham feito (Marcos 6:30). Isso é discipulado: aprender, praticar, avaliar e multiplicar.\n\n## Lições de evangelismo que aprendemos com Jesus\n\n1. Abordagem individualizada. Jesus não tinha uma fórmula fixa. Com Nicodemos usou as Escrituras; com a samaritana, a água; com Zaqueu, uma visita; com os pescadores, a pesca. O obreiro precisa conhecer a pessoa antes de escolher como falar com ela.\n\n2. Iniciativa. Em quase todos os encontros, foi Jesus quem tomou a iniciativa: foi a Samaria, parou debaixo da árvore, entrou no barco. O obreiro não espera o interessado aparecer; ele vai ao encontro.\n\n3. Relacionamento antes de doutrina. Jesus misturava-Se, mostrava simpatia, atendia às necessidades, ganhava a confiança e só então dizia “Segue-Me”. A ordem importa.\n\n4. Atravessar barreiras. Barreiras religiosas, sociais, de gênero e de reputação não impediram Jesus. Nenhuma pessoa está longe demais.\n\n5. Ouvir e fazer perguntas. Jesus fazia perguntas e deixava as pessoas falarem. Quem ouve conquista o direito de ser ouvido.\n\n6. Cristo no centro. Em todos os encontros, a conversa terminava em Jesus. O objetivo de um estudo bíblico não é vencer um debate, mas apresentar o Salvador.\n\n7. Respeito ao tempo de Deus. Zaqueu decidiu no mesmo dia; Nicodemos levou anos. O obreiro semeia, rega e confia no crescimento que vem de Deus (1 Coríntios 3:6).\n\n8. Discipulado. O alvo de Jesus não era apenas converter, mas formar discípulos que fizessem outros discípulos.\n\n> Leia João 4:7-26. Faça uma lista dos passos que Jesus deu na conversa com a samaritana, do primeiro pedido até a revelação “Eu o sou”. Qual desses passos você costuma pular?\n\n> Leia Lucas 19:1-10 e Marcos 2:15-17. Por que Jesus aceitava comer com pecadores? O que isso ensina sobre visitar as pessoas em suas casas?\n\n> Leia Marcos 6:7-13 e 6:30. Como Jesus treinou os discípulos? Encontre no texto os momentos de aprender, praticar e avaliar.\n\n## PRATICAR · Exercício da semana\n\n1. Escreva o nome de três pessoas do seu convívio (família, trabalho, vizinhança) que ainda não conhecem Jesus de forma pessoal.\n2. Ore por elas todos os dias desta semana, pelo nome.\n3. Escolha uma delas e faça algo concreto por ela, como Jesus faria: uma visita, uma ligação, uma ajuda prática, um convite para um café. Não fale de doutrina ainda; apenas ouça e demonstre interesse sincero.\n4. Anote o que você descobriu sobre as necessidades e interesses dessa pessoa.\n\n## AVALIAR · Autoavaliação\n\nResponda com sinceridade, de 1 (nunca) a 5 (sempre):\n• Eu tomo a iniciativa de me aproximar das pessoas?\n• Eu ouço mais do que falo nas conversas sobre fé?\n• Eu evito discussões e mantenho Jesus no centro?\n• Eu trato com respeito pessoas de vida difícil ou de outra religião?\n\nOnde sua nota foi mais baixa, peça a Deus que transforme essa área em você.\n\n## MULTIPLICAR\n\nCompartilhe com alguém da igreja (um amigo, seu par de obreiro ou seu pequeno grupo) uma das lições desta aula e conte como foi a sua experiência com o exercício da semana.\n\n[ ] Quero aprender a me aproximar das pessoas como Jesus Se aproximava: com interesse sincero, simpatia, serviço e confiança."}, {"titulo": "Aula 2 · Pedro: o evangelho sem barreiras", "refs": "Atos 2; Atos 3:1-4:22; Atos 8:14-25; Atos 10; João 21:15-19", "conteudo": "“Reconheço, por verdade, que Deus não faz acepção de pessoas; pelo contrário, em qualquer nação, aquele que O teme e faz o que é justo Lhe é aceitável.” (Atos 10:34, 35)\n\nPedro é a prova de que Deus usa pessoas imperfeitas. O mesmo homem que negou Jesus três vezes foi restaurado à beira do mar da Galileia, quando Jesus lhe perguntou três vezes “Tu Me amas?” e o comissionou: “Apascenta as Minhas ovelhas” (João 21:15-17). Poucas semanas depois, esse pescador restaurado pregou o sermão mais frutífero da igreja primitiva. Nesta aula, acompanhamos Pedro em quatro situações em que o evangelho atravessou barreiras.\n\n## APRENDER · Estudo de caso 1: o Pentecostes (Atos 2)\n\nOs discípulos estavam reunidos, em oração e unidade, quando o Espírito Santo foi derramado (Atos 1:14; 2:1-4). Havia em Jerusalém judeus de muitas nações, e cada um ouvia o evangelho na sua própria língua (Atos 2:6-11). A primeira barreira vencida foi a da língua: Deus faz questão de falar ao coração de cada pessoa na linguagem que ela entende.\n\nPedro aproveitou a curiosidade do povo e pregou. Repare na estrutura do sermão: partiu de uma pergunta do público (“Que quer isto dizer?”), usou as Escrituras que eles conheciam (Joel e Salmos), apresentou Jesus crucificado e ressuscitado e terminou com um apelo claro. Quando o povo perguntou “Que faremos, irmãos?”, Pedro respondeu: “Arrependei-vos, e cada um de vós seja batizado em nome de Jesus Cristo para remissão dos vossos pecados, e recebereis o dom do Espírito Santo” (Atos 2:37, 38). Quase três mil pessoas foram batizadas naquele dia (Atos 2:41).\n\nE o trabalho não terminou no batismo: “E perseveravam na doutrina dos apóstolos e na comunhão, no partir do pão e nas orações” (Atos 2:42). Os novos membros foram imediatamente integrados à vida da igreja.\n\n## Estudo de caso 2: a cura do coxo (Atos 3:1-4:22)\n\nPedro e João subiam ao templo para a oração da hora nona. Na porta chamada Formosa estava um homem coxo de nascença, que pedia esmolas. Pedro fixou os olhos nele e disse: “Olha para nós” (Atos 3:4). Antes de qualquer coisa, houve contato pessoal, olho no olho.\n\n“Não possuo nem prata nem ouro, mas o que tenho, isso te dou: em nome de Jesus Cristo, o Nazareno, anda!” (Atos 3:6). Pedro tomou o homem pela mão direita e o levantou. O homem entrou no templo andando, saltando e louvando a Deus. A necessidade concreta foi atendida, e isso abriu as portas para a pregação: Pedro aproveitou o ajuntamento no pórtico de Salomão para apresentar Jesus, e o número dos que creram chegou a quase cinco mil homens (Atos 4:4).\n\nQuando foram presos e interrogados, as autoridades “reconheceram que haviam eles estado com Jesus” (Atos 4:13). E a resposta de Pedro e João tornou-se o lema de todo obreiro: “Pois nós não podemos deixar de falar das coisas que vimos e ouvimos” (Atos 4:20).\n\n## Estudo de caso 3: a evangelização em Samaria (Atos 8:14-25)\n\nDepois que Filipe pregou em Samaria e muitos creram, a igreja de Jerusalém enviou Pedro e João. Eles oraram pelos novos crentes, que receberam o Espírito Santo (Atos 8:14-17). Pedro, que antes compartilhava o preconceito dos judeus contra os samaritanos, agora servia a eles como irmãos.\n\nAli também houve um teste: Simão, o mágico, quis comprar com dinheiro o poder de transmitir o Espírito. Pedro o repreendeu com firmeza e, ao mesmo tempo, o chamou ao arrependimento e à oração (Atos 8:20-23). Firmeza com a verdade e esperança para o pecador andam juntas. Na volta para Jerusalém, Pedro e João “evangelizavam muitas aldeias dos samaritanos” (Atos 8:25): o trabalho não se limitou ao lugar para onde foram enviados.\n\n## Estudo de caso 4: o encontro com Cornélio (Atos 10)\n\nCornélio era centurião romano em Cesareia, piedoso, temente a Deus, generoso com os pobres e homem de oração. Um anjo lhe disse que mandasse buscar Pedro em Jope. Ao mesmo tempo, Deus preparava Pedro: em visão, ele viu um grande lençol com animais impuros e ouviu: “Ao que Deus purificou não consideres comum” (Atos 10:15). Deus estava tratando o preconceito de Pedro antes de enviá-lo a um gentio.\n\nQuando Pedro chegou, encontrou a casa cheia: Cornélio tinha reunido “seus parentes e amigos íntimos” (Atos 10:24). Pedro reconheceu: “Deus me demonstrou que a nenhum homem considerasse comum ou imundo” (Atos 10:28). Enquanto ele ainda falava de Jesus, o Espírito Santo desceu sobre todos os que ouviam, e eles foram batizados (Atos 10:44-48).\n\nRepare como Deus trabalha dos dois lados: Ele prepara o interessado e prepara o obreiro. E repare também em Cornélio: um interessado sincero logo reúne a família e os amigos para ouvir.\n\n## Lições de evangelismo que aprendemos com Pedro\n\n1. Deus usa pessoas restauradas. Seu passado não desqualifica você. A pergunta de Jesus continua a mesma: “Tu Me amas?” O amor a Cristo é a primeira qualificação do obreiro.\n\n2. Oração e unidade antes da missão. O Pentecostes veio depois de dias de oração em comum. Obreiros que oram juntos veem resultados.\n\n3. Fale a língua da pessoa. Use palavras simples, exemplos da vida dela e textos que ela consiga entender.\n\n4. Atenda à necessidade e depois pregue. O coxo foi levantado antes do sermão. Gestos concretos de cuidado abrem portas que argumentos não abrem.\n\n5. Faça apelos claros. Pedro não terminou com “pensem nisso”: ele disse o que fazer. Toda apresentação do evangelho deve levar a uma decisão.\n\n6. Integre o novo crente. Doutrina, comunhão, partir do pão e oração: o discipulado começa logo depois da decisão.\n\n7. Vença seus próprios preconceitos. Às vezes a maior barreira não está no interessado, mas no obreiro. Peça a Deus que mostre quem você tem considerado “comum ou imundo”.\n\n8. Alcance a casa inteira. Cornélio reuniu parentes e amigos. Ao estudar com alguém, ore pela família dele e esteja aberto para estudar com todos.\n\n> Leia Atos 2:14-41. Identifique no sermão de Pedro: o ponto de partida, os textos usados, o centro da mensagem e o apelo final.\n\n> Leia Atos 3:1-10. Que atitudes de Pedro e João você pode imitar quando encontrar alguém em necessidade?\n\n> Leia Atos 10:9-35. Como Deus preparou Pedro e Cornélio ao mesmo tempo? O que isso ensina sobre os encontros “por acaso” na vida do obreiro?\n\n## PRATICAR · Exercício da semana\n\n1. Faça uma lista sincera de grupos de pessoas com quem você tem dificuldade de se relacionar (por religião, classe social, estilo de vida, política, aparência). Ore pedindo a Deus que cure esse preconceito.\n2. Pratique contar o evangelho em três minutos, usando a estrutura de Pedro: a pessoa de Jesus, Sua morte e ressurreição por nós, e o convite ao arrependimento e à nova vida. Treine com seu par de obreiro ou com alguém da família.\n3. Identifique uma necessidade concreta de alguém da sua lista de oração e ajude de alguma forma.\n\n## AVALIAR · Autoavaliação\n\n• Eu consigo explicar o evangelho com clareza em poucos minutos?\n• Eu faço apelos claros ou fico apenas na informação?\n• Existe algum tipo de pessoa que eu evitaria convidar para estudar a Bíblia?\n• Eu oro com outros irmãos pelo trabalho missionário?\n\n## MULTIPLICAR\n\nCombine com seu par de obreiro um momento semanal de oração pelos interessados de vocês. O Pentecostes começou com um grupo orando junto.\n\n[ ] Peço a Deus que me liberte de todo preconceito, e quero anunciar o evangelho a qualquer pessoa que Ele colocar no meu caminho."}, {"titulo": "Aula 3 · Paulo: o evangelho para todos", "refs": "Atos 16:9-34; Atos 17:16-34; Atos 18:1-11; Atos 19:1-20; Atos 20:20, 31; 1 Coríntios 9:19-23", "conteudo": "“Fiz-me tudo para com todos, com o fim de, por todos os modos, salvar alguns.” (1 Coríntios 9:22)\n\nPaulo foi o maior missionário da igreja primitiva. Ele pregou a judeus e gregos, a filósofos e carcereiros, a comerciantes e autoridades. Em cada cidade, adaptou a forma de apresentar a mensagem, sem nunca mudar o conteúdo. Nesta aula, acompanhamos Paulo em quatro cidades e aprendemos a arte de adaptar a abordagem evangelística a cada pessoa.\n\n## APRENDER · Estudo de caso 1: Filipos, o coração aberto e a casa salva (Atos 16:9-34)\n\nPaulo foi a Filipos depois de uma visão: um homem macedônio lhe pedia: “Passa à Macedônia e ajuda-nos” (Atos 16:9). Como não havia sinagoga na cidade, no sábado ele foi à beira do rio, onde costumava haver um lugar de oração, e conversou com as mulheres reunidas ali. Uma delas, Lídia, vendedora de púrpura, “o Senhor lhe abriu o coração para atender às coisas que Paulo dizia” (Atos 16:14). Ela foi batizada com toda a sua casa e abriu o lar para os missionários.\n\nMais tarde, Paulo e Silas foram açoitados e presos. À meia-noite, oravam e cantavam hinos, e os presos os escutavam. Veio um terremoto, as portas se abriram, e o carcereiro, pensando que todos tinham fugido, ia se matar. Paulo gritou: “Não te faças nenhum mal, que todos aqui estamos!” (Atos 16:28). O carcereiro perguntou: “Senhores, que devo fazer para que seja salvo?” E a resposta foi: “Crê no Senhor Jesus e serás salvo, tu e tua casa” (Atos 16:30, 31). Na mesma hora da noite ele e toda a sua família foram batizados.\n\nLição para o obreiro: vá aonde as pessoas estão. Quem abre o coração é Deus. E o testemunho do obreiro em momentos de sofrimento fala mais alto do que muitos sermões.\n\n## Estudo de caso 2: Atenas, partindo da cultura do ouvinte (Atos 17:16-34)\n\nEm Atenas, Paulo ficou indignado ao ver a cidade cheia de ídolos. Mas transformou a indignação em diálogo: discutia na sinagoga com os judeus e, todos os dias, na praça, com quem estivesse ali (Atos 17:16, 17). Convidado a falar no Areópago, não começou atacando a religião deles. Começou com algo que eles mesmos tinham escrito num altar: “Ao Deus desconhecido”. E disse: “Esse que adorais sem conhecer é precisamente Aquele que eu vos anuncio” (Atos 17:23).\n\nPaulo citou até os poetas gregos: “Porque dEle também somos geração” (Atos 17:28). Partiu da criação, chegou ao chamado ao arrependimento e terminou com a ressurreição de Jesus e o juízo. Os resultados foram variados: alguns zombaram, outros disseram “A respeito disso te ouviremos noutra ocasião”, e alguns creram, entre eles Dionísio, o areopagita, e uma mulher chamada Dâmaris (Atos 17:32-34).\n\nLição para o obreiro: encontre pontos de contato na cultura, nos interesses e nas crenças da pessoa. Comece pelo que vocês têm em comum. E não desanime com respostas diferentes: o mesmo estudo produz reações diferentes em pessoas diferentes.\n\n## Estudo de caso 3: Corinto, trabalho, perseverança e simplicidade (Atos 18:1-11; 1 Coríntios 2:1-5)\n\nEm Corinto, Paulo morou e trabalhou com Áquila e Priscila, que eram fabricantes de tendas como ele. Todo sábado ele discorria na sinagoga, persuadindo judeus e gregos (Atos 18:3, 4). Quando houve oposição, mudou de lugar, mas não parou: foi para a casa de Tício Justo, ao lado da sinagoga. Crispo, o principal da sinagoga, creu com toda a sua casa, e muitos coríntios foram batizados (Atos 18:7, 8).\n\nNuma noite, o Senhor encorajou Paulo em visão: “Não temas; pelo contrário, fala e não te cales; porquanto Eu estou contigo, [...] pois tenho muito povo nesta cidade” (Atos 18:9, 10). Paulo ficou ali um ano e seis meses ensinando a Palavra.\n\nEscrevendo depois aos coríntios, Paulo explicou seu método: “Porque decidi nada saber entre vós, senão a Jesus Cristo e Este crucificado” (1 Coríntios 2:2). A cidade era sofisticada, mas a mensagem continuou simples e centrada em Cristo.\n\nLição para o obreiro: a vida profissional e o lar são lugares de missão. Diante da oposição, mude a estratégia, não a missão. Deus tem pessoas preparadas na sua cidade que você ainda não conhece.\n\n## Estudo de caso 4: Éfeso, ensino sistemático e de casa em casa (Atos 19:1-20; 20:17-31)\n\nEm Éfeso, Paulo encontrou doze discípulos que conheciam apenas o batismo de João. Ele completou o ensino deles, e eles foram batizados em nome de Jesus (Atos 19:1-7). Durante três meses ensinou na sinagoga; depois passou a ensinar diariamente na escola de Tirano, durante dois anos, “dando ensejo a que todos os habitantes da Ásia ouvissem a palavra do Senhor” (Atos 19:9, 10).\n\nO resultado foi uma mudança profunda de vida: muitos que praticavam artes mágicas trouxeram os seus livros e os queimaram diante de todos, num valor de cinquenta mil denários (Atos 19:19). Quando se despediu dos líderes de Éfeso, Paulo resumiu o seu ministério: ensinou “publicamente e também de casa em casa” e, durante três anos, não cessou “de admoestar, com lágrimas, a cada um” (Atos 20:20, 31).\n\nLição para o obreiro: o ensino bíblico precisa ser sistemático, com regularidade e sequência. Encontros semanais, no mesmo dia e horário, constroem fundamento. E o cuidado é individual: “a cada um”.\n\n## Lições de evangelismo que aprendemos com Paulo\n\n1. Adapte a abordagem, nunca a mensagem. Com judeus, Paulo usava as Escrituras; com filósofos, partia da criação e da cultura; com o carcereiro, foi direto ao ponto. O conteúdo foi sempre o mesmo: Jesus crucificado e ressuscitado.\n\n2. Encontre pontos de contato. O altar ao Deus desconhecido, o lugar de oração no rio, a profissão de fazer tendas. Todo interessado tem uma porta de entrada.\n\n3. Ensine com regularidade. Paulo ensinava todo sábado, diariamente, por meses e anos. O estudo bíblico eficaz tem constância.\n\n4. Trabalhe de casa em casa. O lar é o lugar onde a confiança cresce e onde a família inteira pode ser alcançada.\n\n5. Persevere na oposição. Paulo foi preso, expulso e zombado, mas continuou. O obreiro não leva a rejeição para o lado pessoal.\n\n6. Conte com a promessa: “Eu estou contigo”. O mesmo Senhor que encorajou Paulo em Corinto encoraja você hoje.\n\n7. Espere mudança de vida. A mensagem bíblica leva a decisões concretas, como os livros de magia queimados em Éfeso.\n\n8. Cuide de cada pessoa. “A cada um, com lágrimas.” Por trás de cada interessado existe uma história que merece atenção individual.\n\n> Leia 1 Coríntios 9:19-23. O que significa “fazer-se tudo para com todos”? Onde está o limite entre adaptar a abordagem e mudar a mensagem?\n\n> Leia Atos 17:22-31. Quais pontos de contato Paulo usou com os atenienses? Como você poderia começar uma conversa sobre Deus com um amigo que não frequenta igreja?\n\n> Leia Atos 20:17-35. Faça uma lista das atitudes de Paulo como obreiro. Quais delas você quer desenvolver?\n\n## PRATICAR · Exercício da semana\n\n1. Pense em três perfis diferentes de interessados: uma pessoa religiosa de outra denominação, uma pessoa sem religião e uma pessoa que está passando por uma crise (doença, luto, desemprego). Para cada perfil, escreva qual seria um bom ponto de contato e por qual tema você começaria.\n2. Escolha uma das pessoas da sua lista de oração e descubra um interesse dela que possa ser uma porta para conversar sobre Deus.\n3. Monte uma agenda realista: que dia e horário da semana você poderá reservar fixamente para dar um estudo bíblico?\n\n## AVALIAR · Autoavaliação\n\n• Eu sei adaptar minha linguagem a pessoas de diferentes contextos?\n• Eu tenho constância nos compromissos ou desisto quando surgem dificuldades?\n• Eu levo a mensagem com simplicidade, centrada em Cristo?\n• Eu percebo meu trabalho e minha casa como lugares de missão?\n\n## MULTIPLICAR\n\nCompartilhe com seu pequeno grupo ou com seu par de obreiro um ponto de contato que você descobriu nesta semana e peça que orem com você por essa pessoa.\n\n[ ] Quero ser um obreiro que se adapta a cada pessoa sem nunca mudar a mensagem: Jesus Cristo, e Este crucificado."}, {"titulo": "Aula 4 · Filipe: sensível à voz do Espírito", "refs": "Atos 6:1-7; Atos 8:4-13; Atos 8:26-40; Atos 21:8, 9", "conteudo": "“Então, disse o Espírito a Filipe: Aproxima-te desse carro e acompanha-o.” (Atos 8:29)\n\nFilipe foi um dos sete homens escolhidos para servir às mesas na igreja de Jerusalém. Os requisitos eram: “de boa reputação, cheios do Espírito e de sabedoria” (Atos 6:3). Ele começou servindo e se tornou conhecido como “Filipe, o evangelista” (Atos 21:8). Nesta aula, vemos em Filipe como identificar oportunidades e, principalmente, como conduzir um estudo bíblico do início ao fim. O encontro de Filipe com o eunuco etíope é, talvez, o melhor modelo de estudo bíblico de toda a Bíblia.\n\n## APRENDER · Estudo de caso 1: Filipe em Samaria (Atos 8:4-13)\n\nCom a perseguição em Jerusalém, os crentes se espalharam, “pregando a palavra” (Atos 8:4). Filipe desceu a uma cidade de Samaria e anunciava a Cristo. As multidões atendiam unânimes, e “houve grande alegria naquela cidade” (Atos 8:8). Homens e mulheres foram batizados.\n\nA dificuldade, a perseguição, não paralisou Filipe; tornou-se oportunidade. E ele pregou exatamente aos samaritanos, o povo que os judeus evitavam. Filipe não esperou as condições ideais para começar.\n\n## Estudo de caso 2: o eunuco etíope, um estudo bíblico modelo (Atos 8:26-40)\n\nNo auge do sucesso em Samaria, um anjo deu a Filipe uma ordem estranha: “Dispõe-te e vai para o lado do Sul, no caminho que desce de Jerusalém a Gaza; este se acha deserto” (Atos 8:26). Sair de uma cidade em avivamento para uma estrada deserta parecia não fazer sentido. Mas Filipe “se levantou e foi” (Atos 8:27).\n\nNa estrada vinha um etíope, eunuco, alto oficial de Candace, rainha dos etíopes, responsável por todo o seu tesouro. Ele tinha ido a Jerusalém para adorar e voltava sentado em seu carro, lendo o profeta Isaías. Vamos ver, passo a passo, o que Filipe fez.\n\nPasso 1 · Obedeceu à direção de Deus. “Então, disse o Espírito a Filipe: Aproxima-te desse carro e acompanha-o” (Atos 8:29). Filipe não discutiu nem adiou.\n\nPasso 2 · Tomou a iniciativa com disposição. “Correndo Filipe [...]” (Atos 8:30). Há urgência na missão. Oportunidades passam.\n\nPasso 3 · Ouviu antes de falar. Filipe ouviu o homem ler em voz alta. Antes de ensinar, ele descobriu em que ponto o interessado estava.\n\nPasso 4 · Fez uma pergunta. “Compreendes o que vens lendo?” (Atos 8:30). Não começou com um sermão, mas com uma pergunta simples, respeitosa e aberta.\n\nPasso 5 · Foi convidado a entrar. O eunuco respondeu: “Como poderei entender, se alguém não me explicar?” E convidou Filipe a subir e sentar-se com ele (Atos 8:31). Toda pessoa sincera precisa de alguém que a ajude a entender a Bíblia. Esse é o papel do obreiro.\n\nPasso 6 · Partiu da dúvida do interessado. O texto era Isaías 53:7, 8: “Foi levado como ovelha ao matadouro”. O eunuco perguntou: “De quem diz isto o profeta? De si mesmo ou de algum outro?” (Atos 8:34). Filipe respondeu à pergunta que o interessado realmente tinha.\n\nPasso 7 · Usou a Bíblia e apresentou Jesus. “Então, Filipe explicou; e, começando por esta passagem da Escritura, anunciou-lhe a Jesus” (Atos 8:35). O ponto de partida foi a Escritura, e o ponto de chegada foi Jesus.\n\nPasso 8 · Levou à decisão. Filipe deve ter explicado também o batismo, porque, ao verem água, o eunuco disse: “Eis aqui água; que impede que seja eu batizado?” (Atos 8:36). Um bom estudo bíblico conduz naturalmente a uma decisão.\n\nPasso 9 · Batizou. Desceram ambos à água, e Filipe o batizou (Atos 8:38). O batismo foi por imersão: desceram à água e depois saíram da água.\n\nPasso 10 · Deixou o novo crente seguir com alegria. “O Espírito do Senhor arrebatou a Filipe, não o vendo mais o eunuco; e este foi seguindo o seu caminho, cheio de júbilo” (Atos 8:39). O novo crente levou o evangelho para a Etiópia. O obreiro aponta para Jesus e não cria dependência de si mesmo.\n\n## Lições de evangelismo que aprendemos com Filipe\n\n1. Sensibilidade espiritual. O obreiro vive em oração, atento à voz do Espírito, que o conduz às pessoas que Deus já preparou. Comece cada dia orando: “Senhor, coloca no meu caminho alguém que precise de Ti.”\n\n2. Obediência imediata. Filipe deixou o sucesso de Samaria por uma estrada deserta. Às vezes Deus nos envia a uma única pessoa. Uma alma vale todo o esforço.\n\n3. Identifique oportunidades. O eunuco lia a Bíblia em voz alta: era um interessado visível. Hoje, os sinais são parecidos: alguém que assiste a programas cristãos, que faz perguntas sobre a Bíblia, que atravessa uma crise, que se inscreveu num curso bíblico da TV Novo Tempo.\n\n4. Pergunte e ouça. A pergunta “Você entende o que está lendo?” abriu tudo. Boas perguntas revelam as necessidades e as dúvidas do interessado.\n\n5. Responda às dúvidas reais. Filipe não seguiu um roteiro decorado; ele respondeu à pergunta que o eunuco fez. É por isso que a nossa trilha começa com uma aula de diagnóstico.\n\n6. Comece pela Escritura e termine em Jesus. Todo estudo, sobre qualquer tema, deve apresentar Cristo.\n\n7. Conduza à decisão. O alvo do estudo bíblico é a entrega a Jesus, expressa no batismo.\n\n8. Não crie dependência. O obreiro é um instrumento. O interessado deve aprender a amar a Jesus e a Palavra, não apenas o obreiro.\n\n> Leia Atos 8:26-40 e escreva com suas palavras os dez passos do estudo bíblico de Filipe. Quais deles você acha mais difíceis?\n\n> Leia Isaías 53. Por que esse capítulo foi um ótimo ponto de partida para apresentar Jesus ao eunuco?\n\n> Leia Atos 6:3 e 21:8, 9. Que tipo de pessoa era Filipe? O que o testemunho da família dele (as quatro filhas que profetizavam) diz sobre o seu lar?\n\n## PRATICAR · Exercício da semana\n\n1. Durante esta semana, comece cada dia com a oração: “Senhor, coloca no meu caminho alguém que precise de Ti, e dá-me sensibilidade para perceber.” Anote as oportunidades que surgirem.\n2. Treine fazer perguntas abertas. Escreva cinco perguntas que você poderia usar para iniciar uma conversa espiritual, por exemplo: “O que você acha que Deus pensa sobre você?” ou “Você já leu a Bíblia? Alguma parte chamou sua atenção?”\n3. Com seu par de obreiro, simule um estudo curto a partir de Isaías 53, seguindo os passos de Filipe: pergunte, ouça, explique e apresente Jesus.\n\n## AVALIAR · Autoavaliação\n\n• Eu oro pedindo oportunidades e realmente presto atenção a elas?\n• Eu obedeço prontamente quando sinto que Deus quer que eu fale com alguém?\n• Eu faço perguntas e ouço, ou começo logo a falar?\n• Meus estudos terminam apresentando Jesus e convidando a uma decisão?\n\n## MULTIPLICAR\n\nConte ao seu par de obreiro ou ao seu pequeno grupo uma oportunidade que Deus colocou no seu caminho nesta semana, mesmo que você não a tenha aproveitado. Aprendam juntos com ela.\n\n[ ] Quero viver sensível à voz do Espírito Santo e obedecer prontamente quando Ele me enviar a alguém."}, {"titulo": "Aula 5 · André: evangelismo individual", "refs": "João 1:35-46; João 6:5-13; João 12:20-22; Marcos 5:18-20", "conteudo": "“Ele achou primeiro o seu próprio irmão, Simão, a quem disse: Achamos o Messias [...]. E o levou a Jesus.” (João 1:41, 42)\n\nAndré não pregou grandes sermões nem escreveu cartas do Novo Testamento. Sempre aparece como “irmão de Simão Pedro”. Mas, nas três vezes em que o evangelho de João o mostra em destaque, ele está fazendo a mesma coisa: levando alguém a Jesus. André é o padroeiro do evangelismo individual, aquele que alcança uma pessoa de cada vez, por meio de convites pessoais.\n\n## APRENDER · Estudo de caso 1: André leva o próprio irmão (João 1:35-42)\n\nAndré era discípulo de João Batista. Quando ouviu João dizer, apontando para Jesus, “Eis o Cordeiro de Deus!”, ele e outro discípulo seguiram Jesus. Jesus se voltou e perguntou: “Que buscais?” Eles responderam: “Rabi, onde assistes?” E Jesus disse: “Vinde e vede” (João 1:38, 39). Eles passaram aquele dia com Jesus.\n\nO que André fez primeiro depois desse encontro? “Ele achou primeiro o seu próprio irmão, Simão [...] e o levou a Jesus” (João 1:41, 42). André começou em casa. E quem ele levou se tornou Pedro, o pregador do Pentecostes. Ninguém sabe quantas pessoas serão alcançadas por aquela única pessoa que você levar a Jesus.\n\nO mesmo padrão aparece logo em seguida: Filipe encontrou Natanael e disse: “Achamos Aquele de quem Moisés escreveu na lei, e a quem se referiram os profetas”. Natanael duvidou: “De Nazaré pode sair alguma coisa boa?” Filipe não discutiu. Apenas disse: “Vem e vê” (João 1:45, 46). O melhor argumento é um convite para conhecer Jesus pessoalmente.\n\n## Estudo de caso 2: André e o menino dos pães (João 6:5-13)\n\nDiante de uma multidão de cerca de cinco mil homens e nenhuma comida, Filipe calculou que nem duzentos denários de pão bastariam. André percebeu alguém que ninguém tinha notado: “Está aí um rapaz que tem cinco pães de cevada e dois peixinhos; mas isto que é para tanta gente?” (João 6:9). André levou o pouco que havia a Jesus, e Jesus multiplicou.\n\nLição para o obreiro: André tinha olhos para as pessoas, até para um menino no meio da multidão. E sabia que o pouco nas mãos de Jesus se torna suficiente. Seu tempo, seu conhecimento e seus talentos parecem pouco, mas nas mãos de Jesus alimentam multidões.\n\n## Estudo de caso 3: André e os gregos (João 12:20-22)\n\nAlguns gregos que tinham subido para adorar na festa procuraram Filipe e pediram: “Senhor, queremos ver Jesus” (João 12:21). Filipe foi falar com André, e os dois foram dizer a Jesus. André era a pessoa a quem os outros recorriam quando alguém queria chegar a Jesus. Ele era uma ponte.\n\n“Queremos ver Jesus” é o pedido silencioso de muitos interessados. Eles não querem ver o obreiro, a instituição ou uma discussão doutrinária: querem ver Jesus.\n\n## O poder do convite pessoal\n\nNos três episódios, André fez a mesma coisa: aproximou-se de alguém e o levou a Jesus. Não houve multidões nem estratégias complicadas. Houve relacionamento e convite.\n\nAs pessoas mais abertas ao evangelho geralmente são aquelas com quem já temos algum vínculo: família, amigos, vizinhos, colegas de trabalho e de estudo. Jesus disse ao homem liberto em Gadara: “Vai para tua casa, para os teus. Anuncia-lhes tudo o que o Senhor te fez e como teve compaixão de ti” (Marcos 5:19).\n\nChamamos esse círculo de pessoas próximas de “círculo de influência”. Todo obreiro deve conhecer o seu e orar por ele.\n\n## Como fazer a aproximação de um interessado\n\n1. Ore primeiro. Antes de falar com a pessoa sobre Deus, fale com Deus sobre a pessoa.\n\n2. Cultive a amizade. Demonstre interesse genuíno pela vida dela: família, trabalho, saúde, preocupações. Lembre datas importantes, como o aniversário.\n\n3. Sirva. Ajude numa necessidade concreta. O serviço abre o coração.\n\n4. Compartilhe sua experiência. Conte de forma breve e natural o que Jesus fez por você: como era sua vida, como você O conheceu e o que mudou. Um testemunho pessoal não se discute.\n\n5. Faça o convite. Seja claro, simples e pessoal. Por exemplo: “Eu estou participando de um estudo da Bíblia muito bonito, sobre [tema]. São encontros curtos, uma vez por semana. Você gostaria de estudar comigo?” Ou: “Vi que você está passando por um momento difícil. Posso orar por você? Tenho um estudo da Bíblia sobre esperança que me ajudou muito. Quer conhecer?”\n\n6. Respeite a resposta. Se a pessoa disser não, continue sendo amigo. Um “não” hoje pode ser um “sim” daqui a alguns meses.\n\n7. Acompanhe. Depois do convite aceito, marque o dia e o horário, envie uma mensagem de lembrete e chegue pontualmente.\n\n## Formas de convite que funcionam\n\n• Convite para estudar a Bíblia em casa ou por vídeo, com um tema ligado ao interesse da pessoa.\n• Convite para um culto especial, um programa de família ou uma semana de evangelismo.\n• Convite para o pequeno grupo da sua casa ou do seu bairro.\n• Convite para um evento de saúde, uma feira ou um projeto social.\n• Compartilhar um vídeo ou programa da TV Novo Tempo e perguntar depois: “O que você achou?”\n• Oferecer um curso bíblico da Escola Bíblica Novo Tempo.\n\n## Lições de evangelismo que aprendemos com André\n\n1. Comece pelo seu círculo de influência: casa, família, amigos.\n2. Um encontro pessoal com Jesus gera o desejo de convidar outros.\n3. O convite “Vem e vê” vale mais que uma discussão.\n4. Tenha olhos para as pessoas que ninguém nota.\n5. Leve o pouco que você tem a Jesus; Ele multiplica.\n6. Seja uma ponte: leve as pessoas a Jesus, não a você mesmo.\n7. Uma pessoa alcançada pode alcançar multidões, como Pedro.\n\n> Leia João 1:35-51. Quantas pessoas foram levadas a Jesus por meio de convites pessoais nesse capítulo? Quem convidou quem?\n\n> Leia Marcos 5:18-20. Por que Jesus mandou o homem liberto voltar para a própria casa em vez de segui-Lo? Qual foi o resultado (veja também Marcos 7:31-37)?\n\n> Leia João 6:5-13. Qual foi a diferença entre a reação de Filipe e a de André diante da multidão? O que isso ensina sobre a fé do obreiro?\n\n## PRATICAR · Exercício da semana\n\n1. Monte o seu círculo de influência: escreva o nome de dez pessoas, em cinco grupos (família, amigos, vizinhos, trabalho ou estudo, outros). Marque as cinco que parecem mais abertas.\n2. Escreva o seu testemunho pessoal em, no máximo, dez linhas: como era sua vida, como você conheceu Jesus e o que mudou. Treine contá-lo em dois minutos.\n3. Faça pelo menos um convite pessoal nesta semana: para um estudo bíblico, um culto, um pequeno grupo ou um programa da TV Novo Tempo.\n\n## AVALIAR · Autoavaliação\n\n• Eu sei de cor o nome das pessoas pelas quais estou orando?\n• Eu consigo contar meu testemunho de forma breve e natural?\n• Quantos convites pessoais eu fiz no último mês?\n• Eu tenho levado as pessoas a Jesus ou apenas a mim e às minhas opiniões?\n\n## MULTIPLICAR\n\nEnsine alguém da sua família ou do seu pequeno grupo a montar o próprio círculo de influência. André levou Pedro; Pedro levou milhares.\n\n[ ] Quero, como André, levar as pessoas a Jesus, uma de cada vez, começando pelas que estão mais perto de mim."}, {"titulo": "Aula 6 · Barnabé: discipulado e encorajamento", "refs": "Atos 4:36, 37; Atos 9:26-28; Atos 11:19-26; Atos 14:21-23; Atos 15:36-41; 2 Timóteo 4:11", "conteudo": "“Porque era homem bom, cheio do Espírito Santo e de fé. E muita gente se uniu ao Senhor.” (Atos 11:24)\n\nO batismo não é a linha de chegada; é a linha de partida. Muitos novos membros se afastam nos primeiros meses depois do batismo porque ninguém os acompanha. Barnabé é o modelo bíblico de quem cuida, encoraja e fortalece os novos conversos. Seu nome verdadeiro era José, mas os apóstolos lhe deram o apelido de Barnabé, que quer dizer “filho de exortação”, ou “filho da consolação” (Atos 4:36).\n\n## APRENDER · Estudo de caso 1: um coração generoso (Atos 4:36, 37)\n\nA primeira vez que Barnabé aparece, ele vende um campo e coloca o dinheiro aos pés dos apóstolos. Antes de ser um encorajador com palavras, ele foi generoso com aquilo que tinha. O discipulador investe: tempo, recursos e af
