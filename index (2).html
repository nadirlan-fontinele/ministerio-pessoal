amente rico e próspero, foi o pedido que Ele colocou diante do Senhor. Ele poderia pedir qualquer coisa, mas pediu o que justamente lhe daria uma mente próspera. Todos sabemos que Salomão pediu sabedoria a Deus:\n\n“Teu servo está no meio do teu povo que escolheste, povo grande, tão numeroso que não se pode contar. Dá, pois, ao teu servo coração compreensivo para governar o teu povo, para que, com prudência, saiba discernir entre o bem e o mal. Pois quem seria capaz de governar este teu grande povo? Estas palavras agradaram ao Senhor, por haver Salomão pedido tal coisa. E Deus lhe disse: — Já que você pediu isso e não me pediu longevidade, nem riquezas, nem a morte de seus inimigos, mas pediu entendimento, para discernir o que é justo, eis que farei como você pediu. Eu lhe dou um coração sábio e inteligente, de maneira que antes de você nunca houve ninguém igual a você, nem haverá depois de você” (1 Reis 3:8-12).\n\nFoi por isso, por Salomão ter pedido apenas para ser um rei sábio para julgar e entender o povo que, em Provérbios e Eclesiastes, livros escritos por ele próprio, encontramos conselhos de sabedoria prática para administrar as finanças. Esses livros devem ser lidos muitas e muitas vezes, como direcionadores para a condução de nossa vida.\n\n## Vejamos alguns desses conselhos\n\nProvérbios 19:20 – “Ouça os conselhos e receba a instrução, para que você seja sábio a partir de agora”.\n\nProvérbios 1:5 – “O sábio ouvirá e crescerá em conhecimento, e o entendido adquirirá sábios conselhos” (ARA).\n\nProvérbios 18:15 – “O coração do sábio adquire o conhecimento, e o ouvido dos sábios procura o saber”.\n\nTer uma mente sábia é fundamental para a gestão das finanças. Assim como Deus concedeu sabedoria a Salomão, Ele quer dar a todos aqueles que Lhe forem fiéis e pedirem. Tiago 1:5 diz: “Se, porém, algum de vocês necessita de sabedoria, peça a Deus, que a todos dá com generosidade e sem reprovações, e ela lhe será concedida”.\n\nO apóstolo ainda diz, no verso 17, o seguinte: “Toda boa dádiva e todo dom perfeito vêm lá do alto, descendo do Pai das luzes, em quem não pode existir variação ou sombra de mudança”. Isso significa que Deus é extremamente generoso para nos dar a inteligência necessária para lidar com o dinheiro, administrar as finanças e alcançar a prosperidade e riqueza. Falaremos mais um pouco sobre esse assunto na próxima lição.", "refs": "Filipenses 4:8 · Deuteronômio 28:1-13 · Tiago 1:5"}, {"titulo": "Guia seguro para a vida", "conteudo": "“Não seja sábio aos seus próprios olhos; tema o SENHOR e afaste-se do mal”. (Provérbios 3:7)\n\nNa lição anterior, falamos sobre a importância de adquirirmos sabedoria como fez Salomão, que foi o homem mais sábio e próspero do mundo. Como vimos, Salomão nos deixou vários conselhos sobre a vida, trabalho, prosperidade e riquezas. Mas, como seguir os conselhos de Salomão e encontrar a instrução para ser sábio, para ter conhecimento para gerir o dinheiro e as finanças da família?\n\nPor exemplo, se alguém deseja escalar uma montanha, explorar cavernas, ou qualquer outra aventura, será necessário contratar um guia. Esse profissional deve ser alguém que já fez a jornada várias vezes e conhece o caminho; alguém que sabe onde e como andar, qual o melhor horário para isso, garantindo que todos cheguem ao destino com segurança.\n\nJesus declarou que “se um cego guiar outro cego, ambos cairão no buraco” (Mateus 15:14). Para alcançar a prosperidade e riqueza dentro dos planos de Deus, o conhecimento deve ser buscado em fontes que se alimentam das Escrituras Sagradas. As ações de Satanás para arruinar a vida dos filhos de Deus tem como objetivo final o de levá-los à morte eterna. Esse caminho pode ser através das drogas, dos vícios, da criminalidade, mas também pela acumulação de bens, dinheiro e riquezas.\n\nOs corruptos são aqueles que têm muito, que vivem, pensam e trabalham movidos pela ganância, sem se importar com os pobres. Grandes fortunas estão nas mãos de poderosos e celebridades, muitos deles infiéis, ateus, pervertidos e escravos de suas próprias imagens e desejos de consumo.\n\nEm Lucas 12:15, encontramos a advertência de Jesus: “Tenham cuidado e não se deixem dominar por qualquer tipo de avareza, porque a vida de uma pessoa não consiste na abundância dos bens que ela tem”. Precisamos entender que Satanás vai fazer de tudo para que a avareza, o dinheiro e a ganância tomem o lugar de Deus, ocupando o trono da vida do homem e, dessa forma, levando-o à ruína.\n\nNa parábola do semeador, é dado um destaque sobre o perigo das riquezas, quando ela se torna uma prioridade ou uma obsessão: “O que foi semeado entre os espinhos é o que ouve a palavra, porém as preocupações deste mundo e a fascinação das riquezas sufocam a palavra, e ela fica infrutífera” (Mateus 13:22).\n\nUma das artimanhas de Satanás para que Jesus fracassasse em Sua missão, foi exatamente dar a Ele as riquezas deste mundo, conforme descrito em Mateus 4:8, 9, que diz: “O diabo ainda levou Jesus a um monte muito alto, mostrou-lhe todos os reinos do mundo e a glória deles e disse: — Tudo isso lhe darei se, prostrado, você me adorar”. Existe uma grande diferença entre ser rico com Deus e ser rico sem Deus.\n\nSer rico sem Deus pode ser uma maldição que vai, com certeza, levar à perdição eterna. Enquanto, ser rico com Deus é uma bênção, pois esse servo fiel ao Senhor vai promover a Sua obra neste mundo e ajudar o próximo.\n\nExatamente por esse motivo, de seguir o conselho de Salomão e buscar a instrução para ser sábio de acordo com a Bíblia, o exemplo deve vir de pessoas que temem a Deus, que observam e vivem sob as Suas Palavras.\n\nHá muitos autores de livros e influenciadores que falam de finanças, mas apenas estimulam seus leitores e seguidores a serem ricos, sem dizer o que fazer com a riqueza. Além de ensinarem a satisfazer os desejos pessoais, esses autores não falam sobre a importância de dizimar, ofertar, ajudar o próximo e promover a pregação do Evangelho.\n\nO objetivo da maioria deles é buscar a riqueza para “satisfazer os sonhos” que, em muitos casos, só tem a ver com prazeres e acumulação de bens, e nada com a salvação eterna.\n\nAo seguir orientações e conselhos de educadores que não temem a Deus, todo cuidado é pouco. Lembrem da advertência de Jesus: “Quem não é por mim é contra mim; e quem comigo não ajunta, espalha” (Mateus 12:30). O único guia seguro para a vida são os sábios conselhos e advertências que Deus nos deixou em Sua Palavra. Segui-los é sinal de maturidade espiritual e certeza que nosso futuro estará seguro em Suas mãos.", "refs": "Mateus 15:14 · Lucas 12:15 · Provérbios 3:7"}, {"titulo": "Prosperidade e perseverança", "conteudo": "“Poder comer, beber e desfrutar o que se conseguiu com todo o trabalho é dom de Deus”. (Eclesiastes 3:13)\n\n## Empreendimentos que são realizados em nossas vidas\n\nUm texto muito construtivo que encontramos na Bíblia está em Hebreus 12:1-2, que declara: “Portanto, também nós, visto que temos a rodear-nos tão grande nuvem de testemunhas, livremo-nos de todo peso e do pecado que tão firmemente se apega a nós e corramos com perseverança a carreira que nos está proposta, olhando firmemente para o Autor e Consumador da fé”.\n\nEsse texto deve ser aplicado a todos os empreendimentos que são realizados em nossa vida: estudos, carreira, vida profissional, vida financeira e em muitos outros. Aplicando-o à vida financeira, a primeira advertência do apóstolo é que cada um de nós está “rodeado de testemunhas”. A forma como conduzimos as finanças poderá confirmar ou negar nossa fé, e exercerá influência em quem vive ao nosso redor.\n\nUm cristão que não paga suas contas dá um péssimo testemunho de sua fé e cria um bloqueio que impede aos outros de conhecerem a Deus. A mesma coisa acontece com um cristão que esbanja suas finanças, que faz um mau uso do seu dinheiro, que age com usura, mesquinhez etc. Outra atitude muito triste são as brigas que acontecem em casa por conta das finanças, pois isso é uma péssima influência para os filhos.\n\nOutro desafio é deixar todo o pecado que “tão firmemente se apega a nós”. As tentações que envolvem o dinheiro são inúmeras. Não apenas as maneiras erradas para obtê-lo, como a cobiça, desonestidade, sonegação de impostos e corrupção, mas também como e com o que estamos gastando nosso dinheiro.\n\nA Bíblia apresenta o exemplo triste de Judas, que era um dos discípulos de Cristo. Ele era o gestor das finanças do que Jesus e Seus apóstolos recebiam, mas, secretamente, retirava para si parte do que era arrecadado.\n\nQuem sabe lá no fundo de seu coração, ele achava que tinha esse direito, por trabalhar para a obra de Cristo. Vejamos o que a Bíblia diz sobre ele: “Mas Judas Iscariotes, um dos seus discípulos, aquele que estava para trair Jesus, disse: — Por que este perfume não foi vendido por trezentos denários e o valor não foi dado aos pobres? Ele disse isso não porque se preocupava com os pobres, mas porque era ladrão e, tendo a bolsa do dinheiro, tirava o que era colocado nela” (João 12:4-6).\n\nDevemos eliminar de nossas vidas o uso indiscriminado do dinheiro com coisas nocivas à saúde física e espiritual. Bebidas alcoólicas, fumo, drogas e gula são exemplos de pecados que devem ser abandonados. Na sequência do texto de Hebreus, há um importante conselho: “corramos com perseverança a carreira que nos está proposta”. O ideal é que todos se preparassem para um dia alcançar a independência ou liberdade financeira, que são idênticas.\n\nO que é a independência ou liberdade financeira? É quando alguém tem renda suficiente para viver com qualidade de vida, sem precisar mais trabalhar. Esse alvo não precisa ser alcançado apenas quando se chega à aposentadoria, mas mesmo durante a vida ativa. É a chamada renda passiva, proveniente de renda de locação de imóveis, royalties, juros compostos ou dividendos. A jornada para chegar lá é cheia de percalços, por isso, deve haver perseverança.\n\nA construção de um patrimônio é feita inicialmente com pequenos aportes, com atenção aos detalhes com a economia, cuidando não apenas das grandes despesas, mas também das pequenas, como acontece no mundo dos negócios. Grandes corporações que se tornaram impérios começaram em uma pequena loja, uma garagem ou até dentro de casa.\n\nPor último, o essencial: a riqueza só produzirá felicidade se for submetida a Cristo. Por isso, o conselho do apóstolo: “corra sua jornada olhando para Jesus”. Olhar para Jesus é colocá-Lo como prioridade na vida (Mateus 6:33); é seguir Seus ensinamentos (Mateus 28:20); é guardar Seus mandamentos (João 14:15); ou seja, na vida financeira, nada será feito em desacordo com a Palavra do Senhor.\n\nUm dos milagres mais incríveis de Jesus foi quando Ele andou sobre as águas em meio a uma tempestade. Antes que Jesus acalmasse essa tempestade, Pedro O reconheceu e Lhe pediu que andasse sobre as águas também. Jesus respondeu: “vem”. Enquanto olhava para Cristo, Pedro miraculosamente andou sobre as águas, mas quando temeu e desviou os olhos de Cristo, ele começou a afundar no mar agitado. Pedro clamou por socorro e Jesus o socorreu. Ao entrarem no barco, Jesus declarou: “— Homem de pequena fé, por que você duvidou?” (Mateus 14:31). Note que Jesus não repreendeu a Pedro por querer andar sobre as águas, mas, sim, por ter fraquejado em sua fé.\n\nNão há nenhum pecado em “querer andar sobre as águas”. Ser uma pessoa de destaque na sociedade, ter um nome reconhecido, realizar grandes conquistas materiais e alcançar rapidamente a independência financeira. Não é pecado “andar sobre as águas”. Pecado é desviar os olhos de Cristo. Dinheiro com Deus é bênção, mas sem Ele, é um caminho para a perdição.", "refs": "Hebreus 12:1-2 · Eclesiastes 3:13"}, {"titulo": "Prosperidade e a família", "conteudo": "“Bem-aventurado aquele que teme o Senhor e anda nos seus caminhos! Você comerá do fruto do seu trabalho, será feliz, e tudo irá bem com você. Sua esposa, no interior de sua casa, será como a videira frutífera; seus filhos serão como rebentos da oliveira ao redor da sua mesa”. (Salmo 128:1-3)\n\n## Reconheça a importância que o dinheiro tem\n\nPara ter sucesso financeiro é fundamental reconhecer a importância que o dinheiro tem. Será que teríamos um animalzinho em casa se isso não fosse importante? Uma motocicleta ou um carro? Da mesma forma, se o dinheiro não for importante para nós, certamente não teremos nenhum. As pessoas que dizem que o dinheiro não é importante são, geralmente, aquelas que não têm nada.\n\nUma vez que tenhamos esse pensamento a respeito do dinheiro, como será possível construir uma jornada financeira em busca da riqueza, prosperidade e uma vida estável e equilibrada? Tudo começa dentro de casa, entre os membros da família, mas, principalmente, com o casal.\n\nQuando o rei Salomão descreveu sobre a importância da unidade do casal, ele usou as seguintes palavras: “Melhor é serem dois do que um, porque maior é o pagamento pelo seu trabalho. Porque se caírem, um levanta o companheiro. Mas ai do que estiver só, pois, caindo, não haverá quem o levante. Também, se dois dormirem juntos, eles se aquecerão; mas, se for um sozinho, como se aquecerá? Se alguém quiser dominar um deles, os dois poderão resistir; o cordão de três dobras não se rompe com facilidade” (Eclesiastes 4:9-12).\n\nO casal deve trabalhar unido, com total e ampla transparência. A esposa deve conhecer os detalhes das finanças, receitas e despesas, tanto quanto o marido. O texto base da união conjugal, em Gênesis 2:24, diz que “ambos serão uma só carne”. Este texto se refere a uma união integral, ou seja, espiritual, física e material.\n\nPode até ser que um dos cônjuges tenha mais habilidade para lidar com o dinheiro; que ele ou ela seja o responsável pelos pagamentos, por guardar as notas, fazer a declaração do imposto de renda, conferir os extratos bancários etc. Mas isso não lhe dá o direito de tomar decisões sozinho. Ambos devem conhecer os detalhes e, o mais importante, tomarem decisões em conjunto. E devem, juntos, buscar a ajuda do Pai Celestial, pois quando Salomão menciona “o cordão de três dobras”, naturalmente está adicionando ao casal a presença da bênção de Deus.\n\nO escritor Harv Eker afirma com propriedade: “É o que está embaixo da terra que cria o que está em cima dela. É o invisível que produz o visível. Para mudar os frutos, primeiro tem que trocar as raízes – quando deseja alterar o que está visível, antes deve modificar o que está invisível.” É em casa que se faz o planejamento, o orçamento, onde se determina os sonhos e a família lança as bases para uma vida financeira de prosperidade.\n\nUma vez que as “raízes” estão lançadas, agora é seguir em frente que os frutos virão no seu devido tempo. É importante o envolvimento de todos os membros da família. Os filhos devem participar desde cedo, conhecendo o orçamento e os seus limites. A palavra-chave é compartilhar, porque quem participa, colabora. O princípio é simples: quem ajuda a ganhar tem o direito de gastar. Quem ajuda a gastar tem o dever de ajudar a ganhar. Quem não trabalha tem o dever de ajudar a economizar.\n\nO grau de envolvimento dos filhos deve aumentar à medida que eles amadurecem. Uma vez que os filhos participam na elaboração do orçamento e conhecem os limites e as prioridades, com certeza entenderão um “não” da parte dos pais, quando for necessário. As expectativas em relação as possibilidades e limites na vida financeira familiar deve começar quando os planos para o casamento estão sendo realizados. É comum, principalmente para a noiva, que o padrão de vida mude após o casamento. Não será fácil para o jovem marido, recém-casado, que muito provavelmente está dando os primeiros passos na vida profissional, ainda em formação e estudando, oferecer à jovem esposa o mesmo conforto proporcionado por seus pais que tinham a vida financeira totalmente consolidada.\n\nPor esse motivo, para que não haja uma frustração por parte do jovem casal, logo após o casamento, deve ser feito um “alinhamento de expectativas”, que nada mais é do que um diálogo franco sobre o orçamento do novo lar que estão formando. O ideal é que eles unifiquem as rendas de ambos e façam o orçamento dentro do que ganham, definindo, assim, o novo padrão de vida, que pode ser inferior ao que tinham antes sob o sustento dos pais.\n\nQuando a Bíblia diz que “o homem deixará pai e mãe para se unir à sua mulher” (este “deixar” é para ambos), entende-se também que este “deixar” é físico, emocional e financeiro. Os pais podem até dar presentes, um apoio, uma ajuda pontual ao jovem casal. Mas o casal jamais deve manter uma dependência dos pais. A jornada na construção de uma nova vida material e financeira deve ser feita por ambos, unidos nas decisões, no controle e nos propósitos.\n\nPode ser que algum leitor deste estudo diga que no seu caso a harmonia conjugal nas finanças é algo impossível, pois uma das partes se nega a conversar, dialogar e trabalhar junto. O que deve ser feito quando isso acontece?\n\nNão é fácil mudar pessoas que não querem fazer sua parte no cuidado das finanças. O dever de cada cônjuge é usar o que aprendeu para melhorar a si mesmo e a sua vida, e, assim, influenciar a outra parte. A família deve estar unida, orando a Deus e buscando sabedoria para compartilharem as decisões sobre finanças a fim de que haja harmonia e bem-estar no lar.", "refs": "Eclesiastes 4:9-12 · Gênesis 2:24 · Salmo 128:1-3"}, {"titulo": "Conselhos práticos – parte 1", "conteudo": "“Quanto melhor é adquirir a sabedoria do que o ouro! E mais excelente, adquirir a prudência do que a prata!”. (Provérbios 16:16)\n\n## Cuidado com o consumismo\n\nSe você fosse atribuir um fator determinante para a estabilidade financeira de uma família, qual seria? É fato que a estabilidade financeira de uma família não está associada necessariamente ao tamanho da renda, mas à uma boa administração das despesas. O mesmo acontece no mundo corporativo. As empresas mais estáveis nem sempre são as que mais faturam, e sim as que têm uma boa gestão de seus custos.\n\nPara serem competitivas no mercado, além de qualidade nos produtos, serviços e um bom atendimento, elas precisam ter um preço justo naquilo que oferecem a seus clientes. E um dos fatores que mais contribuem para a definição dos preços são os custos.\n\nNa vida pessoal acontece o mesmo. Se não há uma boa gestão das despesas, o padrão de vida fica mais caro e a qualidade é comprometida. O consumo compulsivo sem planejamento mina as economias da família.\n\nVivemos em uma sociedade extremamente consumista. O tempo todo somos bombardeados por propagandas, elas estão em todos os lugares, como TV, rádio, internet, outdoors, jornais, revistas, redes sociais, transportes, vitrines, placas, carros de som etc. Muitos cedem à tentação. Essa doença chamada consumismo conduz ao endividamento e, de igual modo, à redução da qualidade de vida com o pagamento de despesas com juros e mais juros. Além da instabilidade financeira, o consumismo afeta outras áreas da vida, como os relacionamentos, a família, o casamento, a saúde e a fidelidade a Deus.\n\nEm Ageu 1:6, a Bíblia traduz o consumismo com as palavras: “Vocês semearam muito e colheram pouco; comem, mas isso não chega para matar a fome; bebem, mas isso não dá para ficarem satisfeitos; põem roupa, mas ninguém se aquece; e o que recebe salário, recebe-o para colocá-lo numa sacola furada.”\n\nPara controlar o impulso pelas compras, o planejamento é fundamental, isto é, saber o que comprar, quando e como pagar. Ninguém deveria ir às compras sem ter esse planejamento básico. O que deve definir uma compra não deve ser o saldo bancário, mas sim o orçamento.\n\nFazer uma lista com antecedência do que comprar no mercado será fundamental para otimizar o orçamento, pois evita comprar o que não precisa e evita esquecer o que é necessário, tendo posteriormente que suprir a necessidade com opções mais caras e, em muitos casos, com desperdício de tempo.\n\nTraumas da infância em relação ao dinheiro também podem afetar a forma como as pessoas conduzem suas vidas financeiras, tornando-as consumistas. E essa doença tem nome: oneomania – que é o transtorno compulsivo por compras. O psicanalista e professor da ESPM Pedro de Santi explica: “A dependência é o encontro de uma estrutura emocional frágil desde a infância com um grande apelo de consumo na sociedade”.\n\nAo tratar de um assunto delicado como o de um cristão causar escândalo e se tornar pedra de tropeço para o seu semelhante, Jesus usa uma metáfora poderosa para nos deixar um precioso conselho que também pode ser aplicado à questão do consumismo:\n\n“E, se a sua mão leva você a tropeçar, corte-a; [...] se o seu pé leva você a tropeçar, corte-o; [...] se um dos seus olhos leva você a tropeçar, arranque-o...” (Marcos 9:43-47).\n\nEssa metáfora nos ensina que o desenvolvimento espiritual na vida cristã requer sacrifício e disciplina. No aspecto da economia pessoal ou familiar não é diferente, pois a maturidade financeira também envolve disciplina e sacrifício. Ou seja, tudo que leva uma pessoa a ceder às tentações do consumo deve ser “cortado”. Como é o caso do uso indiscriminado do cartão de crédito. Se alguém não consegue controlar seus impulsos, que corte o cartão e o jogue fora.\n\nSe uma família vai passear no shopping e quer apenas dar uma volta, almoçar, jantar, ou apenas tomar um sorvete e não quer correr o risco de gastar um dinheiro que não tem ao ser exposta às muitas “promoções”, que deixe em casa os cartões de débito e crédito e leve apenas o dinheiro do estacionamento e do que se propôs a fazer indo até o shopping.\n\n## Domine seus impulsos\n\nSaber distinguir a diferença de desejo e necessidade é fundamental para dominar os impulsos. Diante de uma decisão de consumo, é importante fazer as seguintes perguntas antes de comprar: Preciso mesmo desse produto? Se eu não comprar, vai fazer falta? É o momento certo de comprar? O valor está dentro do meu orçamento? Se uma das respostas for não, então não compre!\n\nSe você tem dificuldade de exercer o autocontrole, há uma boa notícia, pois Deus, em Sua infinita bondade, provê uma solução para essa fraqueza. É isso o que o apóstolo Paulo escreveu: “Mas o fruto do Espírito é: amor, alegria, paz, longanimidade, benignidade, bondade, fidelidade, mansidão, domínio próprio” (Gálatas 5:22-23).\n\nEntão, para que você tenha domínio próprio, é necessário ser cheio do Espírito Santo. Mas note que as promessas de Deus não param por aqui, pois Jesus ainda acrescenta a informação de que Deus deseja dar o Seu Espírito em abundância a todos aqueles que pedirem, como declarado em Lucas 11:13: “Ora, se vocês, que são maus, sabem dar coisas boas aos seus filhos, quanto mais o Pai celeste dará o Espírito Santo aos que lhe pedirem!”\n\nPara os casos mais complexos, principalmente os descontroles gerados por traumas do passado, é importante procurar ajuda, dedicar tempo à uma terapia e se submeter a um tratamento que envolva médicos ou especialistas. Isso fará toda diferença e ajudará a pessoa a entender e a lidar com essas questões.\n\n## Responsabilidade com os gastos\n\nViver sem um planejamento financeiro é como andar de olhos vendados à beira de um precipício. Portanto, uma vez que a base familiar já esteja bem estabelecida, é necessário trabalhar com eficiência para que o planejamento e o orçamento sejam executados como previstos. Para tanto, deve-se gastar o salário com responsabilidade. Em primeiro lugar, com o que pode e não com o que se deseja, gastando de acordo com as possiblidades da família.\n\nSaber como gastar é tão importante quanto ganhar. Uma pessoa pode ser um excelente vendedor, de destaque, ganhar muitos prêmios, mas se não souber administrar seus ganhos, tudo será em vão. Por isso, ter um orçamento, comprar somente à vista, fazer pesquisas de preços antes das compras, praticar a economia doméstica, fazer lista de compras para o mercado etc., trarão redução de despesas e, como consequência, um melhor aproveitamento da renda e qualidade de vida.\n\nVale ressaltar algo muito significativo, que são as despesas com alimentação fora de casa e em momentos de lazer, no mercado, restaurantes e praças de alimentação. Além do custo, deve-se considerar o impacto na saúde.\n\nNosso corpo e mente são nossas ferramentas de trabalho. Cuidar da saúde significa ter uma mente “limpa” para o aprendizado e, consequentemente, mais oportunidades de crescimento. Ter um corpo saudável significa mais produtividade. Além disso, jamais deveríamos nos esquecer de que o corpo é o templo do Espírito Santo (1 Coríntios 6:19), e que um corpo saudável e uma mente iluminada pelo Espírito de Deus proporcionarão as virtudes necessárias para uma vida equilibrada em todos os aspectos.\n\n## Organização financeira e o futuro\n\nTodos nós deveríamos nos fazer a seguinte pergunta: Como eu gostaria que estivesse minha vida financeira daqui a 5, 10, 20 anos, ou quando chegar à aposentadoria? Como estará a minha vida financeira quando chegar lá?\n\nNão é difícil responder a essa pergunta. Vamos fazer aqui uma comparação com a saúde física, pois o mesmo conceito pode ser aplicado à nossa relação com ela. Se queremos saber como vai estar nossa saúde daqui a 5, 10 ou 20 anos, basta parar para analisar como estamos cuidando dela hoje. Se praticamos exercícios físicos regularmente, se temos uma alimentação saudável, se respeitamos as horas do repouso, se o sono é reparador, se nos abstemos de coisas nocivas como o fumo, drogas, bebida alcóolica, refrigerantes, açúcar, frituras, gorduras etc., certamente teremos uma boa saúde lá na frente. Mas se negligenciamos os princípios básicos de saúde, a “fatura” virá, e a conta poderá ser alta. A mesma coisa acontece com as finanças. Se hoje ignoramos os princípios básicos de uma boa educação financeira, a “fatura” virá, com certeza!\n\nInfelizmente, muitas pessoas não se empenham na busca pela prosperidade e os motivos são os mais diversos: incredulidade, dívidas, acham que estão velhos demais para começar, pensam que riqueza é para os ricos, acreditam que por serem pobres nunca irão chegar lá etc.\n\nExiste um lindo verso da Bíblia que pode muito bem ser aplicado à questão financeira. O texto diz assim: “A vereda dos justos é como a luz da aurora, que vai brilhando mais e mais até ser dia perfeito” (Provérbios 4:18).\n\nMuitas pessoas sonham com a ideia do enriquecimento rápido. A menos que se ganhe uma herança ou acerte na loteria – o que, além de ser ilusório e viciante, é também uma perda de dinheiro – ninguém fica rico da noite para o dia. A busca da prosperidade é uma longa jornada, onde se dá um passo de cada vez até chegar ao alvo. É economizando e investindo um pouco aqui e um pouco ali que a riqueza será construída. Por isso, é importante ter um planejamento. Mais uma vez o livro de Provérbios nos instrui sobre a necessidade de um bom plano financeiro e nos adverte quanto à ideia do enriquecimento rápido:\n\n“Os planos bem elaborados levam à fartura; mas o apressado sempre acaba na miséria” (Provérbios 21:5).\n\nO processo para se livrar de dívidas, ou mesmo a busca da prosperidade começa da mesma forma como a cura para uma doença. A primeira coisa a ser feita é um diagnóstico. É somente depois que um médico examina o paciente e tem em suas mãos os resultados dos exames que ele prescreve o tratamento.\n\nTodos devem fazer um diagnóstico de sua vida financeira, seja para iniciar a liquidação das dívidas, para começar a jornada da busca da prosperidade ou para fortalecer o aumento do patrimônio.\n\nEsse diagnóstico envolve saber com precisão qual a renda da família e onde está sendo gasta. Os aplicativos de smartphones ou mesmo uma pequena caderneta são muito úteis para que todas as despesas sejam anotadas, pequenas e grandes. Despois de alguns meses, uma média mensal das despesas deve ser feita, e esta deve ser comparada com a renda média da família. O resultado dessa equação (renda menos despesa), deve ser positivo. Ou seja, se uma família consegue fazer três mil reais por mês, a despesa mensal deve ser menor que esse valor. Esse é um princípio básico de economia.\n\nPara ser traçada a rota de uma viagem, é necessário saber a sua localização e para onde quer ir. Uma vez que isso esteja muito bem definido, então é possível escolher o melhor caminho para se chegar lá.\n\nNa vida financeira acontece o mesmo. É importante saber como está a sua realidade atual, qual o seu padrão, onde está sendo gasta a renda da sua família e, então, definir os seguintes pontos: o que você precisa manter, o que deve excluir, e quais passos devem ser dados em direção aos objetivos que você e sua família propuseram. É com base nesse diagnóstico e com o conhecimento de para onde está indo cada centavo da renda que será elaborado o orçamento.", "refs": "Ageu 1:6 · Marcos 9:43-47 · Provérbios 21:5"}, {"titulo": "Conselhos práticos – parte 2", "conteudo": "“As dívidas, para o homem honesto, são uma servidão amarga”. (Publius Syrius)\n\n## Fuja das dívidas\n\nA dívida realmente pode escravizar uma pessoa e, por essa razão, o sábio Salomão faz uma poderosa advertência para que fujamos dela do mesmo modo que uma “gazela” foge “das mãos do caçador” (Provérbios 6:3-5). O apóstolo Paulo corrobora com este pensamento ao afirmar o seguinte: “Paguem a todos o que lhes é devido: a quem tributo, tributo; a quem imposto, imposto; a quem respeito, respeito; a quem honra, honra. Não fiquem devendo nada a ninguém, exceto o amor de uns para com os outros. Pois quem ama o próximo cumpre a lei” (Romanos13:7-8 – grifos acrescentados).\n\nA dívida é uma doença que leva a vida financeira à falência. Comprar à vista e pagar as contas em dia é fundamental para que a jornada em busca da prosperidade financeira seja realizada com sucesso. Assim como não se deve gastar tudo o que se recebe, também não se deve gastar antes de receber. É difícil viver sem se endividar? Sem fazer crediários? Talvez para muitos pareça difícil, mas com certeza é possível.\n\nSe você estiver disposto a realizar só o que é fácil, a vida será difícil. Mas se concordar em fazer o que é difícil, a vida se tornará fácil.\n\nTalvez alguns pensem que a busca da prosperidade seja uma utopia, algo impossível de ser alcançado porque estão muito endividados. Mas é importante entender que, assim como a riqueza começa pequena e cresce, da mesma forma é a dívida. O endividamento está grande, porém começou pequeno e, para liquidá-lo, tem que ser trilhado o mesmo caminho. Nosso enfoque não pode estar nos problemas, mas nas soluções.\n\nPor exemplo, se uma pessoa só enxerga um grande problema diante de si, isso pode significar que ela está sendo tão “pequena” que não consegue mais se enxergar. Ninguém deve se deixar enganar pelas aparências. O nosso mundo exterior é, de certa forma, um reflexo do nosso mundo interior. Se queremos fazer uma mudança permanente, devemos redirecionar o foco: do tamanho dos nossos problemas para o tamanho da nossa pessoa. Não foque nos problemas, mas nas soluções.\n\nTodas as dívidas podem ser pagas, o que difere é o tempo de um caso para outro. Quanto maior for a dívida em relação à renda ou salário, maior será o tempo para se livrar dela, mas uma coisa é certa, isso pode ser feito.\n\nEm primeiro lugar é preciso conhecer o perfil da dívida: a quem se deve, a quantidade de parcelas em atraso e as que ainda não venceram, saber com exatidão quanto que se deve para cada banco, loja ou instituição e a taxa de juros que está sendo aplicada em cada uma dessas dívidas. Feito isso, a pessoa poderá começar o plano de pagamento das dívidas com o saldo positivo do balanço mensal, ou seja, da receita menos a despesa. A primeira dívida a ser paga são as dos serviços essenciais: água, luz, gás e telefone, que são imprescindíveis. Depois, as dívidas que estão sendo corrigidas pela maior taxa de juros, e assim sucessivamente.\n\nAlgo que pode ajudar, é trocar uma dívida que está sendo corrigida com uma taxa de juros maior por outra com uma taxa de juros menor. O conhecido crédito consignado, a linha de crédito pessoal que tem a menor taxa de juros no mercado, pode ser útil para pagar dívidas que têm uma taxa de juros maior. Uma alternativa são os Feirões Limpa Nome, organizados em parceria com marcas, lojas, bancos e financeiras, em que as condições de negociação se tornam mais acessíveis ao devedor.\n\nMas o mais importante para se livrar das dívidas não é conhecer o seu perfil, negociar com os credores ou mesmo buscar linhas de crédito que tenham uma taxa de juros mais razoável. O passo mais importante para isso é ser humilde e reconhecer que uma mudança radical no estilo de vida deve ser feita, com medidas fortes para reduzir as despesas da família.\n\nSe o objetivo é atingir um novo patamar na vida, deve-se sair da zona de conforto e praticar ações desconfortáveis. Mudar para um aluguel mais barato, tirar as crianças da escola particular, vender o carro ou carros e andar de transporte público, não comer fora de casa, não viajar nas férias e procurar fazer passeios gratuitos com as crianças, apenas para citar alguns exemplos. O tamanho dessas medidas será proporcional à necessidade. Sem uma mudança radical, talvez as dívidas nunca sejam quitadas.\n\nNão gastar antes de receber é imprescindível, mas é de se considerar certos tipos de dívidas. Vejamos alguns casos:\n\nQuando a opção de pagar à vista com desconto não existe. Exemplos: compras de passagens aéreas parceladas sem juros nos sites e, às vezes, o mercado dá a opção de pagar em duas ou três vezes sem aumento. A vantagem neste caso é que o valor que seria pago à vista ficará investido e rendendo juros.\n\nFinanciamento do carro, quando este é uma ferramenta indispensável para o trabalho. Normalmente a taxa de juros é baixa, uma vez que o próprio carro fica como garantia e só passa a ser seu após a quitação total. É importante lembrar que a parcela tem que caber no orçamento.\n\nFinanciamento da casa própria.\n\n## Elabore um plano financeiro e respeite seu orçamento\n\nA base para qualquer empreendimento financeiro é o orçamento. Quem negligencia essa base está determinando o seu fracasso. Jesus declarou: “Pois qual de vocês, pretendendo construir uma torre, não se assenta primeiro para calcular a despesa e verificar se tem os meios para a concluir? Para não acontecer que, tendo lançado os alicerces e não podendo terminar a construção, todos os que a virem zombem dele, dizendo: ‘Este homem começou a construir e não pôde acabar’” (Lucas 14:28-30).\n\nO orçamento vai determinar o padrão de vida da família, que deve ser proporcional à renda. Nesse sentido, considere com atenção a instrução da Palavra de Deus que diz: “Que a vida de vocês seja isenta de avareza. Contentem-se com as coisas que vocês têm, porque Deus disse: ‘De maneira alguma deixarei você, nunca jamais o abandonarei’” (Hebreus 13:5).\n\nAo seguir fielmente o plano financeiro mantendose dentro do orçamento, o resultado entre as receitas da família e as despesas será sempre positivo e este saldo deverá ser utilizado para formar o fundo de reserva da família, a poupança. Alguns podem achar que o controle das finanças através do orçamento é desnecessário. Mas há um velho ditado que diz: “Você se esquece daquilo que escuta; se lembra daquilo que vê; entende aquilo que faz”.\n\nNo momento em que o casal fizer o orçamento, entenderá por que gastam muito em determinados itens, por que devem ser mais econômicos e por que os gastos devem ser equilibrados, como estabelecer limites para fechar as contas, onde mexer para que haja sobra e gere o fundo de reserva. O orçamento abre os olhos da pessoa para que ela enxergue onde está e dá a base para estabelecer o lugar a que deseja chegar.\n\nTodo empreendimento tem como base um orçamento sólido, em que todas as receitas estão previstas, sempre de forma conservadora, e todas as despesas são descritas, com uma boa margem para imprevistos. As empresas sólidas e geradoras de lucro e valor, realizam suas despesas com base no orçamento, não com base no saldo bancário.\n\nNa elaboração do orçamento, todos os membros da família devem participar e conhecer os detalhes. Como base para elaboração de um orçamento, deve-se anotar por pelo menos 3 meses tudo o que a família gasta; pequenas e grandes despesas. Feito isso, é possível tirar uma média mensal dos gastos, incluindo 1/12 das despesas pagas uma única vez no ano, como IPVA, IPTU, e assim sucessivamente. Nada deve ser esquecido. A média mensal de cada um dos itens do orçamento deve ser feita, e então usar essas informações como base para estabelecer o limite mensal de cada um dos gastos. Veja nas páginas 85, 86 e 87 algumas formas de como fazer essas anotações utilizando uma pequena caderneta, planilha ou até mesmo um aplicativo.\n\n## Faça a sua reserva\n\nO livro de Provérbios, escrito pelo sábio Salomão, está cheio de verdades práticas para o nosso dia a dia. Ele afirmou: “Na casa do sábio há tesouros preciosos e o suficiente para viver, mas o tolo desperdiça tudo o que tem” (Provérbios 21:20). Umas das razões por que as famílias não progridem na vida financeira, não constroem um patrimônio ou alcançam a riqueza, é porque gastam tudo o que recebem e estão sempre no limite.\n\nA chave para a prosperidade é saber poupar, formar uma reserva e fazer com este montante bons investimentos de onde venha uma receita adicional, seja com aluguéis, com juros provenientes dos rendimentos de aplicações em renda fixa ou dos dividendos dos investimentos em renda variável.\n\n## Benefícios da reserva financeira\n\n• Cobre os imprevistos;\n• Torna o consumo mais barato com o pagamento à vista;\n• Traz economia no pagamento de impostos em uma única parcela (IPVA, IPTU etc.);\n• Aumenta o poder de compra e negociação na hora de realizar compras de bens: móveis, veículos, eletrodomésticos, peças, assessórios etc.\n\n• Garante a estabilidade financeira no longo prazo;\n• Garante a realização dos sonhos da família.\n\nO primeiro passo para a formação de uma reserva financeira é ter um orçamento fechado com uma boa sobra todos os meses. Eis a regra de ouro na vida das pessoas prósperas: viver um padrão de vida um pouco menor do que se poderia. Essa regra vai facilitar tremendamente o fortalecimento da reserva financeira.\n\n## Eis as colunas da estabilidade financeira no longo prazo\n\n1. Não gastar tudo que recebe;\n2. Não gastar antes de receber;\n3. Formar uma reserva e reforçá-la todos os meses.\n\nOutro aspecto importante é não gastar antes de receber, ou seja, eliminar todo e qualquer parcelamento, comprando tudo à vista. Isso vai fazer com que o montante gasto com as necessidades da família seja muito menor.\n\nPode ser que alguém diga que a reserva financeira é tão importante que ela deve ser prioridade, ou seja, ao receber o salário, deve-se separar primeiro o valor da reserva financeira e só então realizar as despesas e o pagamento das dívidas. Reservar primeiro antes de gastar está corretíssimo, mas antes de pagar as dívidas é um erro grave, pois haverá perda de renda. Não faz sentido ter uma reserva rendendo a uma taxa de juros de 1% ao mês se alguém tem uma dívida sendo corrigida a uma taxa de juros de 3% ao mês. A prioridade máxima da família é quitar as dívidas e só depois começar a fazer a reserva financeira.\n\nTemos um exemplo na Bíblia sobre isso, no conselho de Eliseu à viúva, após realizar o milagre da multiplicação do azeite. Está em 2 Reis 4:7: “Então ela foi e contou ao homem de Deus. Ele disse: — Vá, venda o azeite e pague a sua dívida; e você e os seus filhos vivam do que sobrar.”\n\nA dívida é um mau testemunho, e se livrar dela deve ser uma prioridade na vida de todo cristão. Sobre dívidas bancárias, todo cuidado é pouco. Apenas renegociar não é suficiente. A taxa de juros tem que ser praticável, justa e honesta. Renegociar simplesmente para ter uma parcela de amortização mensal que cabe no orçamento, mas sem considerar a taxa de juros, é um erro grave. Se a taxa de juros não é razoável, deve-se deixar o pagamento do banco para o período de prescrição da dívida, quando certamente será paga com uma correção justa. Neste ponto é importante conhecer as implicações disso, porque mesmo que a dívida caduque depois de cinco anos, ela continuará existindo. O que muda é que o banco não poderá mais cobrar judicialmente, mas a dívida deve ser paga porque isso é uma responsabilidade de todo cristão (Romanos 13:7-8; Mateus 22:21).", "refs": "Provérbios 6:3-5 · Romanos 13:7-8 · Lucas 14:28"}, {"titulo": "Ouse sonhar", "conteudo": "“Quem deixa de sonhar, deixa de viver”. (Ditado popular)\n\n## Tenha metas\n\nMuitas famílias não se motivam a crescer na vida financeira, e só trabalham para pagar as contas. O resultado inevitável é que acabam sobrevivendo apertadas mês a mês. Muitos fatores contribuem para isso, mas sem dúvida a falta de sonhos, metas e objetivos são alguns dos principais motivos.\n\nHá um ditado popular que diz que “quem não sabe para onde vai, qualquer caminho serve”. É importante ter uma meta, estabelecer objetivos patrimoniais, ter sonhos e projetos para a família, pois isso vai trazer motivação para economizar. E esses sonhos devem alcançar todos os membros da família.\n\nHá uma lei universal que diz: “Aquilo que focalizamos se expande”. Se focarmos nos nossos objetivos e sonhos, eles se expandirão diante de nós.\n\nOs sonhos e os objetivos não devem ser apenas para satisfazer desejos, como uma viagem internacional, férias especiais ou alguma atividade prazerosa, mas devem também ter como propósito a formação do patrimônio da família.\n\nEsse patrimônio deve ser de bons ativos, que gerem renda e não despesa. Automóvel, por exemplo, nem deve ser considerado como “patrimônio”, um ativo, pois além de ele depreciar rapidamente, independentemente do uso, também traz muitas despesas. Casa de praia é outro exemplo de um ativo ruim, pois se a mesma não puder ser alugada, só vai gerar despesas.\n\nBons ativos são imóveis que trazem renda de aluguéis ou bons investimentos do mercado financeiro, que aumentam com os juros compostos ou com dividendos. Ao estabelecer sonhos e objetivos, estes devem ser quantificados e deve-se estabelecer uma data para que sejam realizados. O montante deve ser dividido pelo número de meses até a realização, para se saber exatamente o quanto será necessário economizar mensalmente.\n\nPode parecer um pouco trabalhoso, mas na verdade é muito fácil e vale a pena seguir os seguintes passos:\n\nTodos os projetos, objetivos e sonhos de família devem ser escritos, anotados em uma agenda, caderno ou planilha e passado de ano para ano, para que não sejam esquecidos.\n\nÉ muito bom ter também pequenos sonhos para o médio e até curto prazo. A realização deles será uma grande motivação para que os grandes sejam alcançados.\n\nAs conquistas patrimoniais da família devem ser celebradas, pois nelas há um fortalecimento da visão de médio e longo prazo. Essa celebração não precisa ser complexa e nem cara, mas ela tem o seu lugar e precisa ser celebrada.\n\nTer sonhos é bom, mas muito melhor é realizá-los. Os sonhos, cuja realização alcança todos os membros da família, geram um poderoso engajamento na busca da economia e, assim, se tornam mais fáceis de serem realizados. Portanto, eles devem ser compartilhados com toda a família e relembrados de tempos em tempos. E como fazer isso?\n\nEm Lucas 15 encontramos três parábolas com grandes ensinamentos. Elas falam de conquistas que foram realizadas: uma ovelha perdida que foi resgatada; uma dracma perdida que foi encontrada; e um filho pródigo que volta para casa e para os braços do pai. As três histórias terminam com felicidade, alegria e festa.\n\n## Casa própria, o objetivo patrimonial número 1\n\nExiste uma dúvida entre os investidores se compensa comprar uma casa ou morar de aluguel e investir no mercado financeiro. Vale destacar que a obtenção da casa própria vai muito além de apenas um investimento. A casa própria traz segurança para a família.\n\nA avaliação a ser feita é o quanto se gasta com aluguel, pois este representa uma das maiores despesas no orçamento da família. Por isso, deve-se fazer um estudo cuidadoso, pois pagar um financiamento, mesmo que por um longo prazo, é muito melhor do que pagar aluguel. Em cada parcela de um financiamento existe uma amortização do saldo devedor. É como comprar uma casa em pequenas parcelas a uma taxa de juros extremamente razoável.\n\nO ideal é que o valor da prestação fique bem próxima a de um aluguel de mercado. Se por qualquer motivo a família necessitar mudar, o imóvel poderá ser alugado e garantirá o pagamento do financiamento.\n\nMuitas pessoas ficam esperando para fazer o investimento na casa própria. Por que não pensar de outra forma? Compre e espere... o futuro dirá qual foi a melhor opção.", "refs": "Lucas 15"}, {"titulo": "Invista para o futuro", "conteudo": "“O homem bom deixa herança aos filhos de seus filhos”. (Provérbios 13:22)\n\n## Pense a longo prazo\n\nFormar uma reserva financeira é pensar, a longo prazo, nos sonhos que serão realizados e nos objetivos que serão alcançados. Talvez alguém diga: como posso pensar no amanhã se mal consigo sobreviver a este momento? O fato é, no fim das contas, o amanhã se tornará hoje. Quem não cuidar do problema agora, dirá a mesma coisa de novo amanhã. Por isso, pensar no futuro é poupar e investir.\n\nOs temas da formação de uma reserva, poupança e investimentos também são destaques em diversas passagens da Bíblia e deixam uma lição a ser praticada. A história de José no Egito é um exemplo de como Deus deseja abençoar seus filhos fiéis. Em meio à crise que lhe foi revelada, José foi inspirado por Deus e foi capaz de dar o seguinte conselho para Faraó: “Agora, pois, Faraó devia escolher um homem ajuizado e sábio e encarregá-lo de dirigir a terra do Egito. Faraó devia fazer isto: pôr administradores sobre a terra e recolher a quinta parte dos frutos da terra do Egito nos sete anos de fartura. Esses administradores deviam ajuntar toda a colheita dos bons anos que virão, recolher cereal por ordem de Faraó, para mantimento nas cidades, e guardá-lo em armazéns. Assim, o mantimento servirá para abastecer a terra nos sete anos da fome que haverá no Egito; para que a terra não seja destruída pela fome” (Gênesis 41:33-36).\n\nA vida de José e suas ações como gestor fez do Egito a nação mais rica do mundo daquela época. Ali os povos vinham para comprar alimentos. Através da sua administração, a vida da ascendência de Jesus (Jacó e sua família) foi preservada.\n\nA permanência de José no Egito também foi uma bênção espiritual para a sua família, pois trouxe a oportunidade para a conversão de seus irmãos ao reconhecerem o seu pecado, se arrependerem e receberem o perdão. Assim como aconteceu em uma grande e poderosa nação, a lição da poupança também pode ser encontrada na vida de pequenas criaturas como as formigas: “As formigas, povo sem força; todavia, no verão preparam a sua comida” (Provérbios 30:25).\n\nA poupança, ou reserva, tem um duplo objetivo. Primeiro, prover o necessário para os momentos de crises e imprevistos. Segundo, porque é indispensável para a realização dos sonhos da família, através de bons investimentos. A Bíblia afasta a ideia de que investimento é só para os ricos e a parábola dos talentos, contada por Jesus em Mateus 25, nos ajuda a esclarecer este ponto. Notem o que Jesus disse exatamente àquele que tinha recebido a menor parte, retendo em suas mãos os talentos sem fazer nada: “Você devia ter entregado o meu dinheiro aos banqueiros, e eu, ao voltar, receberia com juros o que é meu” (Mateus 25:27).\n\nEste conceito de investimento também está no rol de bênçãos materiais que Deus está pronto a conceder aos Seus filhos fiéis: “Vocês emprestarão a muitas nações, porém não tomarão emprestado” (Deuteronômio 28:12). Ao mesmo tempo em que o texto exclui o endividamento, pois “não tomarão emprestado”, também afirma que aquele que pratica os ensinamentos de Deus irá fazer investimento: “...emprestarão a muitas nações”. Emprestar nada mais é que colocar o dinheiro nas mãos de outros e receber juros por isso. No mercado financeiro, isso é chamado de renda fixa. O investidor empresta sua reserva financeira para um banco ou governo e recebe uma remuneração por isso, através de um indexador, uma taxa de juros que é determinada no momento do investimento, seja pré ou pós-fixado.\n\nUma vez que esteja claro para o leitor da Palavra de Deus que o tema do investimento faz parte da jornada financeira de um cristão, é importante conhecer o básico para se investir de forma segura e estável. Na prática só existem dois tipos de investimento no mercado: renda fixa e renda variável. A diferença é que na renda fixa o investidor já sabe quanto seu dinheiro vai render no momento da aplicação. Já na renda variável, o rendimento poderá ter muita flexibilidade durante o período do investimento, para cima, ou para baixo. É por isso que investimento em renda variável deve ser feito para o longo prazo, no mínimo acima de 5 anos, para superar variações negativas que afetam o mercado financeiro.\n\nNão existe o “melhor investimento”, existe o mais adequado ao perfil de cada investidor, ao montante que dispõe, ao objetivo a ser alcançado pelo tempo em que o dinheiro ficará investido. Para renda fixa existem vários produtos com características diferentes que serão muito úteis para guardar a reserva de emergência (para o dia a dia), para o curto prazo (até um ano) e para o médio prazo (até 5 anos) e até para o longo prazo. Para tanto, o estabelecimento financeiro que oferece o serviço ao cliente deve estar devidamente autorizado pelo Banco Central do Brasil, cujo site fornece a relação dos estabelecimentos autorizados.\n\nA Bíblia fala de investimento com dinheiro, não fala de negociação com o dinheiro. Em Ezequiel 18:13 é dito que “aquele que emprestar com usura e receber juros não viverá”. Ou seja, a Palavra de Deus condena o empréstimo abusivo, com usura, ou seja, com juros excessivos, o que diante de Deus é pecado. Serviços e produtos que especulam no mercado financeiro não podem ser considerados investimentos, como “opções binárias”, fazer “trade”, que é comprar e vender ações. Quem o faz, está fazendo um negócio, não um investimento.\n\nDevemos seguir os sábios conselhos de Salomão se quisermos investir em renda variável, ou seja, obter instrução e conhecimento para isso, aprender como funciona o mercado financeiro e saber quais são os riscos e implicações envolvidos nas operações. O ideal é que o investidor entre em renda variável depois que já tiver uma robusta reserva financeira para as emergências e imprevistos, e para todas as despesas extras que surgem no curto e médio prazo. Não são poucos os que querem fazer “investimentos” de retorno rápido, mas isso é um grave erro. Não existem milagres. Para se construir um bom patrimônio é preciso tempo, perseverança e paciência.\n\nNo dia 14 de abril de 1912 aconteceu um dos maiores desastres navais da história, quando naufragou no Atlântico Norte o navio Titanic, ao atingir um iceberg, tirando a vida de aproximadamente mil e quinhentas pessoas. Depois de uma longa e cara investigação, a causa foi que a velocidade do navio estava acima do que deveria. A informação apresentada no famoso filme é 100% verídica. Os construtores queriam chegar a Nova York um dia antes do previsto e assombrar o mundo com tamanha façanha. Em investimentos, a “velocidade” é inversamente proporcional à segurança e traz riscos extremos. Devemos nos lembrar das palavras do sábio Salomão em Provérbios 10:4 que diz assim: “À mão dos diligentes vem a riqueza”. O diligente é aquele que age com sabedoria e paciência.", "refs": "Gênesis 41 · Provérbios 13:22 · Ezequiel 18:13"}, {"titulo": "Finanças e o relacionamento com Deus", "conteudo": "“Lembrem-se do SENHOR, seu Deus, porque é ele quem lhes dá força para conseguir riquezas; para confirmar a sua aliança, que, sob juramento, prometeu aos pais de vocês, como hoje se vê”. (Deuteronômio 8:18)\n\nA Bíblia nos revela que Deus é dono de todas as coisas, que tudo vem dEle (1 Crônicas 29:14). Em Ageu 2:8 Deus diz: “Minha é a prata, meu é o ouro”. Por mais que Satanás tenha se apossado deste mundo, a onipotência de nosso Deus não está oculta, e como a Sua Palavra afirma muitas vezes, a mão do Senhor não está e nunca estará encolhida para abençoar Seus filhos (Êxodo 9:3; Isaías 59:1).\n\nVivemos em um grande conflito entre as forças do bem e do mal. De um lado estão os anjos ministradores de nosso Deus e a ação de Seu Santo Espírito, e do outro estão as forças do mal, conduzidas pelo inimigo de Deus. A graça de nosso Deus está ao nosso dispor para nos livrar das garras do pecado, do mal, para nos proteger e conduzir com segurança ao galardão da vida eterna onde seremos cidadãos da Cidade Santa. Mas assim como o inimigo de Deus, Satanás, não pode nos obrigar a pecar, pois essa é uma escolha pessoal, Deus também não vai nos obrigar a receber as Suas bênçãos. Estar nas mãos estendidas de nosso Pai Celestial é uma escolha a ser feita.\n\nHá um texto muito conhecido no livro de Apocalipse onde Jesus diz: “Eis que estou à porta e bato, se alguém ouvir a Minha voz, e abrir a porta, entrarei em Sua casa e cearei com ele, e ele comigo” (Apocalipse 3:20). Temos que “abrir a porta” de nosso coração para receber a graça de Cristo e, da mesma forma, abrir a de nossa vida financeira para que todas as promessas de Deus se cumpram na condução de nossa vida material em busca de uma vida estável e próspera.\n\nTemos que abrir a porta da nossa vida financeira para que todas as promessas de Deus se cumpram.”\n\nE como “abrimos a porta” para Deus em nossa vida material? Dizimando, conforme a promessa do Senhor descrita no livro do profeta Malaquias: “Eu abrirei as portas do Céu derramando bênçãos sem medida” (Malaquias 3:10). A Bíblia só apresenta uma maneira de provarmos a Deus, se Ele realmente cumpre o que promete, e esta é através dos dízimos: “‘Ponham-me à prova’, diz o SENHOR dos Exércitos” (Malaquias 3:10).\n\nÉ claro que as bênçãos que Deus deseja derramar sobre Seus filhos por serem fiéis dizimistas, vai muito além da questão financeira. Amor, paz, saúde e fé na família são dádivas muito mais preciosas que as materiais, mas viver com dignidade na questão material é uma bênção 100% certa e segura para todos.\n\nUm filho obediente de Deus não andará endividado, dando mau testemunho. Muito pelo contrário, além de dizimista fiel, será ofertante e generoso com o próximo. Observe a seguinte declaração do apóstolo Paulo, pois ela tem tudo a ver com a vida financeira: “Irmãos, exortamos vocês a que progridam cada vez mais e se empenhem por viver tranquilamente, cuidar do que é de vocês e trabalhar com as próprias mãos, como ordenamos, para que vocês vivam com dignidade à vista dos de fora, e não venham a precisar de nada” (1 Tessalonicenses 4:10-12).\n\nDizimar é exercer nosso livre-arbítrio, nosso direito de escolha, é sair do terreno do inimigo para as mãos estendidas de Deus que estão prontas para abraçar, proteger, sustentar e abençoar. Dizimar é “abrir a porta” para que Ele venha cear conosco, é tê-Lo como parte de nossa família. Ele vai se “assentar à mesa” quando estivermos fazendo nosso planejamento e orçamento, vai nos dar sabedoria para as decisões e escolhas, vai nos dar o Seu Santo Espírito, e com Ele, o domínio-próprio para resistirmos à satisfação de desejos carnais que são contrários à Sua vontade. O que a Bíblia ensina sobre finanças e o relacionamento com Deus não tem nenhuma relação com a chamada “teologia da prosperidade”, onde se apregoa que temos que dar para receber, e quanto mais damos, mais recebemos. Deus não tem uma “banca” com bênçãos para vender. Ele abençoa segundo Seu amor e misericórdia. Por trás daqueles que promovem a teologia da prosperidade está apenas o interesse em explorar pessoas simples e humildes e se beneficiar de sua inocência. Vale aqui se lembrar das palavras de Tiago: “Resistam ao diabo, e ele fugirá de vocês” (Tiago 4:7).", "refs": "Malaquias 3:10 · Ageu 2:8 · Apocalipse 3:20"}, {"titulo": "Bênçãos compartilhadas", "conteudo": "“O generoso será abençoado, porque reparte o seu pão com os pobres”. (Provérbios 22:9)\n\n## Grandes responsabilidades\n\nUmas das maiores dádivas de nosso Deus é o privilégio de sermos pais e mães. Mas esse privilégio vem acompanhado de uma grande responsabilidade. Além de educarmos nossos filhos nos caminhos do Senhor, devemos transmitir a eles os valores que os tornarão cidadãos honestos, de caráter e que sejam testemunhas do Senhor.\n\nEsse processo passa pela educação financeira. Primeiramente, os pais devem educar pelo exemplo, não brigando e discutindo sobre dinheiro diante dos filhos. Muito pelo contrário: devem ter uma vida sóbria e equilibrada com as finanças. Mas também devem ensiná-los na prática, e um dos métodos mais eficientes é dando a eles uma mesada que será proporcional à idade. Juntamente com a mesada, deve-se dar as devidas orientações para que gastem com responsabilidade.\n\nMuitas são as lições a serem aprendidas, como a importância do dinheiro, a arte de ficar dentro dos limites, a valorização dos recursos e a principal delas: a oportunidade de dizimar e ofertar de suas próprias rendas, mesmo que aos olhos humanos seja pouco. Dessa forma ensinaremos nossos filhos a lição do desprendimento das coisas materiais e a fidelidade ao nosso Deus. Lembre-se das palavras: “Ensine a criança no caminho em que deve andar, e ainda quando for velho não se desviará dele” (Provérbios 22:6).\n\n## Mais feliz é aquele que dá do que aquele que recebe\n\nA Palavra de Deus ainda apresenta um ingrediente adicional na administração das nossas finanças para que o “fascínio das riquezas” não sufoquem nossa fé, além de nos trazer o desprendimento das coisas materiais desta vida. Esse ingrediente é o “amor em ação”, ou seja, dar um pouco do que temos em forma de ofertas e doações. É isso que Paulo nos ensina através das palavras de Jesus registradas em Atos 20:35 que diz: “é preciso socorrer os necessitados e lembrar das palavras do próprio Senhor Jesus: ‘Mais bem-aventurado é dar do que receber.’” É muito bom ser feliz, melhor ainda é contribuir para a felicidade das pessoas através de nossa atenção, carinho e doação. O verso mais conhecido da Bíblia diz que “Deus amou o mundo de tal maneira que deu o Seu Filho...” (João 3:16). Dar é uma das maiores expressões de amor. O segredo para um casamento feliz é quando os cônjuges se dão um para o outro sem esperar receber nada em troca.\n\nJesus fez uma declaração muito oportuna que nos ajuda a lembrar de nossa responsabilidade social, declarando: “Porque os pobres estarão sempre com vocês” (Marcos 14:7). Não podemos viver neste mundo sem expressar amor aos mais necessitados. Temos que colocar em prática o grande mandamento deixado por Jesus: — “Ame o Senhor, seu Deus, de todo o seu coração, de toda a sua alma e de todo o seu entendimento. [...] Ame o seu próximo como você ama a si mesmo” (Mateus 22:37–39).\n\nEsse amor pelo nosso semelhante não é um amor fingido de meras palavras, mas um amor de coração que envolve “atos” de bondade, resignação e sacrifício. É isso o que João, o discípulo amado nos ensina. Veja o que ele escreveu: “Nisto conhecemos o amor: que Cristo deu a sua vida por nós; portanto, também nós devemos dar a nossa vida pelos irmãos. Ora, se alguém possui recursos deste mundo e vê seu irmão passar necessidade, mas fecha o coração para essa pessoa, como pode permanecer nele o amor de Deus? Filhinhos, não amemos de palavra, nem da boca para fora, mas de fato e de verdade” (1 João 3:16-18). Nosso Pai, em Sua infinita misericórdia e bondade, ainda concede bênçãos exclusivas àqueles que, com coração amoroso e desprendido, compartilham o que têm com os mais necessitados.\n\n## Veja algumas bênçãos do Senhor em resposta à generosidade\n\n• Quem dá aos pobres está emprestando a Deus (Provérbios 19:17);\n• Quem dá com liberalidade aumenta seu patrimônio (Provérbios 11:24);\n• Quem dá será abençoado (Provérbios 22:9);\n• Será feliz (Isaías 58:10);\n• Será próspero (Provérbios 11:15);\n• Suas necessidades serão supridas (Filipenses 4:19);\n• O Pai o recompensará (Mateus 6:4);\n• O Senhor o livrará no dia do mal (Salmos 41:1);\n• Seus celeiros se encherão fartamente (Provérbios 3:10);\n• Não terá falta de nada (Provérbios 28:27);\n• Terá um tesouro no Céu (Mateus 19:21);\n• Conhecerá a Deus (Jeremias 22:16);\n• A terra e os filhos que Deus lhe der serão abençoados (Levíticos 26:5);\n\n## Dizimar é um ato de responsabilidade\n\nMuito mais que satisfazer as necessidades imediatas dos mais necessitados, um gesto muito mais elevado é levar até eles a Palavra do Senhor. Essa é a maior necessidade a ser suprida e isso deve ser feito ofertando e doando generosamente para a pregação do Evangelho. Uma das formas de colocar isso em prática é sendo um Anjo da Esperança, é doar financeiramente para que a Novo Tempo faça o seu trabalho e alcance muitas pessoas.\n\nSe você recebeu esse curso gratuitamente, é porque alguém fez uma doação financeira para a Novo Tempo. Sem esse apoio, a Novo Tempo não produziria, nem ofereceria e enviaria cursos gratuitos como esse para milhares de pessoas todos os meses. Conheça esse projeto, confira as informações contidas nas páginas desse guia de estudo e torne-se um Anjo da Esperança. Seja você um missionário também!\n\nQuerido Deus, muito obrigado por cada Anjo da Esperança que faz a sua doação e possibilita que estudos bíblicos como este chegue às mãos de milhares de pessoas. Peço a Tua bênção sobre eles e oro também em favor de cada pessoa que recebe este Guia de Estudo, para que tenha saúde, paz, esperança, sabedoria para administrar as finanças e que seja próspera em todos os seus empreendimentos. Em nome de Jesus, amém!\n\nQuem dizima não é um Anjo da Esperança. Dizimar é um ato de responsabilidade, de honestidade, de obediência à ordem de Deus de devolver a Ele o que lhe pertence. Doar como um Anjo da Esperança é um ato voluntário de dar uma parte daquilo que pertence ao doador, um ato de amor e compromisso pela pregação do Evangelho, entendendo que a Novo Tempo pode alcançar mais pessoas com a Palavra do Senhor. Pessoas que, de outra forma, provavelmente não seriam alcançadas.\n\nAo terminar esse estudo, renove o seu compromisso de fidelidade a Deus e faça um compromisso de ser generoso em suas ofertas e doações para que nosso Senhor Jesus Cristo volte logo a esta Terra. E que se cumpra em nossas vidas a grande promessa: “Seja fiel até a morte, e eu lhe darei a coroa da vida” (Apocalipse 2:10).", "refs": "Atos 20:35 · Provérbios 22:6 · Provérbios 22:9"}], "prova": [{"pergunta": "Qual é o maior objetivo de Deus para o ser humano?", "opcoes": ["Salvação e libertação deste mundo de pecado.", "Prosperidade financeira.", "Que ele construa sua casa própria.", "Nenhuma das alternativas está correta."], "correta": 0, "grupo": "Capítulo 1 · Um guia seguro"}, {"pergunta": "Tendo a Bíblia como fonte de instrução, o que Deus deseja para o ser humano? 2 Timóteo 3:16-17", "opcoes": ["Que o homem de Deus seja imperfeito.", "Que ele seja perfeitamente habilitado para toda boa obra.", "Que o homem de Deus seja educado na injustiça.", "Todas as alternativas estão corretas."], "correta": 1, "grupo": "Capítulo 1 · Um guia seguro"}, {"pergunta": "Ao se tratar de prosperidade financeira, qual deve ser o foco? Mateus 6:33", "opcoes": ["Seguir o conselho dos experts em investimentos.", "Buscar em primeiro lugar o Reino de Deus e a sua justiça.", "Realizar sonhos materiais como construir / adquirir a casa própria, viajar e conhecer outros países etc.", "Nenhuma das alternativas está correta."], "correta": 1, "grupo": "Capítulo 1 · Um guia seguro"}, {"pergunta": "De acordo com o texto, por que o apego ao dinheiro se tornou uma maldição para a humanidade?", "opcoes": ["Porque o ser humano se tornou mais generoso e propenso a dividir seus recursos.", "Porque o dinheiro passou a ocupar o lugar errado na escala de valores da vida.", "A busca incessante pelo dinheiro evitou grandes atrocidades como guerras, corrupção e a degradação da humanidade.", "Todas as alternativas estão corretas."], "correta": 1, "grupo": "Capítulo 2 · Prosperidade à luz da Bíblia"}, {"pergunta": "A lição citou três textos que aparentemente falam contra a riqueza (1 Timóteo 6:10; Marcos 10:25; Marcos 10:21). Qual é o real problema tratado por estes textos?", "opcoes": ["Se quisermos alcançar a graça de Deus e nos salvar, temos que nos livrar do dinheiro e ser pobres.", "O dinheiro é intrinsecamente mau.", "Amar o dinheiro é errado, portanto é pecado. Mas quando é usado de acordo com a orientação divina, ele se torna uma bênção.", "Nenhuma das alternativas está correta."], "correta": 2, "grupo": "Capítulo 2 · Prosperidade à luz da Bíblia"}, {"pergunta": "De acordo com o guia de estudo, assinale a única frase falsa:", "opcoes": ["Uma vez que compreendemos os ensinamentos bíblicos sobre o dinheiro e seu uso, ele trará felicidade para nós, nossa família e ao próximo.", "Qualquer coisa que se coloque no lugar de Cristo, inclusive o dinheiro e a riqueza, tornase um deus e uma escravidão.", "Uma forma de honrar o nome do Senhor é ser fiel e generoso através dos dízimos, ofertas e doações.", "Os ricos não entrarão no Céu."], "correta": 3, "grupo": "Capítulo 2 · Prosperidade à luz da Bíblia"}, {"pergunta": "Que promessas Deus fez para nós? Assinale a alternativa errada.", "opcoes": ["Forças para adquirir riquezas (Deuteronômio 8:17-18).", "Felicidade com a prosperidade e a riqueza (Salmos 112:1-3).", "Sustento e fortalecimento (Isaías 41:10).", "O justo desamparado e a sua descendência mendigará o pão (Salmos 37:25)."], "correta": 3, "grupo": "Capítulo 3 · Promessas de sabedoria e prosperidade"}, {"pergunta": "Quais são as condições para se alcançar essas bênçãos? Deuteronômio 28:1, 2, 13", "opcoes": ["Ouvir a voz do Senhor e guardar todos os Seus mandamentos.", "Fazer promessas a Deus.", "Investir na bolsa de valores.", "Ouvir a voz dos experts em investimentos e obedecer as leis do mercado financeiro."], "correta": 0, "grupo": "Capítulo 3 · Promessas de sabedoria e prosperidade"}, {"pergunta": "O conhecimento é importante, mas mais importante ainda é “ter uma mente sábia para a gestão das finanças”. Como podemos adquirir essa sabedoria? Tiago 1:5", "opcoes": ["Somente fazendo cursos com os melhores profissionais da área.", "É só pedir a Deus que Ele dará a sabedoria com generosidade.", "Essa sabedoria só se adquire com a experiência de tentativas – erros e acertos.", "Nenhuma das alternativas está correta."], "correta": 1, "grupo": "Capítulo 3 · Promessas de sabedoria e prosperidade"}, {"pergunta": "Mateus 15:14 diz: “Se um cego guiar outro cego, ambos cairão no buraco”. Como o autor do curso aplicou este texto?", "opcoes": ["Para alcançar a prosperidade e riqueza dentro dos planos de Deus, o conhecimento deve ser buscado em fontes que se alimentam das Escrituras Sagradas.", "O conhecimento técnico para a gestão de finanças não é importante.", "Os conceitos bíblicos de ética, gestão e finanças são dispensáveis.", "Nenhuma das alternativas está correta."], "correta": 0, "grupo": "Capítulo 4 · Guia seguro para a vida"}, {"pergunta": "De acordo com o autor do curso, assinale a alternativa correta:", "opcoes": ["Ser rico sem Deus pode ser uma maldição.", "Satanás vai fazer de tudo para que a avareza, o dinheiro e a ganância tomem o lugar de Deus, ocupando o trono da vida do homem e, dessa forma, levando-o à ruína.", "Na parábola do semeador, é dado um destaque sobre o perigo das riquezas, quando ela se torna uma prioridade ou uma obsessão.", "Todas as alternativas estão corretas."], "correta": 3, "grupo": "Capítulo 4 · Guia seguro para a vida"}, {"pergunta": "Por que se deve tomar muito cuidado com as orientações de autores e influencers não cristãos?", "opcoes": ["O objetivo da maioria deles é buscar a riqueza para “satisfazer os sonhos” que têm tudo a ver com a salvação eterna.", "Muitos deles estimulam seus leitores e seguidores a serem ricos, sem dizer o que fazer com a riqueza.", "Esses autores falam sobre a importância de dizimar, ofertar e promover a pregação do evangelho.", "Nenhuma das alternativas está correta."], "correta": 1, "grupo": "Capítulo 4 · Guia seguro para a vida"}, {"pergunta": "De acordo com o autor do curso, como o texto de Hebreus 12:1-2 pode ser aplicado?", "opcoes": ["A todos os empreendimentos que são realizados em nossa vida: estudos, carreira, vida profissional, vida financeira e em muitos outros.", "Apenas às questões financeiras.", "Este texto trata somente da questão espiritual.", "Nenhuma das alternativas está correta."], "correta": 0, "grupo": "Capítulo 5 · Prosperidade e perseverança"}, {"pergunta": "Assinale a alternativa correta:", "opcoes": ["Um cristão que não paga suas contas dá um bom testemunho de sua fé.", "O cristão que age com usura dá um bom testemunho de sua fé.", "A forma como conduzimos as finanças poderá confirmar ou negar nossa fé, e exercerá influência em quem vive ao nosso redor.", "Todas as alternativas estão corretas."], "correta": 2, "grupo": "Capítulo 5 · Prosperidade e perseverança"}, {"pergunta": "Sobre independência ou liberdade financeira, assinale a alternativa correta:", "opcoes": ["É quando alguém tem renda suficiente para viver com qualidade de vida, sem precisar mais trabalhar.", "A independência financeira não precisa ser alcançada apenas quando se chega à aposentadoria.", "A jornada para chegar lá é cheia de percalços, por isso, deve haver perseverança.", "Todas as alternativas estão corretas."], "correta": 3, "grupo": "Capítulo 5 · Prosperidade e perseverança"}, {"pergunta": "Em Eclesiastes 4:9-12 Salomão descreveu a importância da unidade do casal. Qual é a implicação dessa unidade entre marido e mulher?", "opcoes": ["O casal deve trabalhar unido, com total e ampla transparência.", "A esposa deve conhecer os detalhes das finanças, receitas e despesas, tanto quanto o marido.", "Ambos devem conhecer os detalhes e tomar decisões em conjunto.", "Todas as alternativas estão corretas."], "correta": 3, "grupo": "Capítulo 6 · Prosperidade e a família"}, {"pergunta": "Quando se trata de finanças na família, assinale a alternativa correta.", "opcoes": ["Podemos afirmar que é na escola que se faz o planejamento financeiro.", "Não é importante que os filhos participem do planejamento financeiro da família.", "Os filhos devem participar desde cedo, conhecendo o orçamento e os seus limites.", "Nenhuma das alternativas está correta."], "correta": 2, "grupo": "Capítulo 6 · Prosperidade e a família"}, {"pergunta": "Qual é a implicação da afirmação bíblica de que o homem deve deixar pai e mãe para se unir à sua mulher? Gênesis 2:24", "opcoes": ["O jovem deve ser independente dos pais no aspecto físico, emocional e financeiro.", "Não há problema do filho continuar dependendo dos pais no aspecto financeiro.", "Isso quer dizer que os pais não podem dar uma ajuda financeira pontual para o casal.", "Nenhuma das alternativas está correta."], "correta": 0, "grupo": "Capítulo 6 · Prosperidade e a família"}, {"pergunta": "Sobre princípios de economia no mundo corporativo, assinale a alternativa correta:", "opcoes": ["As empresas mais estáveis são sempre as que mais faturam.", "As empresas mais estáveis são geralmente as que têm uma boa gestão de seus custos.", "Um dos fatores que mais contribuem para a definição dos preços não são os custos.", "Nenhuma das alternativas está correta."], "correta": 1, "grupo": "Capítulo 7 · Conselhos práticos – parte 1"}, {"pergunta": "Que fator está associado ao consumismo e deve ser tratado com ajuda médica especializada?", "opcoes": ["Traumas da infância que desencadeiam o consumo exagerado.", "O transtorno compulsivo por compras.", "A doença conhecida como oneomania.", "Todas as alternativas estão corretas."], "correta": 3, "grupo": "Capítulo 7 · Conselhos práticos – parte 1"}, {"pergunta": "Que fator é imprescindível para controlar o impulso pelas compras?", "opcoes": ["O planejamento financeiro, isto é, saber o que comprar, quando e como pagar.", "O que deve definir uma compra é o saldo bancário.", "O único critério para o consumo é saber se tenho dinheiro para comprar.", "Nenhuma das alternativas está correto."], "correta": 0, "grupo": "Capítulo 7 · Conselhos práticos – parte 1"}, {"pergunta": "Que conselho é dado por Salomão a respeito das dívidas? Provérbios 6:3-5", "opcoes": ["Podemos fazer dívida apenas com os bancos.", "Devemos fugir das dívidas do mesmo modo que uma gazela foge do caçador.", "Só não podemos fazer dívidas com os agiotas que agem com usura.", "Nenhuma das alternativas está correta."], "correta": 1, "grupo": "Capítulo 8 · Conselhos práticos – parte 2"}, {"pergunta": "Que orientação o apóstolo Paulo oferece em Romanos 13:7-8?", "opcoes": ["Não fique devendo nada a ninguém.", "É necessário pagar a todos o que lhes é devido.", "Devemos amar o nosso semelhante.", "Todas as alternativas estão corretas."], "correta": 3, "grupo": "Capítulo 8 · Conselhos práticos – parte 2"}, {"pergunta": "Qual é o primeiro passo para se elaborar um orçamento familiar?", "opcoes": ["Registrar por três meses tudo o que família gasta e calcular a média do gasto mensal.", "Fazer uma reserva financeira.", "Cortar gastos.", "Nenhuma das alternativas está correta."], "correta": 0, "grupo": "Capítulo 8 · Conselhos práticos – parte 2"}, {"pergunta": "Quando se trata de finanças, qual deve ser o principal propósito dos sonhos e objetivos da família?", "opcoes": ["Fazer viagens internacionais.", "Tirar férias especiais e prazerosas.", "Formar o patrimônio familiar.", "Nenhuma das alternativas está correta."], "correta": 2, "grupo": "Capítulo 9 · Ouse sonhar"}, {"pergunta": "Que tipo de patrimônio é um bom ativo?", "opcoes": ["São aqueles que geram renda e não despesas, entre eles estão os imóveis que trazem renda de aluguéis.", "Carro.", "Casa de campo ou de praia.", "Nenhuma das alternativas está correta."], "correta": 0, "grupo": "Capítulo 9 · Ouse sonhar"}, {"pergunta": "Qual deve ser o objetivo patrimonial número 1 para a família?", "opcoes": ["Fazer uma viagem internacional.", "Adquirir a casa própria.", "Comprar o carro dos sonhos.", "Nenhuma das alternativas está correta."], "correta": 1, "grupo": "Capítulo 9 · Ouse sonhar"}, {"pergunta": "Sobre reserva financeira, assinale a alternativa correta:", "opcoes": ["Formar uma reserva financeira é pensar, a longo prazo, nos sonhos que serão realizados.", "Pensar no futuro é poupar e investir.", "José no Egito é um grande exemplo de se fazer uma reserva para os momentos de crise.", "Todas as alternativas estão corretas."], "correta": 3, "grupo": "Capítulo 10 · Invista para o futuro"}, {"pergunta": "Assinale a alternativa falsa:", "opcoes": ["A Bíblia afasta a ideia de que investimento é só para os ricos.", "Um dos objetivos da reserva ou poupança é prover o necessário para os momentos de crises e imprevistos.", "A reserva financeira não é necessária para a realização dos sonhos de família.", "A lição da poupança pode se ensinada pelas formigas."], "correta": 2, "grupo": "Capítulo 10 · Invista para o futuro"}, {"pergunta": "De acordo com o autor, a Bíblia fala de investimento com dinheiro e não de negociação com dinheiro. Qual é o único exemplo de investimento e não negociação?", "opcoes": ["Empréstimo abusivo, com usura, ou seja, com juros excessivos.", "Fazer trade, que é comprar e vender ações.", "Serviços e produtos que especulam no mercado financeiro.", "Emprestar dinheiro para o banco ou governo – renda fixa."], "correta": 3, "grupo": "Capítulo 10 · Invista para o futuro"}, {"pergunta": "Assinale a única afirmação falsa:", "opcoes": ["A Bíblia revela que Deus é dono de todas as coisas e que tudo vem das mãos dEle.", "Deus é o dono da prata e do ouro.", "Deus não se importa com os aspectos materiais e financeiros da nossa vida.", "A mão de Deus nunca está encolhida para abençoar Seus filhos."], "correta": 2, "grupo": "Capítulo 11 · Finanças e o relacionamento com Deus"}, {"pergunta": "Qual é a única maneira que a Bíblia apresenta de provarmos a Deus, se Ele realmente cumpre o que promete? Malaquias 3:10", "opcoes": ["Através de votos de fidelidade.", "Através dos dízimos.", "Fazer caridade.", "Nenhuma das alternativas está correta."], "correta": 1, "grupo": "Capítulo 11 · Finanças e o relacionamento com Deus"}, {"pergunta": "O que Deus deseja para cada um de nós? 1 Tessalonicenses 4:10-12", "opcoes": ["Progresso na vida.", "Trabalho.", "Vida tranquila e com dignidade.", "Todas as alternativas estão corretas."], "correta": 3, "grupo": "Capítulo 11 · Finanças e o relacionamento com Deus"}, {"pergunta": "Qual é uma das formas mais eficazes de ensinar os filhos a lidarem com o dinheiro?", "opcoes": ["Uma mesada cujo valor seja proporcional com a idade.", "Levar dinheiro para igreja e dar para o filho ofertar na hora em que o diácono passar.", "Não sendo um bom exemplo para os filhos.", "Nenhuma das alternativas está correta."], "correta": 0, "grupo": "Capítulo 12 · Bênçãos compartilhadas"}, {"pergunta": "Que ordenança é dada para todo seguidor de Cristo? Atos 20:35", "opcoes": ["Dar um pouco do que temos em forma de ofertas e doações.", "É preciso socorrer os necessitados e lembrar das palavras de Cristo: “Mais bemaventurado é dar do que receber”.", "Deus nos ensinou a doar pelo exemplo ao entregar Seu Filho para morrer em nosso lugar.", "Todas as alternativas estão corretas."], "correta": 3, "grupo": "Capítulo 12 · Bênçãos compartilhadas"}, {"pergunta": "Quais são as bênçãos para aquele que pratica a generosidade para o seu semelhante? Assinale a alternativa falsa.", "opcoes": ["Será feliz (Isaías 58:10).", "Suas necessidades serão supridas (Filipenses 4:19).", "Quem dá aos pobres está emprestando a Deus (Provérbios 19:17).", "Quem dá com generosidade sentirá falta de seus recursos (Mateus 6:3)."], "correta": 3, "grupo": "Capítulo 12 · Bênçãos compartilhadas"}]},{"id": "est-ouvindo-voz-deus", "titulo": "Ouvindo a Voz de Deus", "descricao": "Série de 27 estudos bíblicos “Ouvindo a Voz de Deus” (material do site maisrelevante.com.br): da Bíblia e da criação à salvação, à volta de Jesus, ao sábado, ao batismo e à vida cristã, com perguntas, recapitulação e compromisso de fé em cada estudo.", "notaMinima": 7, "oficial": true, "licoes": [{"titulo": "A Bíblia Sagrada", "refs": "João 17:17 · Atos 8:26-31 · Isaías 28:10 · João 5:39", "conteudo": "A Bíblia é um livro diferente. Na verdade, trata-se de uma pequena biblioteca, composta de 66 livros escritos por cerca de 40 autores, das mais variadas culturas, origens e ocupações, durante um período de 1.600 anos. Milhares de pessoas já deram a vida, literalmente, em defesa das verdades nela contidas. Por abraçarem essas verdades, blasfemos já se tornaram reverentes; ébrios se tornaram sóbrios; criminosos se tornaram confiáveis, ladrões se tornaram honestos; adúlteros se tornaram puros. O que torna a Bíblia um livro tão especial? De onde vem seu poder? Que valor tem ela para o homem atual? Essas perguntas serão respondidas neste estudo.\n\n## 1. Como Jesus considerava a Bíblia?\n\n> Leia João 17:17. Santifica-os na verdade, a Tua Palavra é a ____.\n\nResposta: A verdade.\n\n## 2. Qual é a situação de muitos estudantes da Bíblia, e o que necessitam para entendê-la?\n\n> Leia Atos 8:26-31. Estudam e não ____. Para entendê-la, alguém precisa ____.\n\nResposta: Estudam e não entendem. Para entendê-la, alguém precisa explicar (orientar).\n\n## 3. Qual é a maneira correta de estudar a Bíblia?\n\n> Leia Isaías 28:10. Marque V ou F: ( ) Comparar os textos que tratam do mesmo assunto. ( ) Buscar outras passagens que explicam o assunto. ( ) Estudar sem pedir a orientação do Espírito Santo. ( ) Um pouco aqui, e um pouco ali sobre o mesmo assunto.\n\nResposta: Verdadeiro:
