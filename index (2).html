eto.\n\n## Estudo de caso 2: Barnabé acolhe Saulo (Atos 9:26-28)\n\nDepois de se converter, Saulo tentou juntar-se aos discípulos em Jerusalém, “mas todos o temiam, não acreditando que ele fosse discípulo” (Atos 9:26). Fazia sentido: Saulo tinha perseguido a igreja. Barnabé, porém, tomou a iniciativa: “tomando-o consigo, levou-o aos apóstolos” e contou como Saulo tinha visto o Senhor e pregado com ousadia em Damasco (Atos 9:27).\n\nBarnabé arriscou a própria reputação por um novo convertido. Ele serviu de ponte entre o recém-chegado e a igreja. Sem Barnabé, talvez a igreja tivesse perdido o apóstolo Paulo.\n\nLição para o obreiro: o novo membro precisa de alguém que o apresente, o acolha e confie nele. Apresente seu interessado aos irmãos, sente-se ao lado dele no culto e ajude-o a fazer amigos na igreja.\n\n## Estudo de caso 3: Barnabé em Antioquia (Atos 11:19-26)\n\nEm Antioquia, muitos gregos creram no Senhor. A igreja de Jerusalém enviou Barnabé para lá. “Tendo ele chegado e, vendo a graça de Deus, alegrou-se e exortava a todos a que, com firmeza de coração, permanecessem no Senhor” (Atos 11:23).\n\nRepare nos três verbos. Ele viu: percebeu o que Deus estava fazendo nos novos crentes. Alegrou-se: não criticou nem comparou; celebrou. E exortou: encorajou-os a permanecer firmes.\n\nDepois, Barnabé percebeu que precisava de ajuda. Foi a Tarso buscar Saulo, e os dois ensinaram durante um ano inteiro naquela igreja. “Em Antioquia, foram os discípulos, pela primeira vez, chamados cristãos” (Atos 11:26). Discipulado é ensino contínuo: um ano inteiro com o mesmo grupo.\n\n## Estudo de caso 4: confirmando as almas (Atos 14:21-23)\n\nNa primeira viagem missionária, depois de pregarem em várias cidades, Paulo e Barnabé fizeram algo importante: voltaram pelos mesmos lugares, “fortalecendo a alma dos discípulos, exortando-os a permanecer firmes na fé; e mostrando que, através de muitas tribulações, nos importa entrar no reino de Deus” (Atos 14:22). Também organizaram líderes em cada igreja (Atos 14:23).\n\nLição para o obreiro: volte para visitar. Prepare o novo crente para as dificuldades, sem ilusões. E ajude-o a encontrar um lugar de serviço na igreja.\n\n## Estudo de caso 5: uma segunda chance para João Marcos (Atos 15:36-41; 2 Timóteo 4:11)\n\nJoão Marcos tinha abandonado Paulo e Barnabé no meio da primeira viagem (Atos 13:13). Quando Barnabé quis levá-lo de novo, Paulo não concordou, e a discordância foi tão forte que eles se separaram. Barnabé levou Marcos consigo para Chipre.\n\nBarnabé apostou em quem tinha falhado. E deu certo: anos mais tarde, o próprio Paulo escreveu: “Toma contigo Marcos e traze-o, pois me é útil para o ministério” (2 Timóteo 4:11). João Marcos escreveu o evangelho de Marcos.\n\nLição para o obreiro: novos crentes vão tropeçar. Alguns vão se afastar. O discipulador não desiste: procura, encoraja e dá uma nova chance.\n\n## O discipulado do novo membro na prática\n\nO cuidado depois do batismo é parte do trabalho do obreiro. Siga estes passos durante os primeiros seis meses:\n\n1. Esteja presente no batismo e nas primeiras semanas. Sente-se com o novo membro nos cultos e apresente-o aos irmãos.\n\n2. Continue o contato semanal. Uma mensagem, uma ligação ou uma visita mostram que ele não foi esquecido depois do batismo.\n\n3. Integre à vida da igreja. Escola Sabatina, pequeno grupo, cultos de oração e programas da igreja. Ajude-o a criar pelo menos cinco amizades na igreja.\n\n4. Ensine os hábitos espirituais. Ajude-o a desenvolver a oração diária, o estudo da Lição da Escola Sabatina, a leitura da Bíblia e a fidelidade.\n\n5. Prepare para as lutas. Mostre que dificuldades e tentações fazem parte da vida cristã, e que Jesus é suficiente.\n\n6. Dê uma tarefa. Todo novo membro deve ter um ministério: recepção, música, ajuda a um projeto, acompanhar o obreiro numa visita. Quem serve permanece.\n\n7. Procure quem se afasta. Se ele faltar duas semanas seguidas, faça contato. Sem cobrança: com saudade.\n\n8. Leve-o a convidar outros. O novo membro tem um círculo de influência novo, cheio de pessoas que ainda não conhecem a igreja. Ele é o melhor convidador que existe.\n\n## Lições de evangelismo que aprendemos com Barnabé\n\n1. O batismo é o início, não o fim, do trabalho com o interessado.\n2. Encorajar é um ministério. Palavras de ânimo mantêm pessoas na igreja.\n3. Seja ponte entre o novo membro e a igreja.\n4. Veja a graça de Deus nas pessoas e alegre-se com ela.\n5. Ensine com constância: discipulado leva tempo.\n6. Dê uma segunda chance a quem falhou.\n7. Saiba trabalhar com outros: Barnabé foi buscar Paulo.\n8. Um homem bom, cheio do Espírito e de fé atrai pessoas ao Senhor.\n\n> Leia Atos 9:26-28. O que poderia ter acontecido se ninguém tivesse acolhido Saulo? Quem, na sua igreja, precisa de um “Barnabé” agora?\n\n> Leia Atos 11:22-26. O que Barnabé viu, sentiu e fez ao chegar em Antioquia? Como isso se aplica ao acompanhamento de um novo batizado?\n\n> Leia Hebreus 10:24, 25 e 1 Tessalonicenses 5:11. Qual é o papel do encorajamento mútuo na vida da igreja?\n\n## PRATICAR · Exercício da semana\n\n1. Identifique na sua igreja um membro batizado há menos de um ano. Procure-o, converse, convide-o para almoçar ou para o seu pequeno grupo.\n2. Identifique alguém que se afastou da igreja. Faça um contato amigável, sem cobrança, apenas para dizer que ele faz falta.\n3. Envie três mensagens de encorajamento nesta semana, para pessoas diferentes.\n\n## AVALIAR · Autoavaliação\n\n• Eu acompanho as pessoas depois que elas tomam uma decisão, ou considero o trabalho terminado?\n• Eu sou conhecido como alguém que encoraja ou como alguém que critica?\n• Eu dou segunda chance a quem me decepcionou?\n• Eu ajudo os novos membros a encontrar amigos e um ministério na igreja?\n\n## MULTIPLICAR\n\nCombine com o seu pequeno grupo ou com o seu par de obreiro uma forma de “adotar” os próximos batizandos da igreja, garantindo que nenhum deles fique sem acompanhamento nos primeiros seis meses.\n\n[ ] Quero ser um Barnabé: encorajar, acolher e acompanhar cada pessoa que eu levar a Jesus, antes e depois do batismo."}, {"titulo": "Aula 7 · Ananias: disposição para servir", "refs": "Atos 9:1-22; Atos 22:6-16; Isaías 6:8", "conteudo": "“Mas o Senhor lhe disse: Vai, porque este é para Mim um instrumento escolhido para levar o Meu nome perante os gentios e reis, bem como perante os filhos de Israel.” (Atos 9:15)\n\nAnanias aparece em poucos versículos da Bíblia. Não sabemos sua profissão, sua idade nem como morreu. Mas Deus o usou num dos momentos mais importantes da história da igreja: o batismo de Saulo de Tarso, que se tornaria o apóstolo Paulo. Ananias é o retrato do servo quase anônimo que, num momento decisivo, disse sim a Deus, mesmo com medo.\n\n## APRENDER · O estudo de caso (Atos 9:10-19; 22:12-16)\n\nSaulo ia a Damasco para prender os cristãos quando foi derrubado por uma luz do céu e ouviu a voz de Jesus. Ficou cego e foi levado para a cidade, onde passou três dias sem comer nem beber, orando (Atos 9:9, 11).\n\nAo mesmo tempo, o Senhor falou em visão a um discípulo chamado Ananias: “Dispõe-te, e vai à rua que se chama Direita, e, na casa de Judas, procura por Saulo, apelidado de Tarso; pois ele está orando” (Atos 9:11). Deus deu instruções específicas: o nome da rua, o nome do dono da casa e o nome da pessoa.\n\n## O medo e a objeção\n\nAnanias respondeu com sinceridade: “Senhor, de muitos tenho ouvido a respeito desse homem, quanto mal tem feito aos Teus santos em Jerusalém; e para aqui trouxe autorização dos principais sacerdotes para prender a todos os que invocam o Teu nome” (Atos 9:13, 14).\n\nO medo de Ananias era razoável. Ir até Saulo podia custar a sua liberdade ou a sua vida. Deus não o repreendeu pelo medo. Apenas repetiu a ordem e revelou o propósito: “Vai, porque este é para Mim um instrumento escolhido” (Atos 9:15). Deus via em Saulo o que Ananias ainda não conseguia ver.\n\nLição para o obreiro: é normal sentir medo, insegurança ou resistência diante de certas pessoas. Leve o medo a Deus em oração, mas não deixe que ele decida por você. Deus vê no interessado um potencial que nós ainda não vemos.\n\n## A obediência e o acolhimento\n\n“Então, Ananias foi e, entrando na casa, impôs sobre ele as mãos, dizendo: Saulo, irmão, o Senhor me enviou, a saber, o próprio Jesus que te apareceu no caminho por onde vinhas, para que recuperes a vista e fiques cheio do Espírito Santo” (Atos 9:17).\n\nAs primeiras palavras de Ananias a Saulo foram “Saulo, irmão”. Para o homem que tinha vindo prender os cristãos, a primeira palavra cristã que ouviu foi “irmão”. Antes de qualquer ensinamento, houve acolhimento. Ananias tocou nele, chamou-o pelo nome e explicou de onde vinha a mensagem: “o Senhor me enviou”.\n\nImediatamente caíram dos olhos de Saulo como que escamas, ele voltou a ver e foi batizado. Depois, alimentou-se e recuperou as forças (Atos 9:18, 19). O cuidado foi completo: espiritual, físico e emocional.\n\n## O apelo ao batismo\n\nQuando Paulo contou essa história anos depois, ele lembrou as palavras de Ananias: “E agora, por que te demoras? Levanta-te, recebe o batismo e lava os teus pecados, invocando o nome dEle” (Atos 22:16). Ananias não deixou a decisão para depois. Quando a pessoa está pronta, o obreiro faz o convite com clareza e amor.\n\nPaulo também lembrou quem era Ananias: “homem piedoso conforme a lei, tendo bom testemunho de todos os judeus que ali moravam” (Atos 22:12). O seu bom testemunho dava credibilidade à sua mensagem.\n\n## O que aconteceu depois\n\nSaulo ficou alguns dias com os discípulos em Damasco e “logo pregava, nas sinagogas, a Jesus, afirmando que Este é o Filho de Deus” (Atos 9:20). O homem que Ananias teve medo de visitar escreveu treze cartas do Novo Testamento e levou o evangelho a boa parte do mundo conhecido. A obediência de um servo quase anônimo mudou a história.\n\n## Lições de evangelismo que aprendemos com Ananias\n\n1. Disponibilidade. Quando Deus chamou, Ananias respondeu: “Eis-me aqui, Senhor!” (Atos 9:10). A primeira qualidade de um obreiro não é a capacidade, mas a disponibilidade, como Isaías: “Eis-me aqui, envia-me a mim” (Isaías 6:8).\n\n2. Obediência apesar do medo. Coragem não é ausência de medo, mas obediência com medo.\n\n3. Deus prepara o caminho. Enquanto Ananias recebia a visão, Saulo estava orando e também tinha visto em visão um homem chamado Ananias chegando (Atos 9:12). Quando Deus envia o obreiro, Ele já está trabalhando no coração do interessado.\n\n4. Acolhimento antes de ensinamento. “Saulo, irmão.” Chame o interessado pelo nome, trate-o com afeto e faça-o sentir-se parte da família de Deus.\n\n5. Não julgue pela fama. O passado de uma pessoa não determina o que Deus pode fazer com ela.\n\n6. Cuidado integral. Ananias orou, batizou e garantiu que Saulo se alimentasse. O obreiro se importa com a pessoa inteira.\n\n7. Convite claro à decisão. “Por que te demoras?” Há um momento certo de fazer o apelo, e o obreiro não deve adiá-lo por timidez.\n\n8. Bom testemunho. A vida do obreiro na comunidade confirma ou desmente a mensagem que ele leva.\n\n9. Servir sem buscar reconhecimento. Ananias desaparece da história depois desse episódio. O servo fiel não precisa de palco.\n\n## Princípios do serviço missionário\n\nO serviço missionário não se resume a dar estudos. Ele inclui visitar doentes, levar alimento a quem precisa, ajudar idosos, acolher visitantes nos cultos, orar com quem sofre. Jesus disse: “Sempre que o fizestes a um destes Meus pequeninos irmãos, a Mim o fizestes” (Mateus 25:40). Muitas vezes o serviço é a porta que leva ao estudo bíblico.\n\nAlgumas atitudes práticas do obreiro que serve:\n• chega no horário combinado e cumpre o que promete;\n• trata cada casa que visita com respeito e discrição;\n• guarda em sigilo o que o interessado compartilha;\n• está disponível em momentos de crise (doença, luto, desemprego);\n• não espera retorno, reconhecimento ou vantagem.\n\n> Leia Atos 9:10-19. Faça uma lista de todas as ordens que Deus deu a Ananias e de todas as ações que ele realizou. O que você aprende com a correspondência entre as duas listas?\n\n> Leia Atos 22:12-16. Que qualidades de Ananias Paulo destacou? Por que elas são importantes para um obreiro?\n\n> Leia Mateus 25:31-46. Como o serviço ao próximo está ligado ao evangelismo?\n\n## PRATICAR · Exercício da semana\n\n1. Pense numa pessoa da qual você tem medo, receio ou preconceito de se aproximar. Ore por ela todos os dias desta semana.\n2. Faça um ato de serviço concreto e discreto, sem contar a ninguém: uma visita a um doente, uma ajuda a um idoso, uma refeição para uma família necessitada.\n3. Treine o acolhimento: no próximo culto, procure um visitante ou alguém que esteja sozinho, chame-o pelo nome e faça-o sentir-se em casa.\n\n## AVALIAR · Autoavaliação\n\n• Quando sinto que Deus quer que eu faça algo, eu obedeço ou fico adiando?\n• Existe alguém que eu considero “perigoso” ou “perdido demais” para ser alcançado?\n• Eu sei acolher pessoas novas, chamando pelo nome e oferecendo amizade?\n• Eu sirvo mesmo quando ninguém está vendo?\n\n## MULTIPLICAR\n\nConvide alguém da igreja para fazer com você o ato de serviço desta semana. Servir junto é uma das melhores formas de formar novos obreiros.\n\n[ ] Senhor, eis-me aqui. Quero estar disponível para ir aonde o Senhor me enviar, mesmo quando eu sentir medo."}, {"titulo": "Aula 8 · Priscila e Áquila: evangelismo em equipe", "refs": "Atos 18:1-4, 18-28; Romanos 16:3-5; 1 Coríntios 16:19; Lucas 10:1, 2; Eclesiastes 4:9-12", "conteudo": "“Melhor é serem dois do que um, porque têm melhor paga do seu trabalho. Porque se caírem, um levanta o companheiro.” (Eclesiastes 4:9, 10)\n\nPriscila e Áquila eram um casal de judeus que trabalhava fabricando tendas. Nunca foram apóstolos nem pregadores famosos, mas aparecem seis vezes no Novo Testamento, e sempre juntos. Eles mostram que o evangelismo é mais forte quando feito em equipe: em casal, em dupla, em família e em pequeno grupo. Nesta última aula de estudos de caso, aprendemos com eles o trabalho em duplas, o ensino e a multiplicação.\n\n## APRENDER · Estudo de caso 1: um lar aberto e uma parceria com Paulo (Atos 18:1-4)\n\nÁquila e Priscila tinham saído da Itália por causa de um decreto do imperador Cláudio que expulsou os judeus de Roma. Em Corinto, Paulo os encontrou e, “visto serem do mesmo ofício, passou a morar com eles e ali trabalhava, pois a profissão deles era fazer tendas” (Atos 18:3).\n\nImagine a convivência: trabalhando lado a lado, conversando sobre as Escrituras, recebendo visitas. Priscila e Áquila aprenderam com Paulo no dia a dia. Depois viajaram com ele para Éfeso, onde ficaram enquanto Paulo seguia viagem (Atos 18:18, 19). Eles foram discipulados para depois discipular.\n\n## Estudo de caso 2: o ensino de Apolo (Atos 18:24-28)\n\nChegou a Éfeso um judeu chamado Apolo, “homem eloquente e poderoso nas Escrituras”. Ele falava com fervor e ensinava com precisão a respeito de Jesus, “conhecendo somente o batismo de João” (Atos 18:24, 25). Faltavam pontos importantes no seu conhecimento.\n\nPriscila e Áquila o ouviram na sinagoga. Não o corrigiram em público nem o humilharam. “Tomaram-no consigo e, com mais exatidão, lhe expuseram o caminho de Deus” (Atos 18:26). Fizeram, em particular e com amor, um verdadeiro estudo bíblico.\n\nO resultado foi extraordinário: Apolo foi para a Acaia e “auxiliou muito aqueles que, mediante a graça, haviam crido; porque, com grande poder, convencia publicamente os judeus, provando, por meio das Escrituras, que o Cristo é Jesus” (Atos 18:27, 28). Um casal simples ensinou um pregador eloquente, que alcançou muitos outros.\n\nLição para o obreiro: há pessoas sinceras e até muito religiosas que conhecem parte da verdade. O obreiro não as despreza nem discute em público; convida-as para estudar e expõe a Palavra com exatidão e amor.\n\n## Estudo de caso 3: a igreja na casa deles (Romanos 16:3-5; 1 Coríntios 16:19)\n\nPaulo os chama de “meus cooperadores em Cristo Jesus, os quais pela minha vida arriscaram a sua própria cabeça” e envia saudações também à “igreja que se reúne na casa deles” (Romanos 16:3-5). Em Éfeso, também havia uma igreja na casa deles (1 Coríntios 16:19).\n\nO lar de Priscila e Áquila era um centro de missão: lugar de hospitalidade, de estudo, de oração e de culto. Era o que hoje chamamos de pequeno grupo.\n\n## Por que trabalhar em duplas\n\nJesus enviou os doze “de dois em dois” (Marcos 6:7) e depois enviou setenta “de dois em dois, para que O precedessem em cada cidade e lugar aonde Ele estava para ir” (Lucas 10:1). Paulo sempre viajou com companheiros: Barnabé, Silas, Timóteo, Lucas. O trabalho em duplas traz muitos benefícios:\n\n• Apoio espiritual: enquanto um ensina, o outro ora em silêncio.\n• Complemento de dons: um pode ser melhor em explicar, o outro em acolher ou em responder perguntas.\n• Segurança e decoro: visitar em dupla protege o obreiro e o interessado. Evite estudar sozinho com alguém do sexo oposto.\n• Formação: um obreiro experiente leva um iniciante, que aprende vendo, depois praticando e, por fim, conduzindo.\n• Perseverança: “se caírem, um levanta o companheiro” (Eclesiastes 4:10). Quando um desanima, o outro encoraja.\n• Continuidade: se um obreiro precisar se ausentar, o interessado não fica abandonado.\n\n## Como funciona uma boa dupla de obreiros\n\n1. Orem juntos antes de cada visita ou estudo.\n2. Combinem os papéis: quem conduz o estudo, quem faz a oração, quem cuida do registro e dos lembretes.\n3. Revezem os papéis para que os dois cresçam.\n4. Avaliem depois de cada encontro: o que foi bem? O que podemos melhorar? Quais dúvidas o interessado trouxe?\n5. Mantenham a comunicação: compartilhem as informações do interessado e registrem tudo no sistema.\n6. Cuidado com conversas paralelas: durante o estudo, o foco é o interessado.\n\n## Multiplicação: o alvo final\n\nPaulo ensinou Priscila e Áquila; eles ensinaram Apolo; Apolo fortaleceu muitos em Acaia. Esse é o princípio de 2 Timóteo 2:2: Paulo, Timóteo, homens fiéis e outros. São quatro gerações de discípulos num só versículo.\n\nPense na diferença: se um obreiro leva uma pessoa a Jesus por ano, em dez anos serão dez pessoas. Mas se cada pessoa alcançada também se tornar obreira e alcançar uma pessoa por ano, e assim por diante, os números se multiplicam. O alvo do obreiro não é apenas ganhar pessoas, mas formar obreiros.\n\nNa prática, isso significa:\n• levar sempre alguém para aprender com você nas visitas e estudos;\n• preparar o novo batizado para dar o seu testemunho e fazer convites;\n• incentivar quem foi batizado a fazer este Curso de Formação de Obreiros;\n• abrir sua casa para um pequeno grupo, como Priscila e Áquila.\n\n## Lições de evangelismo que aprendemos com Priscila e Áquila\n\n1. O evangelismo é mais forte em equipe.\n2. O casal e a família podem ser uma dupla missionária.\n3. O trabalho profissional é ocasião de testemunho.\n4. O lar é um centro de missão.\n5. Corrija com amor e em particular, nunca em público.\n6. Ensine “com mais exatidão”: o obreiro precisa conhecer bem a Palavra.\n7. Quem foi discipulado deve discipular outros.\n8. O alvo final é a multiplicação.\n\n> Leia Atos 18:24-28. Que atitudes de Priscila e Áquila tornaram possível que Apolo aceitasse ser ensinado? Como agir quando um interessado já conhece muito da Bíblia, mas não toda a verdade?\n\n> Leia Lucas 10:1-9. Que instruções Jesus deu aos setenta? Quais delas se aplicam a uma dupla de obreiros hoje?\n\n> Leia 2 Timóteo 2:2. Identifique as quatro gerações de discípulos nesse versículo. Em qual delas você está hoje?\n\n## PRATICAR · Exercício da semana\n\n1. Escolha seu par de obreiro (se ainda não tiver um) e combinem um horário semanal fixo para orar juntos pelos interessados.\n2. Façam juntos uma visita, definindo antes quem conduz, quem ora e quem registra. Depois, avaliem o encontro.\n3. Converse com sua família ou seu pequeno grupo sobre a possibilidade de abrir sua casa para estudos bíblicos ou para um pequeno grupo.\n\n## AVALIAR · Autoavaliação\n\n• Eu prefiro trabalhar sozinho ou sei trabalhar em equipe?\n• Eu aceito ser corrigido e sei corrigir com amor e em particular?\n• Meu lar é um lugar aberto para a missão?\n• Estou preparando alguém para fazer o que eu faço?\n\n## MULTIPLICAR\n\nConvide uma pessoa da igreja para fazer a próxima turma deste curso e ofereça-se para ser o par dela na prática dos estudos bíblicos.\n\n[ ] Quero trabalhar em equipe, abrir meu lar para a missão e formar outros obreiros que também levem pessoas a Jesus."}, {"titulo": "Metodologia · O passo a passo do estudo bíblico", "refs": "Atos 8:26-40; Lucas 24:13-35; 2 Timóteo 2:15; Colossenses 4:5, 6", "conteudo": "“Procura apresentar-te a Deus aprovado, como obreiro que não tem de que se envergonhar, que maneja bem a palavra da verdade.” (2 Timóteo 2:15)\n\nNas aulas anteriores, aprendemos com Jesus e com os primeiros obreiros da igreja. Agora reunimos tudo num método prático. Este capítulo é o seu manual de trabalho: ele mostra, numa preparação e em sete etapas, o caminho completo de um estudo bíblico, desde a oração por uma pessoa até o dia em que ela, já batizada, se torna também uma obreira.\n\n\nO método tem uma preparação e sete etapas. A regra de ouro é esta: a primeira aula é sempre a aula de diagnóstico. Nenhum estudo bíblico começa antes de o obreiro conhecer o seu aluno.\n\nAntes da primeira aula: preparar-se, identificar os interessados, aproximar-se e convidar.\n1. A primeira aula é sempre o diagnóstico\n2. Escolher o estudo e planejar os encontros\n3. Conduzir cada encontro\n4. Lidar com perguntas e objeções\n5. Fazer apelos e acompanhar decisões\n6. Preparar para o batismo\n7. Discipular e multiplicar\n\n## Antes da primeira aula · Preparar-se espiritualmente\n\nO estudo bíblico começa no joelho do obreiro. Ninguém pode levar outra pessoa a um lugar onde ele mesmo não está. Antes de cada encontro:\n• mantenha sua comunhão diária com Deus: oração, Bíblia e a Lição da Escola Sabatina;\n• estude com antecedência a lição que vai ensinar, procurando todos os textos;\n• ore pelo interessado pelo nome e peça a direção do Espírito Santo;\n• se possível, ore com o seu par de obreiro antes de sair.\n\nDomine o conteúdo, mas não decore um discurso. Quem conhece bem a lição consegue conversar com naturalidade e responder às perguntas que surgirem.\n\n## Antes da primeira aula · Identificar e orar pelos interessados\n\nInteressados podem chegar de várias fontes:\n• seu círculo de influência (família, amigos, vizinhos, colegas);\n• pessoas inscritas nos cursos e programas da TV Novo Tempo, que a coordenação encaminha pelo sistema;\n• visitantes dos cultos e programas da igreja;\n• participantes de pequenos grupos, projetos sociais e eventos de saúde;\n• pessoas que se inscrevem pelo site e escolhem você como tutor.\n\nMantenha uma lista de oração com nomes. Ore por eles todos os dias. A oração muda o obreiro, abre portas e prepara corações, como Deus preparou Cornélio e Saulo antes que Pedro e Ananias chegassem.\n\n## Antes da primeira aula · Aproximar-se e fazer o convite\n\nSiga o método de Cristo: misture-se, demonstre simpatia, atenda às necessidades, conquiste a confiança e então convide.\n\nPara o primeiro contato com um interessado encaminhado pela coordenação, por mensagem ou por telefone:\n• Apresente-se com o nome e diga de onde fala: “Olá, [nome], tudo bem? Aqui é [seu nome], da Igreja Adventista da Aldeota. Vi que você se interessou pelo estudo [tema] da Novo Tempo.”\n• Ofereça ajuda, não pressão: “Eu sou obreiro bíblico voluntário e posso acompanhar você nesse estudo, no seu tempo, presencialmente ou por vídeo.”\n• Faça uma pergunta fácil de responder: “Qual dia da semana é melhor para você?”\n• Explique que o primeiro encontro será uma conversa para conhecer a pessoa e escolher juntos o estudo: “No nosso primeiro encontro eu quero conhecer você e saber o que você gostaria de estudar.”\n• Se a pessoa não responder, tente novamente alguns dias depois, de outra forma (ligação, áudio), sempre com gentileza.\n\nPara um convite pessoal a alguém do seu convívio, seja natural: fale do estudo como algo que fez bem a você e ligue-o a um interesse ou necessidade da pessoa.\n\nCuidados importantes:\n• Sempre que possível, faça as visitas em dupla.\n• Evite estudar a sós com uma pessoa do sexo oposto; nesses casos, e com casais e famílias, vá em dupla.\n• Respeite o horário e o espaço da casa.\n• Nunca prometa favores ou vantagens em troca do estudo.\n\n\n## Etapa 1 · A primeira aula é sempre o diagnóstico\n\nEsta é a lição mais importante da metodologia. Em toda nova turma de estudo, com qualquer interessado, a primeira aula não é o início de um estudo pronto: é a aula de diagnóstico. Antes de ensinar, o obreiro precisa conhecer o seu aluno.\n\nPor que começar pelo diagnóstico? Porque foi assim que Jesus e os primeiros obreiros trabalharam. Jesus perguntou aos dois discípulos: “Que buscais?” (João 1:38). Com a samaritana, partiu da água; com Nicodemos, das Escrituras. Filipe ouviu o eunuco ler e perguntou: “Compreendes o que vens lendo?” (Atos 8:30), e só então, “começando por esta passagem”, anunciou Jesus a partir da dúvida real daquele homem. Paulo começou em Atenas pelo altar que os atenienses conheciam. Nenhum deles usou o mesmo roteiro para todos.\n\nO diagnóstico evita três erros comuns: ensinar o que a pessoa já sabe, responder perguntas que ela não fez e ignorar a dor que ela está vivendo. Ele mostra por onde começar, como falar e qual estudo vai tocar o coração daquela pessoa.\n\n## O que o obreiro precisa descobrir no diagnóstico\n\n1. O momento de vida pessoal. A pessoa está tranquila, passando por uma crise, um luto, uma doença, um problema no casamento ou nas finanças? Quem está sofrendo precisa primeiro de esperança.\n\n2. O momento espiritual. Ela tem religião? Frequenta alguma igreja? Já foi batizada em outra denominação? Está afastada de Deus, buscando, ou firme na fé?\n\n3. A familiaridade com a Bíblia e a oração. Ela tem Bíblia? Sabe encontrar os livros? Costuma ler e orar? Isso define a linguagem e o ritmo do estudo.\n\n4. Os assuntos que gostaria de estudar. Família, saúde emocional, profecias, salvação, finanças, a volta de Jesus, os ensinos de Jesus, mulheres da Bíblia? O interesse da pessoa é a porta de entrada.\n\n5. As dúvidas espirituais e bíblicas. O que ela sempre quis perguntar? O que a incomoda na religião? Essas dúvidas serão respondidas ao longo do estudo.\n\n6. O formato preferido. Presencial, por vídeo ou por mensagens? Que dia e horário?\n\n7. O pedido de oração. Pelo que ela gostaria que você orasse? Isso abre o coração e cria vínculo.\n\n## Como conduzir a aula de diagnóstico\n\n1. Comece com acolhida e uma oração curta.\n2. Explique o objetivo com simplicidade: “Hoje eu quero conhecer você um pouco melhor, para escolhermos juntos o estudo que mais combina com o seu momento.”\n3. Faça as perguntas como numa conversa, não como num interrogatório. Use perguntas abertas: “Como está a sua vida hoje?” “Como é a sua relação com Deus?” “Que assunto da Bíblia você gostaria de entender melhor?” “Existe alguma dúvida que você sempre teve sobre a fé?”\n4. Ouça mais do que fala. Não corrija, não debata e não comece a ensinar doutrinas nesse dia. Apenas anote.\n5. Valorize cada resposta e agradeça a sinceridade.\n6. Termine orando pelos pedidos que a pessoa compartilhou, pelo nome.\n7. Combine o próximo encontro, quando o estudo escolhido vai começar.\n\n## O diagnóstico no sistema\n\nNo sistema do Ministério Pessoal, o obreiro não consegue iniciar um estudo com o interessado sem antes registrar a Aula 1 · Diagnóstico. Em “Meus interessados”, o botão “Aula 1: diagnóstico” abre o roteiro com as perguntas acima. O obreiro marca as respostas durante a conversa ou logo depois.\n\nAo salvar, o sistema analisa as respostas e mostra automaticamente:\n• o perfil do interessado;\n• uma sugestão de abordagem para o obreiro;\n• as dúvidas e o pedido de oração registrados;\n• os estudos bíblicos mais indicados, em ordem de prioridade.\n\nBasta escolher um dos estudos sugeridos e tocar em “Iniciar este estudo”. O obreiro só pode iniciar os estudos em que já foi aprovado; se o mais indicado ainda estiver bloqueado para você, estude-o e faça a prova, ou peça à coordenação que encaminhe o interessado a outro obreiro. Se o interessado já tiver respondido ao diagnóstico ao se inscrever pelo site, confira as respostas com ele na primeira aula e atualize o que for preciso.\n\nO diagnóstico pode ser refeito. Se, ao longo do estudo, você perceber que o momento da pessoa mudou, atualize as respostas e veja as novas sugestões.\n\n## Etapa 2 · Escolher o estudo e planejar os encontros\n\nCom o diagnóstico em mãos e as sugestões do sistema, escolha junto com o interessado o estudo mais adequado. Uma pessoa em crise emocional pode começar por um estudo sobre esperança e saúde mental; uma pessoa com muitas perguntas doutrinárias, por um estudo sistemático das crenças bíblicas; uma família com dificuldades financeiras, por um estudo sobre educação financeira à luz da Bíblia. O ponto de partida pode variar; o ponto de chegada é sempre Jesus e a decisão por Ele.\n\nPlaneje:\n• Frequência: uma vez por semana é o ideal. Encontros regulares criam hábito e mantêm o interesse.\n• Dia e horário fixos: combine e mantenha. Pontualidade é testemunho.\n• Duração: de 40 minutos a 1 hora. É melhor terminar deixando vontade de continuar do que cansar.\n• Local: na casa do interessado, na sua casa, na igreja ou por vídeo, conforme a preferência dele.\n• Material: a Bíblia do interessado (ou uma de presente), a lição do estudo e algo para anotar.\n\nRegistre cada agendamento no sistema. Ele prepara lembretes para você e para o interessado 24 horas e 30 minutos antes de cada encontro.\n\n## Etapa 3 · Conduzir cada encontro\n\nTodo encontro de estudo bíblico pode seguir esta estrutura em seis momentos:\n\n1. Acolhida (5 minutos). Cumprimente com alegria, chame pelo nome, pergunte como foi a semana, lembre-se do que a pessoa contou no encontro anterior. Crie um clima leve e de amizade.\n\n2. Oração inicial (2 minutos). Faça uma oração curta e simples, pedindo que Deus abra o entendimento. Com o tempo, convide o interessado a orar também.\n\n3. Revisão (5 minutos). Relembre em poucas palavras o tema anterior e pergunte se ficou alguma dúvida ou se a pessoa conseguiu aplicar algo durante a semana.\n\n4. Estudo da lição (25 a 30 minutos). Este é o coração do encontro:\n• Apresente o tema com uma pergunta ou uma situação da vida real.\n• Deixe a Bíblia falar: peça que o interessado leia os textos em voz alta. A convicção vem da Palavra, não do obreiro.\n• Depois de cada texto, faça uma pergunta: “O que esse versículo diz?” “O que isso significa para você?”\n• Explique com simplicidade, usando exemplos e ilustrações do cotidiano.\n• Ensine a encontrar os livros da Bíblia: isso dá autonomia ao interessado.\n• Mantenha o foco no tema da lição; anote outras perguntas para depois.\n• Ligue sempre o tema a Jesus.\n\n5. Aplicação e apelo (5 minutos). Pergunte o que a lição significa na vida da pessoa e faça um pequeno apelo ligado ao tema (veja a Etapa 5).\n\n6. Oração final e agendamento (3 minutos). Ore pelos pedidos da pessoa e pela decisão tomada. Confirme o próximo encontro. Deixe uma pequena tarefa: ler um capítulo, assistir a um programa, orar sobre a decisão.\n\nDepois do encontro, registre no sistema a lição ministrada, as dúvidas, as decisões e os pedidos de oração. Esse registro ajuda você, a sua dupla e a coordenação a acompanharem cada passo.\n\n## Como fazer boas perguntas\n\nPerguntas abertas fazem o interessado pensar e falar. Prefira:\n• “O que esse texto ensina sobre Deus?”\n• “Como você se sente ao ler essa promessa?”\n• “O que mudaria na sua vida se você vivesse isso?”\n• “O que você entendeu até aqui?”\n\nEvite perguntas que deixam a pessoa constrangida ou que só pedem “sim” ou “não” no meio do estudo. Valorize toda resposta, mesmo incompleta: “Boa observação! Vamos ver o que o próximo verso acrescenta.”\n\n## Etapa 4 · Lidar com perguntas e objeções\n\nPerguntas são sinal de interesse. Objeções também: mostram que a pessoa está levando a mensagem a sério. Siga estes passos:\n\n1. Ouça até o fim, sem interromper.\n2. Valorize a pergunta: “Que bom que você perguntou isso.”\n3. Entenda a razão por trás da objeção: às vezes é uma dúvida bíblica, às vezes é medo da família, do trabalho ou de mudanças.\n4. Responda com a Bíblia, de forma breve. Deixe o texto falar.\n5. Se o assunto será estudado mais adiante, diga: “Ótima pergunta. Temos uma lição inteira sobre isso; anotei aqui e vamos estudar juntos.”\n6. Se não souber a resposta, seja honesto: “Não sei responder agora, mas vou estudar e trago a resposta no próximo encontro.” Depois, cumpra.\n7. Nunca discuta, ironize ou critique outras igrejas e religiões. Ganhar uma discussão e perder uma pessoa não é vitória. Lembre-se de Colossenses 4:6: “A vossa palavra seja sempre agradável, temperada com sal.”\n\n## Etapa 5 · Fazer apelos e acompanhar decisões\n\nO estudo bíblico não é apenas informação: é um convite para seguir Jesus. Decisões grandes são construídas com pequenas decisões ao longo do estudo.\n\nApelos progressivos: em cada lição, convide o interessado a uma decisão ligada ao tema. Por exemplo:\n• Depois de estudar sobre a Bíblia: “Você gostaria de ler a Bíblia todos os dias?”\n• Depois de estudar sobre a salvação: “Você gostaria de aceitar Jesus como seu Salvador pessoal?”\n• Depois de estudar sobre o sábado: “Você gostaria de começar a guardar o sábado do Senhor?”\n• Ao final do estudo: “Você gostaria de entregar sua vida a Jesus pelo batismo?”\n\nComo fazer um apelo:\n• Faça-o com amor, nunca com pressão ou ameaça.\n• Faça uma pergunta clara e direta, e depois espere em silêncio. O silêncio respeita o momento da decisão.\n• Se a resposta for sim, celebre e ore agradecendo a Deus.\n• Se a pessoa hesitar, pergunte com delicadeza: “O que impede você de tomar essa decisão?” Ouça e ajude, com a Bíblia, a vencer o obstáculo.\n• Se a resposta for não, respeite. Continue o estudo e a amizade. Volte ao assunto mais tarde.\n\nRegistre cada decisão no sistema. As decisões marcadas nas lições também ajudam o interessado a ver o seu progresso.\n\n## Etapa 6 · Preparar para o batismo\n\nQuando o interessado decide pelo batismo:\n1. Revise com ele as crenças fundamentais da igreja, garantindo que ele entende e aceita os princípios bíblicos estudados.\n2. Converse sobre as mudanças práticas de vida: sábado, fidelidade, saúde, vestuário, relacionamentos. Ajude-o com paciência; Deus dá poder para mudar.\n3. Apresente-o ao pastor e aos líderes do Ministério Pessoal para a entrevista e a preparação.\n4. Integre-o à igreja antes do batismo: Escola Sabatina, pequeno grupo, cultos. Ninguém deve ser batizado como um estranho.\n5. Envolva a família, se ela estiver aberta.\n6. Prepare um batismo festivo e significativo: convide os amigos e a família dele, esteja presente e celebre.\n\n## Etapa 7 · Discipular e multiplicar\n\nDepois do batismo, siga o modelo de Barnabé (Aula 6): acompanhamento semanal nos primeiros seis meses, amizades na igreja, hábitos espirituais, um ministério para servir e cuidado especial nos momentos de dificuldade.\n\nPor fim, complete o ciclo: ajude o novo membro a fazer a lista do seu círculo de influência, leve-o com você em uma visita e incentive-o a fazer o Curso de Formação de Obreiros. Assim, o método APRENDER, PRATICAR, AVALIAR e MULTIPLICAR continua de geração em geração.\n\n## O uso do sistema do Ministério Pessoal\n\nO sistema é sua ferramenta de trabalho. Nele você:\n• estuda e é aprovado nos estudos bíblicos que vai ministrar;\n• recebe os interessados que você cadastrou, que a coordenação vinculou a você ou que escolheram você como tutor;\n• aplica a aula de diagnóstico e vê os estudos recomendados;\n• conversa com o interessado e registra cada passo;\n• gera o link da aula virtual para os estudos por vídeo;\n• agenda os encontros e envia os lembretes de 24 horas e 30 minutos;\n• registra as lições ministradas e as decisões;\n• acompanha seus pontos e certificados.\n\nMantenha os registros em dia. Eles permitem que a coordenação ore com você, ajude nas dificuldades e celebre cada vitória.\n\n## Os dez erros mais comuns do obreiro iniciante\n\n1. Falar demais e ouvir de menos.\n2. Começar a ensinar sem fazer a aula de diagnóstico e sem conhecer o aluno.\n3. Discutir e tentar vencer argumentos.\n4. Criticar outras igrejas ou religiões.\n5. Faltar ou se atrasar nos encontros.\n6. Não estudar a lição com antecedência.\n7. Não fazer apelos, por timidez.\n8. Pressionar o interessado a decidir antes do tempo.\n9. Abandonar o interessado depois do batismo.\n10. Trabalhar sozinho, sem oração e sem dupla.\n\n## Ética do obreiro bíblico\n\n• Guarde sigilo sobre tudo o que o interessado compartilhar.\n• Respeite a liberdade de consciência: o convite é de Deus, a decisão é da pessoa.\n• Mantenha decoro nas visitas: dupla, horários adequados, postura respeitosa.\n• Use os dados do sistema somente para o trabalho missionário.\n• Seja exemplo: a sua vida é a primeira lição que o interessado lê.\n\n> Leia Lucas 24:13-35. Jesus caminhou com os discípulos de Emaús e, “começando por Moisés, discorrendo por todos os Profetas, expunha-lhes o que a seu respeito constava em todas as Escrituras” (v. 27). Que etapas do método você reconhece nesse encontro?\n\n> Leia 2 Timóteo 2:15 e 1 Pedro 3:15. Que atitudes Deus espera de quem ensina a Bíblia e responde às perguntas das pessoas?\n\n## PRATICAR · Exercício final\n\n1. Com seu par de obreiro, simule uma aula de diagnóstico: um faz o papel de interessado e o outro conduz a conversa com as sete perguntas da Etapa 1. Registrem as respostas e vejam quais estudos seriam indicados.\n2. Escolha uma lição de um dos estudos bíblicos do sistema e prepare um encontro completo, seguindo os seis momentos da Etapa 3.\n3. Simule o encontro com seu par de obreiro: um faz o papel de interessado (inclusive com uma objeção) e o outro conduz. Depois, troquem os papéis.\n4. Avaliem juntos: a acolhida foi calorosa? A Bíblia falou mais que o obreiro? As perguntas foram abertas? Houve um apelo claro?\n\n## AVALIAR · Autoavaliação final\n\n• Eu sei por que a primeira aula é sempre o diagnóstico e me sinto preparado para conduzi-la?\n• Eu conheço os seis momentos de um encontro de estudo bíblico?\n• Eu sei como responder a uma objeção sem discutir?\n• Eu tenho coragem de fazer um apelo claro?\n• Eu sei como acompanhar o novo membro depois do batismo?\n\nSe alguma resposta ainda for “não”, revise o tema e converse com a coordenação do Ministério Pessoal. Depois, faça a prova avaliativa do curso.\n\n[ ] Quero ser um obreiro aprovado, que maneja bem a Palavra da verdade, e me comprometo a dar estudos bíblicos para levar pessoas aos pés de Jesus."}], "prova": [{"pergunta": "Segundo Ellen G. White, em A Ciência do Bom Viver, qual era a ordem do método de Cristo?", "opcoes": ["Pregar, convencer, batizar e depois fazer amizade.", "Misturar-Se com as pessoas, mostrar simpatia, atender às necessidades, ganhar a confiança e então dizer “Segue-Me”.", "Convidar para a igreja e esperar que as pessoas tomassem a iniciativa.", "Ensinar primeiro as doutrinas e só depois se aproximar das pessoas."], "correta": 1, "grupo": "Aula 1 · Jesus: o modelo do evangelista"}, {"pergunta": "Como Jesus iniciou a conversa com a mulher samaritana?", "opcoes": ["Repreendendo-a pelos cinco maridos.", "Explicando onde se devia adorar.", "Pedindo um favor: “Dá-Me de beber”.", "Convidando-a para ir ao templo em Jerusalém."], "correta": 2, "grupo": "Aula 1 · Jesus: o modelo do evangelista"}, {"pergunta": "O que o encontro de Jesus com Zaqueu ensina ao obreiro?", "opcoes": ["Que a aceitação e a amizade vieram antes da mudança de vida, e a mudança foi fruto delas.", "Que é preciso exigir a mudança de vida antes de visitar alguém.", "Que pecadores conhecidos devem ser evitados para não escandalizar a igreja.", "Que a salvação depende da devolução dos bens."], "correta": 0, "grupo": "Aula 1 · Jesus: o modelo do evangelista"}, {"pergunta": "Qual foi o principal recurso que Jesus usou com Nicodemos, um mestre em Israel?", "opcoes": ["Um milagre de cura.", "Uma refeição na casa dele.", "Uma parábola sobre pescaria.", "As Escrituras, como a história da serpente levantada no deserto, apontando para a cruz."], "correta": 3, "grupo": "Aula 1 · Jesus: o modelo do evangelista"}, {"pergunta": "Como Pedro respondeu quando o povo perguntou “Que faremos, irmãos?” no Pentecostes?", "opcoes": ["“Voltem amanhã para ouvir mais.”", "“Arrependei-vos, e cada um de vós seja batizado em nome de Jesus Cristo.”", "“Vendei os vossos bens e dai aos pobres.”", "“Guardai a lei para serdes salvos.”"], "correta": 1, "grupo": "Aula 2 · Pedro: o evangelho sem barreiras"}, {"pergunta": "O que aconteceu com os novos crentes logo depois do Pentecostes, segundo Atos 2:42?", "opcoes": ["Voltaram para suas cidades sem acompanhamento.", "Foram enviados imediatamente como missionários a outros países.", "Perseveravam na doutrina dos apóstolos, na comunhão, no partir do pão e nas orações.", "Passaram a se reunir apenas uma vez por ano."], "correta": 2, "grupo": "Aula 2 · Pedro: o evangelho sem barreiras"}, {"pergunta": "Qual era a principal barreira que Deus precisou vencer em Pedro antes do encontro com Cornélio?", "opcoes": ["O preconceito contra os gentios.", "O medo de falar em público.", "A falta de conhecimento bíblico.", "A distância entre Jope e Cesareia."], "correta": 0, "grupo": "Aula 2 · Pedro: o evangelho sem barreiras"}, {"pergunta": "Na cura do coxo na porta Formosa, o que veio antes da pregação no pórtico de Salomão?", "opcoes": ["Uma longa explicação sobre a lei.", "Uma oferta em dinheiro.", "Uma discussão com os sacerdotes.", "O contato pessoal (“Olha para nós”) e o atendimento à necessidade concreta do homem."], "correta": 3, "grupo": "Aula 2 · Pedro: o evangelho sem barreiras"}, {"pergunta": "Como Paulo começou o seu discurso aos atenienses no Areópago?", "opcoes": ["Condenando a idolatria e ameaçando com o juízo.", "Partindo de um ponto de contato da cultura deles: o altar “Ao Deus desconhecido”.", "Lendo os profetas do Antigo Testamento.", "Contando a história da sua conversão."], "correta": 1, "grupo": "Aula 3 · Paulo: o evangelho para todos"}, {"pergunta": "O que significa “fazer-se tudo para com todos” (1 Coríntios 9:22) no evangelismo?", "opcoes": ["Adaptar a abordagem a cada pessoa, sem mudar o conteúdo da mensagem.", "Mudar a mensagem para agradar a cada público.", "Aceitar todas as crenças como verdadeiras.", "Evitar falar de Jesus para não ofender ninguém."], "correta": 0, "grupo": "Aula 3 · Paulo: o evangelho para todos"}, {"pergunta": "Como Paulo resumiu o seu ministério em Éfeso aos líderes da igreja?", "opcoes": ["Pregou apenas nas grandes multidões.", "Ensinou somente na sinagoga, aos sábados.", "Ensinou publicamente e de casa em casa, admoestando com lágrimas a cada um.", "Escreveu cartas, mas não visitou ninguém."], "correta": 2, "grupo": "Aula 3 · Paulo: o evangelho para todos"}, {"pergunta": "Em Filipos, quem abriu o coração de Lídia para atender ao que Paulo dizia?", "opcoes": ["O carcereiro.", "Silas.", "A família dela.", "O Senhor."], "correta": 3, "grupo": "Aula 3 · Paulo: o evangelho para todos"}, {"pergunta": "Qual foi a pergunta de Filipe ao eunuco etíope que abriu o estudo bíblico?", "opcoes": ["“Você quer ser batizado?”", "“Compreendes o que vens lendo?”", "“De onde você vem?”", "“Você conhece a lei de Moisés?”"], "correta": 1, "grupo": "Aula 4 · Filipe: sensível à voz do Espírito"}, {"pergunta": "A partir de qual passagem Filipe anunciou Jesus ao eunuco?", "opcoes": ["Gênesis 1.", "Salmo 23.", "Isaías 53, que fala da ovelha levada ao matadouro.", "Daniel 2."], "correta": 2, "grupo": "Aula 4 · Filipe: sensível à voz do Espírito"}, {"pergunta": "O que Filipe fez antes de começar a explicar a Bíblia ao eunuco?", "opcoes": ["Ouviu o eunuco ler e fez uma pergunta, para descobrir em que ponto ele estava.", "Pediu que ele descesse do carro e o seguisse.", "Entregou um folheto e foi embora.", "Exigiu que ele largasse o cargo na corte."], "correta": 0, "grupo": "Aula 4 · Filipe: sensível à voz do Espírito"}, {"pergunta": "Que princípio do estudo de Filipe justifica a aula de diagnóstico no início da trilha do interessado?", "opcoes": ["O obreiro deve seguir sempre o mesmo roteiro decorado.", "O obreiro deve responder às dúvidas reais do interessado, partindo de onde ele está.", "O diagnóstico serve para escolher apenas os interessados mais preparados.", "O batismo deve ser feito no primeiro encontro."], "correta": 1, "grupo": "Aula 4 · Filipe: sensível à voz do Espírito"}, {"pergunta": "Qual foi a primeira pessoa que André levou a Jesus?", "opcoes": ["Natanael.", "Filipe.", "O menino dos pães.", "Seu próprio irmão, Simão Pedro."], "correta": 3, "grupo": "Aula 5 · André: evangelismo individual"}, {"pergunta": "Qual foi a resposta de Filipe à dúvida de Natanael (“De Nazaré pode sair alguma coisa boa?”)?", "opcoes": ["“Vem e vê.”", "Uma longa explicação das profecias.", "Uma repreensão pela falta de fé.", "Ficou em silêncio e foi embora."], "correta": 0, "grupo": "Aula 5 · André: evangelismo individual"}, {"pergunta": "O que é o “círculo de influência” do obreiro?", "opcoes": ["A lista de membros da diretoria da igreja.", "As pessoas próximas, como família, amigos, vizinhos e colegas, que estão mais abertas ao convite.", "Os pastores da associação.", "Apenas os interessados enviados pela TV Novo Tempo."], "correta": 1, "grupo": "Aula 5 · André: evangelismo individual"}, {"pergunta": "No episódio da multiplicação dos pães, o que André fez de diferente de Filipe?", "opcoes": ["Calculou quanto dinheiro seria necessário.", "Mandou a multidão embora.", "Notou o function fmtData(iso){ if(!iso) return "—"; const [y,m,d] = iso.slice(0,10).split("-"); return `${d}/${m}/${y}`; }
function fmtDiaMes(iso){ if(!iso) return "—"; const [,m,d] = iso.split("-"); return `${d}/${m}`; }
function fmtDataHora(iso){ if(!iso) return "—"; const d = new Date(iso); return d.toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"2-digit"}) + " às " + d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}); }
function fmtNota(n){ return (Math.round(n*10)/10).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1}); }
function iniciais(n){ return String(n||"?").trim().split(/\s+/).filter(Boolean).slice(0,2).map(p=>p[0]).join("").toUpperCase(); }
function primeiroNome(n){ const p = String(n||"").trim().split(/\s+/)[0] || ""; return p.charAt(0).toUpperCase()+p.slice(1).toLowerCase(); }
function nomeBonito(n){ const s = String(n||"").trim().replace(/\s+/g," "); if(s!==s.toUpperCase() && s!==s.toLowerCase()) return s; return s.toLowerCase().replace(/(^|\s)(\S)/g,(m,a,b)=>a+b.toUpperCase()).replace(/\s(De|Da|Do|Dos|Das|E)\s/g,m=>m.toLowerCase()); }
function soDigitos(t){ return String(t||"").replace(/\D/g,""); }
function celular(t){
  const partes = String(t||"").includes("+") ? String(t).split("+") : [String(t||"")];
  const limpar = d => {
    if(d.startsWith("55") && (d.length>=12 || d.length===10 || (d.length===11 && d[2]!=="9"))) d = d.slice(2);
    while(d.length>11 && d.startsWith("55")) d = d.slice(2);
    d = d.replace(/^0+/,"");
    if(d.length>11) d = d.slice(-11);
    if(d.length===8 || (d.length===9 && d[0]==="9")) d = "85"+d;
    return d;
  };
  const nums = partes.map(soDigitos).filter(d=>d.length>=8).map(limpar).filter(d=>d.length>=10);
  return nums.find(d=>d.length===11 && d[2]==="9") || nums[0] || "";
}
function waNumero(t){ let d = soDigitos(t); if(!d) return ""; if(d.length===10||d.length===11) d = "55"+d; return d; }
function fmtTel(t){ const d = soDigitos(t); if(d.length===11) return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`; if(d.length===10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`; return t||"—"; }
async function hash(txt){
  try{ const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("mp-aldeota:"+txt)); return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join(""); }
  catch(e){ let h=0; for(const c of "mp-aldeota:"+txt){ h=(h*31+c.charCodeAt(0))|0; } return "x"+h; }
}
function idade(iso){ if(!iso || iso.startsWith("1900")) return null; const n=new Date(iso+"T12:00:00"), h=new Date(); let a=h.getFullYear()-n.getFullYear(); const m=h.getMonth()-n.getMonth(); if(m<0||(m===0&&h.getDate()<n.getDate())) a--; return a; }
function diasAteAniversario(iso){
  if(!iso) return null;
  const h = new Date(); h.setHours(0,0,0,0);
  const [,m,d] = iso.split("-").map(Number);
  let prox = new Date(h.getFullYear(), m-1, d);
  if(m===2 && d===29 && prox.getMonth()!==1) prox = new Date(h.getFullYear(),1,28);
  if(prox < h) prox = new Date(h.getFullYear()+1, m-1, d);
  return Math.round((prox - h)/86400000);
}
function isoRelativo(dias, anosAtras){
  const d = new Date(); d.setDate(d.getDate()+dias); d.setFullYear(d.getFullYear()-anosAtras);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function dataHoraFutura(dias, hora){ const d=new Date(); d.setDate(d.getDate()+dias); d.setHours(hora,0,0,0); return d.toISOString(); }
const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim();

function copiar(txt){
  const ok = () => toast("Copiado");
  const fallback = () => { const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); ok(); }catch(e){ toast("Selecione o texto e copie manualmente"); } ta.remove(); };

}

/* ---------- aniversários ---------- */
function pessoasComAniversario(){
  const lista = [];
  const meusIds = me && me.papel==="obreiro" ? new Set(D.interessados.filter(i=>i.obreiroId===me.id).map(i=>i.id)) : null;
  D.interessados.forEach(i=>{ if(i.nascimento && (!meusIds || meusIds.has(i.id))) lista.push({ id:i.id, nome:i.nome, tipo:"Interessado", nascimento:i.nascimento, telefone:i.telefone }); });
  if(me && me.papel==="admin") obreiros().forEach(o=>{ if(o.nascimento) lista.push({ id:o.id, nome:o.nome, tipo:"Obreiro", nascimento:o.nascimento, telefone:o.telefone }); });
  return lista.map(p=>({...p, dias:diasAteAniversario(p.nascimento)})).sort((a,b)=>a.dias-b.dias || a.nome.localeCompare(b.nome));
}
function aniversariantes(maxDias){ if(!D || !me || me.papel==="interessado") return []; return pessoasComAniversario().filter(p=>p.dias<=maxDias); }
function mensagemPara(p){ return D.config.mensagem.replaceAll("{nome}", primeiroNome(p.nome)).replaceAll("{nome_completo}", nomeBonito(p.nome)); }
function jaEnviado(id){ const ano = new Date().getFullYear(); return D.enviados.some(e=>e.id===id && e.ano===ano); }
function linhaAniv(p){
  const [,m,d] = p.nascimento.split("-");
  const num = waNumero(p.telefone);
  const quando = p.dias===0 ? "Hoje" : p.dias===1 ? "Amanhã" : `Em ${p.dias} dias`;
  const idd = idade(p.nascimento);
  return `<div class="bday">
    <div class="cake">${d}<small>${MESES[+m-1]}</small></div>
    <div style="min-width:0"><b>${esc(nomeBonito(p.nome))}</b><div class="row small muted" style="gap:6px;margin-top:2px">${pill(p.tipo, p.tipo==="Obreiro"?"info":"")} <span>${quando}${idd!=null?` · ${p.dias===0?idd:idd+1} anos`:""}</span> ${p.telefone?`<span>· ${esc(fmtTel(p.telefone))}</span>`:""} ${jaEnviado(p.id)?pill("Mensagem enviada","ok"):""}</div></div>
    <div class="row">
      <button class="btn sm" data-act="ver-msg" data-id="${p.id}">Ver mensagem</button>
      ${num?`<a class="btn sm wa" href="https://wa.me/${num}?text=${encodeURIComponent(mensagemPara(p))}" target="_blank" rel="noopener" data-act="marcar-enviado" data-id="${p.id}">WhatsApp</a>`:`<span class="small muted">sem telefone</span>`}
    </div></div>`;
}
function vAniversarios(){
  const todas = pessoasComAniversario();
  const abas = { hoje:["Hoje", todas.filter(p=>p.dias===0)], semana:["Próximos 7 dias", todas.filter(p=>p.dias<=7)], mes:["Próximos 30 dias", todas.filter(p=>p.dias<=30)] };
  const [, lista] = abas[UI.abaAniv] || abas.hoje;
  return `<div class="page-head"><div><span class="eyebrow">Cuidado pastoral</span><h1>Aniversários</h1>
    <p>${me.papel==="admin"?"Interessados e obreiros":"Seus interessados"} que fazem aniversário. A mensagem sai pronta, assinada pela ${IGREJA}.</p></div>
    ${me.papel==="admin"?`<a class="btn" href="#config">Editar mensagem padrão</a>`:""}</div>
  <div class="tabs">${Object.entries(abas).map(([k,[t,l]])=>`<button data-act="aba-aniv" data-k="${k}" class="${UI.abaAniv===k?"on":""}">${t} (${l.length})</button>`).join("")}</div>
  <div class="card">${lista.length?lista.slice(0,200).map(linhaAniv).join(""):`<div class="empty">Ninguém faz aniversário neste período.</div>`}</div>
  ${me.papel==="admin"?`<p class="small muted">Na versão beta o envio é feito com um toque pelo WhatsApp. Na versão hospedada o envio diário pode ser automático.</p>`:""}`;
}

function ranking(lista, max){

  return r.length ? r.map((x,i)=>`<div class="rank"><span class="pos">${i+1}º</span>${pessoa(x.u.nome, `${aprovadosDe(x.u.id).length} estudo(s) aprovado(s)`)}<b class="num">${x.pts} pts</b></div>`).join("") : `<div class="empty">Ainda sem pontuação.</div>`;
}

const CAMPOS = [["nome","Nome"],["telefone","Telefone / WhatsApp"],["nascimento","Data de nascimento"],["email","E-mail"],["bairro","Bairro"],["endereco","Endereço"],["religiao","Religião"],["ultimoCurso","Último curso"],["codigo","Código (ID)"],["obs","Observações"]];
const SINONIMOS = { nome:["nome completo","nome","interessado","aluno","name"], telefone:["telefone","celular","whatsapp","fone","contato","tel","phone"], nascimento:["data de aniversario","data de nascimento","nascimento","aniversario","data nasc","dt nasc"], email:["email","e-mail","e mail"], bairro:["bairro"], endereco:["endereco","rua","logradouro"], religiao:["religiao","igreja"], ultimoCurso:["ultimo curso solicitado","ultimo curso","curso"], codigo:["id","codigo","matricula"], obs:["obs","observacao","observacoes","descricao","anotacoes"] };
function adivinharColuna(campo, cab){
  const ns = cab.map(norm);
  for(const s of SINONIMOS[campo]){ const i = ns.indexOf(s); if(i>=0) return i; }
  if(campo==="codigo") return -1;
  for(const s of SINONIMOS[campo]){ const i = ns.findIndex(h=>h.includes(s)); if(i>=0) return i; }
  return -1;
}
function paraISO(v){
  if(v==null || v==="") return "";
  if(v instanceof Date && !isNaN(v)) return v.getFullYear()+"-"+String(v.getMonth()+1).padStart(2,"0")+"-"+String(v.getDate()).padStart(2,"0");
  if(typeof v==="number" && v>1000 && v<80000){ const d=new Date(Math.round((v-25569)*86400000)); return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0"); }
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if(m){ let y=+m[3]; if(y<100) y += y>30?1900:2000; if(+m[2]<1||+m[2]>12||+m[1]<1||+m[1]>31) return ""; return y+"-"+String(+m[2]).padStart(2,"0")+"-"+String(+m[1]).padStart(2,"0"); }
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return m[1]+"-"+String(+m[2]).padStart(2,"0")+"-"+String(+m[3]).padStart(2,"0");
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})$/);
  if(m) return "1900-"+String(+m[2]).padStart(2,"0")+"-"+String(+m[1]).padStart(2,"0");
  return "";
}

function lerBytesPlanilha(bytes, nome){
  if(typeof XLSX==="undefined"){ $("#imp-preview").innerHTML = `<p style="color:var(--bad)">O leitor de planilhas não carregou. Verifique a conexão e tente de novo.</p>`; return; }
  try{
    const wb = XLSX.read(bytes, { type:"array", cellDates:true });
    const abas = wb.SheetNames.map(n=>({ nome:n, linhas:XLSX.utils.sheet_to_json(wb.Sheets[n], { header:1, defval:"", raw:true }).filter(l=>l.some(c=>String(c).trim()!=="")) }));
    const validas = abas.filter(a=>a.linhas.length>=2);
    if(!validas.length) throw new Error("A planilha não tem linhas de dados.");
    const melhor = validas.reduce((a,b)=>b.linhas.length>a.linhas.length?b:a);
    UI.import = { nomeArquivo:nome, abas:validas, aba:melhor.nome };
    escolherAba(melhor.nome);
  }catch(err){ $("#imp-preview").innerHTML = `<p style="color:var(--bad)">Não foi possível ler o arquivo: ${esc(err.message)}</p>`; $("#imp-ok").disabled=true; }
}
const nomeArq = p => String(p).split("/").pop();
async function buscarPlanilhasProjeto(){
  const box = $("#imp-fonte"); box.innerHTML = `<p class="muted">Procurando planilhas no projeto…</p>`;
  let fs = null; try{ fs = await window.claude.use("files"); }catch(e){}
  if(!fs){ box.innerHTML = `<p style="color:var(--bad)">Os arquivos do projeto não estão disponíveis nesta tela. Use a opção 2 ou 3.</p>`; return; }
  try{
    let entries = [], cursor;
    do { const r = await fs.list({ recursive:true, cursor }); entries = entries.concat(r.entries); cursor = r.cursor; } while(cursor && entries.length < 3000);
    const arqs = entries.filter(e=>!e.isDirectory && e.size>0 && e.size<30*1024*1024);
    const porExt = arqs.filter(e=>/\.(xlsx|xls|csv|ods)$/i.test(e.path));
    const semExt = arqs.filter(e=>!/\.[a-z0-9]{2,5}$/i.test(nomeArq(e.path)));
    const extras = [];
    for(const e of semExt.slice(0,40)){ try{ const r = await fs.read(e.path, { length:8 }); const b = r.bytes; if((b[0]===0x50&&b[1]===0x4B) || (b[0]===0xD0&&b[1]===0xCF)) extras.push(e); }catch(err){} }
    const lista = [...porExt, ...extras];
    box.innerHTML = lista.length ? `<div class="lesson-list">${lista.map(e=>`<button class="lesson-item" data-act="imp-ler-projeto" data-path="${esc(e.path)}"><span class="chk">▦</span><span style="flex:1"><b>${esc(/\.(xlsx|xls|csv|ods)$/i.test(e.path)?nomeArq(e.path):"Planilha enviada na conversa")}</b><br><span class="small muted">${(e.size/1024/1024).toLocaleString("pt-BR",{maximumFractionDigits:1})} MB${e.createdAt?" · "+fmtDataHora(e.createdAt):""}</span></span></button>`).join("")}</div>`
      : `<p class="small muted">Nenhuma planilha encontrada nos arquivos do projeto. Use a opção 2 ou 3.</p>`;
  }catch(err){
    box.innerHTML = err?.code==="not_granted" ? `<p class="small" style="color:var(--warn)">Acesso aos arquivos do projeto não autorizado. Use a opção 2 ou 3.</p>`
      : `<p style="color:var(--bad)">Não foi possível ver os arquivos do projeto${err?.code==="not_found"?" (sua conta não tem acesso a este projeto)":""}. Use a opção 2 ou 3.</p>`;
  }
}
async function lerPlanilhaProjeto(path){
  $("#imp-preview").innerHTML = `<p class="muted">Lendo a planilha…</p>`;
  try{
    const fs = await window.claude.use("files"); const r = await fs.read(path);
    let bytes = r.bytes;
    if(r.size > bytes.length){ const partes=[bytes]; let off=bytes.length; while(off<r.size){ const p=await fs.read(path,{offset:off}); partes.push(p.bytes); off+=p.bytes.length; if(!p.bytes.length) break; } const t=new Uint8Array(off); let o=0; partes.forEach(p=>{ t.set(p,o); o+=p.length; }); bytes=t; }
    lerBytesPlanilha(bytes, /\.(xlsx|xls|csv|ods)$/i.test(path)?nomeArq(path):"Planilha do projeto");
  }catch(err){ $("#imp-preview").innerHTML = `<p style="color:var(--bad)">Não foi possível abrir este arquivo. Tente de novo ou use a opção 2 ou 3.</p>`; }
}

      const validas = abas.filter(a=>a.linhas.length>=2);
      if(!validas.length) throw new Error("A planilha não tem linhas de dados.");
      const melhor = validas.reduce((a,b)=>b.linhas.length>a.linhas.length?b:a);

    <div class="form two">${CAMPOS.map(([k,t])=>`<label class="f">${t}<select data-mapa="${k}"><option value="-1">— não importar —</option>${cab.map((h,i)=>`<option value="${i}" ${mapa[k]===i?"selected":""}>${esc(h||"Coluna "+(i+1))}</option>`).join("")}</select></label>`).join("")}</div></div>
    <div class="table-wrap"><table><thead><tr><th>Nome</th><th>Celular</th><th>Nascimento</th><th>Bairro</th><th>Religião</th></tr></thead><tbody>
    ${dados.slice(0,6).map(d=>`<tr><td>${esc(nomeBonito(d.nome))}</td><td class="num small">${esc(fmtTel(d.telefone))}</td><td class="num small">${d.nascimento?(d.nascimento.startsWith("1900")?fmtDiaMes(d.nascimento):fmtData(d.nascimento)):"—"}</td><td class="small">${esc(d.bairro||"—")}</td><td class="small">${esc(d.religiao||"—")}</td></tr>`).join("")}
    </tbody></table></div>
    <p class="small"><b>${(dados.length-dup).toLocaleString("pt-BR")}</b> interessado(s) serão importados${dup?`; ${dup} repetido(s) ou já cadastrado(s) serão ignorados`:""}${semAniv?`; ${semAniv} sem data de aniversário`:""}.${mapa.nome<0?` <span style="color:var(--bad)">Escolha a coluna do nome.</span>`:""}</p>`;

function textoEncontro(a){ const i=interessado(a.interessadoId), o=usuario(a.obreiroId), e=estudo(a.estudoId);

function tituloEncontro(a){ return me.papel==="interessado" ? `Estudo bíblico com ${usuario(a.obreiroId)?.nome||"meu obreiro"}` : `Estudo bíblico com ${nomeBonito(interessado(a.interessadoId)?.nome||"")}`; }
function icsDe(a){
  const ini = new Date(a.dataHora), fim = new Date(ini.getTime()+H);
  const f = d=>d.toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
  const tx = t=>String(t||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/([,;])/g,"\\$1");
  const al = (q,t)=>["BEGIN:VALARM","ACTION:DISPLAY","TRIGGER:-"+q,"DESCRIPTION:"+tx(t),"END:VALARM"];
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//IASD Aldeota//Ministerio Pessoal//PT-BR","CALSCALE:GREGORIAN","METHOD:PUBLISH","BEGIN:VEVENT",
    "UID:"+a.id+"@iasd-aldeota","DTSTAMP:"+f(new Date()),"DTSTART:"+f(ini),"DTEND:"+f(fim),"SUMMARY:"+tx(tituloEncontro(a)),"DESCRIPTION:"+tx(textoEncontro(a)),
    "LOCATION:"+tx(a.link||a.obs||a.modo), ...(a.link?["URL:"+a.link]:[]),
    ...al("PT24H","Amanhã: "+tituloEncontro(a)), ...al("PT30M","Em 30 minutos: "+tituloEncontro(a)),
    "END:VEVENT","END:VCALENDAR"].join("\r\n");
}
function gcalDe(a){ const ini=new Date(a.dataHora), fim=new Date(ini.getTime()+H); const f=d=>d.toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(tituloEncontro(a))+"&dates="+f(ini)+"/"+f(fim)+"&details="+encodeURIComponent(textoEncontro(a))+"&location="+encodeURIComponent(a.link||a.obs||""); }
async function salvarArquivo(nome, texto, tipo){
  const blob = new Blob([texto], {type:tipo});
  let dl = null; try{ dl = window.claude?.use ? await window.claude.use("downloads") : null; }catch(e){ dl = null; }
  if(dl){ try{ await dl.save({ filename:nome, data:blob }); toast("Arquivo salvo. Abra-o para colocar na agenda."); }catch(e){} return; }
  const u = URL.createObjectURL(blob); const l = document.createElement("a"); l.href=u; l.download=nome; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u), 4000);
}

function obreirosDisponiveis(estId){ return obreiros().filter(o=>prog(o.id,estId)?.aprovado).sort((a,b)=>D.interessados.filter(k=>k.obreiroId===a.id).length - D.interessados.filter(k=>k.obreiroId===b.id).length); }

/* ---------- conversa e histórico de cada passo ---------- */
function registrar(intId, texto){ if(intId) D.conversas.push({ id:uid(), interessadoId:intId, de:"sistema", tipo:"evento", texto, em:agoraISO(), lidos:[] }); }
function conversaDe(intId){ return D.conversas.filter(c=>c.interessadoId===intId).sort((a,b)=>a.em.localeCompare(b.em)); }
function naoLidas(intId){ return D.conversas.filter(c=>c.interessadoId===intId && c.tipo==="msg" && c.de!==me.id && c.registradoPor!==me.id && !(me.papel==="interessado" && c.de==="interessado-registro") && !(c.lidos||[]).includes(me.id)).length; }
function naoLidasObreiro(){ return D.interessados.filter(i=>i.obreiroId===me.id).reduce((s,i)=>s+naoLidas(i.id),0); }
function marcarLidas(intId){ D.conversas.forEach(c=>{ if(c.interessadoId===intId && !(c.lidos||[]).includes(me.id)) c.lidos=[...(c.lidos||[]), me.id]; }); }
function linkify(t){ return esc(t).replace(/https?:\/\/[^\s<]+/g, u=>`<a href="${u}" target="_blank" rel="noopener">${u}</a>`); }
function autorTxt(c, i){
  if(c.de==="interessado-registro" && me.papel==="interessado") return "Você · pelo WhatsApp";
  if(c.de==="interessado-registro") return `${primeiroNome(i.nome)} · resposta pelo WhatsApp, registrada por ${usuario(c.registradoPor)?.nome||"obreiro"}`;
  const u = usuario(c.de); if(!u) return "—"; if(u.id===me.id) return "Você";
  return u.papel==="interessado" ? primeiroNome(u.nome) : u.papel==="admin" ? u.nome+" (coordenação)" : u.nome;
}
function htmlConversa(intId){
  const i = interessado(intId); const lista = conversaDe(intId);
  return `<div class="chat" id="chat-box">${lista.length ? lista.map(c => c.tipo==="evento"
      ? `<div class="evento">${linkify(c.texto)} · ${fmtDataHora(c.em)}</div>`
      : `<div class="bubble ${c.de===me.id||(me.papel==="interessado"&&c.de==="interessado-registro")?"mine":""} ${c.de==="interessado-registro"?"reg":""}">${linkify(c.texto)}<small>${esc(autorTxt(c,i))} · ${fmtDataHora(c.em)}${c.viaWa?" · também enviada pelo WhatsApp":""}</small></div>`).join("")
    : `<p class="small muted empty">Nenhuma mensagem ainda. Cada passo do estudo também fica registrado aqui.</p>`}</div>`;
}
function telOutro(i){ return me.papel==="interessado" ? (usuario(i.obreiroId)?.telefone || D.config.telCoord) : i.telefone; }
function modalConversa(intId){

        ${num?`<button class="btn wa" type="button" data-act="enviar-msg" data-id="${intId}" data-via="wa">Enviar e abrir no WhatsApp</button>`:""}<button class="btn primary" type="button" data-act="enviar-msg" data-id="${intId}" data-via="sistema">Enviar</button></div>

    num?`<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${num}?text=${encodeURIComponent(msgAvisoObreiro(i))}" data-act="aviso-enviado" data-id="${i.id}">Enviar aviso pelo WhatsApp</a>`:`<button class="btn primary" data-act="fechar">Entendi</button>`, { noFocus:true });

const H = 3600000;
function msgLembrete(a, k){
  const i = interessado(a.interessadoId), o = usuario(a.obreiroId), e = estudo(a.estudoId);
  const quando = fmtDataHora(a.dataHora); const hora = new Date(a.dataHora).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  const onde = a.link ? avisoLink(a.link) : a.obs ? `\n\nLocal: ${a.obs}` : "";
  const est = e ? ` “${e.titulo}”` : "";
  if(k==="24h-int") return `Olá, ${primeiroNome(i?.nome)}! Lembrete: nosso estudo bíblico${est} com ${primeiroNome(o?.nome)} está marcado para ${quando} (${a.modo}).${onde}\n\nAté lá! ${IGREJA}`;
  if(k==="30m-int") return `Olá, ${primeiroNome(i?.nome)}! Daqui a 30 minutos, às ${hora}, começa nosso estudo bíblico${est} com ${primeiroNome(o?.nome)}.${onde}\n\nDeus abençoe! ${IGREJA}`;
  if(k==="24h-ob") return `Olá, ${primeiroNome(o?.nome)}! Lembrete do Ministério Pessoal: você tem estudo bíblico${est} com ${nomeBonito(i?.nome)} em ${quando} (${a.modo}).${onde}${i?.telefone?`\nWhatsApp do interessado: ${fmtTel(i.telefone)}`:""}`;
  return `Olá, ${primeiroNome(o?.nome)}! Em 30 minutos, às ${hora}, começa seu estudo bíblico${est} com ${nomeBonito(i?.nome)} (${a.modo}).${onde}`;
}
function lembretesPendentes(){
  const agora = Date.now(); const out = [];
  D.agendamentos.filter(a=>a.status==="confirmado" && (me.papel==="admin" || a.obreiroId===me.id)).forEach(a=>{
    const falta = new Date(a.dataHora).getTime() - agora;
    let janela = null;
    if(falta <= 0.5*H && falta > -0.25*H) janela = "30m"; else if(falta <= 24*H && falta > 0.5*H) janela = "24h";
    if(!janela) return;
    const alvos = ["int","ob"];
    alvos.forEach(al => { const k = `${janela}-${al}`; if(!(a.lembretes||{})[k]) out.push({ a, k, falta }); });
  });
  return out.sort((x,y)=>x.falta-y.falta);
}
function avisosPendentes(){ return D.interessados.filter(i=>i.avisoObreiro && i.obreiroId && (me.papel==="admin" || i.obreiroId===me.id) && me.papel==="admin"); }
function vLembretes(){
  const lem = lembretesPendentes(); const avs = avisosPendentes();
  const proximos = D.agendamentos.filter(a=>a.status==="confirmado" && (me.papel==="admin"||a.obreiroId===me.id) && new Date(a.dataHora) > new Date()).sort((a,b)=>a.dataHora.localeCompare(b.dataHora)).slice(0,20);
  const linhaLem = ({a,k,falta}) => { const i=interessado(a.interessadoId), o=usuario(a.obreiroId); const paraInt = k.endsWith("int"); const num = waNumero(paraInt?i?.telefone:o?.telefone);
    return `<div class="editor-block"><div class="row">${pill(k.startsWith("24h")?"24 horas antes":"30 minutos antes", k.startsWith("24h")?"info":"warn")}<b>Para ${paraInt?"o interessado":"o obreiro"}: ${esc(paraInt?nomeBonito(i?.nome):o?.nome)}</b><span class="spacer"></span><span class="small muted">estudo em ${fmtDataHora(a.dataHora)}</span></div>
      <div class="msg-preview">${esc(msgLembrete(a,k))}</div>
      <div class="row"><span class="spacer"></span><button class="btn sm" data-act="lembrete-enviado" data-ag="${a.id}" data-k="${k}">Marcar como enviado</button>${num?`<a class="btn sm wa" target="_blank" rel="noopener" href="https://wa.me/${num}?text=${encodeURIComponent(msgLembrete(a,k))}" data-act="lembrete-enviado" data-ag="${a.id}" data-k="${k}">Enviar pelo WhatsApp</a>`:`<span class="small" style="color:var(--warn)">Sem WhatsApp cadastrado</span>`}</div></div>`; };
  return `<div class="page-head"><div><span class="eyebrow">WhatsApp</span><h1>Lembretes e avisos</h1><p>${me.papel==="admin"?"Os lembretes aparecem aqui 24 horas e 30 minutos antes de cada estudo confirmado, para o interessado e para o obreiro, junto com os avisos de novos interessados para os obreiros.":"Os lembretes aparecem aqui 24 horas e 30 minutos antes de cada estudo confirmado: um para o interessado e outro para o seu próprio WhatsApp, já com o link da reunião quando for virtual."} Cada mensagem já vem pronta: toque em “Enviar pelo WhatsApp” e depois em enviar.</p></div></div>
  ${me.papel==="admin"?`<div class="card"><div class="card-head"><h2>Avisos para obreiros</h2></div>${avs.length?avs.map(i=>{ const o=usuario(i.avisoObreiro.obreiroId); const num=waNumero(o?.telefone);
      return `<div class="editor-block"><div class="row"><b>${esc(o?.nome||"—")}</b><span class="small muted">${i.avisoObreiro.motivo==="escolha"?"foi escolhido(a) como tutor por":"recebeu da coordenação"} ${esc(nomeBonito(i.nome))}</span><span class="spacer"></span><span class="small muted">${fmtDataHora(i.avisoObreiro.em)}</span></div>
        <div class="msg-preview">${esc(msgAvisoObreiro(i))}</div>
        <div class="row"><span class="spacer"></span><button class="btn sm" data-act="aviso-dispensar" data-id="${i.id}">Já avisado</button>${num?`<a class="btn sm wa" target="_blank" rel="noopener" href="https://wa.me/${num}?text=${encodeURIComponent(msgAvisoObreiro(i))}" data-act="aviso-enviado" data-id="${i.id}">Enviar pelo WhatsApp</a>`:`<span class="small" style="color:var(--warn)">Obreiro sem WhatsApp cadastrado</span>`}</div></div>`; }).join(""):`<p class="small muted">Nenhum aviso pendente.</p>`}</div>`:""}
  <div class="card"><div class="card-head"><h2>Lembretes para enviar agora</h2></div>${lem.length?lem.map(linhaLem).join(""):`<p class="small muted">Nenhum lembrete pendente neste momento.</p>`}</div>
  <div class="card"><div class="card-head"><h2>Próximos estudos confirmados</h2></div>${proximos.length?`<div class="table-wrap"><table><thead><tr><th>Quando</th><th>Interessado</th>${me.papel==="admin"?"<th>Obreiro</th>":""}<th>Lembrete de 24h</th><th>Lembrete de 30 min</th></tr></thead><tbody>${proximos.map(a=>{ const st=k=>a.lembretes?.[k]?"enviado":"—"; return `<tr><td class="num small">${fmtDataHora(a.dataHora)}</td><td class="small">${esc(nomeBonito(interessado(a.interessadoId)?.nome||"—"))}</td>${me.papel==="admin"?`<td class="small">${esc(usuario(a.obreiroId)?.nome||"—")}</td>`:""}<td class="small">interessado: ${st("24h-int")} · obreiro: ${st("24h-ob")}</td><td class="small">interessado: ${st("30m-int")} · obreiro: ${st("30m-ob")}</td></tr>`; }).join("")}</tbody></table></div>`:`<p class="small muted">Nenhum estudo confirmado à frente.</p>`}</div>
  ${me.papel==="admin"?`<p class="small muted">O envio totalmente automático, sem precisar tocar no botão, exige a API oficial do WhatsApp Business ligada a um servidor. Isso entra na versão hospedada do sistema.</p>`:""}`;
}
function bannerProximo(){

/* ---------- aula virtual ---------- */

  { k:"formato", t:"Como você prefere estudar?", tipo:"um", ops:[["presencial","Presencial"],["online","Por vídeo (online)"],["telefone","Por telefone ou WhatsApp"],["sozinho","Sozinho(a), no meu ritmo"]]},

  { k:"pedido", t:"Tem algum pedido de oração? (opcional)", tipo:"texto" }
];
const PERFIL_ESTUDO = {
  "est-biblia":{ temas:["biblia"], momento:["conhecer"], espiritual:["sem","outra"], biblia:["nunca","pouco"] },
  "est-salvacao":{ temas:["jesus"], momento:["conhecer","dificil","crescer"], espiritual:["sem","outra","afastado"], biblia:["nunca","pouco"] },
  "est-sabado":{ temas:["sabado"], espiritual:["outra","afastado"], biblia:["as-vezes","frequente"] },

  "est-mente-feliz":{ temas:["emocoes"], momento:["emocional","dificil"] },
  "est-marcadas-pela-fe":{ temas:["mulheres","familia","oracao"], momento:["familia","crescer","dificil"] },
  "est-educacao-financeira":{ temas:["financas","familia"], momento:["financas"] }
};
const rotulo = (k, v) => DIAG.find(q=>q.k===k)?.ops?.find(o=>o[0]===v)?.[1] || "";
const lc = t => /^(Jesus|Deus|Bíblia)/.test(t) ? t : t.charAt(0).toLowerCase()+t.slice(1);
function diagnosticar(r, i){
  const perfil = [], abordagem = [];
  const nivel = { nunca:"iniciante", pouco:"iniciante", "as-vezes":"intermediário", frequente:"avançado" }[r.biblia];
  const necessidade = { dificil:"Precisa de consolo e esperança neste momento difícil", emocional:"Busca paz e equilíbrio emocional", familia:"Busca orientação bíblica para a família e o casamento", financas:"Busca orientação para a vida financeira à luz da Bíblia", crescer:"Quer aprofundar a vida com Deus", conhecer:"Quer conhecer os fundamentos da fé" }[r.momento];
  if(necessidade) perfil.push(necessidade);
  if(r.espiritual) perfil.push("Vida espiritual: "+lc(rotulo("espiritual", r.espiritual)));
  if(nivel) perfil.push("Conhecimento bíblico: "+nivel);
  if(r.oracao) perfil.push("Oração: "+lc(rotulo("oracao", r.oracao)));
  if(r.temas?.length) perfil.push("Interesses: "+r.temas.map(t=>lc(rotulo("temas",t))).join(", "));
  if(r.formato) perfil.push("Prefere estudar: "+lc(rotulo("formato", r.formato)));
  if(["dificil","emocional"].includes(r.momento)) abordagem.push("Comece ouvindo e orando junto. Priorize mensagens de esperança e cuidado antes de temas doutrinários.");
  if(r.espiritual==="outra") abordagem.push("Valorize o que a pessoa já crê e construa a partir da Bíblia, sem confrontos.");
  if(r.espiritual==="afastado") abordagem.push("Acolha sem cobranças. O foco é o reencontro com Jesus e com a igreja.");
  if(r.espiritual==="sem" || nivel==="iniciante") abordagem.push("Comece pelos fundamentos: quem é Deus, quem é Jesus e como ler a Bíblia.");
  if(r.oracao==="nao") abordagem.push("Ensine a orar de forma simples e ore com a pessoa em cada encontro.");
  if(r.formato==="online") abordagem.push("Use a aula virtual do sistema para os encontros.");
  if(r.duvidas?.trim()) abordagem.push("Prepare-se para as dúvidas que a pessoa trouxe.");
  const feitos = new Set(i?.concluidos||[]);
  const recomendados = D.estudos.filter(e=>!feitos.has(e.id)).map(e=>{
    const p = PERFIL_ESTUDO[e.id]; let score = 0; const motivos = [];
    if(p){
      (r.temas||[]).forEach(t=>{ if(p.temas?.includes(t)){ score+=3; motivos.push("interesse em "+lc(rotulo("temas",t))); } });
      if(p.momento?.includes(r.momento)){ score+=3; motivos.push("combina com o momento de vida"); }
      if(p.espiritual?.includes(r.espiritual)){ score+=1; motivos.push("adequado à vida espiritual atual"); }
      if(p.biblia?.includes(r.biblia)){ score+=1; motivos.push("adequado ao nível de conhecimento bíblico"); }
    } else {
      const txt = norm(e.titulo+" "+e.descricao);
      (r.temas||[]).forEach(t=>{ const palavras = norm(rotulo("temas",t)).split(/\s+/).filter(w=>w.length>4); if(palavras.some(w=>txt.includes(w))){ score+=2; motivos.push("interesse em "+lc(rotulo("temas",t))); } });
    }
    return { id:e.id, score, motivos };
  }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,3);
  return { perfil, abordagem, recomendados };
}

function reduzirImagem(file, cb){
  const r = new FileReader();
  r.onload = ev => { const img = new Image(); img.onload = () => {
    const max = 320, s = Math.min(1, max/Math.max(img.width,img.height));
    const cv = document.createElement("canvas"); cv.width=Math.round(img.width*s); cv.height=Math.round(img.height*s);
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height); cb(cv.toDataURL("image/png")); };
    img.onerror = () => toast("Não foi possível ler a imagem"); img.src = ev.target.result; };
  r.readAsDataURL(file);
}
