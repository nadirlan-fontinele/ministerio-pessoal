comparar os textos do mesmo assunto, buscar outras passagens que o explicam e estudar um pouco aqui, um pouco ali. Falso: estudar sem pedir a orientação do Espírito Santo.\n\n## 4. Que benefício recebe o estudante das Escrituras?\n\n> Leia João 5:39. Através da Bíblia, encontramos a vida ____. Ela testifica de ____.\n\nResposta: A vida eterna. Ela testifica de Jesus.\n\nJesus é o personagem central da Bíblia. Cada página da Bíblia revela Seu amor e Seu desejo de nos salvar. Lendo-a, encontramos o caminho da salvação.\n\n## 5. Que outro benefício prático advém de examinar a Bíblia?\n\n> Leia João 16:13; 8:32. O Espírito Santo guia em toda a ____. E é a verdade que nos ____.\n\nResposta: Guia em toda a verdade. E é a verdade que nos liberta.\n\n## 6. Quem dirigiu os profetas ao escreverem a Bíblia?\n\n> Leia 2 Pedro 1:21. Homens santos falaram da parte de Deus, ____ pelo ____ Santo.\n\nResposta: Movidos pelo Espírito Santo.\n\n## 7. Quanto do texto bíblico é inspirado por Deus?\n\n> Leia 2 Timóteo 3:16. Marque V ou F: ( ) Somente o Antigo Testamento. ( ) Somente o Novo Testamento. ( ) Toda a Bíblia é inspirada por Deus.\n\nResposta: Verdadeiro: toda a Bíblia é inspirada por Deus.\n\nSegundo esse texto, a Bíblia é útil para o ensino, repreensão, correção e para a educação na justiça. Pela leitura da Bíblia, nosso caráter é transformado.\n\n## 8. Que parte da Bíblia não foi escrita por autores humanos?\n\n> Leia Êxodo 31:18 e responda: Que parte da Bíblia não foi escrita por autores humanos?\n\nResposta: Os Dez Mandamentos, escritos nas tábuas de pedra pelo dedo de Deus.\n\n## 9. Está alguém autorizado a alterar a Bíblia?\n\n> Leia Malaquias 3:6; Apocalipse 22:18, 19 e responda: Está alguém autorizado a alterar a Bíblia?\n\nResposta: Não. Deus não muda, e ninguém pode acrescentar nem tirar nada das palavras da Bíblia.\n\n## 10. Como são chamados os praticantes dos ensinos bíblicos?\n\n> Leia João 13:17; Tiago 1:22. Bem ____ se praticardes os ____ da Bíblia.\n\nResposta: Bem-aventurados se praticardes os ensinos da Bíblia.\n\n## Recapitulação\n\nPara Jesus, a Palavra de Deus é a fonte da verdade. Muitos estudam a Bíblia e não a entendem. A forma correta de estudar a Bíblia é um pouco aqui e um pouco ali, sobre o mesmo assunto. Toda a Bíblia é inspirada por Deus. Não podemos tirar nem acrescentar nada às Escrituras.\n\n## Compromisso de fé\n\n[ ] Aceito toda a Bíblia como regra de fé para minha vida.\n\n[ ] Quero dedicar tempo cada dia para estudar a Bíblia.\n\n[ ] Farei todo o possível para colocar em prática seus ensinos em minha vida."}, {"titulo": "A beleza da criação divina", "refs": "Gênesis 1:2 · Hebreus 11:3 · Gênesis 1:1-2 · Gênesis 1", "conteudo": "Tudo o que existe na natureza expressa ordem, beleza, exatidão, adaptação, e pressupõe um planejamento inteligente. Observe as maravilhas naturais: o colorido e o perfume das flores, os pássaros, a teia de aranha, o brilho dos astros, a organização da colmeia, o funcionamento do corpo humano, entre outros magníficos fenômenos. Poderia tudo isso ter surgido por mero acaso? Como disse um estudioso do passado, “este relógio não poderia funcionar sem um relojoeiro”. Essa é a verdade que a Bíblia afirma, como veremos no presente estudo.\n\n## 1. Como era a Terra antes de ser criada?\n\n> Leia Gênesis 1:2. A Terra era sem ____ e ____.\n\nResposta: Sem forma e vazia.\n\n## 2. Como foi formado o Universo?\n\n> Leia Hebreus 11:3; Salmo 33:6, 9. Mediante a Palavra de ____. Ele falou e tudo se ____, ordenou e tudo passou a ____.\n\nResposta: Mediante a Palavra de Deus. Ele falou e tudo se fez, ordenou e tudo passou a existir.\n\n“Porque em seis dias fez o Senhor os céus e a Terra, o mar e tudo o que neles há” (Êxodo 20:11).\n\n## 3. Quem participou do ato da criação?\n\n> Leia Gênesis 1:1-2; João 1:1-3. No princípio criou ____ os céus e a Terra. O ____ de Deus pairava sobre as águas. Todas as coisas foram feitas por meio de ____.\n\nResposta: Deus criou os céus e a Terra. O Espírito de Deus pairava sobre as águas. Todas as coisas foram feitas por meio do Verbo, Jesus.\n\nEmbora a Bíblia não use a palavra Trindade, há vários textos que mencionam as três Pessoas da Divindade: Pai, Filho e Espírito Santo (Mateus 28:19; 2 Coríntios 13:13). Há, portanto, um só Deus: Pai, Filho e Espírito Santo, uma unidade de três Pessoas coeternas (Colossenses 1:16).\n\n## 4. Como foi o processo diário da criação?\n\n> Leia Gênesis 1; 2:1-3. Leia e anote o que foi criado em cada dia: 1º dia (versos 3-5), 2º dia (6-8), 3º dia (9-12), 4º dia (13-19), 5º dia (20-23), 6º dia (24-26, 31), 7º dia (Gênesis 2:1-3).\n\nResposta: 1º dia: a luz, separada das trevas. 2º dia: o firmamento, separando as águas. 3º dia: a terra seca, os mares e as plantas. 4º dia: o Sol, a Lua e as estrelas. 5º dia: os peixes e as aves. 6º dia: os animais terrestres e o ser humano. 7º dia: Deus descansou, abençoou e santificou o sábado.\n\nA palavra hebraica para “dia” na expressão “tarde e manhã, o primeiro dia” é yom, que significa um período de 24 horas (quando é acompanhada de numeral ordinal).\n\n## 5. Como se deu a criação do homem e da mulher?\n\n> Leia Gênesis 1:26, 27; 2:7, 18-25. Homem, criado do ____ da ____. Mulher, criada da ____ de ____.\n\nResposta: O homem foi criado do pó da terra. A mulher foi criada da costela de Adão.\n\nCoroando a obra da criação, Deus fez o homem “à Sua imagem, à imagem de Deus o criou; homem e mulher os criou”. Diferentemente do restante da criação, que veio à existência pela palavra de Deus, o ser humano foi feito à Sua imagem. Foi moldado pelas mãos divinas e recebeu diretamente de Deus o sopro de vida. Você é muito especial para Deus.\n\n## 6. Que presente o primeiro casal recebeu de Deus?\n\n> Leia Gênesis 2:8, 15. Receberam de Deus um lindo e maravilhoso ____.\n\nResposta: Um jardim: o Jardim do Éden.\n\n## 7. Sob que condição eles viveriam eternamente no Jardim do Éden?\n\n> Leia Gênesis 2:15-17. Não comer da árvore do conhecimento do bem e do ____. A desobediência às orientações de ____ acarretaria duas consequências.\n\nResposta: Não comer da árvore do conhecimento do bem e do mal. A desobediência às orientações de Deus acarretaria duas consequências: 1) deixar o jardim e 2) ficar sujeitos à morte.\n\n## Recapitulação\n\nHoje aprendemos que a Terra, antes de ser criada, era sem forma e vazia. Deus falou e tudo se fez. Os céus e a Terra foram criados por Deus em seis dias. Estavam presentes na criação Deus, o Pai; o Espírito Santo e o Filho. O homem foi criado do pó da terra; e a mulher, da costela de Adão. Adão e Eva deixaram o jardim e se tornaram sujeitos à morte, por causa da desobediência à Palavra de Deus.\n\n## Compromisso de fé\n\n[ ] Aceito que o Universo foi criado com a participação das três Pessoas da Divindade.\n\n[ ] Creio no poder de Deus que criou a Terra em seis dias literais.\n\n[ ] Quero conhecer mais a respeito do Deus Criador."}, {"titulo": "A origem do mal", "refs": "Apocalipse 5:11 · Ezequiel 28:14, 15, 17 · Isaías 14:12-14 · Apocalipse 12:7-9", "conteudo": "Charles Baudelaire, historiador, artista e poeta francês do século 19, acreditava que Deus criou a natureza e os seres humanos para serem bons e maus, resultando no que parece ser uma mistura de ambos. Há quem concorde com Baudelaire, mas qual deve ser a postura do cristão? Como harmonizar um Deus amoroso, que deu a própria vida para salvar pecadores, com a existência de doença, sofrimento e morte? Que dizer de realidades como violência, terrorismo, roubos, assassinatos frios que acontecem todos os dias? É Deus responsável por tudo isso? Se não, quem é? Deixemos que a Bíblia responda.\n\n## 1. De quantos anjos é composto o exército de Deus?\n\n> Leia Apocalipse 5:11. É composto de ____ de anjos.\n\nResposta: Milhões de milhões e milhares de milhares de anjos.\n\n## 2. Que descrição a Bíblia faz de Lúcifer, o ex-líder dos anjos?\n\n> Leia Ezequiel 28:14, 15, 17. “Perfeito eras nos teus ____”, até cometer ____.\n\nResposta: “Perfeito eras nos teus caminhos”, até que se achou iniquidade em ti.\n\nIniquidade é transgressão da Lei de Deus (1 João 3:4).\n\n## 3. Que outros pecados esse anjo cometeu?\n\n> Leia Isaías 14:12-14. Marque V ou F: ( ) Queria assentar-se no trono de Deus. ( ) Pretendia ser semelhante ao Altíssimo. ( ) Queria o lugar de Deus e ser adorado. ( ) Amou a Deus.\n\nResposta: Verdadeiro: queria assentar-se no trono de Deus, ser semelhante ao Altíssimo e ter o lugar de Deus, sendo adorado. Falso: amou a Deus.\n\n## 4. Qual foi o resultado da rebeldia desse anjo?\n\n> Leia Apocalipse 12:7-9. Houve no Céu uma grande ____ entre Cristo e ____.\n\nResposta: Houve no Céu uma grande batalha (peleja) entre Cristo (Miguel) e o dragão, Satanás.\n\nO mal surgiu no Céu, através de um anjo de luz, que se rebelou contra Deus e passou a se chamar Satanás. Nesse conflito, a terça parte dos anjos se uniu ao inimigo, e todos foram expulsos do Céu vindo alojar-se na Terra (Apocalipse 12:4).\n\n## 5. Que advertência Deus fez a Adão e Eva no Éden?\n\n> Leia Gênesis 2:15-17. Deus disse: Não comam da árvore do conhecimento do ____ e do ____. Se comerem, certamente ____.\n\nResposta: Do bem e do mal. Se comerem, certamente morrerão.\n\n## 6. Contrariando a advertência divina, o que a serpente disse à mulher?\n\n> Leia Gênesis 3:1-5. A serpente disse: É certo que não ____. Sereis como ____.\n\nResposta: É certo que não morrereis. Sereis como Deus.\n\n## 7. Que certeza Deus transmitiu a Adão e Eva, quando eles pecaram?\n\n> Leia Gênesis 3:15. Jesus Cristo, o descendente da mulher, esmagaria a cabeça da ____.\n\nResposta: Da serpente.\n\nEle deixaria o Céu e, através do mistério da Encarnação, nasceria de mulher. Viveria como homem e, por Sua morte e ressurreição, decretaria o fim do domínio de Satanás.\n\n## 8. De que maneira Satanás nos engana hoje?\n\n> Leia 2 Coríntios 11:14, 15; Mateus 24:24. Transformando-se em ____ de luz. Realizando ____ e prodígios.\n\nResposta: Transformando-se em anjo de luz. Realizando grandes sinais e prodígios.\n\n## 9. Contra quem o inimigo está especialmente irado em nossos dias?\n\n> Leia Apocalipse 12:12, 17. Marque V ou F: ( ) Contra aqueles que não seguem mandamento algum. ( ) Contra aqueles que seguem os dez mandamentos. ( ) Contra aqueles que escolhem alguns mandamentos para obedecer.\n\nResposta: Verdadeiro: contra aqueles que guardam os mandamentos de Deus e têm o testemunho de Jesus.\n\n## 10. Como nos é possível vencer Satanás?\n\n> Leia Efésios 6:10-18. Revestindo-nos de toda a ____ de Deus. Tendo o escudo da ____, seguindo a Palavra de ____, orando em ____ o tempo.\n\nResposta: Revestindo-nos de toda a armadura de Deus. Tendo o escudo da fé, seguindo a Palavra de Deus, orando em todo o tempo.\n\n## Recapitulação\n\nLúcifer era um anjo de luz e quis tomar o trono (lugar) de Deus. Eva foi enganada pela serpente. O mal se originou no Céu, no coração de um ser criado livre, e não com Deus. Lúcifer cometeu iniquidade, que é desobediência à lei de Deus. Ele enganou os anjos e tem enganado a muitos através de sinais e prodígios. Sua ira é contra os que seguem os mandamentos de Deus.\n\n## Compromisso de fé\n\n[ ] Creio que o mal surgiu com um anjo criado perfeito e que se rebelou contra Deus.\n\n[ ] No grande conflito entre o bem e o mal, quero ficar ao lado de Deus e Sua Palavra.\n\n[ ] Desejo me revestir de toda a armadura de Deus e seguir Suas orientações."}, {"titulo": "O plano da salvação", "refs": "Romanos 5:12 · Gênesis 3:8-10 · Gênesis 6:5 · Efésios 2:3", "conteudo": "Independentemente de quem tenhamos sido ou o que tenhamos feito no passado, Deus nos ama “com amor eterno”, dispondo-Se a vir ao mundo e passar pela agonia da cruz a fim de resgatar a humanidade perdida. Entretanto, muitos há que se perguntam: “Como posso ser bom diante de Deus?” “Como posso apagar meu passado mal?” “Como posso ser apresentado sem culpa diante dEle?” “Como posso ser salvo?” O caminho para a vida eterna é muito fácil de ser achado e compreendido, mas poucos sabem como ir a Cristo e experimentar alegria, paz de espírito, perdão e esperança. O presente estudo mostra a resposta bíblica para uma vida cristã vitoriosa.\n\n## 1. Quantos são pecadores e qual é o resultado do pecado?\n\n> Leia Romanos 5:12; 6:23. A morte passou a ____ os homens, porquanto todos ____. O salário do pecado é a ____.\n\nResposta: A morte passou a todos os homens, porquanto todos pecaram. O salário do pecado é a morte.\n\n## 2. Que reação Deus manifestou diante da entrada do pecado?\n\n> Leia Gênesis 3:8-10. ( ) Abandonou o homem. ( ) Não Se importou. ( ) Procurou o homem.\n\nResposta: Deus procurou o homem.\n\n## 3. Qual a condição da natureza humana após o pecado?\n\n> Leia Gênesis 6:5; Salmo 51:5; Jeremias 13:23; 17:9; Mateus 15:19. Marque V ou F: ( ) Ficou mais santa. ( ) Tornou-se corrompida e depravada. ( ) Permaneceu como era.\n\nResposta: Verdadeiro: tornou-se corrompida e depravada.\n\n## 4. Quais são outras características da natureza humana pecaminosa?\n\n> Leia Efésios 2:3; 4:18; 1 Coríntios 2:14; Romanos 7:15-19, 23, 24. Querer o bem está em mim; mas não consigo ____. O homem natural não ____ as coisas de Deus.\n\nResposta: Não consigo realizá-lo (fazer o bem). O homem natural não aceita (compreende) as coisas de Deus.\n\n## 5. Que plano Deus estabeleceu para nos salvar da morte eterna?\n\n> Leia João 3:16 e responda: Que plano Deus estabeleceu para nos salvar da morte eterna?\n\nResposta: Deus amou o mundo de tal maneira que deu o Seu Filho unigênito, para que todo o que nEle crê não pereça, mas tenha a vida eterna.\n\nDeus estabeleceu um plano mediante o qual Seu Filho daria a vida em lugar do pecador. Dessa forma, todo o que O aceita como Salvador é perdoado e recebe a promessa de vida eterna. “Cristo morreu pelos nossos pecados, segundo as Escrituras” (1 Coríntios 15:3).\n\n## 6. O que Jesus fez por nós na cruz?\n\n> Leia 1 Pedro 2:24; Isaías 53:5, 6. Carregou em Seu corpo sobre o madeiro os nossos ____. O Senhor fez cair sobre Ele a ____ de todos nós.\n\nResposta: Carregou os nossos pecados. O Senhor fez cair sobre Ele a iniquidade de todos nós.\n\n## 7. Quem pode mudar a natureza humana?\n\n> Leia 1 Samuel 10:6; João 8:32. O Espírito ____ e o conhecimento da ____.\n\nResposta: O Espírito do Senhor (Espírito Santo) e o conhecimento da verdade.\n\n## 8. A salvação depende de nossas boas obras?\n\n> Leia Efésios 2:8-9; Gálatas 2:16. ( ) Sim ( ) Não\n\nResposta: Não. Somos salvos pela graça, mediante a fé; não por obras.\n\n## 9. Como pode o homem alcançar a salvação?\n\n> Leia 1 João 5:11-12; Hebreus 5:9. Aceitando a Cristo, o Autor da salvação eterna para todos os que lhe ____.\n\nResposta: Para todos os que Lhe obedecem.\n\n## Recapitulação\n\nApós o homem pecar, Deus foi procurá-lo e lhe deu a certeza de que Jesus morreria em seu lugar. Jesus é o cordeiro de Deus. Ele tomou sobre Si os nossos pecados. Após o pecado, a natureza humana ficou depravada e o coração corrompido. O Espírito Santo muda a natureza humana e implanta a lei de Deus no coração. A salvação depende de nossa fé em Jesus.\n\n## Compromisso de fé\n\n[ ] Creio no plano idealizado por Deus para a salvação do homem.\n\n[ ] Aceito o trabalho do Espírito Santo para transformar minha natureza.\n\n[ ] Quero entregar o coração a Jesus, aceitando-O como meu Salvador."}, {"titulo": "Fé, arrependimento e confissão", "refs": "Hebreus 11:1, 6 · 1 João 5:4 · Romanos 10:17 · Lucas 5:32", "conteudo": "Certo dia, um sacerdote cristão visitou um hospital psiquiátrico na Inglaterra. Enquanto andava pelos corredores e aposentos, observando os pacientes em seu lamentável desequilíbrio mental, ouviu do diretor da instituição, que o acompanhava: “Se metade dessas pessoas pudesse crer no perdão, poderia ser mandada de volta para casa”. De fato, muitos males emocionais, espirituais, e até físicos, têm origem no sentimento de culpa. O pecado tem ação devastadora na vida de qualquer pessoa. Que podemos fazer com ele? Como nos livrarmos de suas terríveis consequências? A Bíblia aponta a saída.\n\n## 1. O que é fé e qual é sua importância na vida cristã?\n\n> Leia Hebreus 11:1, 6; Romanos 5:1; Tiago 2:26. Fé é certeza. Ela agrada a ____ e produz paz. A fé sem obras é ____.\n\nResposta: Agrada a Deus. A fé sem obras é morta.\n\n## 2. Qual é o objetivo da fé?\n\n> Leia 1 João 5:4; 1 Pedro 1:9. Vencer o ____. O fim da fé é a ____.\n\nResposta: Vencer o mundo. O fim da fé é a salvação da nossa alma.\n\n## 3. Como desenvolver a fé?\n\n> Leia Romanos 10:17. A fé vem enquanto ouvimos a Palavra de ____.\n\nResposta: A Palavra de Deus (de Cristo).\n\n## 4. O que Jesus veio fazer?\n\n> Leia Lucas 5:32. Chamar pecadores ao ____.\n\nResposta: Ao arrependimento.\n\n## 5. O que nos leva ao arrependimento?\n\n> Leia Romanos 2:4. A ____ de ____ nos leva ao arrependimento.\n\nResposta: A bondade de Deus.\n\n## 6. O que faz o pecador arrependido?\n\n> Leia Salmo 38:18. Ele ____ os pecados a Jesus.\n\nResposta: Ele confessa os pecados.\n\nOs Salmos 32 e 51 falam sobre arrependimento. Se confessarmos nossos pecados, Jesus é fiel e justo para nos perdoar e purificar (1 João 1:9). Paulo afirma que Jesus é o único mediador entre nós e Deus (1 Timóteo 2:5).\n\n## 7. O que acontece com aquele que não confessa seus pecados?\n\n> Leia Provérbios 28:13. Jamais ____. Mas quem confessa e deixa alcançará ____.\n\nResposta: Jamais prosperará. Mas quem confessa e deixa alcançará misericórdia.\n\n## 8. O que Deus faz quando confessamos nossos pecados?\n\n> Leia 1 João 1:9; Miqueias 7:18, 19; Isaías 43:25. Ele nos ____ e ____. Lança nossos pecados nas ____ do mar.\n\nResposta: Ele nos perdoa e purifica. Lança nossos pecados nas profundezas do mar.\n\n## 9. O que Deus espera de nós hoje?\n\n> Leia Isaías 55:7. Deixemos o caminho do ____, nos convertamos e nos voltemos para Deus, pois é rico em ____.\n\nResposta: Deixemos o caminho do mal (do ímpio). Deus é rico em perdoar.\n\n## Recapitulação\n\nA fé agrada a Deus. Ela é o meio pelo qual somos justificados. A fé é dom de Deus, e o Espírito Santo dá uma medida de fé a cada um. A fé em Cristo nos ajuda a vencer. A fé vem enquanto ouvimos a Palavra de Deus. Jesus veio chamar pecadores ao arrependimento. Quem não confessa os pecados jamais prosperará. Mas, quando os confessamos, Deus os lança nas profundezas do mar, pois é grandioso em perdoar.\n\n## Compromisso de fé\n\n[ ] Quero experimentar a paz que vem do arrependimento e da confissão.\n\n[ ] Creio que Deus pode perdoar todos os meus pecados.\n\n[ ] Aceito o convite de Jesus para deixar o mal e me voltar para Ele."}, {"titulo": "Sinais da volta de Cristo", "refs": "Mateus 24:6, 7, 10 · Mateus 24:7, 29 · Mateus 24:4, 5, 11, 24 · Mateus 24:14", "conteudo": "Estando com os discípulos no monte das Oliveiras, Jesus ouviu deles a seguinte pergunta: “Que sinal haverá da Tua vinda e da consumação do século?” (Mateus 24:3). O Mestre, então, enumerou vários sinais indicadores do Seu retorno à Terra. Alguns dos sinais apresentados tiveram cumprimento inicialmente em Jerusalém, e serviram como “maquete” ilustrativa dos acontecimentos do fim. Outros sinais, porém, estão se cumprindo agora, em nossos dias. Quais são eles?\n\n## 1. Que sinais seriam vistos no MUNDO SOCIAL antes da volta de Cristo?\n\n> Leia Mateus 24:6, 7, 10; 2 Timóteo 3:1-4. Ouvireis falar de ____ e ____ de ____, nação contra ____, e haverá ____ em vários lugares.\n\nResposta: Ouvireis falar de guerras e rumores de guerras, nação contra nação, e haverá fomes em vários lugares.\n\n## 2. Que três grandes sinais no MUNDO NATURAL indicam a proximidade da volta de Jesus?\n\n> Leia Mateus 24:7, 29. 1) Terremotos; 2) escurecimento do Sol e da Lua (19/05/1780); 3) queda de ____ (13/11/1833).\n\nResposta: Queda de estrelas.\n\nOs sinais que matam pessoas indicam que Satanás está agindo na natureza.\n\n## 3. Que sinais seriam vistos no MUNDO RELIGIOSO antes da volta de Cristo?\n\n> Leia Mateus 24:4, 5, 11, 24. Haverá falsos ____ e falsos ____. O engano será baseado em sinais e ____. a) Qual é a motivação dos falsos profetas, ao pregarem a Bíblia? (2 Pedro 2:1-3): ( ) Amor ao próximo. ( ) Avareza. ( ) Amor a Deus. b) O que atrai pessoas a esses falsos líderes? (Mateus 7:21-23): ( ) Amizade. ( ) Doutrina sem base bíblica. ( ) Sinais, prodígios e curas.\n\nResposta: Haverá falsos cristos e falsos profetas. O engano será baseado em sinais e prodígios. a) A motivação dos falsos profetas é a avareza. b) O que atrai as pessoas são sinais, prodígios e curas.\n\nA iniquidade será multiplicada (Mateus 24:11; 1 João 3:4).\n\n## 4. Além desses, que importante sinal foi mencionado por Cristo?\n\n> Leia Mateus 24:14. A pregação do evangelho verdadeiro em ____ o ____.\n\nResposta: Em todo o mundo.\n\n## 5. Paulo fala de “outro evangelho” que está sendo pregado (Gálatas 1:6). O que fazer para não ser enganado?\n\n> Leia 1 João 4:1. Devo ____ se o ensino está de acordo com a Palavra de ____.\n\nResposta: Devo provar se o ensino está de acordo com a Palavra de Deus.\n\n## 6. Por que Deus manda provar o ensino dos profetas?\n\n> Leia Mateus 7:15; 2 Pedro 3:16. Marque V ou F: ( ) Porque o engano, às vezes, parece verdade. ( ) Para comprovar se o que é ensinado está de acordo com a Bíblia. ( ) Porque, na Bíblia, tudo é fácil de entender.\n\nResposta: Verdadeiro: porque o engano às vezes parece verdade e para comprovar se o ensino está de acordo com a Bíblia. Falso: na Bíblia, tudo é fácil de entender.\n\n## 7. Como saber se uma doutrina é verdadeira?\n\n> Leia João 7:17; Isaías 28:10. Marque V ou F: ( ) Doutrina de acordo com toda a Bíblia. ( ) Doutrina baseada em um só livro da Bíblia ou só no Novo Testamento. ( ) Doutrina baseada em uma parábola e poucos versos da Bíblia.\n\nResposta: Verdadeiro: a doutrina que está de acordo com toda a Bíblia.\n\n## 8. Se os sinais estão se cumprindo, por que Jesus ainda não voltou?\n\n> Leia 2 Pedro 3:9. Jesus está sendo ____, para que ninguém se perca.\n\nResposta: Jesus está sendo longânimo (paciente) para conosco.\n\n## 9. Que atitudes devemos ter no tempo do fim?\n\n> Leia Lucas 21:28, 34; Mateus 6:33. 1) Exultar e ____ a cabeça. 2) Buscar a Deus em ____ lugar.\n\nResposta: 1) Exultar e erguer a cabeça. 2) Buscar a Deus em primeiro lugar.\n\n## Recapitulação\n\nOs sinais da vinda de Cristo estão se cumprindo. Um grande sinal que indica a proximidade da volta de Cristo é a pregação do evangelho em todo o mundo. Dois evangelhos estão sendo pregados: o verdadeiro e o falso. Devemos provar se a doutrina ensinada está de acordo com a Palavra de Deus. No tempo do fim devemos erguer a cabeça e buscar a Deus em primeiro lugar.\n\n## Compromisso de fé\n\n[ ] Creio que estamos vivendo no tempo do fim.\n\n[ ] Desejo conhecer e praticar a doutrina que está de acordo com toda a Bíblia.\n\n[ ] Quero me preparar para a volta de Cristo."}, {"titulo": "A segunda vinda de Cristo", "refs": "Apocalipse 6:15-17 · João 5:28, 29 · Apocalipse 20:6 · Isaías 25:9", "conteudo": "Jesus prometeu: “Virei outra vez e vos levarei para Mim mesmo, para que, onde Eu estou, estejais vós também” (João 14:3). A primeira vinda de Cristo ocorreu há dois mil anos. Hoje aguardamos a Sua segunda vinda, que será pessoal, visível e literal. O que acontecerá com os vivos e com os mortos naquele grande dia? Vejamos o que a Bíblia ensina.\n\n## 1. O que ocorrerá com os vivos que não se prepararam para a segunda vinda de Cristo?\n\n> Leia Apocalipse 6:15-17; 9:6; 2 Tessalonicenses 2:8. Buscarão esconderijo nas ____ e pedirão aos ____ que caiam sobre eles. Buscarão a ____, mas a morte fugirá deles. Os ímpios ____, ao verem o resplendor da glória de Jesus.\n\nResposta: Buscarão esconderijo nas cavernas e pedirão aos montes e rochedos que caiam sobre eles. Buscarão a morte, mas a morte fugirá deles. Os ímpios serão destruídos pelo resplendor da vinda de Jesus.\n\n## 2. De quantas ressurreições a Bíblia fala?\n\n> Leia João 5:28, 29; Daniel 12:2. ( ) nenhuma ( ) uma ( ) duas ( ) várias. A primeira é a ressurreição da ____, e a segunda é a ressurreição da ____.\n\nResposta: Duas. A primeira é a ressurreição da vida, e a segunda é a ressurreição do juízo (condenação).\n\n## 3. Quanto tempo existirá entre a primeira e a segunda ressurreição?\n\n> Leia Apocalipse 20:6. ( ) 200 anos ( ) 500 anos ( ) 1000 anos\n\nResposta: Mil anos.\n\nA próxima lição dará mais detalhes sobre esse assunto.\n\n## 4. Qual será o cântico dos salvos naquele grandioso dia?\n\n> Leia Isaías 25:9. Eis que Este é o nosso Deus, em quem ____. Na Sua salvação ____ e nos ____.\n\nResposta: Em quem esperávamos. Na Sua salvação exultaremos e nos alegraremos.\n\n## 5. Que convite Jesus nos faz hoje?\n\n> Leia Mateus 11:28-29. ( ) Apartai-vos de Mim. ( ) Vinde a Mim. ( ) Nenhum convite.\n\nResposta: “Vinde a Mim, todos os que estais cansados e sobrecarregados, e Eu vos aliviarei.”\n\n## 6. Qual será o resultado da rejeição ao convite de Jesus?\n\n> Leia Mateus 25:41 e responda: Qual será o resultado da rejeição ao convite de Jesus?\n\nResposta: Ouvir de Jesus: “Apartai-vos de Mim, malditos, para o fogo eterno, preparado para o diabo e seus anjos.”\n\n## Recapitulação\n\nA Bíblia fala que Cristo voltará à Terra. A primeira vinda ocorreu há dois mil anos. Aguardamos a segunda vinda de Cristo. O texto clássico da segunda vinda está em João 14:1-3. Quando Ele voltar, iremos para o Céu. Jesus virá de modo pessoal, visível e literal, com milhares de anjos tocando trombetas.\n\n## Compromisso de fé\n\n[ ] Quero me preparar para estar entre os salvos na segunda vinda de Cristo.\n\n[ ] Creio que haverá duas ressurreições: uma para a vida e outra para morte eterna.\n\n[ ] Desejo viver a verdade, a fim de poder morar para sempre com Cristo no Céu."}, {"titulo": "O milênio", "refs": "Apocalipse 20:6 · Apocalipse 20:4 (1ª parte) · Jeremias 4:23-26 · Apocalipse 20:1-3", "conteudo": "Na sequência da volta de Cristo, acontecimentos extraordinários terão lugar. Até que o planeta Terra seja definitivamente restaurado, decorrerá um período de mil anos, ou um milênio. O que acontecerá na Terra, durante esse período? Onde e em que circunstância estará Satanás? Qual e como será o desfecho de tudo? É importante que busquemos respostas nas Escrituras Sagradas para essas indagações.\n\n## 1. Para onde irão os salvos após a volta de Cristo e quanto tempo ali permanecerão?\n\n> Leia Apocalipse 20:6. Marque V ou F: ( ) Irão para o Céu e reinarão com Cristo durante mil anos. ( ) Serão sacerdotes de Deus; sobre eles a morte não terá mais poder. ( ) Permanecerão vivos na Terra.\n\nResposta: Verdadeiro: irão para o Céu e reinarão com Cristo mil anos; serão sacerdotes de Deus, e a morte não terá poder sobre eles. Falso: permanecerão vivos na Terra.\n\n## 2. O que os salvos farão no Céu durante os mil anos?\n\n> Leia Apocalipse 20:4 (1ª parte); 1 Coríntios 6:2. Marque V ou F: ( ) Os salvos receberão autoridade de julgar. ( ) Os salvos decidirão o retorno de Lúcifer ao Céu. ( ) Os salvos entenderão porque muitos não estarão lá.\n\nResposta: Verdadeiro: receberão autoridade de julgar e entenderão por que muitos não estarão lá. Falso: decidirão o retorno de Lúcifer ao Céu.\n\n## 3. Como ficará a Terra durante esse período?\n\n> Leia Jeremias 4:23-26; 25:33. A Terra ficará sem ____ e ____, voltará a ser um abismo como era antes de ser criada. Nela, não haverá pessoas ____. As cidades ficarão todas ____ e ____ diante da vinda de Cristo. A Terra ficará cheia de pessoas ____.\n\nResposta: A Terra ficará sem forma e vazia. Não haverá pessoas vivas. As cidades ficarão destruídas e em ruínas. A Terra ficará cheia de pessoas mortas.\n\n## 4. Quem permanecerá na Terra durante os mil anos?\n\n> Leia Apocalipse 20:1-3. Nesse período, na Terra, ficarão vivos apenas ____ e seus anjos.\n\nResposta: Apenas Satanás e seus anjos.\n\nA prisão de Satanás é circunstancial ou simbólica, pois ficará mil anos sem ninguém a quem tentar.\n\n## 5. Passados os mil anos, o que ocorrerá a Satanás e os ímpios?\n\n> Leia Apocalipse 20:5-7. Os ímpios ressuscitarão. Satanás será solto de sua ____, pois terá novamente a quem tentar.\n\nResposta: Será solto de sua prisão.\n\n## 6. Que outros eventos marcam o fim dos mil anos?\n\n> Leia Apocalipse 21:2, 10; 20:5, 7. A Cidade Santa ____ para a Terra. Dentro da cidade estarão os salvos com ____. Fora da cidade, estarão os perdidos juntamente com ____.\n\nResposta: A Cidade Santa descerá do Céu para a Terra. Dentro dela estarão os salvos com Jesus. Fora estarão os perdidos, juntamente com Satanás.\n\n## 7. O que Satanás fará com seu grande exército, à medida que a Cidade Santa se aproximar da Terra?\n\n> Leia Apocalipse 20:8. Reunirá seu exército, que será como ____ do ____, e se preparará para atacar e tentar possuir a Cidade Santa, que descerá do Céu.\n\nResposta: Como a areia do mar.\n\n## 8. Qual será a sentença final daqueles que rejeitaram a Deus e Sua vontade?\n\n> Leia Apocalipse 20:9; Mateus 25:41. Descerá fogo do Céu e ____ os que rejeitaram a salvação. O fogo foi preparado para o ____ e seus ____. Aqueles que não ficaram ao lado de Cristo receberão a mesma sentença de ____.\n\nResposta: Descerá fogo do Céu e consumirá os que rejeitaram a salvação. O fogo foi preparado para o diabo e seus anjos. Quem não ficou ao lado de Cristo receberá a mesma sentença de Satanás.\n\nO desejo de Deus é salvar. Para isso, Cristo deu a vida. A destruição é um ato estranho para Deus. Mas, depois de dadas todas as oportunidades, Ele terá que destruir o mal, para devolver a perfeição original a Seus filhos.\n\n## Recapitulação\n\nApós a segunda vinda de Cristo, inicia-se o milênio. Durante esse período, os salvos estarão no Céu. A Terra ficará sem forma e vazia. Não haverá pessoas vivas, com exceção de Satanás e seus anjos. No fim desse período, a Nova Jerusalém descerá para a Terra com os salvos. Satanás formará um grande exército, mas serão todos consumidos com fogo e destruídos.\n\n## Compromisso de fé\n\n[ ] Quero estar no Céu durante os mil anos.\n\n[ ] Sinto que Jesus está me chamando para passar a eternidade com Ele.\n\n[ ] Decido, a partir de agora, fazer parte dos seguidores de Deus."}, {"titulo": "A verdade sobre a morte", "refs": "Gênesis 2:7 · Ezequiel 18:4 · Gênesis 3:19 · 1 Timóteo 6:16", "conteudo": "O que acontece a uma pessoa, depois da morte? As tentativas feitas para se responder a essa pergunta são muitas. E a maioria delas só consegue aprofundar a angústia e a tristeza que envolvem o assunto, e aumentar as dúvidas. Para uns, ao morrer, o indivíduo vai direto para o Céu ou para o inferno. Para outros, ele será um espírito que encarnará sucessivamente em outros seres. Em meio a ideias conflitantes, necessitamos obter uma resposta produtora de segurança, que só pode ser encontrada na Palavra de Deus.\n\n## 1. Que material Deus usou para criar o homem?\n\n> Leia Gênesis 2:7. Pó da terra, e soprou em seu nariz o ____. O boneco de barro passou a ter vida. Portanto, ____ + ____ = alma vivente/ser humano.\n\nResposta: O fôlego de vida. Portanto: pó da terra + fôlego de vida = alma vivente (ser humano).\n\n## 2. Como a Bíblia se refere à alma?\n\n> Leia Ezequiel 18:4; Gênesis 46:27; Deuteronômio 10:22. Todas as ____ são minhas. Portanto, ____ significa pessoa viva.\n\nResposta: Todas as almas são minhas. Portanto, alma significa pessoa viva.\n\n## 3. O que acontece com a pessoa (alma vivente) quando morre?\n\n> Leia Gênesis 3:19; Eclesiastes 12:7; 9:5, 10; Jó 7:9, 10. a) O corpo volta a ser ____ (Gn 3:19). b) O espírito, ar ou fôlego de vida, volta para ____ (Ec 12:7). c) A memória é entregue ao ____ (Ec 9:5). d) Para onde vai a pessoa após a morte? ( ) Céu ( ) Inferno ( ) Flutuar no espaço ( ) Sepultura. e) Têm os mortos conhecimento de alguma coisa? ( ) Sim ( ) Não\n\nResposta: a) O corpo volta a ser pó. b) O fôlego de vida volta para Deus. c) A memória é entregue ao esquecimento. d) A pessoa vai para a sepultura. e) Não: os mortos não sabem coisa nenhuma.\n\nNão nos é possível ver ou falar com alguém que já morreu. Em tais manifestações, não é a pessoa morta que aparece, mas Satanás e seus anjos disfarçados (2 Coríntios 11:13). Ele não deseja que entendamos que a oportunidade de salvação só existe enquanto vivemos.\n\n## 4. Quem, unicamente, possui imortalidade?\n\n> Leia 1 Timóteo 6:16. O único que possui imortalidade é ____.\n\nResposta: Deus.\n\n## 5. Sob que condição o homem conservaria sua imortalidade?\n\n> Leia Gênesis 2:16, 17. A condição era não ____ do fruto da árvore do conhecimento do bem e do mal, ou seja, obedecer.\n\nResposta: Não comer.\n\n## 6. O que o pecado ocasionou ao ser humano?\n\n> Leia Romanos 5:12; 6:23. O pecado trouxe a ____ que, por sua vez, passou a todos os ____.\n\nResposta: A morte, que passou a todos os homens.\n\n## 7. Como Jesus considerou a morte?\n\n> Leia João 11:11-14. Jesus afirmou que a morte é um ____.\n\nResposta: Um sono.\n\n## 8. Até quando os mortos em Cristo permanecerão dormindo na sepultura?\n\n> Leia João 5:28, 29; 1 Tessalonicenses 4:16. Até a ____ de Jesus.\n\nResposta: Até a volta (segunda vinda) de Jesus.\n\n## 9. Qual será a recompensa dos que participarem da primeira ressurreição?\n\n> Leia 1 Coríntios 15:51-53. Receberão a imortalidade perdida, num ____ e fechar de ____.\n\nResposta: Num momento, num abrir e fechar de olhos.\n\n## Recapitulação\n\nDeus fez o homem do pó da terra e soprou nele o fôlego de vida. Então, o homem se tornou alma vivente. Alma, na Bíblia, é uma pessoa viva. A morte é um estado de inconsciência. Jesus a considerou um sono. Os mortos não sabem de coisa alguma. Quando a pessoa morre a mente se apaga. O corpo volta a ser pó e o fôlego de vida volta para Deus. Os mortos justos ficarão na sepultura até a volta de Jesus.\n\n## Compromisso de fé\n\n[ ] Creio que o homem foi criado por Deus para ser imortal, mas perdeu a imortalidade devido à desobediência.\n\n[ ] Creio que a morte é um sono e que os mortos justos ressuscitarão na segunda vinda de Jesus.\n\n[ ] Reafirmo minha aceitação de Cristo como meu Salvador. Desejo obedecer-Lhe em tudo e, por ocasião da Sua vinda, receber a imortalidade."}, {"titulo": "A Nova Terra", "refs": "2 Pedro 3:13 · Apocalipse 21:8, 27 · Apocalipse 21:4 · Isaías 65:21, 22", "conteudo": "Um mundo de paz. Sem ódio nem rancor. Um mundo sem violência, preconceitos, corrupção, traições ou manifestações de deslealdade. Um mundo sem dor, sofrimento, luto nem pranto. Um mundo perfeito, onde as flores não murcham e o brilho do próprio Cristo nos aquece e ilumina. Isso é o que todos nós almejamos ardentemente, cansados como estamos do mundo atual e suas dores. Para a mentalidade materialista e descrente, isso é utopia. Mas, a Bíblia fala de realidades a nós prometidas e preparadas por um Ser que jamais falha.\n\n## 1. O que o Senhor prometeu criar após o milênio?\n\n> Leia 2 Pedro 3:13. Nós, porém, ____ a sua ____, esperamos novos ____ e nova ____ onde habita a justiça.\n\nResposta: Nós, porém, segundo a Sua promessa, esperamos novos céus e nova terra.\n\nApós os mil anos, a Nova Jerusalém descerá para a Terra (Apocalipse 21:2), tornando-se a capital da Nova Terra. Será quadrada (versos 16, 14, 12, 18, 19), cercada de muros e adornada de pedras preciosas. Em cada lado dos muros haverá três portas onde estarão escritos os nomes das doze tribos de Israel e dos doze apóstolos. A cidade e a praça serão de ouro (Apocalipse 21:21; 22:1, 2). Na praça, estarão o trono de Deus, a árvore da vida e o rio da vida.\n\n## 2. Quem ficará fora da cidade e quem entrará nela?\n\n> Leia Apocalipse 21:8, 27; 1 Coríntios 6:9, 10. Ficarão de fora os ____. Entrarão somente aqueles que têm o nome no ____.\n\nResposta: Ficarão de fora os covardes, incrédulos, abomináveis, assassinos, impuros, feiticeiros, idólatras e mentirosos. Entrarão somente os que têm o nome no Livro da Vida do Cordeiro.\n\n## 3. O que não haverá na Nova Terra?\n\n> Leia Apocalipse 21:4; Isaías 35:5, 6, 9, 10. Marque V ou F: ( ) Morte, luto, pranto e dor. ( ) Vida eterna. ( ) Deficientes físicos e enfermos. ( ) Voz de choro e clamor.\n\nResposta: Não haverá morte, luto, pranto nem dor; nem deficientes físicos e enfermos; nem voz de choro e clamor. Haverá vida eterna.\n\n## 4. Quais serão as atividades dos salvos na Nova Terra?\n\n> Leia Isaías 65:21, 22. Plantarão ____; cada um desfrutará do trabalho de suas mãos.\n\nResposta: Edificarão casas e as habitarão; plantarão vinhas e comerão o seu fruto.\n\n## 5. Como serão os animais na Nova Terra?\n\n> Leia Isaías 65:25. O ____ e o ____ pastarão juntos.\n\nResposta: O lobo e o cordeiro pastarão juntos.\n\n## 6. Quão frequentemente os salvos adorarão a Deus na Nova Terra?\n\n> Leia Isaías 66:22, 23. De um ____ a ____, virá toda a carne a adorar perante Mim, diz o Senhor.\n\nResposta: De um sábado a outro sábado (e de uma lua nova à outra).\n\n## 7. Para quem Deus preparou essa cidade?\n\n> Leia 1 Coríntios 2:9. Deus preparou esse novo lar para aqueles que O ____. Se desejo estar na Nova Terra, devo a cada dia ____ Jesus e obedecer aos Seus mandamentos.\n\nResposta: Para aqueles que O amam. Devo a cada dia amar (buscar) Jesus e obedecer aos Seus mandamentos.\n\n## 8. Qual é a marca daqueles que amam Jesus?\n\n> Leia João 14:15. Aquele que Me ama guardará os Meus ____.\n\nResposta: Os Meus mandamentos.\n\n## Recapitulação\n\nApós os mil anos, Deus criará um novo céu e uma nova Terra. Não haverá mais morte, desemprego, diferenças sociais, ódio, separações. A capital da Nova Terra será a Nova Jerusalém, cidade cercada com muros revestidos de pedras preciosas, e onde estará o trono de Deus e do Cordeiro. Nela entrarão os que têm o nome no livro da vida e amam a Jesus.\n\n## Compromisso de fé\n\n[ ] Creio que Jesus está preparando morada para mim.\n\n[ ] Desejo amá-Lo de todo o meu coração.\n\n[ ] Quero ter a marca daqueles que amam a Jesus."}, {"titulo": "Salvação pela graça", "refs": "Gênesis 6:8 · Atos 15:11 · Hebreus 9:22 · Atos 16:31", "conteudo": "A pergunta feita por Bildade, um dos amigos do patriarca Jó, traduz uma pertinente inquietação humana: “Como, pois, seria justo o homem perante Deus, e como seria puro aquele que nasce de mulher?” (Jó 25:4). E a realidade é que, sendo pecador, o ser humano não pode se tornar justo por si mesmo, nem obedecer aos justos requerimentos de Deus. Noutras palavras, não pode salvar-se por seus méritos. Estaria, então, o homem irremediavelmente perdido? Não. Felizmente, existe esperança. Cristo proveu um caminho de escape, e nós o encontramos descrito na Bíblia.\n\n## 1. Como ocorria a salvação, segundo o Antigo Testamento?\n\n> Leia Gênesis 6:8; 15:6; Salmo 6:4; 13:5; 86:15. A salvação, no Antigo Testamento, era unicamente pela ____.\n\nResposta: Pela graça (mediante a fé).\n\n## 2. De acordo com o Novo Testamento, como podemos ser salvos?\n\n> Leia Atos 15:11; Efésios 2:8; Romanos 3:24; 1 João 5:11-12. A salvação no Novo Testamento é pela ____.\n\nResposta: Pela graça.\n\nO plano de salvação do Antigo Testamento é continuado no Novo Testamento. Na Bíblia existe apenas um método de salvação (1 Pedro 1:18-20; Apocalipse 14:6; Gênesis 3:15).\n\n## 3. Que Jesus fez para nos salvar?\n\n> Leia Hebreus 9:22; Romanos 5:8. Jesus nos salva através de Sua ____ na cruz.\n\nResposta: Através de Sua morte (Seu sangue derramado) na cruz.\n\n## 4. Quais são os seis passos que confirmam a salvação?\n\n> Leia Atos 16:31; 4:12; 3:19; 1 João 1:9; Mateus 19:16, 17; Marcos 16:16; Mateus 24:13. 1º (At 16:31; 4:12): devo crer em ____ como meu Salvador. 2º (At 3:19): ____ e ____. 3º (1Jo 1:9): ____ os pecados. 4º (Mt 19:16, 17): seguir os ____. 5º (Mc 16:16): ser ____ por imersão. 6º (Mt 24:13): ser ____.\n\nResposta: 1º Crer em Jesus como meu Salvador. 2º Arrepender-me e converter-me. 3º Confessar os pecados. 4º Seguir os mandamentos. 5º Ser batizado por imersão. 6º Ser perseverante até o fim.\n\nPerseverar é continuar praticando o que aprendeu, é a capacidade de continuar, apesar dos obstáculos que encontramos. Devo perseverar na comunhão com Deus, através do estudo da Bíblia e da prática da oração.\n\n## Recapitulação\n\nA salvação em toda a Bíblia é pela graça. Para nos salvar, Jesus morreu na cruz. O primeiro passo que confirma a salvação é crer em Cristo. O segundo passo é arrepender-se e converter-se. O terceiro passo é a confissão dos pecados. O quarto passo é amar a Jesus e guardar os Seus mandamentos. O quinto passo é ser batizado por imersão, como foi Jesus. O sexto passo é ser perseverante, ou seja, continuar até o fim. Devemos perseverar na comunhão com Deus, pelo estudo da Bíblia e pela oração.\n\nOs adventistas do sétimo dia creem que: “Em infinito amor e misericórdia, Deus fez com que Cristo, que não conheceu pecado, Se tornasse pecado por nós, para que nEle fôssemos feitos justiça de Deus. Guiados pelo Espírito Santo, sentimos nossa necessidade, reconhecemos nossa pecaminosidade, arrependemo-nos de nossas transgressões e temos fé em Jesus como Senhor e Cristo, como Substituto e exemplo. Esta fé que aceita a salvação advém do divino poder da Palavra e é o dom da graça de Deus. Por meio de Cristo, somos justificados, adotados como filhos e filhas de Deus, e libertados do domínio do pecado. Por meio do Espírito, nascemos de novo e somos santificados; o Espírito renova nossa mente, escreve a lei de Deus, a lei de amor, em nosso coração, e recebemos o poder para levar uma vida santa. Permanecendo nEle, tornamo-nos participantes da natureza divina e temos a certeza da salvação agora e no juízo.” (Nisto Cremos, p. 168)\n\n## Compromisso de fé\n\n[ ] Aceito que a salvação só pode ser obtida pela graça de Cristo.\n\n[ ] Compreendi que aceitar a Cristo é: confessar e abandonar os pecados, seguir os mandamentos, ter a experiência do batismo e ser perseverante.\n\n[ ] Estou disposto a dar esses passos em minha vida."}, {"titulo": "O santuário de Deus", "refs": "Êxodo 25:8, 9, 40 · Hebreus 9:1-7 · Êxodo 29:38-42 · Levítico 23:27-31", "conteudo": "A fim de que possamos desfrutar plenamente os benefícios do evangelho, devemos entender a obra que Jesus fez por nós no passado, o que Ele faz agora e o que fará no futuro. Podemos compreender esse assunto, estudando o ritual do santuário terrestre dos israelitas, que prefigurava o atual ministério de Cristo no santuário celestial. É fundamental que entendamos o que a Bíblia ensina sobre o tema.\n\n## 1. Que pedido especial fez Deus a Moisés?\n\n> Leia Êxodo 25:8, 9, 40. E Me ____ um santuário, para que Eu possa ____ no meio deles. Vê, pois, que tudo faças segundo o modelo que te foi ____ no monte.\n\nResposta: E Me farão um santuário, para que Eu possa habitar no meio deles. Tudo segundo o modelo que te foi mostrado no monte.\n\n## 2. Como era o santuário?\n\n> Leia Hebreus 9:1-7; Êxodo 40 e responda: Como era o santuário?\n\nO santuário era dividido em dois compartimentos. O primeiro era o lugar santo, e o segundo, o lugar santíssimo. No lugar santo, o sacerdote realizava o trabalho diário (Hebreus 9:6), e continha uma mesa com pães, o candelabro e o altar de incenso (Êxodo 40:22, 24, 26). No lugar santíssimo, o sumo sacerdote entrava uma vez por ano, no Dia da Expiação, que caía no dia dez do sétimo mês (Hebreus 9:7). Ali se encontravam a arca da aliança, coberta de ouro, com as tábuas dos dez mandamentos, uma urna de ouro contendo o maná, e o bordão de Arão (Êxodo 40:20, 21; Hebreus 9:3, 4). Um véu separava esses dois compartimentos (Êxodo 26:33). À frente do lugar santo, ficava o pátio, no qual estavam o altar do holocausto e a pia em que os sacerdotes lavavam as mãos (Êxodo 40:29, 30). O santuário era móvel, cercado (Êxodo 40:33), e teve sua construção aprovada por Deus (Êxodo 40:34-38).\n\n## 3. Em que consistia o serviço diário?\n\n> Leia Êxodo 29:38-42. ( ) Oferecer dois cordeiros. ( ) Oferecer dois cavalos. ( ) Oferecer duas aves.\n\nResposta: Oferecer dois cordeiros, um pela manhã e outro à tarde.\n\nOs cordeiros sacrificados representavam Jesus que, na cruz, morreria pelos pecados humanos.\n\n## 4. Qual era a festa que dava fim ao ciclo anual das cerimônias?\n\n> Leia Levítico 23:27-31. ( ) Páscoa ( ) Pentecostes ( ) Expiação\n\nResposta: O Dia da Expiação.\n\n## 5. Em que consistia a purificação do santuário?\n\n> Leia Levítico 16. Marque V ou F: ( ) Acontecia o sacrifício diário, como nos outros dias. ( ) O sacerdote oferecia um bezerro e um cordeiro, por si e por sua família. ( ) Lançava sorte sobre os dois bodes. ( ) O sacrifício do bode era oferecido a Deus. ( ) O sangue do bode era aspergido no lugar santíssimo. ( ) Os pecados eram transferidos para o bode Azazel, que era enviado ao deserto.\n\nResposta: Todas são verdadeiras: o sacrifício diário continuava; o sacerdote oferecia primeiro por si e por sua casa (Levítico 16:3 fala em um novilho e um carneiro); lançava-se sorte sobre os dois bodes; o bode do Senhor era sacrificado e seu sangue aspergido no lugar santíssimo; e os pecados eram transferidos para o bode Azazel, enviado ao deserto.\n\nAtravés do sacrifício diário, os pecados eram transferidos simbolicamente do pecador arrependido para o santuário. Uma vez ao ano, realizava-se a limpeza ou purificação do santuário no Dia da Expiação, removendo os pecados para o deserto.\n\n## 6. Que acontecimento marcou a consumação do ritual do santuário terrestre, e que santuário está em funcionamento atualmente?\n\n> Leia Mateus 27:50, 51; Hebreus 8:1, 2. Eis que o ____ do santuário se rasgou em ____ partes de alto a baixo. Cristo hoje ministra no verdadeiro santuário que o Senhor ____, não o homem.\n\nResposta: O véu do santuário se rasgou em duas partes. Cristo ministra no verdadeiro santuário que o Senhor erigiu, não o homem.\n\nCom a morte de Cristo, o santuário terrestre perdeu sua função, pois a sombra deu lugar à realidade.\n\n## 7. Quais as evidências bíblicas de um santuário no Céu?\n\n> Leia Êxodo 25:40; Apocalipse 4:5; 11:19. Abriu-se, então, o santuário de Deus, que se acha no ____ e foi vista a ____ da aliança.\n\nResposta: Que se acha no Céu, e foi vista a arca da aliança.\n\nA exemplo do que ocorria no santuário terrestre, Jesus está realizando, em nosso favor, duas atividades no santuário celestial: intercessão (1 Timóteo 2:5; 1 João 2:1), simbolizada pelo serviço diário, e julgamento (João 5:22; Daniel 7:9, 10), representado pelo Dia da Expiação. Sempre que um pecador arrependido vai a Deus em nome de Jesus e pede perdão, Cristo intercede por ele no santuário celestial, aplicando em seu favor os méritos de Seu sacrifício na cruz. Mas, Ele também realiza o trabalho de juiz, neste momento. O próximo estudo esclarecerá esse tema.\n\n## Recapitulação\n\nO santuário terrestre foi feito segundo o modelo do santuário do Céu. Era dividido em dois compartimentos: santo e santíssimo. O sacerdote oferecia dois cordeiros: um pela manhã e outro à tarde. No Dia da Expiação, era feita a remoção dos pecados. Jesus, hoje, está atuando no verdadeiro santuário que existe no Céu.\n\n## Compromisso de fé\n\n[ ] Creio que existe um santuário no Céu.\n\n[ ] Reconheço que Jesus Cristo é o único mediador entre mim e Deus.\n\n[ ] Aceito-O como meu Salvador, a fim de que seja absolvido no julgamento final."}, {"titulo": "O Juízo", "refs": "Hebreus 8:1, 2 · Daniel 8:14 · Apocalipse 10:7-10 · João 5:22", "conteudo": "Um fato bíblico indiscutível é que todos os seres humanos, de todos os tempos, enfrentarão o julgamento de Deus. Disse Salomão: “Porque Deus há de trazer a juízo todas as obras, até as que estão escondidas, quer sejam boas, quer sejam más” (Eclesiastes 12:14). E Paulo confirma: “... pois todos compareceremos perante o tribunal de Deus” (Romanos 14:10). De que modo ocorrerá esse julgamento? Sob que critérios ele estará fundamentado? Quem é o juiz? Como podemos ser absolvidos? A Bíblia nos responde.\n\n## 1. Para onde foi Jesus, após Sua ascensão?\n\n> Leia Hebreus 8:1, 2; 9:24; Apocalipse 1:12, 13. Foi atuar como ministro do santuário e do ____ tabernáculo que o Senhor ____, e não o homem.\n\nResposta: Do verdadeiro tabernáculo, que o Senhor erigiu.\n\n## 2. Que profecia revela a data do início do Juízo?\n\n> Leia Daniel 8:14; 9:24-27. ( ) 1260 anos ( ) 1290 anos ( ) 1335 anos ( ) 2300 tardes e manhãs/anos\n\nResposta: A profecia das 2300 tardes e manhãs (anos).\n\n## 3. O que aconteceria no Céu e na Terra, no fim das 2300 tardes e manhãs?\n\n> Leia Apocalipse 10:7-10; 14:6, 7; 11:18, 19. Temei a Deus e dai-Lhe glória, pois é chegada a hora do Seu ____. E adorai Aquele que fez o céu, a Terra, o ____, e as fontes das águas.\n\nResposta: É chegada a hora do Seu juízo. Adorai Aquele que fez o céu, a Terra, o mar e as fontes das águas.\n\nNa Terra, Deus levantaria um movimento para restaurar verdades jogadas por terra (Isaías 58:12) e anunciar ao mundo a chegada da hora do Juízo. Aprendemos que, no santuário terrestre, uma vez por ano, no dia dez do sétimo mês (Dia da Expiação), o sacerdote entrava no lugar santíssimo para realizar a purificação do santuário. Da mesma forma, ao findar a profecia dos 2300 anos, em 22 de outubro de 1844, Jesus entrou no lugar santíssimo do santuário celestial, para ministrar como juiz.\n\n## 4. Qual é o papel de Jesus no julgamento?\n\n> Leia João 5:22; Daniel 7:9, 10. O Pai a ninguém ____. Mas ao Filho confiou todo o ____.\n\nResposta: O Pai a ninguém julga, mas ao Filho confiou todo o julgamento.\n\n## 5. Além de Juiz, qual é a outra função desempenhada por Jesus?\n\n> Leia 1 João 2:1. Temos um ____ que intercede por nós junto ao ____.\n\nResposta: Temos um Advogado junto ao Pai.\n\nO Juízo é realizado em três fases: a) “Investigação”: teve início em 1844 e terminará pouco antes da volta de Cristo (Daniel 8:14; 9:24-27). b) “Comprovação”: ocorrerá durante os mil anos (Apocalipse 20:4; 1 Coríntios 6:2). c) “Execução”: juízo final que ocorrerá após os mil anos (Apocalipse 20:7-10).\n\n## 6. O que Deus julgará?\n\n> Leia Eclesiastes 12:14. Marque V ou F: ( ) Somente as coisas boas. ( ) Somente as coisas más. ( ) Somente as coisas mais graves. ( ) Todas as coisas.\n\nResposta: Todas as coisas, até as que estão escondidas, boas ou más.\n\nO Juízo de Deus será estabelecido segundo a verdade que recebemos de Sua Palavra (Romanos 2:2).\n\n## 7. De que modo seremos julgados?\n\n> Leia Apocalipse 20:12. Conforme o que está escrito nos ____.\n\nResposta: Conforme o que está escrito nos livros, segundo as nossas obras.\n\n## 8. Quantos comparecerão perante o tribunal de Cristo?\n\n> Leia 2 Coríntios 5:10 e responda: Quantos comparecerão perante o tribunal de Cristo?\n\nResposta: Todos.\n\n## 9. Que devemos fazer para sermos aprovados no Juízo?\n\n> Leia Romanos 8:1. Nenhuma ____ há para os que estão em ____.\n\nResposta: Nenhuma condenação há para os que estão em Cristo Jesus.\n\n## 10. Qual é a norma pela qual seremos julgados?\n\n> Leia Tiago 2:10-12; Eclesiastes 12:13, 14. Seremos julgados pela ____.\n\nResposta: Pela lei da liberdade: os dez mandamentos.\n\n## Recapitulação\n\nApós Sua ascensão, Cristo foi atuar no santuário do Céu. A profecia que revela a data do Juízo é a das 2300 tardes e manhãs. A partir de 1844, Cristo, além de intercessor, atua como juiz. As três fases do Juízo são: 1) investigação, 2) comprovação e 3) execução. Deus vai julgar todas as coisas. Todos nós compareceremos perante o tribunal de Cristo. Não há nenhuma condenação para aqueles que estão em Cristo e guardam Seus mandamentos.\n\n## Compromisso de fé\n\n[ ] Desejo obedecer à Palavra de Deus e aos Seus mandamentos.\n\n[ ] Aceito Jesus como meu Salvador e O constituo meu advogado pessoal."}, {"titulo": "As leis na Bíblia", "refs": "Êxodo 21-22 · Hebreus 9:1-5 · Daniel 9:27 · Mateus 5:17", "conteudo": "Sábio, justo e amoroso como é, Deus estabeleceu leis para regulamentar a saúde dos relacionamentos de Seus filhos e sua conduta diante dEle. As leis não existem para tolher a liberdade saudável, mas para ampliar seu significado e aclarar seu sentido. À nação israelita foram dadas diversas leis, algumas das quais se cumpriram em Cristo e perderam seu valor para os dias de hoje. Para todos os que pretendem se tornar cidadãos da pátria celestial, também foi estabelecida a “lei da liberdade”. A Bíblia descreve essas leis.\n\n## 1. Que tipos de leis encontramos na Bíblia?\n\n> Leia Êxodo 21-22; Levítico 1-4; Levítico 11; Êxodo 20:3-17 e responda: Que tipos de leis encontramos na Bíblia?\n\na) Êxodo 21-22: leis civis, e leis de proteção para reger a nação de Israel. b) Levítico 1-4: leis cerimoniais, envolvendo sacrifícios e ofertas de animais, específicas para o santuário. c) Levítico 11: leis de saúde, para felicidade e bem-estar do ser humano. d) Êxodo 20:3-17: lei moral, que expressa o caráter de Deus, conhecida como lei dos dez mandamentos, escrita pelo dedo de Deus em duas tábuas de pedra (Êxodo 31:18). Não podemos confundir quem escreveu as leis, nem usar textos da lei cerimonial para explicar a lei moral ou vice-versa.\n\n## 2. A lei cerimonial estava relacionada com o santuário. Como era o santuário?\n\n> Leia Hebreus 9:1-5. Marque V ou F: ( ) O santuário era composto de duas partes: Santo e Santíssimo. ( ) O pátio era um lugar reservado para o povo. ( ) O ritual do santuário era regido pela lei cerimonial.\n\nResposta: Verdadeiro: o santuário tinha duas partes, Santo e Santíssimo, e seu ritual era regido pela lei cerimonial. O pátio era a área onde ficavam o altar do holocausto e a pia, e onde o povo trazia os seus sacrifícios.\n\n## 3. Com a morte de Cristo, o que ocorreria com a lei cerimonial?\n\n> Leia Daniel 9:27; Efésios 2:15; Colossenses 2:14. ( ) Continuaria em vigor. ( ) Seria cancelada. ( ) Essa lei nunca existiu.\n\nResposta: Seria cancelada: foi cravada na cruz.\n\n## 4. A Bíblia nos ensina claramente que a lei cerimonial foi abolida na cruz. Mas, que dizer da lei dos dez mandamentos?\n\n> Leia Mateus 5:17. Não penseis que vim revogar a ____ e os ____.\n\nResposta: Não vim revogar a Lei e os Profetas, mas cumprir.\n\n## 5. Qual foi a atitude de Jesus para com a lei moral?\n\n> Leia João 15:10; Tiago 2:10-12. Assim como também Eu tenho ____ os ____ de Meu Pai, e no Seu amor permaneço.\n\nResposta: Eu tenho guardado os mandamentos de Meu Pai.\n\n## 6. A fé em Cristo anula nossa obrigação de seguir os dez mandamentos?\n\n> Leia Romanos 3:31. ( ) Sim ( ) Não\n\nResposta: Não. Pela fé, confirmamos a lei.\n\n## 7. O que Jesus espera dos Seus seguidores?\n\n> Leia 1 João 2:6; 5:2, 3; Eclesiastes 12:13. A suma é: ____ e ____ os Seus ____, porque isto é o ____ de todo ____. Quando amamos a Deus, guardamos os Seus ____, que não são ____.\n\nResposta: A suma é: teme a Deus e guarda os Seus mandamentos, porque isto é o dever de todo homem. Quando amamos a Deus, guardamos os Seus mandamentos, que não são penosos.\n\n## 8. Quais são os benefícios da obediência aos mandamentos de Deus?\n\n> Leia Salmo 19:7-11. Alegria, restauração e grande ____.\n\nResposta: Grande recompensa (galardão).\n\nA obediência à lei de Deus não é a causa, mas é resultado da salvação. Não se guarda a lei para ser salvo, mas por estar salvo em Cristo Jesus. Quem está em Cristo recebe dEle poder para ser fiel. E o faz por amor (João 14:15; Gálatas 2:16; Romanos 3:31).\n\n## Recapitulação\n\nExistem quatro tipos de leis na Bíblia: 1) leis civis, 2) leis cerimoniais e 3) leis de saúde. Essas leis foram escritas por Moisés. O quarto tipo é a lei moral, escrita pelo dedo de Deus em duas tábuas de pedra. A lei cerimonial vigorou até a morte de Cristo. Jesus seguia os dez mandamentos. A fé não anula a lei; antes, a confirma. A obediência é o resultado da salvação e não a causa da salvação.\n\n## Compromisso de fé\n\n[ ] Aceito que a lei cravada na cruz foi a lei cerimonial e não a lei moral.\n\n[ ] Creio que Jesus está me guiando para conhecer toda a verdade.\n\n[ ] Quero, a partir de hoje, seguir os mandamentos de Deus."}, {"titulo": "A lei moral", "refs": "Êxodo 20:3-17 · Mateus 22:36-40 · Mateus 5:17, 18 · Malaquias 3:6", "conteudo": "A natureza está regida por leis. Astros seguem uma rota traçada pelo Criador; por causa das leis naturais, semeamos milho e colhemos milho, não arroz. O relacionamento do ser humano com seus semelhantes e com Deus é norteado pela lei moral, codificada nos dez mandamentos. Sem leis, a vida seria nada menos que um caos. Apesar disso, tentativas têm sido feitas para invalidar, alterar ou substituir a lei de Deus pelas tradições humanas. A pergunta para a qual buscaremos a resposta, neste estudo, é: Têm essas tentativas a autorização ou aprovação do autor da lei? Se não têm, são válidas? Qual deve ser nossa atitude em relação a elas?\n\n## 1. Quais são os dez mandamentos e quem é Seu autor?\n\n> Leia Êxodo 20:3-17; 31:18. ( ) Moisés ( ) Pedro ( ) Salomão ( ) Deus\n\nResposta: Deus, que os escreveu com o Seu dedo nas tábuas de pedra.\n\n## 2. Segundo Jesus, em quantas partes estão divididos os dez mandamentos?\n\n> Leia Mateus 22:36-40. A primeira parte: amor a ____; e a segunda, amor ao ____. Destes dois mandamentos dependem ____ e os ____.\n\nResposta: Duas partes: amor a Deus e amor ao próximo. Destes dois mandamentos dependem toda a Lei e os Profetas.\n\n## 3. Qual foi a atitude de Jesus em relação à validade dos mandamentos?\n\n> Leia Mateus 5:17, 18; 19:17; João 15:10. Marque V ou F: ( ) Confirmou ( ) Alterou, em parte ( ) Aboliu\n\nResposta: Jesus confirmou os mandamentos.\n\n## 4. Acaso, Deus permite mudanças em Sua Palavra ou nos mandamentos?\n\n> Leia Malaquias 3:6; Apocalipse 22:18, 19. ( ) Sim ( ) Não\n\nResposta: Não.\n\n## 5. O que Paulo escreveu sobre os mandamentos de Deus?\n\n> Leia Romanos 3:31; 7:12. Anulamos a lei pela fé? ____, de maneira nenhuma. Antes, confirmamos a ____. A lei é ____ e o mandamento ____, justo e bom.\n\nResposta: Não, de maneira nenhuma. Antes, confirmamos a lei. A lei é santa e o mandamento santo, justo e bom.\n\n## 6. O que, segundo a Bíblia, aconteceria no futuro com a lei de Deus?\n\n> Leia Daniel 8:12; 7:25. Marque V ou F: ( ) A verdade de Deus seria jogada por terra. ( ) Os dez mandamentos seriam alterados (mudariam os tempos e a lei). ( ) Os homens teriam a permissão de Deus para mudar os Seus mandamentos.\n\nResposta: Verdadeiro: a verdade seria jogada por terra e haveria a tentativa de mudar os tempos e a lei. Falso: Deus não deu permissão a ninguém para mudar os Seus mandamentos.\n\n## 7. O que os homens fizeram com a verdade de Deus?\n\n> Leia Romanos 1:25. ( ) Seguiram a verdade. ( ) Amaram a verdade. ( ) Mudaram a verdade em mentira.\n\nResposta: Mudaram a verdade de Deus em mentira.\n\n## 8. O que muitos seguem hoje em lugar dos mandamentos de Deus?\n\n> Leia Marcos 7:6-9, 13. ( ) Seguem tradições. ( ) Seguem mandamentos de homens. ( ) Seguem a Bíblia.\n\nResposta: Seguem tradições e mandamentos de homens.\n\n## 9. O que é mais importante para Deus?\n\n> Leia Atos 5:29; Tito 1:14. Antes importa obedecer a ____ que aos ____. Devemos rejeitar os mandamentos e as ____ de homens que nos desviam da verdade.\n\nResposta: Importa obedecer a Deus que aos homens. Devemos rejeitar as fábulas (tradições) e mandamentos de homens.\n\nUm Deus que ama sabe o que é melhor para Seus filhos. A lei é um guia de conduta que nos protege de dor e sofrimento em nossas relações. A obediência demonstra intimidade com Cristo, pois só Ele pode mudar nosso caráter e nossas inclinações. Por Seu Espírito, Ele nos capacita a obedecer, e escreve os princípios da lei em nosso coração (Jeremias 31:33).\n\n## Recapitulação\n\nOs dez mandamentos estão divididos em duas partes. A função da lei é revelar o pecado. Jesus obedeceu e nunca mudou nenhum dos mandamentos. A profecia sobre a mudança dos mandamentos está no livro de Daniel, capítulo 7, verso 25. A verdade foi jogada por terra. A lei de Deus é santa, justa e boa. Os homens transformaram a verdade de Deus em mentira. Hoje, muitos seguem tradições e mandamentos de homens.\n\n## Compromisso de fé\n\n[ ] Creio nos dez mandamentos como norma vigente para todos os cristãos.\n\n[ ] Rejeito as tradições e imposições de homens afastados da verdade.\n\n[ ] Desejo seguir todos os mandamentos de Deus."}, {"titulo": "O mandamento esquecido", "refs": "Êxodo 20:8-11 · Gênesis 2:1-3 · Êxodo 16:23 · Lucas 4:16, 31", "conteudo": "Alguns cristãos guardam o sábado como dia santo de culto e repouso. Outros guardam o domingo. Há quem santifique a sexta-feira e outros dias da semana. Em todos os casos, há pessoas sinceras que seguem o que lhes foi ensinado, sem nunca ter examinado o que Deus disse. É verdade que há, também, os que preferem esquecer justamente o que Ele mandou lembrar. A Bíblia, que é a Palavra de Deus escrita, é a autoridade máxima para responder à pergunta: Que dia devemos observar como santo?\n\n## 1. O que diz o quarto mandamento?\n\n> Leia Êxodo 20:8-11. Lembra-te do dia de ____ para o ____ porque, em seis dias fez o ____ os céus e a Terra, e ao sétimo dia ____; por isso abençoou o dia de ____ e o ____. O sétimo dia é o ____.\n\nResposta: Lembra-te do dia de sábado para o santificar, porque em seis dias fez o Senhor os céus e a Terra, e ao sétimo dia descansou; por isso abençoou o dia de sábado e o santificou. O sétimo dia é o sábado do Senhor teu Deus.\n\n## 2. Quem estabeleceu o sábado, quando e por quê?\n\n> Leia Gênesis 2:1-3; Marcos 2:27, 28. Deus estabeleceu o sábado, na ____, antes de entrar o ____ no ____. E fez isso para benefício do ____.\n\nResposta: Deus estabeleceu o sábado na criação, antes de entrar o pecado no mundo. E fez isso para benefício do ser humano: “o sábado foi feito por causa do homem”.\n\nAdão e Eva eram os únicos habitantes do mundo; portanto, o sábado existe desde antes do surgimento da nação judaica.\n\n## 3. Que dia Deus ordenou que fosse observado no tempo dos seguintes profetas?\n\n> Leia Êxodo 16:23; Isaías 58:13, 14; 56:4; Jeremias 17:24, 17; Ezequiel 20:12, 20; Neemias 13:15, 19. a) Moisés, cerca de 1500 a.C. (Êx 16:23). b) Isaías, cerca de 700 a.C. (Is 58:13, 14; 56:4). c) Jeremias, cerca de 600 a.C. (Jr 17:24, 27). d) Ezequiel, cerca de 600 a.C. (Ez 20:12, 20). e) Esdras e Neemias, 420 a.C. (Ne 13:15, 19).\n\nResposta: Em todos esses tempos, o dia ordenado foi o sábado.\n\nNo Antigo Testamento, não há nenhum texto indicando mudança do dia de guarda.\n\n## 4. Que dia foi observado por Jesus?\n\n> Leia Lucas 4:16, 31. ( ) Sábado ( ) Domingo ( ) Sexta-feira\n\nResposta: O sábado, “segundo o Seu costume”.\n\n## 5. Que dia guardavam os seguidores de Jesus?\n\n> Leia Lucas 23:53-56; Atos 13:14, 27, 42, 44; 17:2; 18:4. ( ) Sábado ( ) Domingo ( ) Sexta-feira\n\nResposta: O sábado, inclusive depois da morte e ressurreição de Jesus.\n\n## 6. Que dia os salvos guardarão na Nova Terra?\n\n> Leia Isaías 66:22-23. ( ) Sábado ( ) Domingo ( ) Sexta-feira\n\nResposta: O sábado.\n\n## 7. Podemos ignorar esse mandamento?\n\n> Leia Tiago 2:10-12; 1 João 2:4. ( ) Sim ( ) Não\n\nResposta: Não. Quem tropeça em um só mandamento se torna culpado de todos.\n\nÉ bom lembrar que a guarda do sábado não é um meio de se alcançar a salvação, que é obtida unicamente pela graça de Jesus. A obediência a Deus é resultado da salvação. Como alguém pode dizer que está salvo e viver em desobediência a Deus? A guarda do sábado é uma demonstração de amor a Deus e fruto da experiência pessoal com Ele.\n\n## Recapitulação\n\nO sábado foi instituído na criação do mundo. Ele foi observado por Adão e nos tempos dos seguintes profetas: Moisés, Isaías, Jeremias, Ezequiel, Esdras e Neemias. Jesus observava o sábado. Seus seguidores continuaram observando o sábado após Sua morte. Demonstramos amar a Jesus, seguindo os Seus mandamentos. Transgredir um mandamento significa violar toda a lei.\n\n## Compromisso de fé\n\n[ ] Creio que o sábado teve sua origem em um mundo sem pecado.\n\n[ ] Desejo observar o sábado como Jesus fazia.\n\n[ ] Preciso da ajuda de Deus para cumprir esse mandamento."}, {"titulo": "Do sábado para o domingo", "refs": "Mateus 28:1 · 2 Tessalonicenses 2:3, 4 · Deuteronômio 4:19 · Êxodo 16:22, 23", "conteudo": "Embora já tenhamos visto que o sábado é o dia bíblico de repouso, instituído por Deus, observado pelos crentes, nos dias do Antigo Testamento, bem como pelo próprio Jesus e Seus seguidores, nos tempos do Novo Testamento, a maioria dos cristãos, hoje, santifica o domingo. Quem fez ou autorizou a mudança? Tem ela o apoio das Escrituras? Neste estudo, essas questões serão esclarecidas.\n\n## 1. Quantos e quais são os textos bíblicos que falam do domingo?\n\n> Leia Mateus 28:1; Marcos 16:1, 9; Lucas 24:1; João 20:1, 19; Atos 20:7; 1 Coríntios 16:2 e responda: Quantos e quais são os textos bíblicos que falam do domingo?\n\nSão oito textos, e nenhum deles se refere ao domingo como dia de adoração. Na Bíblia, o símbolo da ressurreição de Cristo é o batismo e não o domingo (Romanos 6:3-8).\n\n## 2. O que ocorreria na igreja cristã antes da volta de Jesus?\n\n> Leia 2 Tessalonicenses 2:3, 4; Daniel 8:12. A verdade seria ____ por ____.\n\nResposta: A verdade seria lançada por terra.\n\nA igreja de Cristo passaria por um período de apostasia (abandono da verdade) e seria dominada por pessoas que não seguiriam a verdade, introduzindo nela costumes e práticas pagãos.\n\n## 3. Que prática era observada entre os pagãos nos tempos de Moisés?\n\n> Leia Deuteronômio 4:19; 17:2, 3. ( ) Adoração dos astros. ( ) Adoração a Deus. ( ) Adoração de animais.\n\nResposta: A adoração dos astros: o Sol, a Lua e as estrelas.\n\n## 4. Que costume havia entre o povo de Deus nos tempos de Moisés?\n\n> Leia Êxodo 16:22, 23; Atos 15:21. ( ) Observância do sábado. ( ) Adoração ao Sol. ( ) Adoração a imagens.\n\nResposta: A observância do sábado.\n\n## 5. Que hábito Jesus e o apóstolo Paulo tinham em comum?\n\n> Leia Lucas 4:16; Atos 17:2. ( ) Observar o sábado. ( ) Observar o domingo. ( ) Observar a sexta-feira.\n\nResposta: Observar o sábado.\n\n## 6. Como Jesus considera certas práticas cristãs que não têm fundamento bíblico?\n\n> Leia Marcos 7:6-8, 13. E em vão Me adoram, ensinando ____ que são preceitos de ____.\n\nResposta: Ensinando doutrinas que são preceitos de homens.\n\n## 7. Quem ordenou a guarda do domingo e quando isso ocorreu?\n\nFoi o imperador Constantino, no dia 7 de março do ano 321 d.C. A igreja romana adotou oficialmente a observância do domingo por volta do ano 364 d.C. (concílio de Laodiceia). Constantino era adorador do deus Sol. Converteu-se superficialmente, trazendo para a igreja cristã essa e outras práticas pagãs. “O Mandamento da Igreja determina e especifica a Lei do Senhor: Aos domingos e nos outros dias de festa de preceito, os fiéis têm a obrigação de participar da missa.” (Catecismo da Igreja Católica, Edições Loyola, 10ª edição, julho de 2000, p. 570).\n\n## 8. Quem instituiu a observância do sábado e quando isso ocorreu?\n\n> Leia Gênesis 2:1-3; Êxodo 20:8-11. ( ) Judeus, no Monte Sinai. ( ) Romanos, na Palestina. ( ) Deus, na criação.\n\nResposta: Deus, na criação.\n\n## 9. Quem deve ter prioridade em nossa obediência?\n\n> Leia Atos 5:29; Tito 1:14. Antes importa obedecer a ____. Não se importem com mandamentos de ____ desviados da ____.\n\nResposta: Importa obedecer a Deus. Não dar ouvidos a mandamentos de homens desviados da verdade.\n\nJesus é o centro de nossa adoração e serviço. Separou o sábado como dia especial de relacionamento com Ele. Ser fiel na observância do sábado é demonstrar amor a Jesus.\n\n## Recapitulação\n\nA palavra “domingo” não aparece na Bíblia e sim “primeiro dia da semana”. Constantino trouxe o domingo (dia do Sol) do paganismo e permanece até os dias de hoje. Os pagãos adoravam o Sol no primeiro dia da semana. O decreto de Constantino data de 7 de março do ano 321 d.C.\n\n## Compromisso de fé\n\n[ ] Creio que não existe base bíblica para a observância do domingo.\n\n[ ] Rejeito o domingo como dia do Senhor, porque é uma imposição humana.\n\n[ ] Confirmo o sábado como o verdadeiro dia de adoração a Deus em minha vida."}, {"titulo": "Princípios de saúde", "refs": "Gênesis 1:29, 30 · Gênesis 5:5, 8, 27 · Gênesis 9:3, 4 · Levítico 11:47", "conteudo": "A mensagem do Apocalipse nos chama a temer a Deus e dar-Lhe glória (Apocalipse 14:7). E entre as muitas maneiras de glorificar a Deus, o apóstolo Paulo inclui os hábitos de comer e beber (1 Coríntios 10:31). Assim, o cuidado da saúde física faz parte do crescimento espiritual. Sim, porque mente e corpo estão intimamente relacionados. Deus Se comunica conosco por meio do Espírito e imprime Suas verdades em nossa mente. Caso o corpo esteja debilitado, a apreensão e a compreensão dessas verdades certamente serão dificultadas. A Bíblia nos fornece princípios de saúde, extremamente necessários ao viver cristão.\n\n## 1. Que cuidado Deus teve para com o homem recém-criado?\n\n> Leia Gênesis 1:29, 30. O ser humano deveria ter uma ____ natural.\n\nResposta: Uma alimentação natural: grãos, sementes e frutas.\n\n## 2. Quanto tempo viviam os primeiros indivíduos, mesmo após o pecado?\n\n> Leia Gênesis 5:5, 8, 27. Adão viveu ____ anos. Sete viveu ____ anos. Matusalém viveu ____ anos.\n\nResposta: Adão viveu 930 anos. Sete viveu 912 anos. Matusalém viveu 969 anos.\n\nA obediência à lei de Deus e às leis de saúde produz longevidade e qualidade de vida.\n\n## 3. Quando Deus permitiu ao homem o uso de alimentação cárnea?\n\n> Leia Gênesis 9:3, 4. ( ) Após a entrada do pecado. ( ) Na criação. ( ) Após o dilúvio.\n\nResposta: Após o dilúvio.\n\nNoé sabia a diferença entre animais limpos e imundos (Gênesis 7:2).\n\n## 4. Mesmo permitindo o uso da carne, que orientações deu o Senhor?\n\n> Leia Levítico 11:47. Deus pediu para fazer ____ entre animais imundos e ____.\n\nResposta: Fazer diferença (separação) entre animais imundos e limpos.\n\n## 5. Quais são as características dos animais limpos?\n\n> Leia Levítico 11:2-12. O animal deve ____ e ter os cascos divididos em ____. Dos rios e mares, usar apenas os que têm escamas e ____.\n\nResposta: Deve ruminar e ter os cascos divididos em dois. Dos rios e mares, apenas os que têm escamas e barbatanas.\n\nO melhor plano de alimentação para o homem está em Gênesis 1:29, 30, e inclui grãos, frutas, verduras, legumes. Não devemos consumir carnes imundas nem seus derivados (bacon, presunto, salame, mortadela), bem como frutos do mar.\n\n## 6. O que a Bíblia fala sobre o uso de bebidas alcoólicas?\n\n> Leia Provérbios 20:1; 23:29-35. ( ) Permite moderadamente. ( ) Não permite. ( ) Deixa a nosso critério.\n\nResposta: Não permite: “o vinho é escarnecedor, e a bebida forte, alvoroçadora”.\n\n## 7. Por que Deus Se preocupa com a nossa alimentação?\n\n> Leia 1 Coríntios 6:19, 20. Nosso corpo é o templo do ____.\n\nResposta: Do Espírito Santo.\n\n## 8. O que Deus deseja para cada um dos Seus filhos?\n\n> Leia 3 João 2; Êxodo 15:26. Que tenhamos ____ e que nenhuma enfermidade venha sobre ____.\n\nResposta: Que tenhamos saúde (que tudo nos vá bem) e que nenhuma enfermidade venha sobre nós.\n\n## 9. Qual é a boa notícia de Deus para quem não conhecia o assunto que estudamos hoje?\n\n> Leia Atos 17:30; Tiago 4:17. Deus não leva em conta os tempos de ____.\n\nResposta: Os tempos da ignorância.\n\n## Recapitulação\n\nA Bíblia fala de animais limpos e animais imundos. O animal limpo rumina e tem o casco dividido em dois. O uso da carne foi tolerado após o dilúvio. Dos rios e mares, podemos usar somente o que tem escamas e barbatanas. Não faz parte do estilo de vida cristão usar bebidas alcoólicas. Nosso corpo é o templo do Espírito Santo. Por isso mesmo, o ideal é que voltemos ao regime alimentar original, prescrito por Deus, no Éden.\n\n## Compromisso de fé\n\n[ ] Reconheço que o meu corpo é o templo do Espírito Santo.\n\n[ ] Desejo fazer a minha parte para ter mais saúde.\n\n[ ] Quero a partir de hoje me alimentar de acordo com o ensino bíblico."}, {"titulo": "O dom de profecia", "refs": "Mateus 24:24 · 1 João 4:1 · 1 João 4:2 · Êxodo 15:20", "conteudo": "Antes da entrada do pecado no mundo, Deus e o homem se comunicavam face a face. Tendo caído em pecado, o ser humano perdeu esse privilégio, mas Deus não desistiu de manter contato com Seus filhos. Há muitas maneiras através das quais Ele fala. Uma delas é o ministério profético. O profeta Amós disse: “Certamente, o Senhor Deus não fará coisa alguma, sem primeiro revelar o Seu segredo aos Seus servos, os profetas” (Amós 3:7). Profetas são porta-vozes de Deus, especialmente dotados pelo Espírito Santo para essa tarefa. De acordo com a Bíblia, esse dom seria visto na igreja de Deus, nos últimos dias.\n\n## 1. Qual, diz a Bíblia, seria um dos sinais do fim?\n\n> Leia Mateus 24:24. Falsos ____ e falsos ____ que enganariam através de sinais e prodígios.\n\nResposta: Falsos cristos e falsos profetas.\n\n## 2. Como saber se um profeta é verdadeiro ou falso?\n\n> Leia 1 João 4:1. Devemos ____.\n\nResposta: Devemos provar os espíritos, se procedem de Deus.\n\n## 3. Quais as características de um profeta verdadeiro, segundo a Bíblia?\n\n> Leia 1 João 4:2; Mateus 7:15-23; Deuteronômio 18:21, 22; 13:1-3; Isaías 8:19, 20; Daniel 10:7-10. a) 1Jo 4:2: aceita a ____ de Cristo. b) Mt 7:15-23: manifesta ____ em sua vida. c) Dt 18:21, 22: cumprem-se as suas ____. d) Dt 13:1-3; Is 8:19, 20: vive em conformidade com a Bíblia e a ____ de Deus. e) Dn 10:7-10: suas visões são acompanhadas de fenômenos físicos.\n\nResposta: a) Confessa que Jesus Cristo veio em carne (aceita a encarnação de Cristo). b) Manifesta bons frutos em sua vida. c) Cumprem-se as suas profecias. d) Vive em conformidade com a Bíblia e a lei de Deus.\n\nSomente a presença de fenômenos físicos não é prova suficiente do verdadeiro dom de profecia, pois Satanás também opera sinais (Êxodo 7:9-12). O verdadeiro profeta deve apresentar todas as cinco características acima citadas.\n\n## 4. Que mulheres tiveram o dom de profecia na Bíblia?\n\n> Leia Êxodo 15:20; Juízes 4:4; Lucas 2:36; Atos 21:8, 9. Leia os textos e anote o nome de cada uma.\n\nResposta: Miriã (Êxodo 15:20), Débora (Juízes 4:4), Ana (Lucas 2:36) e as quatro filhas de Filipe (Atos 21:8, 9).\n\n## 5. Que igreja teria o verdadeiro dom de profecia?\n\n> Leia Apocalipse 12:17; 19:10 e responda: Que igreja teria o verdadeiro dom de profecia?\n\nNos últimos dias, o verdadeiro dom de profecia seria visto dentro da igreja que segue os mandamentos de Deus e tem o testemunho de Jesus, que é o espírito de profecia.\n\n## 6. Por que os adventistas do sétimo dia aceitam que o dom de profecia manifestou-se através do ministério de Ellen G. White?\n\na) Seus ensinos são fundamentados na Bíblia. b) Ela exalta a pessoa de Cristo. c) O cumprimento de suas profecias. d) Os frutos positivos em sua vida. e) Adventistas e não adventistas aceitam seus escritos como inspirados. f) Sua vida e seus ensinos estavam em conformidade com a Bíblia e a lei de Deus.\n\n## 7. Qual é a nossa segurança nos dias finais?\n\n> Leia 2 Crônicas 20:20; 1 Tessalonicenses 5:20. Crer no verdadeiro dom de profecia. Assim estaremos ____.\n\nResposta: Crede nos Seus profetas e prosperareis: estaremos seguros e prosperaremos.\n\n## Recapitulação\n\nNos últimos dias surgiriam falsos cristos e falsos profetas. Antes de rejeitar o dom de profecia devemos provar os espíritos, para saber se realmente procede de Deus. Várias mulheres receberam o dom de profecia. Esse dom se manifestaria na igreja que segue os mandamentos de Deus. A Igreja Adventista aceita esse dom manifestado através de Ellen G. White, em virtude de sua coerência em relação aos critérios bíblicos de avaliação profética.\n\n## Compromisso de fé\n\n[ ] Creio que estamos vivendo nos últimos dias.\n\n[ ] Aceito o dom de profecia manifestado na Igreja Adventista do Sétimo Dia.\n\n[ ] Desejo ler os livros escritos por Ellen G. White."}, {"titulo": "O dízimo", "refs": "1 João 4:9 · Deuteronômio 8:17, 18 · Gênesis 1:1 · Levítico 27:30", "conteudo": "Deus é o criador e mantenedor do Universo. De Suas mãos recebemos todas as provisões para a nossa sobrevivência material. Em Seu amor, e no processo de nos ajudar a desenvolver as virtudes de Seu caráter, tais como fidelidade e altruísmo, Ele nos fez administradores de Suas riquezas. E, numa sociedade singular, requer que Lhe devolvamos 10% dos bens que põe em nossas mãos, deixando a nosso encargo a administração sábia, judiciosa e fiel dos restantes 90%. Como a Bíblia ensina, essa parceria nos rende eternos dividendos.\n\n## 1. Como Deus manifestou Seu amor por nós?\n\n> Leia 1 João 4:9. ( ) Entregando-Se ( ) Negando-Se ( ) Castigando\n\nResposta: Entregando-Se: enviou o Seu Filho ao mundo para que vivamos por meio dEle.\n\n## 2. O que Deus fez por Seus filhos?\n\n> Leia Deuteronômio 8:17, 18 e responda: O que Deus fez por Seus filhos?\n\nResposta: Deu-nos força (capacidade) para adquirirmos riquezas e prosperarmos.\n\n## 3. Por que razão possui Deus direito sobre nós e nossos bens?\n\n> Leia Gênesis 1:1; Salmo 24:1; 50:10, 11. Marque V ou F: ( ) Porque é o Criador. ( ) Porque é o Mantenedor. ( ) Porque é o Redentor. ( ) Porque é interesseiro.\n\nResposta: Verdadeiro: porque é o Criador, o Mantenedor e o Redentor. Falso: Deus não é interesseiro.\n\n## 4. Que percentual de nossas rendas Deus reservou para que Lhe devolvêssemos como ato de adoração?\n\n> Leia Levítico 27:30. ( ) 5% ( ) 20% ( ) 10% ( ) 0%\n\nResposta: 10%, a décima parte.\n\nO percentual do dízimo (décima parte) foi determinado por Deus. Não podemos dar mais nem menos.\n\n## 5. Qual é o destino dos dízimos?\n\n> Leia Números 18:21; 1 Coríntios 9:14; Malaquias 3:10 e responda: Qual é o destino dos dízimos?\n\nResposta: O sustento dos que se dedicam ao ministério e à pregação do evangelho: “que haja mantimento na Minha casa”.\n\n## 6. O que Deus diz daqueles que retêm os dízimos e ofertas?\n\n> Leia Malaquias 3:8; Ageu 1:6. ( ) Aceita suas desculpas ( ) Não diz nada ( ) Reprova sua atitude\n\nResposta: Reprova sua atitude: “Roubará o homem a Deus?”\n\n## 7. Que promessas Deus faz aos que fielmente Lhe devolvem o dízimo?\n\n> Leia Provérbios 3:9, 10; Malaquias 3:10-12 e responda: Que promessas Deus faz aos que fielmente Lhe devolvem o dízimo?\n\nResposta: Abrirá as janelas do céu e derramará bênção sem medida; repreenderá o devorador; os celeiros se encherão com fartura.\n\nÉ importante lembrar que a motivação para devolução do dízimo a Deus não é conseguir bênçãos, mas expressar amor e prestar adoração a Ele como nosso criador e mantenedor.\n\n## 8. O que Deus espera de nós?\n\n> Leia 2 Coríntios 9:7; Atos 17:30. Marque V ou F: ( ) Fidelidade sistemática. ( ) Dar sempre com alegria e generosidade. ( ) Participar quando posso e quando quero.\n\nResposta: Verdadeiro: fidelidade sistemática e dar sempre com alegria e generosidade. Falso: participar só quando posso e quando quero.\n\n## Recapitulação\n\nDeus tem manifestado Seu amor por nós a cada dia. Somos administradores de Deus. De tudo quanto ganhamos 10% devem ser devolvidos a Ele. O dízimo é para a manutenção daqueles que pregam o evangelho. Deus espera de cada um de nós fidelidade sistemática e generosidade alegre.\n\n## Compromisso de fé\n\n[ ] Reconheço que Deus é o Criador e Mantenedor de todas as coisas.\n\n[ ] Quero ajudar na pregação do evangelho, sendo fiel nos dízimos.\n\n[ ] Estou decidido a devolver o dízimo de tudo o que o Senhor me der."}, {"titulo": "Ofertar, um ato de adoração", "refs": "Deuteronômio 16:16 · Malaquias 3:8 · Deuteronômio 16:17 · Êxodo 36:3", "conteudo": "No estudo anterior, aprendemos que o dízimo pertence a Deus. Ele o requer, e devolvê-lo nada mais é que dever de todos nós. Mas, precisamos ir além do dever, em nosso aprendizado de altruísmo e na busca da semelhança com Aquele que Se deu voluntariamente para nossa salvação. O cristão deve ser generoso e agradecido, diante das bênçãos que recebe das mãos de Deus. Ofertar é um dos modos mais expressivos desses sentimentos. E a Bíblia nos ensina a ofertar, também como ato de adoração.\n\n## 1. Que reconhecimento a pessoa demonstra ao ofertar a Deus?\n\n> Leia Deuteronômio 16:16; 1 Crônicas 29:13, 14. Reconhece que tudo vem de ____ e das Suas mãos Lho ____.\n\
