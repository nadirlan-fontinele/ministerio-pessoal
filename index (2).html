cer na velha vida.", "Sim. Quem não nasce da água e do Espírito não pode entrar no reino de Deus.", "Não. O batismo é invenção das igrejas e não é necessário."], "correta": 1, "grupo": "Lição 16 · O que Jesus ensinou sobre o batismo"}, {"pergunta": "Em nome de quem as pessoas devem ser batizadas? Mateus 28:19-20.", "opcoes": ["Em nome da igreja.", "Em nome do líder religioso.", "Em nome do Pai, do Filho e do Espírito Santo."], "correta": 2, "grupo": "Lição 16 · O que Jesus ensinou sobre o batismo"}, {"pergunta": "A partir de qual idade pode-se receber o batismo? Atos 22:16.", "opcoes": ["Recém-nascidos já podem ser batizados.", "Aos quatro anos de idade.", "Quando tiver idade para entender e aceitar o plano de salvação em Cristo Jesus."], "correta": 2, "grupo": "Lição 16 · O que Jesus ensinou sobre o batismo"}, {"pergunta": "O que Jesus deseja para cada um de nós? João 10:10.", "opcoes": ["Jesus não Se importa com nosso corpo, apenas com a vida espiritual.", "Jesus deseja que tenhamos vida em abundância.", "A “vida em abundância” mencionada por Jesus significa prosperidade financeira."], "correta": 1, "grupo": "Lição 17 · O que Jesus ensinou sobre o cuidado com o corpo"}, {"pergunta": "O que Paulo ensinou sobre o cuidado com nosso corpo? 1 Coríntios 6:19-20.", "opcoes": ["Somos livres para cuidarmos do corpo da forma como acharmos melhor.", "O corpo pertence a nós mesmos, não a Deus.", "O corpo é o templo do Espírito Santo."], "correta": 2, "grupo": "Lição 17 · O que Jesus ensinou sobre o cuidado com o corpo"}, {"pergunta": "Qual foi a alimentação que Deus ofereceu ao ser humano assim que o criou? Gênesis 1:29; 2:9", "opcoes": ["Apenas vegetais.", "Carne vermelha", "Peixes e mariscos."], "correta": 0, "grupo": "Lição 17 · O que Jesus ensinou sobre o cuidado com o corpo"}, {"pergunta": "O que Jesus deseja para cada um de Seus filhos? Êxodo 15:26; 3 João 2.", "opcoes": ["Deseja apenas a nossa saúde espiritual.", "Deseja que tenhamos saúde e que nenhuma enfermidade venha sobre nós.", "Jesus quer que gastemos todos os nossos recursos em médicos e remédios."], "correta": 1, "grupo": "Lição 17 · O que Jesus ensinou sobre o cuidado com o corpo"}, {"pergunta": "Qual o significado da dedicação de crianças? Salmo 127:3; Isaías 8:18.", "opcoes": ["Um compromisso assumido pelos pais de ensinar à criança o caminho de Deus.", "A dedicação dos filhos a Deus ocorre no batismo de recém-nascidos.", "A dedicação de uma criança não tem relação com os ensinamentos bíblicos."], "correta": 0, "grupo": "Lição 18 · O que Jesus ensinou sobre ritos e tradições"}, {"pergunta": "O que Jesus instituiu no lugar da Páscoa? João 13:4, 5, 15.", "opcoes": ["A circuncisão.", "A Santa Ceia.", "A ordenação."], "correta": 1, "grupo": "Lição 18 · O que Jesus ensinou sobre ritos e tradições"}, {"pergunta": "O que Cristo disse sobre o casamento? Mateus 19:4-6.", "opcoes": ["“O Criador, desde o princípio, os fez homem e mulher”.", "“Deixará o homem pai e mãe e se unirá à sua mulher”.", "Todas as alternativas estão corretas."], "correta": 2, "grupo": "Lição 18 · O que Jesus ensinou sobre ritos e tradições"}, {"pergunta": "Que funções Jesus designou para os discípulos? Marcos 3:14.", "opcoes": ["Concedeu riquezas e bens como incentivo à prática do ministério.", "“Designou doze para estarem com Ele e para os enviar a pregar”.", "Separou doze homens apenas para curar os doentes, não para pregar."], "correta": 1, "grupo": "Lição 18 · O que Jesus ensinou sobre ritos e tradições"}]},{"id": "est-mente-feliz", "titulo": "Mente Feliz", "descricao": "Guia de Estudo Bíblico da Escola Bíblica Novo Tempo, do Dr. César Vasconcelos, em 8 capítulos sobre ansiedade, tristeza, perdão, família, compulsões, corpo e mente, pensamentos e controle emocional.", "notaMinima": 7, "oficial": true, "licoes": [{"titulo": "Saída para a ansiedade excessiva", "refs": "Salmo 119:50 · Mateus 6:27 · João 16:33 · Jeremias 29:11 · 1 Pedro 5:7", "conteudo": "Gênesis 1 a 3 relata que Deus criou os primeiros seres humanos – Adão e Eva –, colocando-os no Jardim do Éden, onde eram felizes. Não havia neles angústia, tristeza, egoísmo e orgulho, sendo puros no caráter.\n\nO Criador do Universo disse que eles poderiam comer de toda árvore do Jardim, menos da árvore do conhecimento do bem e do mal, para não morrerem. Eles desobedeceram, comendo do fruto proibido. Não morreram imediatamente, mas seu corpo e mente foram danificados. Entraram em sua natureza a morte e a angústia, a “angústia existencial”, que atinge pessoas de todas as eras, classes sociais e econômicas e raças. Não foi um castigo de Deus, mas consequência da escolha errada de Adão e Eva. Deus não escondeu deles algo que lhes daria mais felicidade. O Senhor não queria que eles experimentassem o mal, a angústia, a dor e a morte.\n\nEsta angústia espiritual é fruto do afastamento de Deus (Isaías 59:1, 2) e da perda da semelhança com o caráter divino (Gênesis 1:26 e 27), pela entrada do pecado em nossa natureza. A solução definitiva para ela só ocorrerá na volta de Jesus, em breve, “quando este corpo corruptível se revestir de incorruptibilidade, e o que é mortal se revestir de imortalidade, então, se cumprirá a palavra que está escrita: Tragada foi a morte pela vitória” (1 Coríntios 15:54). Até lá, Deus sustenta quem O busca, estuda a Bíblia e ora para receber força para lidar com esta angústia.\n\n> Onde o salmista encontrava consolo para sua angústia? Salmo 119:50\n\nA Bíblia ajuda em sua angústia, quando você lê e medita no conteúdo dela, crendo que ela é a verdade. Veja: “A energia criadora que trouxe à existência os mundos, está na Palavra de Deus. Esta Palavra comunica poder, gera vida. Cada ordenança é uma promessa; aceita voluntariamente, recebida na alma, traz consigo a vida do Ser infinito. Transforma a natureza, cria de novo a alma à imagem de Deus” (Ellen G. White, Educação, p. 126). Agora, pense nesse texto: “A vida de Cristo, que dá vida ao mundo, acha-se em Sua Palavra.” (Ellen G. White, O Desejado de Todas as Nações, p. 270).\n\nQue maravilha é a Bíblia! Em Naum 1:9, última parte, lemos: “...não se levantará por duas vezes a angústia”. Como podemos aplicar esse texto? Podemos sugerir que essa existência é a primeira vez e que, ao Jesus regressar para fundar Seu reino de bondade, justiça e verdade, não mais existirá angústia a segunda vez!\n\nJesus Cristo experimentou angústia ao viver aqui por receber os pecados de toda a humanidade, tornando-Se nosso Salvador. Por isso, disse:\n\n“Agora, está angustiada a Minha alma, e que direi Eu? Pai, salva-Me desta hora? Mas, precisamente com este propósito vim para esta hora. Pai, glorifica o Teu nome” (João 12:27, 28).\n\nNinguém experimentou ou experimentará angústia como essa.\n\nComo seres humanos, possuímos angústia de origem espiritual e a de origem psicológica.\n\nA primeira, como comentado acima, envolve a falta da presença de Deus como existia antes da queda do Éden. A segunda, envolve conflitos emocionais no indivíduo e em seus relacionamentos variados. Esta angústia ou ansiedade de fonte psicológica pode ser piorada por maus hábitos físicos; ela pode ser exagerada e causar diferentes sofrimentos.\n\nAnsiedade excessiva se manifesta por preocupação exagerada, dificuldades com memória e concentração, impaciência, crises agudas de ansiedade, insônia, tensão muscular, inquietude, sensação de aperto no peito ou bolo na garganta. A ansiedade é uma resposta emocional diante do medo, da incerteza e do que ameaça o indivíduo.\n\nTodos têm ansiedade, mas não exagerada. É mais provável alguém desenvolver um transtorno de ansiedade: se houve experiências traumáticas, especialmente na infância, se há doença física grave, se parentes próximos têm ansiedade excessiva e se a pessoa nasceu com ansiedade traço, que é a que existe desde a infância, tendo base genética. Ansiedade estado é aquela que surge numa situação desafiadora ou estressante, como numa entrevista para trabalho ou numa prova difícil para o estudante. A ansiedade estado volta ao normal ao terminar o evento de estresse. ao terminar o evento estressante.\n\nAnsiedade é um sentimento de apreensão, um sintoma que revela algo que funciona mal na pessoa e precisa de reparo. Pode se manifestar como: ansiedade generalizada, que perturba o tempo todo; crises de pânico, quando há sensação de despersonalização ou de morte iminente, geralmente com a ideia de ter um ataque cardíaco; fobia, que é medo exagerado; ou como ansiedade social, quando há medo de se embaraçar ao se tornar o alvo das atenções; e a ansiedade de separação, quando se cria vínculos afetivos exagerados com pessoas importantes, e, depois, esses vínculos são rompidos.\n\nO ansioso precisa pensar que ele pode detectar o perigo, mas não tem como prever todo e qualquer risco; precisa lidar na vida com situações de perigo, mas considerar que nem todo perigo é uma catástrofe; e precisa pensar que não se consegue controlar tudo para evitar ansiedade excessiva.\n\nPessoas ansiosas podem ter intolerância para com a incerteza, quando a realidade revela muitas dúvidas. Então, para diminuir a ansiedade excessiva, aceite a realidade das incertezas e, junto disso, avalie se a preocupação que piora sua ansiedade tem utilidade.\n\n> Complete o texto e descubra como a ansiedade é inútil na solução dos problemas da vida. Mateus 6:27\n\nPreocupações inúteis travam a vida. Se você compreende que sua preocupação com algo é inútil, não permita que ela prenda você. Não a alimente, questione a preocupação e a enfrente, na força de Deus.\n\nSe você é muito ansioso por se preocupar demais, pode se acalmar, identificando o que é produtivo e o que é improdutivo na preocupação, abandonando o pensamento que não ajuda em nada. Desafie o pensamento criador de ansiedade, procurando entender o que, no fundo, produz este desconforto mental. Aceite as perdas e os fracassos e siga em frente, vendo o que aprendeu com a situação, para não repetir os mesmos erros no futuro.\n\nEnfrente situações que produzam medo e ansiedade, com a ajuda de Deus, familiares e amigos e, com a determinação de encará-las com humildade, siga em frente, pois Deus sempre o ajudará a passar por elas.\n\n> Que conselho Jesus faz a todos nós, em João 16:33?\n\nMuitos ansiosos têm uma percepção exagerada de perigo e se sentem incapazes de enfrentar o que para eles é ameaçador, tendo tendência de interpretarem reações normais do corpo como perigosas, fazendo surgir pensamentos indesejados de incerteza, ameaça e medo. Para o alívio de sua ansiedade no nível cognitivo, analise se suas crenças psicológicas ou pensamentos automáticos são verdadeiros, se representam ameaças reais ou imaginárias. Isto é psicoeducação, que alguns conseguem sozinhos, outros, com psicólogo, aprendendo a lidar com pensamentos trágicos, substituindo-os por pensamentos saudáveis e aprendendo como administrar as emoções.\n\nFalar ajuda na diminuição da dor emocional, pelo desabafo do sofrimento. Avaliar o que você pensa melhora a autoconsciência, o que pode auxiliar no combate da ansiedade excessiva, e ajuda a observar se existem pensamentos distorcidos e catastróficos. Questione pensamentos que o fazem crer que todos estão contra você, entre outras distorções cognitivas. Sua ansiedade pode diminuir, ao tratar a si mesmo com compaixão, em vez de se atacar ou depreciar por qualquer coisa que não seja perfeita em si e em sua vida.\n\n> Que pensamentos Deus tem a nosso respeito? Jeremias 29:11\n\nCultive pensamentos de paz e questione crenças erradas sobre a ansiedade como estas:\n\n“Eu não devia sentir ansiedade!” – a verdade é que, ao se sentir ameaçado, a mente liga o alarme, surgindo a ansiedade.\n\n“Eu deveria ter vergonha de minha ansiedade.” – não há nada de vergonhoso na ansiedade. Você teria vergonha de estar com febre?\n\n“Minha ansiedade é um tipo de insanidade.” – não, ela é um mecanismo de defesa.\n\n“Minha ansiedade é perigosa.” – ela é desagradável, mas não perigosa. Ela é resultado de pensamentos ansiosos, que não têm poder sobre você, a não ser que você permita.\n\n“Preciso me livrar logo da ansiedade.” – não precisa! Aprenda a conviver com ela e aceitá-la, e ela diminuirá. Sua ansiedade pode estar indicando que você, talvez, precise ser assertivo, se tratar melhor, colocar limites, não pegar pesado consigo mesmo e confiar mais em Deus.\n\nNa ansiedade grave, pode ser preciso medicação temporária prescrita por um médico. Adotar dieta vegetariana, por exemplo, ajuda muito, bem como praticar atividades físicas ao ar livre, evitar cafeína, bebidas alcoólicas e outras drogas, dormir bem à noite, hidratar o corpo com água pura, receber apoio de amigos e parentes e cultivar a espiritualidade.\n\n> Que convite precioso Deus nos faz, em 1 Pedro 5:7?\n\nVeja que Deus, em outro lugar na Bíblia, nos anima a lidar com nossa ansiedade: “Não andeis ansiosos de coisa alguma; em tudo, porém, sejam conhecidas, diante de Deus, as vossas petições, pela oração e pela súplica, com ações de graças” (Filipenses 4:6). Faça isso, diariamente, e Ele ajudará sua ansiedade a diminuir.\n\n## Minha decisão\n\n[ ] Decido entregar todas as minhas lutas, angústias e dificuldades a Deus. Descansarei nEle, desfrutarei da paz e suavidade de espírito que só Ele oferece."}, {"titulo": "Por que estou tão triste assim?", "refs": "Salmo 13:2 · Filipenses 4:8 · Atos 20:35 · Isaías 43:2 · Salmo 103:3", "conteudo": "Ao viver na Terra, Jesus era alegre, sentia tristeza, chorava em alguns momentos, mas nunca ficou deprimido. Por outro lado, pessoas de Deus mencionadas na Bíblia tiveram momentos depressivos.\n\n> Que pergunta Davi fez, no Salmo 13:2?\n\nNaquele momento, Davi lutava com a tristeza, mas fez o que a Bíblia recomenda e ficou bem. Ele desabafou com Deus, e o resultado foi: “No tocante a mim, confio na Tua graça; regozije-se o meu coração na Tua salvação. Cantarei ao Senhor, porquanto me tem feito muito bem” (Salmos 13:5, 6). Fale com o Senhor, em oração, sobre sua tristeza, e Ele responderá. “Pedi, e dar- -se-vos-á” (Mateus 7:7).\n\nDiferentes tipos de perdas nos deixam tristes, e isso é normal, podendo durar poucos dias ou semanas, sem precisar de tratamento. Se houver demora em recuperar da tristeza; se a produtividade cair por perda da energia; se pensamentos negativos tomarem conta a mente, surgindo ideias de morrer e de se matar; e se houver perda de prazer por coisas que davam satisfação, então, cabe ser avaliado por um médico psiquiatra.\n\nO médico Lucas, autor de um dos quatro Evangelhos e do livro de Atos, escreveu que os discípulos de Jesus, no Getsêmani, em vez de orarem como Ele havia recomendado para enfrentar as tentações, dormiram por causa da tristeza, ao verem o Mestre angustiado, antes de ser preso, torturado e crucificado. Lucas escreveu: “Levantando-Se da oração, foi ter com os discípulos, e os achou dormindo de tristeza” (Lucas 22:45). A tristeza, em deprimidos, os leva a dormir demais, ou a ter insônia.\n\nFator gatilho é um evento que favorece o surgimento de dor emocional, porque toca na ferida que já existe na sua mente e dispara a dor mental. Quando perdas importantes ocorrem na sua vida, você pode ficar com uma marca negativa na mente, e, quando algum fator gatilho acontece anos depois, a depressão pode surgir ou voltar. Por isso, esteja atento aos fatores gatilhos que podem disparar pensamentos e sentimentos dolorosos.\n\nA tendência de cultivar pensamentos de queixas, pessimismo, derrota, desprezo pessoal e desesperança favorece o surgimento da depressão. Veja o que Deus recomenda sobre a qualidade de nossos pensamentos.\n\n> De acordo com Filipenses 4:8, o que deve ocupar o nosso pensamento?\n\nSe você sempre cultiva pensamentos e crenças negativas sobre sua pessoa, sobre a vida e sobre confiar nos outros, predominando em sua mente a falta de esperança para encontrar saídas para dificuldades, você está mais propenso a ter um estado depressivo do que a pessoa otimista. O deprimido, ao perceber seu jeito pessimista de pensar, deve resistir a isto e cultivar pensamentos de gratidão, otimismo realista, compaixão e perdão. Isto é importante na recuperação da depressão, porque a maneira como você interpreta o que acontece é mais importante do que o que realmente acontece.\n\nOutro fator causador de depressão é colocar ênfase exagerada sobre seu valor pessoal, no que acontece nos seus relacionamentos e em conquistas gerais. Quando surgem problemas, como perda financeira ou divórcio, você pode entrar em depressão, porque havia colocado sua base de valor pessoal fora de si mesmo, em outra pessoa ou em alguma aquisição externa. Nestes casos, evitar centrar seu autorrespeito e autovalorização em objetos, aquisições acadêmicas e econômicas ou em relacionamentos pode ajudar.\n\nUm bom número de indivíduos desenvolve depressão, porque não conseguindo o amor e a aceitação de pessoas importantes na vida delas, passam a se sentir cheias de falhas e indignas de receber afeto. Algumas se tornam exigentes em receber atenção, sendo isso uma armadilha que favorece o estado depressivo, porque nem todos podem dar atenção o tempo todo. A pessoa não recebendo tudo o que queria, pode se depreciar e deprimir, em vez de olhar a realidade e pensar que as pessoas ao redor não são responsáveis pelo que faltou a elas na infância e não podem oferecer tudo e o tempo todo o que elas desejam em termos de carinho, atenção e elogios. Nestes casos, lute para evitar manter em sua mente estes desejos idealizados, entendendo que você é amado por alguns, mesmo não recebendo amor ideal.\n\nDiminua as expetativas de receber atenção e carinho dos outros e ofereça amor.\n\n> De acordo com Atos 20:35, que palavras de Jesus devemos recordar?\n\nExperiências traumáticas, ao longo da infância, aumentam o risco de surgir depressão na vida adulta. Isso inclui: a criança ser vítima de abusos; ter sofrido doenças que exigiam hospitalizações; divórcio dos pais; e morte especialmente da pessoa com quem ela tinha mais apego; e isso tudo acontecendo nos primeiros anos de vida. Mas isso não obriga a pessoa a se tornar deprimida.\n\nAlguém pode dizer que passou a ter depressão desde que algo desagradável aconteceu na sua vida adulta. Mas este fato doloroso pode ser o fator desencadeador da depressão, não o causador. Sofrimentos na infância, morte de queridos, perda do emprego, morar em local de violência e dificuldades conjugais tudo isso se acumula, e pode surgir a depressão disparada por um evento traumático atual.\n\nPara evitar entrar em depressão, ajuda muito ter parentes e amigos que apoiam, atividades físicas regulares, alimentação saudável, eliminação de substâncias tóxicas para o cérebro, ingestão de água pura, exposição ao sol, fé religiosa e sentido positivo e altruísta na vida.\n\n> Que certeza Deus nos dá ao passarmos pelas tormentas da vida? Isaías 43:2\n\nAlguns deprimidos podem estar vivendo situações difíceis parecendo não haver solução. Nestes casos, existe dificuldade real que pode produzir falta de esperança.\n\nA própria pessoa ou alguém pode ajudar, lembrando de situações do passado dela que pareciam insolúveis, mas que houve jeito, ou relembrar que os acontecimentos que não tiveram boa solução foram enfrentados, e a pessoa seguiu adiante.\n\nO que pensamos produz o que sentimos, e o que sentimos produz o que fazemos. Tudo começa no pensamento. Se ele for distorcido, precisa ser corrigido, porque influencia o sentimento que você vai experimentar. Tomar remédio para melhorar o sentimento doloroso sem mudar o pensamento pessimista, trágico e autodepreciador não resolve o problema básico. Por isso, Deus ordena:\n\n“...Transformai-vos pela renovação da vossa mente...” (Romanos 12:2).\n\nRaciocine: “Que pensamento causou este meu sentimento?”; “O que aconteceu comigo que me fez pensar algo ruim e me fez sentir mal?”; “Cultivo uma forma de pensar negativa que me deprime?” Constatando que você pensa muito negativo, escolha pensamentos de gratidão, de esperança e de significado nobre da vida e os cultive daqui para a frente.\n\nAo romper um relacionamento importante na sua vida, sua mente reage com tristeza, podendo ser tristeza normal ou podendo evoluir para uma depressão. Este estado forte de tristeza, desânimo e perda de prazer na vida pode afundar você mais ainda; pode deixá-lo num estado crônico de melancolia, ou conduzi-lo a pensar nas circunstâncias da perda e analisar a situação; pode fazer você buscar entender o que houve que machucou seu emocional; e pode levar você a examinar se existe exagero na ligação afetiva com a pessoa ou objeto que você perdeu por morte, afastamento, fim de relacionamento, problema econômico entre outros.\n\n> Que certeza temos, em Salmo 103:3?\n\nSe a depressão se prolonga, mesmo após o uso de medicamentos, isto pode significar que você ainda não chegou na compreensão das causas mais importantes dela para aprender a lidar com a dor. Quando houver compreensão das causas, consciência para perdoar, inclusive a si mesmo, aceitação das perdas e melhora da resistência diante da tristeza, o alívio surge. Deus ajuda o deprimido passo a passo para ele sair da depressão, seja através de ajuda profissional ou da forma que Ele achar melhor para a pessoa.\n\nNão é porque você está deprimido que o Senhor o abandonou. Ezequiel, um profeta de Deus, certa vez estava triste, amargurado e disse: “Então, o Espírito me levantou e me levou; eu fui amargurado ...; mas a mão do Senhor se fez muito forte sobre mim” (Ezequiel 3:14).\n\nNão é o seu sentimento que prova que Deus o está ajudando, mas é a sua necessidade. Ele está aí agora procurando restaurar sua saúde mental. Abra seu coração a Ele e deixe a luz curadora do Céu entrar. Deus sustenta sua vida física e mental e promete que, ao Jesus voltar em breve, vai estabelecer um mundo sem perdas, decepções e tristeza. Você poderá viver num lugar de justiça e alegria o tempo todo. Jesus disse: “Assim também agora vós tendes tristeza; mas outra vez vos verei; o vosso coração se alegrará, e a vossa alegria ninguém poderá tirar” (João 16:22). Olhe com fé para cima!\n\n## Minha decisão\n\n[ ] Confiando nas promessas de Deus, decido confiar a Ele minhas tristezas e dores, na certeza de que Ele está ao meu lado para me confortar e sustentar."}, {"titulo": "Ideias para perdoar", "refs": "1 Pedro 2:21 · Mateus 26:39 · Isaías 43:25 · Mateus 6:12 · Colossenses 3:13", "conteudo": "Operdão está relacionado à boa vontade de dizer adeus ao ressentimento, à indiferença e à atitude de julgamento para com alguém que machucou você injustamente. Ele o leva a praticar compaixão, bondade e até amor por quem o feriu. O perdão não finge que não teve dor no passado, mas ajuda a evitar levá-la para o futuro.\n\nDeus nos ajuda a aprender a lidar, construtivamente, com perdas. “Perto está o Senhor dos que têm o coração quebrantado e salva os de espírito oprimido” (Salmo 34:18).\n\nO perdão não muda necessariamente a pessoa que errou e foi perdoada. Em alguns casos excepcionais de perdão, o ofensor pode decidir mudar para melhor pelo impacto positivo exercido sobre sua consciência como reação ao perdão imerecido recebido.\n\nMas há pessoas que não se importam se são ou não perdoadas. Continuam seus erros com frieza para com a justiça, a verdade e o bom senso, com arrogância, ironia e sem o mínimo sentimento de remorso. Repetem os erros porque querem satisfazer seus desejos de qualquer maneira. O perdão não muda este tipo de pessoa enquanto ela não estiver interessada nele.\n\nNestes casos, a mente adoecida não se preocupa com o perdão que é oferecido pela vítima a quem ela machucou, mas em ter o que quer, custe o que custar. O perdão oferecido gratuitamente pode ser um ingrediente importante para que a pessoa ofensiva, em algum momento, reflita sobre seus erros, os reconheça, admita que errou, aceite o perdão e obtenha serenidade; tudo isso é fruto de uma mente que está ficando saudável. Perdoar é um ato de fé, porque você pode perdoar baseado na crença de que Deus é melhor juiz do que você. Assim, o desejo de vingança é deixado de lado, e você deixa nas mãos de Deus para Ele fazer justiça. Só o Criador do Universo sabe como equilibrar perfeitamente justiça com misericórdia.\n\n> Que exemplo nos deixou Jesus quando era ultrajado e maltratado? 1 Pedro 2:21\n\nO perdão não é de graça, no sentido dele não livrar a pessoa dos resultados de seus atos. O povo de Israel foi perdoado, porém, do total de aproximadamente 600 mil homens, sem contar mulheres e crianças, que andaram pelo deserto após saírem do Egito, só dois entraram na Terra Prometida. Havia um preço para entrar em Canaã. O teólogo e escritor Miguel Núñez explica: “Aquele que maltrata outra pessoa física, sexual ou psicologicamente, tem de assumir as consequências de seu ato; caso contrário, o perdão não terá sentido nem significado. Perdoar não é passar por alto as consequências das agressões. Isto é injustiça. O perdão bíblico é sempre um ato realizado num contexto de justiça. Em nenhuma parte, é um ato isento de responsabilidade. Seria confundir perdão com impunidade, e não é isso o que a Bíblia apresenta. Mas é importante entender que o perdão tem seu tempo de desenvolvimento, é pessoal e, em muitos casos, um milagre” (Miguel Ángel Núñez, Ph.D., Violência e Perdão, p. 32, Sinais dos Tempos, da série “Quebrando o Silêncio”).\n\nO perdão promove a cura da pessoa que o oferece de graça. Evita a continuidade da mágoa. O ressentimento perpetua a dor, e o perdão termina com ela. Muitas pessoas poderão melhorar sua saúde mental se e quando praticarem o perdão, inclusive por si mesmas.\n\n> Que pedido Jesus fez ao Pai, no jardim do Getsêmani? Mateus 26:39\n\nPagando o preço da nossa culpa, Jesus sentiu o peso de perdoar e chegou a pedir ao Pai para que afastasse o cálice que Ele devia tomar como prova do perdão para com a humanidade. O perdão oferecido por Ele envolveu experimentar uma angústia que nunca sentiremos igual. Uma angústia que O fez suar sangue, receber cuspe no rosto, chicotadas, tapas, socos, pregos nas mãos e pés, coroa de espinhos da cabeça e, finalmente, a morte numa cruz.\n\nMuitas vezes, o perdão coloca quem perdoa no mesmo barco de quem errou, e podemos perceber que não somos tão diferentes do culpado como pensamos, porque o potencial para a maldade está dentro de todos nós. Simão foi um personagem bíblico curado da lepra por Jesus, que O convidou para uma refeição em sua casa. Uma mulher, Maria, sabendo que Jesus estava em casa de Simão, foi até lá e manifestava gratidão por Jesus. Simão ficou incomodado por Ele permitir ser adorado por uma pecadora, em vez de a rejeitar. Por não ter sido ainda plenamente convertido, Simão não entendeu que Deus age com ternura, compaixão e misericórdia. Então, Jesus contou uma parábola a Simão que dizia que um credor tinha dois devedores. Um devia muito mais do que o outro. O credor perdoou a dívida de ambos. Jesus, então, perguntou a Simão: “Qual deles amará mais o credor?”, e ele respondeu: “Aquele que foi mais perdoado.” Jesus, então, o elogiou dizendo: “Você julgou bem!”\n\nSimão ficou constrangido, porque julgava e desprezava Maria por ela ser uma pecadora. Jesus queria mostrar que os erros de Simão eram piores que os de Maria, mas ambos haviam sido perdoados por Deus. E disse a Simão, apontando para Maria que demonstrava amor pelo Mestre: “... aquele a quem pouco se perdoa, pouco ama” (Veja este relato em Lucas 7:36 a 50).\n\n> O que Deus promete fazer com nossas transgressões e pecados? Isaías 43:25\n\nQuem perdoa esquece? Não! Primeiro lembra, pensa no que houve e não finge que não doeu ou que não está doendo. Admite o fato, sente a dor, a raiva ou tristeza, expressa isso de forma saudável e depois, aí sim, esquece porque passou pelo processo do perdão.\n\nNo perdão relacionado com adultério, se o cônjuge que traiu desejar reconciliação, precisa aceitar a responsabilidade pelo ocorrido, manifestar sincero pesar e arrependimento, oferecer alguma recompensa, prometer não repetir o mesmo erro e pedir perdão. O verdadeiro arrependimento tem de mudar o comportamento daquele que diz estar arrependido.\n\nTraidores, muitas vezes, querem uma reconciliação rápida, após admitirem a besteira que fizeram. Mas, precisam entender que agora há um preço natural a ser pago pelos seus atos. No caso de adultério, o cônjuge traído ficou machucado e seus sentimentos ficaram, no mínimo, confusos. E isto pode gerar afastamento, distância afetiva, que provoca solidão no casal.\n\nO preço que o culpado arrependido precisa pagar é enfrentar sua solidão e angústia e esperar pelo tempo que o outro necessitará para ter a ferida curada. Isto pode ser o vale da sombra da morte para o ofensor, porque o ofendido também estará no mesmo tipo de vale, pela perda da confiança num tipo de relacionamento humano em que a confiança é como o oxigênio para se viver. A cura da dor tem um ritmo, um processo e um tempo.\n\n> Que condição Jesus apresenta para que nossos pecados sejam perdoados? Mateus 6:12 e 15\n\nVocê pode perdoar uma pessoa, e, tempos depois, a ferida ainda pode estar na sua memória, não sendo curada fácil e rapidamente. Perdoar pode ser mais difícil do que as palavras dizem. Veja que na palavra “perdoar” tem a parte que diz “doar”. Você doa, de graça, algo a alguém que não merece. Ou você, sendo culpado, recebe o que não merece, o perdão. Há circunstâncias nas quais, talvez, tenhamos de perdoar várias vezes.\n\nEm alguns casos, o perdão não fornece reconciliação, porque o ofensor pode não se interessar pela humilhação necessária para tratar a ferida, ou porque foi longe demais em sua transgressão. Deus teve de destruir os antediluvianos, porque eles não aceitaram o perdão e chegaram a um ponto de não- -volta, de não-arrependimento, de não-perdão. Eles queriam prazer, mas não perdão, porque ficaram movidos pelas emoções, dominados pelos demônios da vaidade, da carnalidade e da mundanidade.\n\n> Como Deus diz que devemos perdoar uns aos outros? Colossenses 3:13\n\nO perdão é um ato da vontade, a qual pode entrar em ação sem depender da emoção do momento. Será que escolher perdoar elimina os sentimentos de dor? Dia a dia, Deus vai curando você destas emoções difíceis. O tempo ajuda na cura. Mas nessa cura pode haver (e em geral há) mudanças profundas no relacionamento entre os envolvidos. Uma pessoa traída pode precisar de longo tempo de restauração emocional para se recompor da tragédia e voltar a viver com serenidade. Um coração partido não se recupera rápido com qualquer curativo religioso ou não.\n\nO perdão cura a pessoa que perdoa e fornece a chance de curar o relacionamento. Medite nesse texto: “Antes, sede uns para com os outros benignos, compassivos, perdoando-vos uns aos outros, como também Deus, em Cristo, vos perdoou” (Efésios 4:32).\n\n## Minha decisão\n\n[ ] Compreendendo o poder que o perdão tem para curar, decido buscar em Deus a graça de perdoar quem tem me ofendido e magoado."}, {"titulo": "Resolução de problemas conjugais e familiares", "refs": "Provérbios 15:1 · Efésios 4:31 · Gálatas 5:22 · Efésios 6:4 · Efésios 4:26", "conteudo": "Precisamos olhar as dolorosas experiências que vivemos no passado a fim de prevenir que repitam, especialmente, na família. Levamos para dentro do casamento o que aprendemos de bom e de ruim em nossa família de origem. Não há como apagar as influências negativas do passado para que elas não interfiram no casamento. Quanto mais cedo cada cônjuge entender o que trouxe de bom e de ruim para o matrimônio e o que foi aprendido na família onde cresceu, mais fácil será encontrar soluções para as crises conjugais.\n\nPor exemplo, se o marido vem de uma família com muita comunicação e se casa com uma esposa vinda de uma família com pouco contato entre os integrantes de sua respectiva família, isto afeta a ambos, porque o marido vai querer ter muita gente em volta, e a esposa pode preferir mais privacidade, menos pessoas em casa. Discutir sobre esta e outras diferenças é importante porque oferece uma oportunidade positiva de compreensão e crescimento, entendendo que o casamento é uma união de duas pessoas diferentes em vários aspectos.\n\n> Complete o texto a seguir e veja a importância de dominarmos nossas palavras. Provérbios 15:1\n\nO diálogo ajuda na resolução de crises conjugais. Cada um deve expor o que incomoda, até que fique claro o que queria dizer. Quando o casal for conversar para resolver problemas do relacionamento, se um estiver muito nervoso, é melhor se acalmar para depois conversar. A conversa visando resolver conflitos entre o casal deve ser feita focando em seu sentimento. Fale dos sentimentos que surgem dentro de você com o que a pessoa fez ou tem feito. Não ataque a pessoa, mas explique o que ela faz que prejudica o relacionamento. Ao falar, diga o que realmente você quer dizer, dê um sentido claro ao que falar, mas evite dizer de forma agressiva.\n\n> De acordo com Efésios 4:31, o que deve ser banido de nossos relacionamentos?\n\nAlivia tensões nos relacionamentos familiares, quando você pede desculpas por ter ferido seu familiar, assumindo a responsabilidade do seu erro. Você pode dizer: “Desculpe! Eu reconheço que fui duro quando falei com você” ou “Perdoe-me! Eu fiquei estressada o dia todo e descontei em você”.\n\nFaz parte do plano de Deus para os relacionamentos humanos a preservação da individualidade. Veja: “O Senhor não deseja que nossa individualidade seja destruída; não é Seu desígnio que quaisquer duas pessoas sejam exatamente iguais nos gostos e disposições. Todos têm características que lhe são particulares, e estas não se devem destruir, mas educar, moldar, afeiçoar segundo a semelhança de Cristo” (Ellen G. White, Mente, Caráter e Personalidade, v. 2, p. 424).\n\n> Que virtudes poderosas estão à nossa disposição para termos relacionamentos saudáveis? Gálatas 5:22\n\nNo casamento, há desafios difíceis para ele funcionar bem. Afastar-se, aproximar-se, falar, não falar, tomar uma atitude firme e renunciar à opinião são comportamentos opostos que requerem sabedoria para escolher quando aplicar um ou outro no relacionamento. Observar, entender seus defeitos de caráter e lutar para vencer a si mesmo ajuda a não repetir mais os mesmos erros. Olhar a nós mesmos com o objetivo de amadurecimento pessoal não é fácil. Não é agradável ver nossos defeitos de caráter. Mas, melhoramos como pessoa e melhoramos nossos relacionamentos, obtendo autoconhecimento. Viver errando e pedindo desculpas e não acabar com o erro é uma barreira contra um bom relacionamento.\n\nSobre educação de filhos, é importante pensar que crianças também sofrem com medo, ansiedade, dúvidas, insegurança e tristeza. Quando seu filho falar de alguma coisa que o incomoda, pare, olhe nos olhos da criança e pergunte o que ela sente. Deixe-a falar e expressar seu medo, sua ansiedade e sua insegurança e ofereça acolhimento. Esta é uma função dos pais. “As crianças têm provações tão difíceis de suportar, tão penosas em sua natureza, como as pessoas de mais idade. Os próprios pais não se sentem sempre da mesma maneira” (Ellen G. White, Orientação da Criança, p. 128).\n\n> Que dois conselhos preciosos para os pais encontramos em Efésios 6:4?\n\nDeus diz também: “Pais, não irriteis os vossos filhos, para que não fiquem desanimados” (Colossenses 3:21).\n\nAs lições que as crianças aprendem, as palavras e condutas dos adultos que cuidam delas exercem um impacto forte sobre sua mente e, dificilmente, são apagadas na vida adulta. Não é raro ver pais e mães impacientes que gritam com seus filhos em qualquer lugar. Uma coisa é o pai ou mãe estar irritado certo dia e, sem querer, perder a paciência com seu filho e gritar com ele, e outra coisa é isto ser rotina. Peça perdão ao seu filho pelo seu ato descontrolado. Os filhos não têm culpa dos problemas dos pais. Eles devem resolver seus machucados afetivos para não afetar a educação dos filhos.\n\nAlguns pais e mães têm dificuldade na prática de autoridade em relação aos seus filhos. Segundo a Bíblia, o pai é o líder da casa e precisa exercer devida autoridade para com seus filhos e exigir o respeito deles para com ele e com a mãe. Isso será bom para os filhos no presente e no futuro e diminuirá o estresse natural da educação deles. A mãe também necessita exigir autoridade dos filhos, desde que eles são pequenos. O respeito pela autoridade preserva os filhos de sofrerem no futuro por rebeldia e desrespeito por chefes, autoridades e colegas. Já o autoritarismo fere os direitos do outro e deve ser evitado pelos pais no relacionamento com seus filhos.\n\nAs crianças precisam e podem aprender desde pequenas a exercerem autocontrole emocional. Isto vai depender da firmeza dos pais e, claro, de eles praticarem autocontrole dando bom exemplo aos filhos. Quando seu filho perder o controle emocional e, por exemplo, chutar algo, querer agredir o pai ou a mãe, jogar objetos no chão, não obedecer ao chamado para tomar banho ou iniciar uma refeição, é importante ter mão firme com ele, sem gritar, reforçando a tarefa a ser feita, falando com a criança com segurança e voz de comando, evitando atitude frouxa e fazendo o que acabou de dizer que faria.\n\nAuxilia a formação de um bom caráter em nossos filhos, quando os treinamos a doar, para vencer o egoísmo. Desde pequenos, ajude seus filhos a selecionarem coisas para dar a alguém necessitado, sejam brinquedos, peças de roupas, calçados ou alimento. A Palavra de Deus diz: “Ensina a criança no caminho em que deve andar, e, ainda quando for velho, não se desviará dele” (Provérbios 22:6).\n\nSe certo dia, um membro da família estiver zangado, procure saber o que está ocorrendo com desejo de ajudar. Incentive a pessoa a falar e expressar sua zanga e não traga isso como algo pessoal. Claro, ela precisará falar sem atacar você ou outro membro da família. Escute o desabafo e veja como ajudar.\n\n> Complete o texto a seguir e veja o limite que devemos impor à ira: Efésios 4:26\n\nEm Efésios 4:26, Deus mostra que cabe em certas circunstâncias sentir raiva. A raiva pode nos ajudar a nos proteger ou cuidar de alguém que pode estar sendo vítima de algum abuso. Porém, veja que a recomendação bíblica é ter a raiva, ou qualquer outra emoção, mas não deixar que ela o domine. Saúde mental tem relação com as emoções, e é importante não deixar que elas nos tenham.\n\nImportante dividir as tarefas em casa. Colocar lixo para o lixeiro pegar, cuidar do cachorro, ajudar no preparo do alimento para todos e cada um cuidar de sua roupa, cama e toalha de banho. Claro, crianças pequenas não podem assumir coisas difíceis, mas, dependendo da idade, podem cooperar com tarefas simples. Esta divisão de tarefas para todos em casa cria um clima de cooperação e evita que os acomodados fiquem sem ajudar e que alguém fique sobrecarregado.\n\nSeja claro ao fazer um pedido ao seu familiar. Alguns têm dificuldade de pedir ajuda e, por isso, se sobrecarregam de tarefas. Peça ajuda, de forma clara, com humildade e sem manipular. Seus familiares podem não perceber que você está com uma carga pesada. Não é justo, por exemplo, a esposa ficar em casa cuidando do serviço de limpeza, das crianças, compras, comida, tarefas da escola dos filhos, e o marido chegar e não colaborar com nada. Mesmo tendo tido um dia difícil no trabalho, coopere ajudando a preparar o jantar, dando banho nas crianças pequenas e arrumando a mesa para a refeição. Considere sua família como um time em que todos jogam do mesmo lado com o objetivo de serem felizes no lar.\n\n## Minha decisão\n\n[ ] Aceitando o fato de que preciso de ajuda, decido buscar em Deus sabedoria, amor e graça para conviver com mais harmonia e paz com meu cônjuge e família."}, {"titulo": "Vencendo compulsões", "refs": "2 Coríntios 10:5 · 1 Coríntios 6:19 · Salmo 101:3 · Isaías 41:13", "conteudo": "Comportamentos compulsivos são atitudes relacionadas com repetições frequentes de atos geralmente impulsivos. A diferença entre obsessão e compulsão é que obsessão tem de ver com pensamentos que ficam na mente perturbando. Você não quer pensar, mas o pensamento está ali. E compulsão tem de ver com impulso, agir sem controle. Obsessão é pensar, e compulsão é fazer.\n\nHá diferentes tipos de comportamentos compulsivos, como comprar coisas, acumular objetos, comer em excesso, jogar jogos de azar, falar compulsivamente, roer unhas, arrancar fios de cabelo, verificar várias vezes se trancou uma porta ou se desligou o gás no fogão. Há, ainda, a compulsão por pornografia e sexo, bebidas alcoólicas e outras drogas e até compulsão pelo trabalho.\n\nAs compulsões são uma busca inconsciente para diminuir a ansiedade. Alguma coisa provoca ansiedade na pessoa, e ela não sabe o que é porque a causa está inconsciente. Essa ansiedade produz pensamentos obsessivos que levam às atitudes compulsivas. Os comportamentos compulsivos são, então, uma busca de alívio da ansiedade que os pensamentos obsessivos produzem. A pessoa se sente aliviada dos pensamentos obsessivos, quando ela pratica atos compulsivos. Mas, em seguida, tudo volta a perturbar, porque a causa principal não foi entendida e trabalhada.\n\nO Transtorno Obsessivo Compulsivo (TOC) é um sofrimento no qual a pessoa tem pensamentos obsessivos que a perturbam tanto que ela é levada a algum ato compulsivo em busca de alívio. Ela pode, por exemplo, ter de lavar as mãos constantemente por causa dos pensamentos de contaminação insistentes e que geram ansiedade. Ao lavar as mãos, a ansiedade diminui. Então, cria-se um condicionamento de que, quando se lava as mãos, a ansiedade diminui. Daí, a pessoa repete isso muitas vezes para buscar alívio. Também é possível que obsessões e compulsões sejam sinais de conflitos inconscientes que a pessoa tenta expulsar da consciência. Mas, como são reais, precisam vir à tona para serem resolvidos. Porém quando esses conflitos são repulsivos ou angustiantes, a pessoa só consegue lidar com eles indiretamente, transferindo-os para algo mais gerenciável, como lavar as mãos, ficar contando objetos, entre outros comportamentos repetitivos.\n\n> Como podemos controlar nossos pensamentos? 2 Coríntios 10:5\n\nUma coisa que pode ajudar a pessoa com obsessões e compulsões é dizer para si mesmo que os pensamentos obsessivos não têm valor moral, mas são resultado de alterações neuroquímicas, talvez, devido ao excesso de ansiedade. Por isso, a pessoa com TOC precisa desvalorizar os pensamentos obsessivos o mais que puder e dizer para si mesma que ela não tem de obedecer ao que eles mandam.\n\nOutra tarefa diária importante é lutar para pensar em outra coisa a fim de substituir o pensamento obsessivo. Isto pode ser difícil, no começo, mas, com o tempo, a pessoa pode conseguir evitar ficar concentrada nos pensamentos obsessivos, escolhendo pensar em outras coisas, adiando o ato compulsivo e suportando a ansiedade. Ao surgirem os pensamentos obsessivos, em vez de logo praticar o ato compulsivo, diga para si: “Vou esperar uns 20 minutos sem me deixar levar pela necessidade de agir compulsivamente.” Quanto melhor se lida com a ansiedade excessiva, menos necessidade existe de a mente produzir pensamentos obsessivos que levam aos atos compulsivos (Veja o que está explicado no capítulo sobre ansiedade).\n\n> Que consciência devemos ter ao lidar com a saúde de nosso corpo? 1 Coríntios 6:19\n\nOutra compulsão comum é o consumo de substâncias, a chamada dependência química. Para classificar uma pessoa como dependente químico, são necessários alguns critérios:\n\n01. Desejo persistente de usar a droga, sem sucesso para parar de consumi-la.\n\n02. Dificuldade em controlar o uso e níveis de consumo da substância.\n\n03. Ocorrência da Síndrome de Abstinência com ansiedade e tremores, podendo surgir alucinações e agitação, que levam à necessidade de usar a droga para cessar o mal-estar.\n\n04. “Tolerância”, ou seja, necessidade de doses maiores da substância para atingir o mesmo efeito que conseguia com doses menores.\n\n05. Abandono progressivo de prazeres ou interesses saudáveis, levando a pessoa a se fixar, obsessivamente, no consumo da droga.\n\n06. Persistência do uso da substância, apesar da clara evidência de consequências negativas sobre a vida geral do viciado, como: alteração no comportamento; problemas estudantis, como reprovações; envolvimento com polícia; agressões físicas a familiares; e acidentes de trânsito.\n\nO dependente químico, inicialmente, nega que tem problemas, que está sofrendo e que precisa de ajuda. A dependência química é a doença da negação. O viciado mente, age desonestamente e se nega a receber ajuda. Em geral, ele coloca a responsabilidade no outro: “Eu me drogo, porque meus pais não me amam” ou “Uso drogas, porque minha mulher é terrível”. Falta humildade para assumir sua falência moral, emocional e física, quando já está envolvido até o “pescoço” com a droga, e falta humildade para assumir que sozinho não pode vencer. Quando, finalmente, o viciado admite que se droga porque perdeu o controle, não mais culpa os outros e pede ajuda, ele dá o primeiro passo para a recuperação. O familiar do dependente químico só deve investir no tratamento dele, se ele realmente aceitar que precisa de ajuda, reconhecendo que perdeu o controle sobre sua vida por causa do vício.\n\n> Que sábia decisão tomou o salmista no Salmo 101:3?\n\nUm tipo de compulsão que tem se tornado uma epidemia é a pornografia. A internet é uma faca de dois gumes. Ali está o bem e o mal. De todos os desejos que a internet alimenta, o sexo sintético parece ser o mais lucrativo e procurado. A pornografia corrói nossa humanidade, prejudica nosso corpo e mente, incentivando a autogratificação. Adiar a aquisição de prazer é importante para se conseguir manter o controle e boa direção em sua vida. As pessoas saudáveis mentalmente conseguem adiar o que produz satisfação, quando isso é necessário, em vez de mergulhar de cabeça na busca de prazer de qualquer forma, em qualquer momento.\n\nA solução envolve resistir a exposição à pornografia e perceber que, ao conseguir isso, surge a sensação de bem-estar e confiança.\n\nA pornografia também corrói nossa humanidade e prejudica nosso corpo e mente, porque destrói os valores daquele que se expõe a ela. Um vídeo influencia a mente e o comportamento, sem a pessoa perceber todos os detalhes dele. A pornografia conduz a pessoa a mudar seus padrões sexuais, animando-a a buscar sexo em relacionamentos íntimos doentios com pessoas dispostas a fazer sexo sem limites. A pessoa madura tem controle sobre sua sexualidade e não é escrava do desejo sexual.\n\nA pornografia pode causar dificuldade de ereção, o que provoca angústia no homem que passa a sofrer dessa disfunção. Há estudos que mostram que a função sexual das mulheres também pode ser afetada pelo consumo crônico de pornografia.\n\nO isolamento social e a vergonha podem dificultar o desenvolvimento de saudável conexão afetiva com os outros, e a pornografia favorece isso. E é bom lembrar que o que promove felicidade nos relacionamentos é o afeto e não o sexo, primariamente. A pessoa viciada em pornografia, com determinação e ajuda de Deus, pode voltar ao convívio social e obter prazer na interação com pessoas numa base saudável.\n\nViciados em pornografia parecem ter o mesmo mecanismo de produção de dopamina que os viciados em drogas como a cocaína. Por isso, a pornografia é uma compulsão forte. Sexo, comida saborosa, obter “curtidas” nas mídias sociais, tudo isso desencadeia a liberação de dopamina. Quanto mais alguém se expõe à pornografia, mais o cérebro é enxarcado com dopamina. O viciado pode, passo a passo, se tornar acostumado aos efeitos de certa dose de dopamina e precisar de mais estímulos para sentir prazer.\n\n> Que promessa Deus faz aos que querem vencer suas compulsões? Isaías 41:13\n\nPara os que lutam com pornografia, todas as noites, antes de dormir, escreva uma lista de tudo o que você precisa realizar no dia seguinte em ordem de impor-tância e que seja aprovado por Deus. No próximo dia, procure fazer tudo o que está na lista. O que sobrar vai para a lista do dia seguinte. Ofereça a si mesmo uma recompensa por realizar tarefas em suas listas. Claro, a recompensa não pode ser pornografia, mas algo que você goste de fazer, que seja saudável, ético e de boa moral. Faça cada dia alguma coisa que não tenha prazer, mas que precisa ser feito, como exercício para aprender a adiar a gratificação. Pode ser algo simples, como arrumar seu armário, visitar uma pessoa doente mesmo sem vontade, praticar exercícios físicos ou outra coisa. Deus promete ajudar você. Veja: “Ele Me invocará, e Eu lhe responderei; na sua angústia Eu estarei com ele, livrá-lo-ei e o glorificarei” (Salmo 91:15).\n\n## Minha decisão\n\n[ ] Decido buscar força e poder em Deus a fim de vencer minhas fraquezas e compulsões."}, {"titulo": "Psicossomática: corpo e mente juntos", "refs": "1 Tessalonicenses 5:23 · Provérbios 15:13 · Provérbios 12:25 · Salmo 32:3 · Hebreus 11:6", "conteudo": "Hipócrates, o pai da Medicina, médico grego, que viveu entre 460 e 370 antes de Cristo, acreditava que mais importante do que saber que doença tem uma pessoa, era tentar tentar entender que pessoa tem aquela doença.\n\nIsto não significa diminuir a importância do diagnóstico, que precisa ser feito pelo profissional de saúde para ter um o tratamento bem indicado. O que Hipócrates disse é que o profissional que busca uma visão completa da pessoa pode conseguir melhores resultados no tratamento, pesquisando fatores físicos, mentais, sociais e espirituais na vida daquela pessoa, e não apenas focalizar num sintoma isolado.\n\n> Com que palavras Paulo mostrou que o ser humano é um ser indivisível? 1 Tessalonicenses 5:23\n\nNão adoecemos por compartimento. O corpo afeta a mente, e a mente afeta o corpo. No desenvolvimento de uma doença, assim como no da saúde, há uma combinação de fatores, no estilo de vida do indivíduo, que tem relação com o como você pensa, como expressa seus sentimentos, como lida com as pessoas, com sua alimentação, prática de exercícios físicos, qualidade do sono, estresse no trabalho, vida nas cidades grandes, entre outros.\n\nQuando você apresenta um sintoma físico, passa por consulta médica e faz todos os exames possíveis, e o médico diz que você não tem nada, e que os exames estão normais, mas você continua com o sintoma, provavelmente, este será um sintoma psicossomático, que pode evoluir para uma doença psicossomática.\n\n“Grande parte das doenças que afligem a humanidade têm a sua origem na mente, e podem ser curadas apenas pela restauração da mente à saúde” (Ellen G. White, Conselhos Sobre Saúde, p. 349).\n\n“Enfermidades mentais prevalecem por toda parte. Nove décimos das doenças das quais os homens sofrem têm aí sua base” (Ellen White, Mente Caráter e Personalidade, v. 1, p. 59).\n\n> Complete os textos e veja a íntima relação entre a mente e o corpo: Provérbios 15:13\n\nVários cientistas têm chegado a esta conclusão, como o médico Dr. Herbert Benson, do Departamento de Psicossomática da Faculdade de Medicina da Universidade de Harvard, que escreveu: “60% a 90% dos pacientes que procuram médicos na clínica [pacientes ambulatoriais] têm suas doenças devido a estresse físico e mental. Elas são pessoas que têm sintomas físicos como resultado de problemas emocionais e sociais. A média poderia ser 75%” (Dr. Herbert Benson, “Timeless Healing – The Power and Biology of Belief”, Harvard School of Medicine, Body-Mind Institute, 1996, p. 204).\n\nDoença psicossomática é a que se manifesta no corpo com sintomas e lesões físicas ou funcionais, mas cuja causa principal se origina na mente, em conflitos psicológicos, muitas vezes por causa de importante estresse mental.\n\nCorpo e mente funcionam em harmonia de tal modo que, quando algo é pesado para a mente carregar, em termos de tensão nervosa, tristeza e ansiedade excessiva, é como se o corpo dissesse para a mente: “Você quer uma ajuda?” Então, a mente “diz”: “Sim, me ajude! Está pesado lidar com este sofrimento mental!” Então, a mente “joga” para o corpo parte de sua tensão, e o corpo começa a apresentar sintomas, que são, então, psicossomáticos.\n\nCada pessoa terá a manifestação do sofrimento emocional em um ou em mais de um “órgão de choque”, que é a parte do corpo que, naquele indivíduo, é mais sensível às tensões emocionais. Para algumas pessoas, o órgão de choque pode ser o estômago, para outras, o sistema imunológico, e, para outras, ainda, o sistema muscular.\n\nPesquisas do Dr. Dean Ornish, cardiologista ligado à Universidade da Califórnia em São Francisco, nos Estados Unidos, mostraram a conexão entre doenças físicas e estado emocional. Por exemplo, ele observou que pessoas com ataque cardíaco têm um risco quatro vezes maior de morrer, dentro de seis meses, se permanecerem deprimidas e sozinhas.\n\nEle cita um estudo da Universidade Case Western Reserve, no qual avaliaram dez mil homens casados e descobriram que aqueles que responderam “sim” à pergunta “Sua esposa expressa amor a você?” tiveram, significantemente, menos angina ou dor no peito.\n\n> Que contraste você consegue ver em Provérbios 12:25?\n\nA maneira como você pensa influi no seu corpo. Veja: “Se você tem a mente impressionada e fixa na ideia de que o banho lhe fará mal, a impressão mental se comunica a todos os nervos do corpo. Os nervos controlam a circulação do sangue; portanto, o sangue, por causa da impressão mental, é confinado nos vasos sanguíneos, e perdem-se os bons efeitos do banho. Tudo isto se dá porque o sangue é, pela mente e a vontade, impedido de fluir prontamente e vir à superfície para estimular, despertar e promover a circulação” (Ellen G. White, Mente, Caráter e Personalidade, v. 2, p. 397, 398).\n\nInteressante, não é? Esta autora está dizendo que a circulação do sangue é prejudicada, porque a mente está em tensão emocional por causa da maneira como você pensa!\n\nVocê pode usar boa qualidade de alimentos, e, mesmo assim, ter problemas de saúde, porque a absorção dos nutrientes não funciona bem por conta de um estado emocional depressivo.\n\nParece que quanto mais uma pessoa tem dificuldade de tomar consciência de suas emoções, especialmente as desagradáveis, mais provável é que apresente sintomas psicossomáticos, porque o corpo absorve e manifesta os sentimentos através de um sintoma físico.\n\n> De acordo com Salmo 32:3, qual é um dos resultados de se calar diante de um sentimento?\n\nUm sentimento sempre tem uma expressão no corpo. Se você tem dificuldade de expressar raiva, ela pode favorecer, por exemplo, a asma ou a hipertensão arterial. Pessoas com dificuldade de expressar qualquer sentimento podem apresentar constipação intestinal. Perfeccionistas podem ter enxaqueca. Alguns com tendência a reprimir emoções por muitos anos podem facilitar seu corpo a desenvolver câncer. Uma pessoa com dificuldade de chorar pode “chorar” pela pele, através de lesões que produzem secreção. Indivíduos que reprimem sentimentos tendem a ter doenças degenerativas como o câncer, diabetes, esclerose múltipla, entre outras. As que são explosivas tendem a ter mais doenças, como enfarto do miocárdio e acidente vascular cerebral.\n\nSofrimentos psicológicos não são fraquezas ou falta de fé, se você viveu ou está vivendo importantes estresses na vida. Angústia forte, tristeza profunda e medo excessivo são expressões de sofrimento, que, muitas vezes, se manifestam através do corpo.\n\nSe você tem sintomas físicos e foi avaliado por médicos, e todos dizem que não acharam nenhum diagnóstico, tendo exames normais, comece a pensar se não existe algo mal resolvido em seu relacionamento com as pessoas, com você mesmo, ou com ambos, que pode estar se manifestando em seu corpo. Neste caso, considere ter uma avaliação com um psicólogo clínico. Se for necessária a medicação, você poderá marcar uma consulta com um médico psiquiatra em seguida.\n\nÀs vezes, os problemas emocionais se resolvem com a vida. Às vezes, precisamos de ajuda técnica. Não fique com um sofrimento, sem tomar uma atitude para melhorar. Primeiro de tudo, fale com Deus, em oração sincera, sobre seu sofrimento. Há situações na vida que produzem sofrimento, e Deus vai resolver junto com você, sem precisar de profissional. E há sofrimentos mentais que Ele o ajudará a encontrar um bom profissional para orientá-lo.\n\n> Que certeza devemos ter ao buscarmos o auxílio de Deus? Hebreus 11:6\n\nComece dirigindo-se, humildemente, a Deus, com oração perseverante, objetiva e sincera, abrindo seu coração a Ele e falando com detalhes do que lhe machuca. Não é Ele que precisa saber o que o perturba, mas é você que precisa falar, porque falar ajuda a curar. Ao falar com Deus, em oração, creia que Ele existe, que ouve sua prece e que o ajudará. Isso ocorrerá, quando você orar com humildade, usando suas próprias palavras e pedindo em nome de Jesus. Sua mente será iluminada para entender o caminho a seguir para a cura que você precisa. Jesus prometeu ajudar, ao dizer: “Vinde a Mim, todos os que estais cansados e sobrecarregados, e Eu vos aliviarei” (Mateus 11:28).\n\n## Minha decisão\n\n[ ] Entendendo a íntima relação que há entre a mente e o corpo, decido cuidar de minhas emoções e sentimentos para desfrutar de mais saúde."}, {"titulo": "Pensando bem", "refs": "Mateus 15:19 · Jeremias 29:11 · Salmo 139:23 · Efésios 4:17 · Romanos 12:2", "conteudo": "Pensar é atributo exclusivo do ser humano dado por Deus. Devido à nossa contaminação espiritual, qualquer pensamento bom que tenhamos, se é realmente bom, vem de Deus. Veja este texto sobre pensar saudavelmente: “Nós não pensamos um nobre pensamento que não venha dEle [de Deus]” (E. G. White, The Seventh-Day Adventist Bible Commentary, v. 6, p. 1.105).\n\nFilipenses 4:8 diz: “...tudo o que é verdadeiro, tudo o que é respeitável, tudo o que é justo, tudo o que é puro, tudo o que é amável, tudo o que é de boa fama, se alguma virtude há e se algum louvor existe, seja isso o que ocupe o vosso pensamento”. Tudo o que é bom ou mal em nossa vida começa no coração!\n\n> Segundo Jesus, o que procede de nosso coração? Mateus 15:19\n\nNa Bíblia, a palavra “coração” significa a parte mais profunda da mente humana, onde nenhum profissional de saúde tem acesso. Coração, no sentido de mente, tem relação com superestruturas do córtex pré-frontal e frontal, no cérebro humano, responsáveis pelas “funções executivas” do cérebro, que incluem raciocinar, decidir, escolher e resolver problemas.\n\nA mente humana funciona com pensamentos, sentimentos e comportamentos. Você pensa, sente e age. Bons ou maus pensamentos geram bons ou maus atos. Você pode não ser capaz de evitar que um mau pensamento venha à sua consciência. Ele vem por causa da contaminação espiritual ou por conflitos emocionais. Mas, você pode decidir o que fará com ele. Pode nutri-lo ou expulsá-lo. Você tem a escolha.\n\nO único caminho eficaz para prevenir maus comportamentos na humanidade é a transformação dos pensamentos, que envolve a mudança do coração, a fonte dos pensamentos. Aqueles que querem desfrutar a paz devem, primeiro, pensar pensamentos de paz.\n\n> Que pensamentos Deus tem para cada um de nós? Jeremias 29:11\n\nA paz é uma Pessoa: Jesus Cristo. E é um fenômeno também. Do ponto de vista psicológico, a paz é o produto do pensar correto e da ação correta. Cultivando maus pensamentos, o fim é destruição, tanto da paz interior, quanto das boas relações com as pessoas. A partir de um mau pensamento, surgem corrupção, maldade, desunião e crimes. Sofrimentos mentais surgem, muitas vezes, por causa de pensamentos distorcidos que a pessoa nutre.\n\nVeja um exemplo de pensamento distorcido: Você telefona para uma amiga, e ela não atende. Então, você pensa: “Ela viu minha ligação e não atendeu. Ela está aborrecida comigo.” No dia seguinte, você pergunta o porquê ela não atendeu a ligação. Ela diz: “Eu fui ao mercado e esqueci o celular em casa!” Assim, o pensamento “Ela está aborrecida comigo” foi uma distorção de pensamento, que pode gerar dor emocional e que não será corrigido por medicação. Corrigir pensamentos distorcidos é algo que um tratamento psicológico ajuda a fazer, ou você, pedindo luz a Deus, vai percebendo a presença destas distorções cognitivas e decide lutar contra elas.\n\nNossos pensamentos possuem três características: a forma, o conteúdo e o ritmo. Uma alteração da forma do pensamento acontece quando surgem pensamentos desestruturados, confusos. Alterações no ritmo do pensamento são quando os pensamentos ficam lentos ou acelerados. E perturbações do conteúdo do pensamento se manifestam por delírios de grandeza, de perseguição, místico e outros.\n\n> Que pedido o salmista fez a Deus no Salmo 139:23 e 24?\n\nQuando você insiste em manter um pensamento distorcido na consciência, isto o faz sentir mal, porque os pensamentos produzem os sentimentos, os sentimentos levam às atitudes, a repetição das atitudes forma hábitos, os quais estruturam o caráter e constroem o destino.\n\nQuando a pessoa aprende a identificar pensamentos distorcidos, confrontando-os e resistindo a eles, ela pode começar a melhorar o seu estado emocional.\n\nO que faz nosso humor alegre, triste ou zangado?\n\nPara nosso humor ser alegre, triste ou zangado depende de um evento ativador. No caso que citei, a moça sentiu que sua amiga poderia estar chateada com ela, por não ter atendido ao telefone. O evento ativador do pensamento negativo foi não conseguir falar com a amiga ao telefone. A crença foi “Será que ela está aborrecida comigo?”. A consequência emocional foi se sentir não querida pela amiga.\n\nPensar correto é necessário para a saúde mental, porque os sentimentos e escolhas resultam do tipo de pensar que nutrimos. O que assistimos na televisão e na internet e o que lemos em livros e revistas influi no que pensamos. Se demoramos em coisas superficiais, de baixo nível, não teremos boa saúde mental e discernimento espiritual.\n\nNo modelo cognitivo de interpretação do sofrimento emocional que leva à depressão, o humor e comportamentos negativos seriam resultados de pensamentos e crenças distorcidos, que interferem tanto no surgimento quanto na manutenção da depressão. Em outras palavras, pensamentos e crenças distorcidos conduzem ao humor e comportamento depressivos.\n\n> Que importante conselho encontramos em Efésios 4:17?\n\nO que fazer com as distorções de pensamento? É importante identificá-las; conhecer a verdade da realidade que influencia o seu pensamento; escutar seus pensamentos; fazer esforços para perceber possíveis crenças errôneas por detrás dos pensamentos; fazer esforços para substituir tais distorções de pensamento pela verdade; fazer esforços para escrever estas distorções num papel; confrontá-las com a verdade; e viver o que for correto.\n\nUm homem deprimido com ideias suicidas, antes de aprender a lidar com seus pensamentos distorcidos, pensava assim: “É melhor morrer.” “Minha esposa não precisa de um marido deprimido.” “Meus pais me rejeitam, por isso é melhor morrer.” “Sou um peso para minha esposa.” “Não consigo lidar com minha vida.”\n\nApós receber orientações sobre vencer pensamentos distorcidos, ele lutou consigo mesmo, começou a cultivar novos pensamentos e, assim, passou a pensar: “Não vou ficar pensando que é melhor morrer. Creio que Deus cuida de mim.” “Minha esposa é boa pessoa e me ajuda, me dá apoio e é paciente comigo.” “Deus me ajuda a lidar bem com meus pais.” “Acredito que minha esposa me ama de verdade.” “Vou aprender a cuidar bem de minha vida.”\n\nAntes de você fechar a questão de que seu pensamento é ou não saudável, pense no seguinte: Quais são as evidências de que este pensamento é verdadeiro ou falso? Alguma experiência na vida me mostrou que este pensamento não é verdade todo o tempo? Quando me sinto melhor, tenho o mesmo tipo de pensamento?\n\n> Que urgente transformação precisa ocorrer em todos nós? Romanos 12:2\n\nRepita para si passagens bíblicas animadoras e cultive pensamentos positivos e de esperança.”\n\nPensamentos saudáveis não nos vêm naturalmente. Temos que lutar por eles. Precisamos educar nossos pensamentos. Isto exige esforço perseverante, consciência e meditação.\n\nEste trabalho de resistir aos pensamentos e sentimentos negativos é para ser feito pela capacidade que Deus nos deu de escolher o que pensar e no que vamos meditar. Talvez, no começo, seja difícil, mas, com treino e perseverança, a tristeza ou ansiedade desaparecerá, passo a passo. Tomar medicamentos não substitui este exercício, porque eles não mudam o que pensamos.\n\nResista aos pensamentos e sentimentos melancólicos. Quando eles surgirem, diga a si mesmo: “Não vou permitir que estes pensamentos permaneçam aqui em mim. Vou resistir a eles. Não vou me concentrar neles. Escolho pensar em coisas melhores. Vou cultivar gratidão pelas coisas boas que já vivenciei e vivencio. Posso fazer isto agora mesmo.” Fazendo assim, você adquirirá autocontrole emocional, se sentirá melhor e será uma pessoa melhor de se conviver.\n\nOutro exercício que pode ajudar a vencer pensamentos distorcidos é fazer uma lista dos seus pensamentos incômodos e examiná-los depois para entender que distorções você tem cultivado em sua forma de pensar.\n\nDeixe de pensar sobre o seu problema ou situação difícil de forma polarizada, ou seja, avalie as coisas numa escala de 0 até 100. Quando um alvo não foi atingido perfeitamente, considere que houve um sucesso parcial, em vez de pensar que tudo deu errado.\n\nNão fique lamentando por ter pensamentos ruins, nem se deprecie por isto. Pense que ele está aí devido à defesa de alguma dor emocional, mau hábito, falta de autocontrole, guerra espiritual, uma destas coisas ou uma mistura delas.\n\nApós decidir com o lado saudável de sua mente não continuar com esse tipo de pensamento desagradável, repita para si passagens bíblicas animadoras, cultive pensamentos positivos e de esperança e tente lembrar de momentos do passado em que o que era ruim também passou, e, assim, com o tempo, seu esforço, com ajuda da força da graça do Criador do Universo, será possível vencer estes pensamentos ruins. Desenvolvendo o hábito da oração e meditação em textos inspiradores, especialmente da Bíblia, sua mente será fortalecida, dia a dia.\n\n## Minha decisão\n\n[ ] Compreendendo a importância de nutrir pensamentos saudáveis, decido permitir que o Espírito Santo de Deus domine completamente minha mente e pensamentos."}, {"titulo": "Controle emocional: o que é isso?", "refs": "Provérbios 16:32 · 1 Samuel 20:30 · Isaías 26:3 · Gálatas 5:22, 23", "conteudo": "Adultos aprendem a administrar uma empresa, gerenciam bem sua vida financeira, fazem mestrado e doutorado, mas um bom número de indivíduos não sabe controlar a si mesmo do ponto de vista emocional e age com frieza nos relacionamentos afetivos. Muitas mulheres são românticas, mas apresentam dificuldade em viver o lado racional nos relacionamentos e se descontrolam.\n\n“Grande conhecimento é conhecer-se a si mesmo. O verdadeiro conhecimento de si próprio induz a uma humildade que abrirá o caminho para que o Senhor desenvolva o espírito, molde e discipline o caráter.” Ellen G. White, Conselho aos Pais, Professores e Estudantes, pág. 419.\n\nPessoas “nervosas” têm dificuldade de conhecer a si mesmas e argumentam que receberam uma carga hereditária de um pai ou de uma mãe descontrolados emocionalmente. Não podemos culpar a herança genética, porque ela influi, no máximo, entre 30% a 50% em nosso comportamento. O resto é resultado do que foi aprendido na infância, de influência epigenética (estudo da hereditariedade), do meio cultural e da própria sensibilidade do indivíduo que faz escolhas.\n\n> De acordo com Provérbios 16:32, o que é melhor do que tomar uma cidade?\n\nUma pessoa com bom controle emocional pode estar conversando com alguém desagradável, consegue ouvir a conversa com respeito e pensa ao mesmo tempo em sua mente: “Esta pessoa é desagradável, mas vou ter paciência com ela.” Já alguém com facilidade para o descontrole emocional apenas reagiria com irritação diante de uma pessoa chata, sem fazer esta reflexão paralela.\n\nQuem consegue olhar para o outro e para dentro de si e perceber sentimentos em si e no outro pode ter melhor controle emocional. Isto não depende de cultura, formação universitária ou poder econômico, mas de sensibilidade para com a vida, que, em parte, é inato, e, em parte, aprendido. Você pode aprender a ser uma pessoa com equilíbrio emocional, evitando ser muito racional ou muito sentimental.\n\nComo se adquire controle emocional? Fazendo diferente do habitual: lutando contra o padrão ou tendência básica de funcionar como vinha atuando; tendo atitudes diferentes com a consciência de que será melhor para um desenvolvimento pessoal; evitando usar as pessoas; lutando contra a ideia de que tem que tomar remédios psiquiátricos para ter controle emocional; parando de culpar as coisas e as pessoas pelo seu descontrole; cultivando gratidão; acabando com ressentimentos; envolvendo-se em trabalho filantrópico voluntário; interrompendo pensamentos destrutivos que brotam na mente; escolhendo melhores pensamentos; e “sentando no banco do carona”, deixando o Deus Criador dirigir sua vida, abrindo, assim, mão do controle.\n\n> Na Bíblia, quem é conhecido por não conter suas emoções? 1 Samuel 20:30\n\n“Nervosismo” e “nervoso” são palavras populares usadas para diferentes tipos de comportamento. Às vezes, se diz que uma pessoa é nervosa, porque explode fácil, tendo “pavio curto”, ou porque não age com serenidade em certas situações, ficando muito ansiosa e insegura. Também, se diz que alguém é nervoso quando é irritadiço, encrenqueiro e briguento. Outras se dizem nervosas, porque tremem diante de desafios como um novo trabalho, uma viagem, sentindo-se incapaz de lidar com a situação, que, para elas, é assustadora. Pessoas “nervosas”, sem autocontrole podem ter problemas de identidade psicológica, falta de segurança interior e fragilidade na estrutura de sua personalidade.\n\nDesde pequenos, nos ensinam a andar, ler, escrever, comer sozinhos, realizar tarefas, fazer a higiene pessoal, ir à escola ou comprar algo sem um adulto junto. Aprendemos a estudar, produzir dinheiro para nossa sobrevivência e a orar, mas, e quanto a aprender a lidar com complicados sentimentos e pensamentos? Quem nos ensina isto? Os pais são os responsáveis por ensinar seus filhos a desenvolverem controle emocional desde pequenos. A melhor maneira de ensinar isto aos filhos é com a própria conduta de bom controle emocional.\n\nUm casal discutia acaloradamente. A esposa sentia necessidade de mais atenção do marido. Qual o limite de satisfação quanto a isto? Há algum parâmetro que sirva de base para se saber o quanto é suficiente? O marido sentia que sua esposa estava sendo injusta e ficava magoado com os ataques dela contra os parentes dele.\n\nO diálogo seguia tenso com a mulher tomada pela emoção. Há grande risco de cometer injustiça, que se está possuído por emoções. Você pode ter emoções fortes numa discussão e exercer autocontrole, administrando sua cabeça para não fazer ou dizer besteiras. Isso é maturidade e controle emocional.\n\n> A quem Deus conservará em perfeita paz? Isaías 26:3\n\nSe você herdou a tendência de descontrole, em parte, porque seu pai ou mãe eram nervosos, ou copiou o modelo da pessoa influente que lhe criou; se ficou assim, desde algum evento estressor, não importa, pois, a responsabilidade de mudar é sua.\n\nTomada pela emoção, ela atacava o marido: “Você nunca me dá atenção! Dá mais importância para eles do que para mim!” O marido, com o raciocínio a mil por hora, analisava os fatos sobre como ele funcionava com sua mulher e com seus próprios parentes, e começava a ficar confuso e indignado. Ele tinha consciência da tensão entre a esposa e parentes dele e tentava, com boa vontade e esforço, administrar as necessidades de sua família de origem e as de sua companheira, não sendo omisso nem acomodado. Mas sua esposa atacava e cometia um erro comum nos casamentos: generalizava.\n\nTomada pela emoção, ela não raciocinava. Se raciocinasse, consideraria que seu esposo realmente dava atenção para ela e para seus filhos. E ela poderia entender que talvez tivesse uma necessidade específica de atenção diferente da que ele vinha dando. Movida pela emoção, ela generalizava e passava a ideia de que seu marido não dava nenhuma atenção para ela, só para a família dele, o que não era verdade.\n\nNa discussão, faltava controle emocional e lógica nesta mulher. Se ela raciocinasse, poderia, mesmo na discussão acalorada, dizer: “Querido, você é bom marido e cuida bem de mim e das crianças. Mas, sinto necessidade de mais atenção sua. Sinto falta de... (ela deveria especificar o quê).” Isso seria maturidade e bom controle emocional.\n\nQuando ela dizia: “Você nunca me dá atenção!” e repetia a palavra “nunca” várias vezes, estava generalizando, porque colocava um exagero na fala, não considerava que, na verdade, o marido fazia o melhor, mesmo não sendo perfeito\n\nPara amadurecer e adquirir autocontrole saudável dos sentimentos, tente o seguinte:\n\n01. Aceite que a falta de controle emocional existe e que é um problema seu, trazida para este relacionamento, porque já existia antes em você.\n\n02. Pare de criticar as pessoas e circunstâncias do passado e do presente como culpadas do seu nervosismo.\n\n03. Entenda e aceite que precisa mudar. Aceitar é olhar a realidade, ver que algumas coisas não são agradáveis e não se revoltar, machucando pessoas e a si mesmo com seu descontrole emocional.\n\n04. Cultive e alimente a ideia e o desejo de mudar.\n\n05. Esteja pronto para mudar, decidido por causa de um profundo desejo pessoal de mudança.\n\n06. Procure ajuda em aconselhamento psicológico, se precisar.\n\n07. Leia bons livros sobre o assunto e assista palestras, programas na TV, rádio ou seminários sobre como adquirir controle emocional.\n\n08. Peça a amigos e parentes que digam como veem seu comportamento. Tenha humildade ao ouvir e coragem para aceitar o que for verdadeiro, usando o comentário para entender o que mudar.\n\n09. Decida parar de funcionar do jeito como age, utilizando o pensamento consciente. Diga a si mesmo: “Não vou agir mais assim.” Morda a língua; vai dar uma caminhada; tome uma chuveirada; cante; ore; respire fundo; e escreva, mas não se deixe mais levar pelo “nervosismo”.\n\n10. Entenda que ter as emoções não é o problema. O desafio é tê-las, sem deixar que elas o tenham e machuquem as pessoas e a si mesmo.\n\n11. Descarregue seu nervosismo com atividade física, cuidando do jardim, fazendo ginástica e orando.\n\n12. Acima de tudo, busque o autocontrole em Deus. Lembre-se que a mansidão e o domínio próprio são frutos do Espírito Santo.\n\n> Confira essa verdade, completando o texto de Gálatas 5:22, 23:\n\nSe você se relaciona com uma pessoa sem controle emocional, em casa, na escola, no trabalho ou na comunidade religiosa, pense que você não causou este descontrole dela, você não pode controlar isto e você não pode curar isto. É ela que tem de aprender a se controlar e assumir as consequências do descontrole dela. E se você tem descontrole emocional, não desanime. Você pode aprender a se controlar. Faça sua parte como expliquei, e Deus fará a dEle, lhe dando forças, iluminação, discernimento, humildade, sabedoria e serenidade.\n\n## Minha decisão\n\n[ ] Decido entregar meu coração a Deus, pedindo a Ele que me ajude a fazer as mudanças necessárias em minha vida para desfrutar de controle emocional."}], "prova": [{"pergunta": "Que acontecerá com nosso corpo, na volta de Jesus? 1 Coríntios 15:54", "opcoes": ["Voltará ao pó, de onde veio.", "Continuaremos com o mesmo corpo.", "Será transformado num corpo imortal e incorruptível.", "A Bíblia não fala nada a esse respeito."], "correta": 2, "grupo": "Capítulo 1 · Saída para a ansiedade excessiva"}, {"pergunta": "Que pedido Jesus fez ao Pai, na hora de Sua angústia? João 12:27", "opcoes": ["Pai, salva-Me desta hora!", "Pai, perdoa-lhes, porque não sabem o que fazem!", "Pai, glorificado seja o Teu nome!", "Pai, por que Me desamparaste?"], "correta": 0, "grupo": "Capítulo 1 · Saída para a ansiedade excessiva"}, {"pergunta": "Que devemos levar ao conhecimento de Deus, de acordo com Filipenses 4:6?", "opcoes": ["Nossas reclamações.", "Tudo que aconteceu de ruim no nosso passado.", "Deus não quer saber de nada sobre nós.", "Nossas petições, pela oração e súplica, com ações de graça."], "correta": 3, "grupo": "Capítulo 1 · Saída para a ansiedade excessiva"}, {"pergunta": "Por que o salmista decidiu cantar louvores ao nome de Deus? Salmo 13:5, 6", "opcoes": ["Porque era sua obrigação.", "Porque ele não tinha o que fazer.", "Porque Deus havia feito muito bem a ele.", "Porque ele tinha medo de Deus."], "correta": 2, "grupo": "Capítulo 2 · Por que estou tão triste assim?"}, {"pergunta": "Complete o verso: “Levantando-se da oração, foi ter com os discípulos, e os achou...” Lucas 22:45", "opcoes": ["Comendo e bebendo.", "Dormindo de tristeza.", "Pescando no Mar da Galileia.", "Numa festa de casamento."], "correta": 1, "grupo": "Capítulo 2 · Por que estou tão triste assim?"}, {"pergunta": "Como devemos ser transformados? Romanos 12:2", "opcoes": ["Através da doação de esmolas.", "Através do contato com o mundo.", "Pela renovação da nossa mente.", "Fazendo longas orações."], "correta": 2, "grupo": "Capítulo 2 · Por que estou tão triste assim?"}, {"pergunta": "Que tipo de alegria domina o coração daqueles que estão na presença de Jesus? João 16:22", "opcoes": ["Alegria que ninguém pode tirar.", "Alegria que passa logo.", "Alegria que depende das circunstâncias da vida.", "Não há alegria na presença de Jesus."], "correta": 0, "grupo": "Capítulo 2 · Por que estou tão triste assim?"}, {"pergunta": "De quem Deus promete estar perto? Salmo 34:18", "opcoes": ["Das pessoas ricas e poderosas.", "Das pessoas que não têm nada pra fazer.", "Das pessoas que vão à igreja sempre.", "Daqueles que têm o coração quebrantado e espírito oprimido."], "correta": 3, "grupo": "Capítulo 3 · Ideias para perdoar"}, {"pergunta": "De acordo com Jesus em Lucas 7:47, aquele a quem pouco foi perdoado...", "opcoes": ["Pouco ama.", "Pouco ora.", "Pouco trabalha.", "Fica sem perdão."], "correta": 0, "grupo": "Capítulo 3 · Ideias para perdoar"}, {"pergunta": "Qual deve ser o nosso padrão de perdão? Efésios 4:32", "opcoes": ["Não devemos perdoar a ninguém.", "O padrão do mundo.", "Devemos perdoar como Deus nos perdoou através de Jesus.", "O padrão dos gentios."], "correta": 2, "grupo": "Capítulo 3 · Ideias para perdoar"}, {"pergunta": "Que conselho Paulo dá aos pais? Colossenses 3:21", "opcoes": ["Não devem irritar os filhos.", "Não devem colocar limites para os filhos.", "Não devem dar mesadas para os filhos.", "Não devem cansar os filhos."], "correta": 0, "grupo": "Capítulo 4 · Resolução de problemas conjugais e familiares"}, {"pergunta": "Que acontecerá com a criança ensinada no caminho em que deve andar? Provérbios 22:6", "opcoes": ["Abandonará o caminho.", "Esquecerá o caminho.", "A criança deve ser deixada sem ensino.", "Nunca esquecerá o caminho."], "correta": 3, "grupo": "Capítulo 4 · Resolução de problemas conjugais e familiares"}, {"pergunta": "Complete a citação: “O Senhor não deseja que nossa individualidade seja destruída; não é Seu desígnio que quaisquer duas pessoas sejam exatamente...”", "opcoes": ["Casados para sempre.", "Felizes no amor.", "Companheiros e amigos.", "Iguais nos gostos e disposições."], "correta": 3, "grupo": "Capítulo 4 · Resolução de problemas conjugais e familiares"}, {"pergunta": "Assinale a alternativa correta.", "opcoes": ["Obsessão é pensar, e compulsão é fazer.", "Compulsão é pensar, e obsessão é fazer.", "Compulsão e obsessão são exatamente a mesma coisa.", "Obsessão é impulso."], "correta": 0, "grupo": "Capítulo 5 · Vencendo compulsões"}, {"pergunta": "Alguns critérios para classificar um dependente químico são:", "opcoes": ["Abandono progressivo de prazeres ou interesses saudáveis.", "Desej
