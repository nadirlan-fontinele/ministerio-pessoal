  "ag-detalhe": el => modalAgendado(el.dataset.id),
  "nova-sala": el => { const i=interessado(el.dataset.id); i.sala=""; salaDe(i); salvar(); render(); modalSala(i.id); toast("Novo link gerado"); },
  "sala-enviada": el => { const i=interessado(el.dataset.id); registrar(i.id, `${me.nome} enviou o link da aula virtual pelo WhatsApp`); salvar(); },
  "sala-entrou": el => { const i=interessado(el.dataset.id); registrar(i.id, `${me.papel==="interessado"?primeiroNome(me.nome):me.nome} entrou na aula virtual`); salvar(); setTimeout(render, 300); },
  "iniciar-minha": el => { const i=interessado(el.dataset.id); iniciarEstudoCom(i, i.estudoDesejado); salvar(); toast("Estudo iniciado. Bons estudos!"); render(); }
};

document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]"); if(!el || el.disabled) return;
  const fn = A[el.dataset.act]; if(!fn) return;
  if(el.tagName==="A" && el.getAttribute("target")==="_blank"){ fn(el, ev); return; }
  if(el.tagName==="A") ev.preventDefault();
  fn(el, ev);
});

document.addEventListener("submit", async ev => {
  const f = ev.target.closest("[data-form]"); if(!f) return;
  ev.preventDefault();
  const v = Object.fromEntries(new FormData(f).entries());
  const tipo = f.dataset.form;
  if(tipo==="login" && ONLINE){ const b=f.querySelector("button[type=submit]"); b.disabled=true; const m = await entrarOnline(v.email.trim(), v.senha); b.disabled=false; if(m){ const e=$("#login-erro"); e.textContent=m; e.hidden=false; } return; }
  if(tipo==="nova-senha"){ const { error } = await sb.auth.updateUser({ password:v.senha }); if(error){ const e=$("#ns-erro"); e.textContent=error.message; e.hidden=false; return; } fecharModal(); toast("Senha alterada"); await carregarOnline(); if(me) location.hash=nav()[0][0]; render(); return; }
  if(tipo==="login"){
    const u = D.usuarios.find(x=>x.email.toLowerCase()===v.email.trim().toLowerCase());
    if(!u || u.senha !== await hash(v.senha)){ const e=$("#login-erro"); e.textContent="E-mail ou senha incorretos."; e.hidden=false; return; }
    me=u; gravarSessao(u.id); location.hash = nav()[0][0]; render();
  }
  if(tipo==="cadastro"){
    const err = m => { const e=$("#cad-erro"); e.textContent=m; e.hidden=false; };
    if(v.senha!==v.senha2) return err("As senhas não conferem.");
    if(ONLINE){ const b=f.querySelector("button[type=submit]"); b.disabled=true; const m = await cadastrarOnline(v, f.dataset.tipo); b.disabled=false;
      if(m==="CONFIRMAR"){ $("#app").innerHTML=`<div class="auth"><section class="auth-form" style="grid-column:1/-1"><div class="card"><h2>Confirme seu e-mail</h2><p class="muted">Enviamos uma mensagem para <b>${esc(v.email)}</b>. Toque no link da mensagem e depois entre com seu e-mail e senha.</p><a class="btn primary" href="#">Ir para a tela de entrada</a></div></section></div>`; return; }
      if(m) err(m); return; }
    const email = v.email.trim();
    if(D.usuarios.some(x=>x.email.toLowerCase()===email.toLowerCase())) return err("Já existe um cadastro com este e-mail. Use “Entrar”.");
    const papel = f.dataset.tipo;
    const u = { id:"u-"+uid(), nome:v.nome.trim(), email, telefone:v.telefone, nascimento:v.nascimento, senha:await hash(v.senha), papel, origem:"link", criadoEm:agoraISO() };
    if(papel==="obreiro") u.igreja = (v.igreja||"").trim();
    if(papel==="interessado"){
      const tel = soDigitos(v.telefone).replace(/^55(?=\d{10,11}$)/,"");
      let i = D.interessados.find(x=>!contaDoInteressado(x.id) && ((x.email && x.email.toLowerCase()===email.toLowerCase()) || (tel.length>=10 && soDigitos(x.telefone)===tel)));
      if(i){ Object.assign(i, { nome:i.nome||u.nome, telefone:i.telefone||tel, nascimento:v.nascimento||i.nascimento, bairro:i.bairro||v.bairro, email:i.email||email }); }
      else { i = novoInteressado({ nome:u.nome, telefone:tel, email, nascimento:v.nascimento, bairro:v.bairro, origem:"site" }); D.interessados.push(i); }
      registrar(i.id, `${primeiroNome(u.nome)} fez a inscrição pelo link`);
      u.interessadoId = i.id;
    }
    D.usuarios.push(u); salvar(); me=u; gravarSessao(u.id); location.hash=nav()[0][0]; render(); toast(papel==="interessado"?"Inscrição feita. Agora escolha o seu obreiro!":"Cadastro criado. Bem-vindo à sua trilha!");
  }
  if(tipo==="usuario"){
    const id = f.dataset.id; const email = v.email.trim();
    const err = m => { const e=$("#u-erro"); e.textContent=m; e.hidden=false; };
    if(D.usuarios.some(x=>x.email.toLowerCase()===email.toLowerCase() && x.id!==id)) return err("Este e-mail já está em uso.");
    if(v.senha && v.senha.length<6) return err("A senha precisa ter pelo menos 6 caracteres.");
    if(ONLINE && !id){ const m = await criarContaPeloAdmin(v, v.papel||f.dataset.papel); if(m) return err(m); fecharModal(); toast("Conta criada"); render(); return; }
    if(ONLINE && v.senha){ if(id!==me.id) return err("Para trocar a senha de outra pessoa, peça que ela use “Esqueci minha senha” na tela de entrada."); const { error } = await sb.auth.updateUser({ password:v.senha }); if(error) return err(error.message); v.senha=""; }
    if(id){ const u=usuario(id); Object.assign(u,{ nome:v.nome.trim(), email, telefone:v.telefone, nascimento:v.nascimento }); if(v.igreja!=null) u.igreja=v.igreja.trim(); if(v.papel) u.papel=v.papel; if(v.senha) u.senha=await hash(v.senha);
      if(u.papel==="admin") D.interessados.forEach(i=>{ if(i.obreiroId===u.id){ i.obreiroId=""; i.status="aguardando"; i.estudo=null; } });
      if(u.interessadoId){ const i=interessado(u.interessadoId); if(i) Object.assign(i,{ nome:u.nome, telefone:u.telefone, nascimento:u.nascimento, email:u.email }); } }
    else D.usuarios.push({ id:"u-"+uid(), nome:v.nome.trim(), email, telefone:v.telefone, nascimento:v.nascimento, igreja:(v.igreja||"").trim(), senha:await hash(v.senha), papel:v.papel||f.dataset.papel, origem:"admin", criadoEm:agoraISO() });
    salvar(); fecharModal(); toast("Salvo"); render();
  }
  if(tipo==="interessado"){
    const id = f.dataset.id;
    const dados = { nome:v.nome.trim(), telefone:v.telefone, email:v.email, nascimento:v.nascimento, bairro:v.bairro, endereco:v.endereco, religiao:v.religiao, ultimoCurso:v.ultimoCurso, obs:v.obs };
    if(id){ const i=interessado(id); Object.assign(i,dados); if(v.status) i.status=v.status; }
    else { const ob = me.papel==="obreiro";
      D.interessados.push(novoInteressado({ ...dados, obreiroId:ob?me.id:"", status:ob?"alocado":"aguardando", origem:ob?"obreiro":"manual" })); if(ob) darPontos(me.id, PONTOS.seguir, `Cadastrou e seguiu ${nomeBonito(dados.nome)}`); }
    salvar(); fecharModal(); toast("Interessado salvo"); render();
  }
  if(tipo==="alocar"){
    const ids = f.dataset.ids.split(","); const ob = v.obreiro; const est = v.estudo;
    ids.forEach(id=>{ const i=interessado(id); if(!i) return;
      if(ob==="_remover"){ i.obreiroId=""; i.status="aguardando"; i.estudo=null; registrar(i.id, "Alocação removida pela coordenação"); return; }
      const mudou = i.obreiroId!==ob; i.obreiroId=ob; if(mudou){ registrar(i.id, `Vinculado a ${usuario(ob)?.nome||"obreiro"} pela coordenação`); i.novoParaObreiro=true; i.avisoObreiro={ obreiroId:ob, motivo:"coordenacao", em:agoraISO() }; darPontos(ob, PONTOS.seguir, `Recebeu ${nomeBonito(i.nome)} da coordenação`); }
      if(est && prog(ob,est)?.aprovado){ iniciarEstudoCom(i, est); }
      else if(mudou){ i.estudo=null; i.status="alocado"; } });
    UI.sel.clear(); salvar(); fecharModal(); toast(ob==="_remover"?"Alocação removida":`${ids.length} interessado(s) vinculado(s). Avise o obreiro em Lembretes e avisos.`); render();
  }
  if(tipo==="agendar"){
    const dataHora = new Date(v.data+"T"+v.hora).toISOString();
    if(new Date(dataHora).getTime() < Date.now()-5*60000) return toast("Escolha uma data e horário futuros");
    const souInt = me.papel==="interessado";
    const i = interessado(f.dataset.int);
    const virtual = v.tipo==="virtual";
    let link = "";
    if(virtual){ const meu=(v.link||"").trim(); if(meu){ if(!/^https:\/\/\S+$/i.test(meu)) return toast("O link precisa começar com https://"); if(meu!==i.sala){ i.sala=meu; registrar(i.id, "Link da reunião definido: "+meu); } } link = salaDe(i); }
    D.agendamentos.filter(a=>a.interessadoId===i.id && a.status==="confirmado" && new Date(a.dataHora).getTime() < Date.now()).forEach(a=>{ a.status="realizado"; });
    const a = { id:uid(), interessadoId:f.dataset.int, obreiroId:f.dataset.ob, estudoId:v.estudo||"", dataHora, modo:virtual?"Virtual":"Presencial", obs:virtual?"":(v.obs||""), link, status:souInt?"solicitado":"confirmado", criadoPor:souInt?"interessado":"obreiro", criadoEm:agoraISO() };
    D.agendamentos.push(a);
    registrar(i.id, `${souInt?"Pedido de estudo":"Estudo agendado"} para ${fmtDataHora(dataHora)} · ${a.modo}${link?" · link: "+link:a.obs?" · "+a.obs:""}`); i.contatoFeito = true; if(v.estudo && !i.estudoDesejado) i.estudoDesejado = v.estudo;
    if(["alocado","aguardando"].includes(i.status)) i.status="contato";
    darPontos(me.id, PONTOS.agendou, "Estudo agendado");
    salvar(); render(); modalAgendado(a.id);
  }
  if(tipo==="diagnostico"){
    const i = interessado(f.dataset.int); const fd = new FormData(f);
    const resp = {}; DIAG.forEach(q=>{ resp[q.k] = q.tipo==="varios" ? fd.getAll(q.k) : (fd.get(q.k)||""); });
    if(!resp.temas.length) return toast("Marque pelo menos um assunto de interesse");
    i.diagnostico = { resp, em:agoraISO(), por:me.id };
    const res = diagnosticar(resp, i);
    registrar(i.id, `Aula de diagnóstico concluída. Perfil: ${res.perfil[0]||"—"}. Estudos indicados: ${res.recomendados.map(x=>estudo(x.id)?.titulo).join(", ")||"nenhum"}`);
    salvar(); render(); modalVerDiagnostico(i.id);
  }
  if(tipo==="prova"){
    const e = estudo(UI.prova.estudoId); let acertos=0; const erradas=[];
    e.prova.forEach((q,i)=>{ if(+v["q"+i]===q.correta) acertos++; else erradas.push(i); });
    const nota = Math.round(acertos/e.prova.length*100)/10;
    const p = progOuNovo(me.id, e.id); p.tentativas.push({ data:agoraISO(), nota });
    if(nota>=e.notaMinima && !p.aprovado){
      p.aprovado=true; p.aprovadoEm=agoraISO(); p.nota=nota; p.certificado=codigoCert();
      darPontos(me.id, PONTOS.aprovado, `Aprovado em “${e.titulo}” com nota ${fmtNota(nota)}`);
      const i = meuInteressado(); if(i && i.obreiroId) darPontos(i.obreiroId, PONTOS.alunoAprovado, `${nomeBonito(i.nome)} foi aprovado em “${e.titulo}”`);
      if(i) registrar(i.id, `${primeiroNome(i.nome)} foi aprovado(a) na prova final de “${e.titulo}” com nota ${fmtNota(nota)}`);
    }
    salvar(); UI.prova.resultado={ nota, acertos, erradas }; render(); scrollTo(0,0);
  }
});

let tBusca = null;
document.addEventListener("input", ev => {
  const t = ev.target;
  if(t.id==="f-busca" || t.id==="pool-busca"){
    clearTimeout(tBusca); tBusca = setTimeout(()=>{ if(t.id==="f-busca"){ UI.busca=t.value; UI.pagina=0; } else { UI.poolBusca=t.value; UI.poolPagina=0; }
      const pos=t.selectionStart, id=t.id; render(); const n=$("#"+id); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} } }, 250);
    return;
  }
  const e = UI.editEstudo; if(!e) return;
  if(t.dataset.ed){ e[t.dataset.ed] = t.value; }
  else if(t.dataset.lic!=null){ e.licoes[+t.dataset.lic][t.dataset.k] = t.value; }
  else if(t.dataset.opt!=null){ e.prova[+t.dataset.q].opcoes[+t.dataset.opt] = t.value; }
  else if(t.dataset.q!=null && t.dataset.k){ e.prova[+t.dataset.q][t.dataset.k] = t.value; }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if(t.id==="f-status"){ UI.fStatus=t.value; UI.pagina=0; render(); }
  else if(t.id==="f-obreiro"){ UI.fObreiro=t.value; UI.pagina=0; render(); }
  else if(t.id==="f-bairro"){ UI.fBairro=t.value; UI.pagina=0; render(); }
  else if(t.id==="pool-bairro"){ UI.poolBairro=t.value; UI.poolPagina=0; render(); }
  else if(t.id==="al-ob"){ atualizarEstudosAlocacao(); }
  else if(t.dataset.sel){ t.checked?UI.sel.add(t.dataset.sel):UI.sel.delete(t.dataset.sel); render(); }
  else if(t.id==="sel-todos"){ $$sel().forEach(id=>t.checked?UI.sel.add(id):UI.sel.delete(id)); render(); }
  else if(t.id==="imp-arquivo" && t.files[0]){ lerPlanilha(t.files[0]); }
  else if(t.id==="imp-aba"){ escolherAba(t.value); }
  else if(t.dataset.mapa){ UI.import.mapa[t.dataset.mapa] = +t.value; desenharPreview(); }
  else if(t.dataset.logo && t.files[0]){ reduzirImagem(t.files[0], url => { D.config[t.dataset.logo]=url; salvar(); render(); toast("Logomarca atualizada"); }); }
  else if(t.dataset.corr!=null && UI.editEstudo){ UI.editEstudo.prova[+t.dataset.q].correta = +t.dataset.corr; }
});
function $$sel(){ return Array.from(document.querySelectorAll("[data-sel]")).map(x=>x.dataset.sel); }
document.addEventListener("keydown", ev => { if(ev.key==="Escape" && $("#modal-root").innerHTML) fecharModal(); });
window.addEventListener("hashchange", () => { fecharModal(); render(); });
setInterval(() => { if(me && !$("#modal-root").innerHTML && !document.activeElement?.matches("input,textarea,select")) render(); }, 60000);

/* ---------- início ---------- */
(async function iniciar(){
  if(ONLINE){ try{ await iniciarOnline(); }catch(e){ console.error(e); $("#app").innerHTML=`<div class="card" style="margin:40px auto;max-width:520px"><h2>Não foi possível conectar</h2><p class="muted">Verifique sua internet e recarregue a página.</p></div>`; } return; }
  try{ const raw = localStorage.getItem(KEY); if(raw) D = JSON.parse(raw); }catch(e){ D = null; }
  if(!D || !D.usuarios || D.versao!==2){ D = await dadosIniciais(); if(/^#(cadastro|inscricao)/.test(location.hash)){ garantirDados(); limparExemplos(); } }
  garantirDados();
  if(!D.obreiroTeste){ D.obreiroTeste = true; if(!D.usuarios.some(u=>u.email==="obreiro.teste@aldeota.org")) D.usuarios.push({ id:"u-teste", nome:"Obreiro de Teste", email:"obreiro.teste@aldeota.org", senha:await hash("formacao2026"), papel:"obreiro", telefone:"", nascimento:"", origem:"admin", criadoEm:agoraISO() }); }
  ESTUDOS_OFICIAIS.forEach(e=>{ if(!D.estudos.some(x=>x.id===e.id) && !(D.estudosRemovidos||[]).includes(e.id)) D.estudos.unshift(JSON.parse(JSON.stringify(e))); });
  salvar();
  const sid = lerSessao(); me = sid ? usuario(sid) || null : null;
  render();
})();
})();
</script>
