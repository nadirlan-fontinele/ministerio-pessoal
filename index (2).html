o persistente de usar a droga.", "Ocorrência da Síndrome de Abstinência com ansiedade, tremores.", "Todas as alternativas acima."], "correta": 3, "grupo": "Capítulo 5 · Vencendo compulsões"}, {"pergunta": "A pornografia é considerada uma compulsão forte porque libera a seguinte substância no organismo:", "opcoes": ["Cocaína.", "Dopamina.", "Nicotina.", "Endorfina."], "correta": 1, "grupo": "Capítulo 5 · Vencendo compulsões"}, {"pergunta": "Quanto das nossas doenças são enfermidades mentais?", "opcoes": ["Um décimo.", "Dois décimos.", "Cinco décimos.", "Nove décimos."], "correta": 3, "grupo": "Capítulo 6 · Psicossomática: corpo e mente juntos"}, {"pergunta": "Complete: “Quanto mais uma pessoa tem dificuldade de tomar consciência de suas emoções, especialmente as desagradáveis, ...”", "opcoes": ["Ela nunca vai apresentar sintomas psicossomáticos.", "Ela terá menos dificuldade em adoecer.", "Mais provável é que apresente sintomas psicossomáticos.", "Nenhuma alternativa acima."], "correta": 2, "grupo": "Capítulo 6 · Psicossomática: corpo e mente juntos"}, {"pergunta": "Que Jesus promete fazer aos que estão cansados e sobrecarregados? Mateus 11:28", "opcoes": ["Jesus vai aliviá-los.", "Jesus vai desistir deles.", "Jesus não vai ouvi-los.", "Jesus não vai recebê-los."], "correta": 0, "grupo": "Capítulo 6 · Psicossomática: corpo e mente juntos"}, {"pergunta": "Coração, no sentido de mente, tem a ver com:", "opcoes": ["Superestruturas do córtex pré-frontal e frontal no cérebro humano.", "Funciona com pensamentos, sentimentos e comportamentos.", "Local onde profissionais de saúde não têm acesso.", "Todas as alternativas acima."], "correta": 3, "grupo": "Capítulo 7 · Pensando bem"}, {"pergunta": "Quais são as três características de nossos pensamentos?", "opcoes": ["Forma, estilo e conteúdo.", "Forma, estilo e ritmo.", "Conteúdo, estilo e ritmo.", "Forma, conteúdo e ritmo."], "correta": 3, "grupo": "Capítulo 7 · Pensando bem"}, {"pergunta": "Verdades sobre pensamentos saudáveis:", "opcoes": ["Surgem naturalmente.", "Exigem esforço perseverante, consciência e meditação.", "Não precisam ser educados.", "Não precisamos lutar por eles."], "correta": 1, "grupo": "Capítulo 7 · Pensando bem"}, {"pergunta": "Por que pessoas “nervosas” têm dificuldade de conhecer a si mesmas?", "opcoes": ["Porque argumentam que receberam uma carga hereditária do pai ou da mãe descontrolados emocionalmente.", "Porque elas querem continuar sendo assim.", "Porque elas não têm interesse em mudar.", "Nenhuma resposta acima."], "correta": 0, "grupo": "Capítulo 8 · Controle emocional: o que é isso?"}, {"pergunta": "Quais são alguns segredos para amadurecer e adquirir autocontrole saudável dos sentimentos?", "opcoes": ["Cultivar e alimentar a ideia e o desejo de mudar.", "Procurar ajuda em aconselhamento psicológico, se precisar.", "Buscar o autocontrole em Deus.", "Todas as alternativas acima."], "correta": 3, "grupo": "Capítulo 8 · Controle emocional: o que é isso?"}, {"pergunta": "Qual a melhor maneira de ensinar o autocontrole aos filhos?", "opcoes": ["A melhor maneira é não tocar no assunto com eles.", "A melhor maneira é com a própria conduta de bom controle emocional.", "A melhor maneira é dando bronca neles.", "A melhor maneira é comprando livros sobre o assunto para eles."], "correta": 1, "grupo": "Capítulo 8 · Controle emocional: o que é isso?"}]},{"id": "est-marcadas-pela-fe", "titulo": "Marcadas pela Fé", "descricao": "Guia de Estudo Bíblico da Escola Bíblica Novo Tempo, de Cláudia Mattevi Luz, sobre 8 mulheres inspiradoras da Bíblia: Ana, Rode, Abigail, Débora, Maria, Rute, Ester e Eva.", "notaMinima": 7, "oficial": true, "licoes": [{"titulo": "Ana, mulher de oração", "refs": "1 Samuel 1 e 2", "conteudo": "Desde o princípio do mundo, muitas mulheres cresceram com o sonho de encontrar um esposo que as amasse e, consequentemente, lhes concedesse a alegria de ser mãe. Com Ana, não foi diferente. Encontramos sua história nos capítulos 1 e 2 do primeiro livro de Samuel. No relato, lemos que, apesar de ter vivido num contexto diferente do nosso, ela realizou parte de seu sonho de menina: encontrou um esposo que a amava muito.\n\nElcana era um bom marido. No entanto, após algum tempo de casados, Ana se surpreendeu ao descobrir que era estéril. E agora? O que fazer com o sonho de ser mãe e formar uma linda família? Além de sofrer a pressão que envolvia a esterilidade, havia outro fator que trazia mais dor e opressão sobre Ana: a segunda esposa de Elcana, chamada Penina, zombava dela, humilhando-a por sua esterilidade.\n\nDe acordo com 1 Samuel 1:6, “Penina, sua rival, a provocava excessivamente para a irritar, porque o Senhor a tinha deixado sem filhos”. Tente se colocar no lugar dela. Imagine a dor dessa mulher. O tempo passava e nada parecia mudar.\n\nUm dia, como de costume, Elcana, Ana e Penina foram a Siló para adorar a Deus. Ana sabia que o Deus que adorava conhecia o desejo de seu coração e, por isso, rasgou o coração diante dEle. De acordo com 1 Samuel 1:10, “Ana, com amargura de alma, orou ao Senhor e chorou muito”. Em sua prece, ela suplicou a Deus que lhe abençoasse com um filho.\n\nO desejo de Ana era tão intenso que ela fez um voto a Deus, dizendo que, se Ele atendesse seu pedido, ela Lhe daria o filho para que este O servisse. Eis as palavras de Ana: “eu o dedicarei ao Senhor por todos os dias da sua vida, e sobre a cabeça dele não passará navalha” (1Samuel 1:11).\n\nSim, amiga, Ana tinha fé e acreditava que sua história poderia mudar. Por isso, ela orou ao Senhor pedindo um filho e, como gratidão, prometeu devolvê-lo para Sua obra.\n\nDeus ouviu o clamor de Ana, e, no ano seguinte, ela recebeu seu filho nos braços. A criança recebeu o nome de Samuel, que quer dizer “ouvida por Deus”. Ana cuidou do filho até que ele completasse três anos de idade, quando, então, cumpriu seu voto e levou Samuel para a casa do Senhor, em Siló.\n\nAna nos inspira com sua história: é um exemplo de mulher de oração, perseverante, persistente, grata, humilde e de muita fé. Ela não permitiu que as palavras negativas, maldições e provocações fossem superiores a sua fé. Será que você e eu suportaríamos tudo o que Ana suportou por muitos anos e, ainda assim, permaneceríamos fiéis ao Senhor? Sua fé e obediência são suficientes para confiar no impossível de Deus?\n\nAna teve de aprender a orar, confiar, entregar e esperar por Deus. Quando recebeu o milagre das mãos de Deus, fez uma linda oração em forma de canção. Seus lábios proferiram palavras vindas do coração para que mulheres de todas as eras, como você, as lessem, apreciassem, aprendessem e imitassem.\n\nObserve a essência do cântico comovente de Ana em 1 Samuel 2:1-10.\n\n• Salvação de Deus: “Me alegro na Tua salvação” (verso 1).\n• Santidade de Deus: “Ninguém é santo como o Senhor” (verso 2).\n• Força de Deus: “Não há rocha como o nosso Deus” (verso 2).\n• Sabedoria de Deus: “O Senhor é o Deus da sabedoria” (verso 3).\n• Poder de Deus: Só Deus tem o poder de dar força aos fracos, alimentar os famintos, transformar as estéreis em férteis, ressuscitar os mortos, curar os enfermos, tornar ricos os pobres e fazer com que os humildes sejam exaltados (versos 4-8).\n• Julgamentos de Deus: “O Senhor destrói os seus inimigos” (verso 10).\n\nQue maravilhoso cântico de glória! Você pode entoá-lo a Deus da mesma forma que Ana. Medite sobre os atributos e ações de Deus que ela menciona no cântico. Em cada acontecimento ou dificuldade da sua vida, procure concentrar-se na pessoa e poder de Deus e não nas circunstâncias. Tenha confiança na soberania de Deus e em Seu amor. Descanse na certeza de que Deus controla todos os acontecimentos de sua vida.\n\nÉ gratificante saber que Ana atingiu tal maturidade espiritual em seu relacionamento com o Criador. Contudo, temos de reconhecer que não deve ter sido fácil para ela voltar sozinha, de Siló, tendo contato com seu filho apenas uma vez por ano. 1 Samuel 2:18 e 19, declara que “Samuel ministrava diante do Senhor, sendo ainda menino, vestido de uma estola sacerdotal de linho. Sua mãe lhe fazia uma túnica pequena e, de ano em ano, a levava para ele quando ia com o seu marido oferecer o sacrifício anual”.\n\nCom certeza a paz de Deus, que excede todo o entendimento, fez com que Ana vencesse a saudade e glorificasse a Deus por ouvir sua oração. Desta forma, o Senhor acrescentou a ela outros filhos e filhas. “Assim, o Senhor abençoou Ana e ela engravidava. Teve mais três filhos e duas filhas. E o menino Samuel crescia diante do Senhor” (1Samuel 2:21).\n\nTalvez sua situação não seja a mesma que a de Ana.\n\nPode ser que outro motivo esteja tirando sua paz, alegria, esperança, motivação ou até mesmo a vontade de viver. Ana era uma mulher como você e eu. A diferença pode estar na maneira como temos enfrentado nossas dificuldades na presença do Senhor.\n\nA Bíblia oferece diversos exemplos de respostas a orações, e podemos comprovar que a história de Ana é evidência do poder da oração. A história dela nos ensina que esperar por algo não é uma maldição. Na verdade, Deus pode usar a espera para produzir uma bênção, ao permanecermos fiéis a Ele. Sim, minha amiga, a espera é uma oportunidade nas mãos de Deus para desenvolver nossa fé e nossa confiança nEle. Ninguém perde por esperar e confiar em Deus.\n\nConfie em Deus, caminhe com Ele: esta é a lição da história de Ana. Independentemente da sua situação hoje, independente do milagre que você espera, Deus já está lá, no tempo dEle, pronto para responder seu clamor e entregar o milagre que você pediu.\n\nQuerida amiga, seja uma coluna de oração. Ore constante e fervorosamente pela sua família e filhos. Seja uma mulher como Ana: de poucas palavras, mas de muita fé e joelhos no chão. Mova os céus através de suas ardentes orações em favor do seu lar. Somente assim podemos alcançar bênçãos sem medidas vindas de nosso Senhor.\n\n## Para estudar na Bíblia\n\n> Que passo Ana deu em sua tristeza por não ter filhos? 1 Samuel 1:9-11.\n\n> Quem se dirigiu a ela enquanto orava no templo? 1 Samuel 1:12-14.\n\n> Ana abriu seu coração sincero com quais palavras? 1 Samuel 1:15-16.\n\n> O que nos diz o cântico de Ana e o que podemos aprender com essa belíssima oração? 1 Samuel 2:1-11.\n\n## Aprendendo com Ana\n\n1. Mãe intencional, dedicou Samuel a Deus, e ele se tornou profeta.\n2. Mulher com domínio próprio e muita fé, não revidou Penina de forma alguma, mas acreditou na justiça e promessa de Deus.\n3. Mulher corajosa, que confiou em Deus ao deixar seu filho Samuel ser educado por outra pessoa; ela não pensou em si mesma, mas no grandioso Deus, em quem sempre confiou.\n\n## Oração do dia\n\nSenhor, obrigada pelo Seu perfeito sentido de tempo. Nunca se atrasa no cumprimento de todas as promessas. Me ajude a manter o foco no Senhor, em Sua lealdade e a manter meus olhos fixos em Seu amor e em Sua graça.\nQue eu possa crescer em fé enquanto aguardo ansiosa pelo que vai fazer em minha vida. Em nome de Jesus.\nAmém."}, {"titulo": "Rode, serva fiel", "refs": "Atos 12:1-19", "conteudo": "A Bíblia conta a história de muitas mulheres que poderíamos chamar de famosas, por serem sempre lembradas em sermões, meditações e livros. Mas ela também possui relatos de mulheres desconhecidas que, por não serem mencionadas com frequência, ficam no anonimato. Vamos conhecer uma dessas mulheres.\n\nO nome dela é Rode, que significa “rosa”. Tendo vivido no primeiro século da era cristã, Rode, a serva fiel, é mencionada apenas uma vez na Bíblia, mas sua história merece atenção e estudo. Afinal, trata-se de um evento importante. Com certeza essa história nos dará vislumbres preciosos do poder e do significado da oração.\n\nSegundo o relato bíblico, Rode era criada e integrante do grupo de oração de Maria, mãe de João Marcos. Esta cedia sua casa para os cristãos congregarem durante a primeira perseguição ordenada por Herodes. Não sabemos a idade de Rode, não temos muitas informações sobre ela, mas sabemos que ela vivenciava a oração bem de perto.\n\nPodemos dizer com certeza que Rode era uma intercessora, pois não há como viver em um ambiente de oração sem ser contagiada por ela. Por isso, cremos que Rode era uma mulher de oração.\n\nCerta madrugada, os cristãos, inclusive Rode, estavam orando pela libertação de Pedro, que fora preso por causa do nome de Jesus. Desde que Tiago, irmão de João, fora morto, a igreja temia que Pedro tivesse o mesmo destino.\n\nPor isso, oravam e suplicavam em favor da vida do apóstolo. Só que esse grupo de oração desconhecia o fato de que Pedro já havia sido liberto miraculosamente por um anjo, de acordo com o relato de Atos 12:7-11.\n\nPedro decidiu ir à casa de Maria, onde sabia que estaria em segurança, por se tratar de uma família amiga. Segundo Atos 12:12, “Pedro resolveu ir à casa de Maria, mãe de João, também chamado Marcos, onde muitas pessoas estavam congregadas e oravam”. Quando Pedro chegou à residência, bateu na janelinha do portão.\n\nNote que o texto diz que ali “muitas pessoas estavam congregadas e oravam”. Durante a reunião de oração, Rode ouviu a batida no portão e correu para lá.\n\nA audição de Rode poderia ser diferenciada, pois ela era uma criada e deveria estar sempre atenta às necessidades das pessoas à sua volta. O verso 13 diz: “Quando ele bateu à porta da frente, uma empregada, chamada Rode, foi ver quem era”.\n\nRode não viu quem batia, mas reconheceu imediatamente a voz de Pedro e ficou radiante. Sua alegria foi tão grande que ela não abriu a porta. Ela deixou Pedro do lado fora e voltou correndo para avisar aos que estavam orando que o apóstolo se encontrava à porta. Os cristãos não creram em Rode e chegaram a questionar sua sanidade. Não acreditaram que Pedro estava à porta, mas, sim, o anjo de Pedro, pois era comum, naquela época, receberem a visita de anjos.\n\nTodos sabiam que Pedro havia sido levado para uma prisão altamente segura e bem guardada por muitos soldados. Rode nunca duvidou de quem era a voz que lhe falou no portão. Ela estava comovida, mas não surpresa pelo fato de Deus ter ouvido as orações da congregação.\n\nRode não precisou ver para crer, ao contrário dos demais, que tiveram de abrir o portão e ver Pedro com seus próprios olhos. O verso 16 diz que eles se espantaram, mesmo vendo Pedro: “Enquanto isso, Pedro continuava batendo. Quando abriram a porta, viram-no e ficaram admirados”.\n\nRode teve fé suficiente para saber que Deus respondia às suas orações, mesmo que fosse de maneira inesperada. Ela aprendera que a oração produz resultados extraordinários! Uma jovenzinha com coração de serva; cuidava não somente da casa de Maria, mas fazia parte dos momentos de oração e a sua fé contagiava a todos. Ela acreditou imediatamente que o milagre pelo qual oravam estava à porta, pronto para testemunhar a todos o que Deus havia feito.\n\nQuantas vezes as situações que encontramos na vida se transformam de dia em noite, de brisa em vendaval, de paz em aflição? Saiba que Deus vê! A Bíblia diz que os olhos do Senhor estão sobre você, amada de Deus.\n\nRode orava pela vida de Pedro, e é preciso se dispor a orar. O texto bíblico deste estudo que merece atenção está em Atos 12:5, que diz: “havia oração incessante a Deus por parte da igreja”. Rode estava em oração! A situação de Pedro parecia uma causa perdida, uma tribulação sem solução, mas “havia oração incessante”. Podemos dizer, sem medo de errar: Rode estava orando incessantemente, crendo que Deus era poderoso para operar o milagre de acordo com a Sua vontade.\n\nIsso quer dizer que a oração fez toda a diferença na vida de Rode e de todos que oravam. O poder da oração daquele grupo libertou Pedro da prisão, ajudou-os a exercer a fé, a dar testemunho e demonstrar gratidão a Deus por ter ouvido as orações e enviado um anjo em favor do apóstolo. Isso nos faz lembrar o quanto devemos orar uns pelos outros em todos os momentos. Temos a responsabilidade de interceder cada dia mais, pois o que o braço da carne não pode fazer, Deus faz!\n\nRode, a humilde serva, nos ensina que devemos orar crendo. E, se aprendermos a orar crendo, veremos que os milagres de Deus já estão batendo à porta.\n\n## Para estudar na Bíblia\n\n> O que a igreja fazia por Pedro enquanto ele estava preso? Atos 12:5.\n\n> O que aconteceu com Pedro e o que torna essa história incrível? Atos 12:6-11.\n\n> Quem atendeu à porta da casa de Maria quando Pedro bateu? Atos 12:13.\n\n> Como Rode reagiu diante da descrença das outras pessoas que oravam? Atos 12:15.\n\n## Aprendendo com Rode\n\n1. Acreditar no milagre, mesmo sem vê-lo, e no poder libertador de Deus.\n2. Deus envia anjos para nos libertar.\n3. Orar sem cessar e interceder pelos outros.\n4. O fruto do Espírito é amor, alegria, paz, longanimidade, benignidade, bondade, fidelidade, mansidão e domínio próprio (Gálatas 5:22-23).\n\n## Oração do dia\n\nSenhor, obrigada por me prometer um futuro, obrigada por atender as minhas orações conforme a Sua vontade. Que, através da oração, eu encontre respostas. Obrigada por me ensinar que o amor é paciente, benigno, não se conduz inconvenientemente, não se exaspera (1Coríntios 13:4-5). Em nome de Jesus.\nAmém."}, {"titulo": "Abigail, a bela corajosa", "refs": "1 Samuel 25:1-35", "conteudo": "Vivemos numa sociedade em que cada mulher pode escolher se casar ou não com determinado homem. Essa é a cultura de nosso país, embora não seja a realidade em todas as culturas. Apesar de muitas mulheres serem infelizes por suas próprias escolhas, Abigail, a personagem de nosso estudo, não podia opinar e nem escolher, pois em sua época os casamentos eram escolhidos pelos pais.\n\nA Bíblia retrata Abigail como uma mulher bela, inteligente e corajosa. No entanto, seu esposo, Nabal, era um homem grosseiro, tolo e maligno. Isso é o que está registrado em 1 Samuel 25:3. Sendo um homem de muitas posses, ele tinha três mil ovelhas e mil cabras. Quando Davi soube que Nabal estava tosquiando suas ovelhas no Carmelo, enviou mensageiros para pedir a Nabal algum sustento para seus homens.\n\nNabal enviou a seguinte resposta a Davi: “Quem é Davi? E quem é o filho de Jessé? Muitos são, hoje em dia, os servos que fogem do seu senhor. Vocês acham que eu vou pegar o meu pão, a minha água e a carne dos animais que abati para os meus tosquiadores e dar a homens que eu não sei de onde vêm?” (1Samuel 25:10, 11).\n\nQuando Davi soube da resposta, foi tomado de tão grande ira que resolveu subir com quatrocentos homens contra Nabal. Davi reagiu com rapidez e determinou uma vingança impensada. Avisada por um servo, Abigail agiu de forma sábia e rápida para evitar que todos de sua casa fossem mortos.\n\n“Então Abigail pegou, a toda pressa, duzentos pães, dois odres de vinho, cinco ovelhas preparadas, cinco medidas de trigo tostado, cem cachos de passas e duzentas pastas de figos, e pôs tudo sobre jumentos. Então disse aos seus servos: — Vão na minha frente, que eu vou logo atrás. Porém ela não contou nada a seu marido Nabal” (1Samuel 25:18, 19).\n\nEla foi se encontrar com Davi, com humildade e calorosa hospitalidade, para conversar. Seu objetivo era fazê-lo desistir da vingança contra Nabal e seus servos. A sabedoria e a doçura de Abigail chamaram Davi de volta à razão, e sua simplicidade o desarmou. Ela usou toda sua criatividade e força para minimizar os danos causados pelo marido tolo. Ao ir contra seu esposo, ela agiu para salvar a vida dele e de todo o seu povo.\n\nEla poderia ter se calado diante do medo e permanecido imóvel naquela situação caótica. Poderia ter se mostrado uma esposa ressentida, procurando acusar o marido, mas seu discurso foi absolutamente honesto, provando que Abigail era habilidosa com as palavras. Ela mostrou compaixão para com o marido ao afirmar a Davi que o ocorrido, na verdade, tinha sido um grande mal-entendido.\n\nAbigail deu a entender que, por estar ausente naquele momento, não pôde ajudá-los nem oferecer a hospitalidade que mereciam. Suas palavras não foram de uma traidora, mas de uma mulher apaziguadora, que abrandou o coração de Davi e o fez desistir do seu intento de vingança contra Nabal.\n\nAbigail era uma líder singular. Mulher de fé, agiu de forma sábia ao alimentar Davi e seus homens após a atitude impensada de Nabal. Ela fez isso a fim de salvar a vida daqueles que pertenciam à sua casa.\n\nAo chegar em casa, depois de livrar seu povo da morte, mais uma vez a sabedoria de Abigail fez toda a diferença. O esposo inconsequente, dando uma festa em sua casa, estava muito embriagado. Então Abigail preferiu dormir e conversar com Nabal no outro dia, após o efeito da bebida passar, e assim ela o fez (1Samuel 25:36).\n\nNo outro dia, contou para o esposo tudo sobre a atitude de Davi. Inexplicavelmente, Nabal ficou aterrorizado e, algum tempo depois, veio a falecer. Ao saber da morte de Nabal, Davi, o ungido de Deus, não perdeu tempo e pediu Abigail em casamento! Com sua atitude de prudência, hospitalidade e sabedoria, ela certamente ganhou a confiança e o respeito de Davi.\n\nPodemos aprender com Abigail a importância de ter prioridades corretas, fazer boas escolhas, ter autoestima saudável e agir na hora certa. Além disso, aprendemos que devemos ser independentes emocionalmente e pensar no bem de todos. Podemos aprender, também, como mudar o rumo da história fazendo escolhas acertadas. Quando Abigail se manifestou nessa história, o tom mudou da treva para a luz, e ela compreendeu o poder da humanidade quando tem o poder de Deus por trás.\n\n## Para estudar na Bíblia\n\n> Qual foi a reação de Davi quando ele soube que Nabal recusou alimentar seus homens? 1 Samuel 25:12-13.\n\n> Um dos servos de Nabal contou a Abigail o que tinha acontecido. Como o servo chamou Nabal? 1 Samuel 25:14-17.\n\n> Como mulher inteligente e apaziguadora, o que fez Abigail? Quais foram os suprimentos que ela proveu? O que isso sugere a respeito dela? 1 Samuel 25:18-20.\n\n> Ao chegar à casa, como Abigail encontrou seu esposo? Qual foi a reação dela? 1 Samuel 25:36.\n\n> O que Abigail fez no dia seguinte, e como ficou Nabal? 1 Samuel 25:37.\n\n> Após alguns dias, o que ocorreu com Nabal? 1 Samuel 25:38.\n\n> Leia Provérbios 31:10-31. Essa passagem bem conhecida descreve a “esposa exemplar”. Que traços dessa mulher Abigail possuía?\n\n> A Bíblia diz que, para sermos sensatos como Abigail, precisamos “temer a Deus”. Como você compreende o temor a Deus? Deuteronômio 10:12.\n\n## Aprendendo com Abigail\n\n1. Pensar no próximo e não somente em mim mesma.\n2. Confio em Deus mesmo quando sou injustiçada.\n3. Reajo à injustiça confiando em Deus.\n\n## Oração do dia\n\nSenhor, Tu és o meu refúgio, um apoio sempre presente nos tempos de angústia. Hoje, oro para que me envolva em Teus braços e me proteja. Dá-me paz quando eu estiver ansiosa e descanso quando eu estiver sobrecarregada. Como é bom saber que tenho em quem confiar e esperar. Em nome de Jesus.\nAmém."}, {"titulo": "Débora, uma mulher notável", "refs": "Juízes 4 e 5", "conteudo": "Uma dona de casa foi escolhida para servir à sua nação. Para entendermos quem foi essa mulher preciosa, precisamos compreender o contexto e as circunstâncias em que ela vivia. Antes de Débora exercer sua liderança incomum e de demonstrar sua capacidade de tomar decisões para salvar a nação das dificuldades, ela foi dona de casa, esposa e mãe em Israel. Sua compaixão foi despertada pelas crueldades que seu povo estava sofrendo.\n\nEla tomou a iniciativa e colocou-se à disposição. Não sendo de linhagem aristocrática, ela é identificada simplesmente como a “mulher de Lapidote”. Débora foi a única mulher das Escrituras elevada a um alto cargo político por seu próprio povo. Antes disso, foi moldada por Deus em seu lar, desenvolvendo seus afazeres domésticos com muito zelo e exercendo a maternidade espiritual, sendo chamada de mãe de Israel, mãe de muitos filhos e filhas (Juízes 5:7), antes de tornar-se juíza.\n\nEm uma nação de escassa espiritualidade, caracterizada pela rejeição a Deus e por uma obstinação do povo, pois cada um agia do seu próprio modo (Juízes 17:6; 21:25), Débora foi, antes de tudo, uma conselheira ao demostrar sua liderança à sombra de uma palmeira próxima à sua casa, sugerindo soluções para pessoas com problemas.\n\nO sistema judicial civil era confuso e incoerente; o exército era fraco demais para defender as fronteiras do país; o sacerdócio, daquilo que havia sido uma teocracia, era impotente, prejudicando a vida em sua normalidade. Foi exatamente nesse contexto que Débora se tornou juíza e, por fim, uma libertadora do seu povo num tempo de guerra.\n\nDeus surpreendeu a todos ao levantar uma mulher para ser juíza em meio a um contexto difícil, no qual Seu povo era oprimido por um reino que adorava outros deuses, um povo pagão e em decadência moral. Os israelitas foram entregues a Sísera e, sob seu domínio, sofriam a consequência de sua inconstância e infidelidade.\n\nDevido à perseguição de Jabim, rei da Canaã, aos israelitas, Débora convocou Baraque, da tribo de Naftali, para formar um exército e guerrear contra Jabim, cujas tropas eram comandadas por Sísera.\n\nO respeito que Débora conquistou no meio de Israel era tão significativo que Baraque estabeleceu uma condição para atender ao pedido dela: “Então Baraque disse a Débora: — Se você for comigo, irei; mas, se você não for comigo, não irei” Juízes 4:8. Este texto é uma prova do significado que as mulheres têm na obra de Deus.\n\nNo passado, Deus havia falado com Moisés e Josué. Agora ele estava falando por meio de Débora, uma juíza e libertadora. Sob sua liderança, Baraque convocou o exército de israelitas e derrotou os inimigos do povo de Deus. A destruição do poder cananeu foi imortalizada por Débora e Baraque num exemplo do que havia de mais refinado na poesia hebraica: um cântico de louvor a Deus. Nesse cântico são descritos os acontecimentos que deram a vitória ao povo de Israel (Juízes 5).\n\nA vida de Débora não está registrada por acaso na Bíblia. Deus tem muito a nos ensinar através dessa mulher forte e fiel. A sabedoria de Débora não vinha dela mesma, mas do Senhor. Quando decidimos servir a Deus e a Seu povo, nós precisamos de muita sabedoria, e Deus nos dá se pedimos com fé, segundo Tiago 1:5-6.\n\nNós, mulheres, precisamos desta sabedoria para educar nossos filhos; para sermos apoio ao nosso marido; para aconselharmos amigos; e para sermos bênçãos em nossos relacionamentos na igreja ou na sociedade. Aprendemos com Débora e seu exemplo que Deus pode usar mulheres que se dispõem a servir mesmo em meio a dificuldades, pecados e maldades. Assim como Deus tinha um plano grandioso para Débora, com certeza Deus também tem um plano lindo para sua vida.\n\nGostaria que você ponderasse sobre a possibilidade de ser a resposta da oração de alguém por ajuda e libertação. Pense nisso: você pode ser uma luz e uma bênção de Deus na vida de muitas pessoas que estão ao seu redor, mesmo que o contexto de sua vida seja desfavorável, como era no caso de Débora.\n\nPense comigo: qual é o contexto em que Deus nos colocou para servi-Lo? Em nossa vizinhança, trabalho, faculdade, como cristãs, nos deparamos com pessoas que praticam o mal. Débora nos ensina que Deus levanta mulheres fiéis, fortes e piedosas, para cumprir Seus propósitos. Lembre-se sempre: mesmo em meio às circunstâncias difíceis, você pode ser um instrumento maravilhoso em sua geração, assim como Débora foi na dela.\n\nDeposite sua vida nas mãos de Deus e decida servi-Lo todos os dias. Assim como Ele esteve ao lado de Débora, Ele promete estar ao seu lado “todos os dias até o fim dos tempos” (Mateus 28:20).\n\n## Para estudar na Bíblia\n\n> Que instrução Débora deu a Baraque? Juízes 4:4-8.\n\n> Baraque respondeu com que pedido incomum? Juízes 4:8.\n\n> Leia o relato da batalha e em poucas palavras escreva o que compreendeu. Juízes 4:10-16.\n\n> De acordo com Débora, quem a fez dominar sobre os poderosos? Juízes 5:13.\n\n## Aprendendo com Débora\n\n1. Débora não buscou a posição de juíza, mas nos mostrou o caminho da sabedoria.\n2. Débora esperou em Deus e incentivou outras pessoas a assumirem a liderança.\n3. Débora foi uma mulher virtuosa; possuía atitudes e princípios morais.\n4. Débora foi uma mulher cujo coração era semelhante ao de Deus. O seu coração era “firme, confiante no Senhor” (Salmos 112:7).\n\n## Oração do dia\n\nSenhor, que o meu coração seja bom, para que minha boca fale do que ele estiver cheio: louvor, gratidão, honra, amor, júbilo e adoração. Meu Pai querido, me use a todo tempo e onde desejar. Em nome de Jesus.\nAmém."}, {"titulo": "Maria, mãe de Jesus", "refs": "Lucas 1:26-38", "conteudo": "De todas as mulheres da Bíblia, Maria, a mãe de Jesus, foi a mais honrada de todas por ter sido escolhida para dar à luz o Messias, o Salvador do Mundo. Isaías falou dela ao profetizar: “Portanto, o Senhor mesmo vos dará um sinal: eis que a virgem conceberá e dará à luz um filho e Lhe chamará Emanuel” (Isaías 7:14).\n\nMateus apresenta Maria de Nazaré como a esposa prometida de José, um homem “justo” (Mateus 1:19). É bom destacar que Maria ainda não estava casada com José e que, por isso mesmo, eles ainda não haviam tido relações íntimas. Quando o anjo Gabriel apareceu anunciando o futuro nascimento de Jesus (Lucas 1:26-28), a resposta de Maria revelou sua perfeita compreensão das Escrituras, sua humildade e sua disposição em obedecer a Deus. Veremos sua resposta um pouco mais abaixo.\n\nO anjo iniciou o comunicado celestial dizendo que Maria era “agraciada” por Deus. Será que não queremos ser chamadas assim também? Nós não desejamos repousar na segurança de que o Senhor nos vê e nos aprova? A boa nova que o anjo anunciou a Maria sobre a vinda de Deus à Terra nos oferece o repouso que nossa alma tanto deseja.\n\nPodemos dizer que Maria faz parecer muito fácil seguir o plano de Deus, pois a encontramos perguntando ao anjo, em Lucas 1:34: “Como será isto, se eu nunca tive relação com homem algum?”. Não se tratou de dúvida com relação ao plano de Deus, mas do desejo de saber qual era o plano, pois, sendo ela virgem, uma gravidez seria impossível aos olhos humanos.\n\nSegundo as palavras do anjo, Maria receberia em seu ventre o Filho de Deus: “O Espírito Santo virá sobre você, e o poder do Altíssimo a envolverá com a sua sombra; por isso, também o ente santo que há de nascer será chamado Filho de Deus” (Lucas 1:35). Maria respondeu: “Aqui está a serva do Senhor; que aconteça comigo o que você falou” (Lc 1:38). Maria disse sim, com toda convicção. Uma resposta cheia de confiança e resignação.\n\nEm outras palavras, Maria disse: “quero fazer parte desse plano maravilhoso, que aconteça comigo conforme tua palavra, que o que foi dito para mim se cumpra!” Em resumo, ela está dizendo: “Sim, sou uma serva.” Isabel, em Lucas 1:45, diz que a jovem foi abençoada porque creu no que Deus disse que faria.\n\nMaria representa aquela fé genuína fruto de um relacionamento próximo com Deus. Maria temia ao Senhor, e mostrava através de sua vida que, mesmo sendo humana e não compreendendo sempre o que lhe acontecia, queria confiar e viver para Deus.\n\nMaria entregou seu corpo como instrumento para operação do Espírito Santo, mesmo sabendo que poderia ser julgada e mal compreendida. Ela resolveu confiar de todo coração e alma, e esta confiança e submissão agradou o coração de Deus.\n\nA mãe de Jesus é um exemplo de mulher de fé, coragem, força e humildade. Sua vida e trajetória nos trazem lições sobre como ser uma mulher especial e cheia da graça do Senhor. Maria torna-se um exemplo a ser seguido para todas as mulheres em todos as épocas e em todos os lugares.\n\nAo confiarmos nas palavras do anjo, ao crermos que o Filho de Deus foi enviado ao mundo como Salvador, também recebemos um favor imerecido. Como Maria, também podemos declarar: “(Ele) atentou para a humildade da sua serva” (Lucas 1:48). Que nossa confiança em Cristo não só nos salve como também defina tudo o que fazemos, dizemos e pensamos.\n\nSe pararmos para refletir, diante dos nossos temores e inseguranças, fugimos dos propósitos de Deus, mesmo sabendo que Ele “é poderoso para fazer infinitamente mais do que tudo o que pedimos ou pensamos, conforme o seu poder que opera em nós” (Efésios 3:20).\n\nCom certeza, Maria e José tiveram outros filhos, de acordo com Marcos 3:32; 6:3. Ela, provavelmente, tenha ficado viúva logo cedo, mas isso não impediu que resplandecesse como esposa fiel e mãe dedicada. As aparições públicas de Maria ao pé da cruz (João 19:25) e em oração após a ascensão do Senhor (Atos 1:12-14) mostraram ao mundo a sua coragem e fizeram com que fosse marcada como “um dos seguidores dEle”, o que a tornava alvo da perseguição, juntamente com os discípulos.\n\nNenhum outro ser foi mais íntimo de Jesus na Terra do que sua mãe, Maria. Todos os evangelhos e o livro de Atos falam sobre ela como uma mulher preparada de modo especial para participar da vida do seu filho na Terra. Como mãe, ela é igual a qualquer uma de nós, mas foi escolhida e abençoada para ser a mãe do nosso Senhor.\n\nNós, mulheres contemporâneas, podemos olhar para Maria, essa mulher do passado, que nos ensina tanto ainda hoje, e ter a certeza de que Deus tem propósitos para nossa vida, mesmo nos sentindo pequenas e frágeis. Deus tem uma missão para cada uma de nós, e é Ele quem nos dará coragem para, apesar dos nossos medos e incertezas, olharmos para a vida e dizer: “Que aconteça comigo conforme Deus quer.”\n\n## Para refletir\n\n• Deus está mais interessado em nossa confiança do que em nosso talento.\n• Quando estamos preenchidos com Cristo, Ele vive por meio de nós.\n• Nossa confiança em Jesus define tudo o que fazemos, dizemos e pensamos.\n• Se nos entregarmos a Deus, Ele cumprirá Seus planos em nossa vida, e nos transformará em bênçãos para todas as pessoas.\n\n## Para estudar na Bíblia\n\n> Com que palavras o anjo Gabriel se dirigiu a Maria? Lucas 1:28.\n\n> Como deveria se chamar o filho que Maria daria à luz? Lucas 1:30-33.\n\n> Como Maria demonstrou que precisava de mais informações do anjo Gabriel? Lucas 1:34.\n\n> Segundo o anjo Gabriel, por que Jesus seria reconhecido como o Filho de Deus? Lucas 1:35.\n\n> Quando Maria soube que daria à luz o Messias prometido, qual foi sua resposta ao anjo? Lucas 1:38.\n\n> Em sua opinião, quais foram os sentimentos de Maria ao ouvir as palavras ditas pelo anjo Gabriel?\n\n> Qual foi a reação de José quando soube que Maria estava grávida? Mateus 1:18-20.\n\n## Aprendendo com Maria\n\n1. Jesus veio ao mundo por meio de pessoas comuns e tornou-Se parte da vida humana.\n2. Quando Cristo habita em nós, nossa identidade se torna extraordinária.\n3. O reino de Deus se manifesta em pessoas humildes que colocam o Senhor em primeiro lugar.\n\n## Oração do dia\n\nSenhor, obrigada por ser um Deus que deseja habitar entre o Teu povo e dentro de cada um. Mesmo que sejamos pecadores sem virtude, Tu ainda escolhes viver no nosso coração. Hoje, permita que a Tua presença em nós seja luz! Esteja à frente de tudo o que fizermos e de tudo o que somos. Nós Te amamos. Em nome de Jesus.\nAmém."}, {"titulo": "Rute, mulher virtuosa", "refs": "Rute 1-4", "conteudo": "A Bíblia conta muitas histórias de mulheres fascinantes. A maioria delas pertencia ao povo de Israel; no entanto, a Bíblia também conta sobre mulheres que pertenciam a outros povos. Uma dessas é Rute, que dá nome a um dos livros da Bíblia. O livro de Rute é uma definição de ética, um manual moral e espiritual que tem utilidade especial em tempos pós-modernos. Impressiona o destaque dado ao valor de gestos de amor, respeito e lealdade para com as pessoas idosas, as viúvas, os estrangeiros e os pobres.\n\nTudo começou quando Elimeleque, sua esposa Noemi e seus dois filhos, Malom e Quiliom, foram para a terra de Moabe a fim de fugirem da fome que se abatia sobre Israel. Em Moabe, infelizmente, Elimeleque veio a falecer. Então, os dois filhos de Noemi se “casaram com mulheres moabitas. O nome de uma delas era Orfa, e o nome da outra era Rute. E ficaram ali quase dez anos” (Rute 1:4).\n\nQuando os seus dois filhos também morreram na terra de Moabe, Noemi decidiu voltar para a terra de Israel. Noemi, com um coração compreensível, despede-se de suas duas noras para que elas voltassem para junto de seus parentes. Orfa aceitou e voltou para sua casa, no entanto Rute não quis deixar a sogra.\n\nRute disse a Noemi que permaneceria junto a ela, proferindo um dos mais lindos textos das Sagradas Escrituras: “Não insista para que eu a deixe nem me obrigue a não segui-la! Porque aonde quer que você for, irei eu; e onde quer que pousar, ali pousarei eu. O seu povo é o meu povo, e o seu Deus é o meu Deus” (Rute 1:16).\n\nEssas palavras dizem tudo sobre a mulher extraordinária que foi Rute, e é muito lindo pensar sobre essa moabita que superou limites, vivenciou uma grande mudança, abençoou a sua sogra e foi resgatada por um homem cheio de coragem, como veremos a seguir. Rute e Noemi não pareciam promissoras, no entanto, só alcançaram florescimento extraordinário através do exercício do amor, da fé e da esperança.\n\nA beleza do caráter espiritual de Rute era fascinante. Dentre suas muitas características, destacam-se as seguintes forças: amor, bondade, generosidade, lealdade, gratidão, esperança, espiritualidade, fé, religiosidade, bravura, perseverança e integridade. Tais características positivas são indicadores de longevidade, segundo pesquisas em psicologia positiva — estudo científico dos potenciais humanos —, e fazem com que indivíduos e comunidades floresçam.\n\nO coração de Rute estava conectado ao coração de sua sogra, e nós sabemos que a religião viva reforça o sistema de crenças, e as pessoas se conectam quando têm opiniões e objetivos em comum. A fé também proporciona a atribuição de significados a eventos, oferecendo esperança, e a esperança reduz o estresse. Além de a espiritualidade ser um fator que contribui para a saúde física, também auxilia no desenvolvimento intelectual.\n\nA esperança, a força e a emoção positivas que surgem de calamidades, incertezas e perdas eram exercitadas por Rute em grande escala. Ela teve responsabilidade e postura positiva com relação ao futuro, além de esforço no alcance de seus objetivos. Rute também praticava a força da gratidão, um dos maiores marcadores do bem-estar, o qual envolve amor e apreciação pela vida e por Deus. Essa nobre força de caráter e emoção positiva abre o coração para retribuirmos a quem nos ajudou. Rute foi uma mulher cheia de fé, casou-se com um Israelita e teve o privilégio de ouvir mais sobre o que Deus era capaz de realizar.\n\nQuando Rute selou um pacto de permanência com Noemi, também selou um pacto de amor e obediência incondicional a Deus. Ao tomar essa decisão, a vida de Rute não foi fácil. Ela tornou-se catadora de espigas, conforme o relato de Rute 2:2, 3. As espigas que eram desprezadas eram coletadas por Rute. Logo após iniciar seu trabalho de catadora, Rute conheceu Boaz, um parente próximo de seu sogro falecido, Elimeleque.\n\nAqui, para quem gosta de um bom romance, percebe em Boaz as caraterísticas de um homem maduro. Boaz não mediu esforços para resgatar sua amada, conforme uma lei de Israel. Rute, a catadora de “sobras”, casou-se com Boaz, ficou grávida e tornou-se bisavó do rei Davi.\n\nMeditando nesta história, gostaria que você refletisse em três pontos. Em primeiro lugar, compreenda o quanto Deus ama você. Acredite que, apesar das perdas, Deus pode transformar a sua vida. Em segundo lugar, aceite a condição em que você vive hoje. Seja grata! Deus está ao seu lado. Por fim, decida viver para servir. Rute renunciou a si mesma para amar o próximo, no caso, a sua sogra, e, por isso mesmo, foi abençoada por Deus. Você pode servir em casa, na comunidade e no seu trabalho.\n\n## Para estudar na Bíblia\n\n> O que disse Rute a Noemi? Que lição podemos extrair dessa confiança em Deus? Rute 1:16.\n\n> O que Rute sugeriu que poderia fazer para prover alimento para ambas? Como Noemi incentivou o plano de Rute? Rute 2:2-3.\n\n> Quais palavras de bênção disse Boaz a Rute? Rute 2:12.\n\n> O que aconteceu com Boaz e Rute? Rute 4:10-11.\n\n## Aprendendo com Rute\n\n1. Procurar a mão de Deus.\n2. Crer que Deus está agindo em sua vida, em tudo o que lhe acontece e em todos os seus momentos difíceis.\n3. Confiar que Deus age em todas as coisas para o bem daqueles que O amam (Romanos 8:28).\n\n## Oração do dia\n\nSenhor, meu Deus, que eu busque refúgio sob Tuas asas, que eu seja obediente a Ti e saiba aguardar a Tua providência. Porque Tu sabes o que é melhor para minha vida. Me ajude a confiar inteiramente na Tua providência e a ser grata por toda minha existência. Em nome de Jesus.\nAmém."}, {"titulo": "Ester, a beleza de ser útil", "refs": "Ester 1-10", "conteudo": "De tempos em tempos, Deus utiliza pessoas em lugares estratégicos para ajudar e libertar seu povo. Uma dessas pessoas, e que tem uma linda história na Bíblia, é a rainha Ester. A Bíblia relata que, antes de ser rainha, Ester era uma judia órfã e sem lar. Ela viveu no tempo em que Xerxes, também conhecido como Assuero, era o rei da Pérsia, em 486 a.C.\n\nSeu nome judeu era Hadassa, conhecida também como Ester, que significa “estrela”. Ester fora adotada pelo seu primo, Mardoqueu, um judeu da tribo de Benjamim que vivia na cidadela de Susan. Por uma providência divina, Ester se tornou rainha da Pérsia, esposa do rei Xerxes, que desconhecia sua origem judaica.\n\nEster conhecia o Deus dos judeus. Embora o livro não mencione isso, nem apareça qualquer alusão ao Deus Criador, a mensagem de um Deus que guia, protege e liberta fica subentendida em sua história. Através da história de Ester compreendemos que somente Deus é amor, justiça, Senhor dos Exércitos, Aquele que eleva e abate a quem bem quer.\n\nA rainha Ester tinha aquela coragem que reflete uma fé inabalável no Senhor. Essa linda judia que amava a Deus era casada com um rei pagão temperamental. Quando Ester tomou conhecimento de uma conspiração para matar todos os judeus, ela sabia que precisava comparecer, sem ser chamada, diante do marido e suplicar pela vida de seu povo.\n\nNum momento de intenso perigo de extinção dos judeus, que foi sugerido por Hamã, homem mais influente do império depois do rei, Ester decidiu arriscar sua confortável vida de luxo, que a posição de rainha lhe conferia, para tentar reverter o quadro junto ao rei. Ester recusou ignorar a possibilidade de ver seu povo ser destruído.\n\nO plano de Ester pôs sua vida em risco, porque, de acordo com o costume dos medos e persas, quem se apresentasse diante do rei sem ser convidado (até mesmo a esposa) arriscava-se a ser condenado a morte. Porém, a coragem de Ester, sustentada pela fé na proteção e no cuidado de Deus, a fez afirmar com ousadia: “irei falar com o rei, ainda que seja contra a lei; se eu tiver de morrer, morrerei” (Ester 4:16).\n\nEster compareceu diante do rei e lhe pediu que livrasse o povo judeu da trama mortal que Hamã havia preparado. O rei Assuero atendeu seu pedido e deu condições para que o povo judeu se defendesse dos inimigos, livrando-os da morte certa. Desta forma, Ester permitiu-se ser útil, pois deixou Deus usá-la para um propósito maior.\n\nO ato heroico de Ester foi inspirado na necessidade urgente de agir a favor do povo de Deus e em sua fé destemida no Deus que ela amava, em detrimento da sua própria vida. O resultado de sua coragem e confiança em Deus? A vida de Ester foi poupada, e a do povo de Deus também. Refletindo na história de Ester, gosto de pensar que Deus fornece o necessário para cada dia, e que os eventos da vida estão todos nas mãos dEle. Por isso, eu apenas posso dizer: “Dá-me o meu quinhão em Teu tempo certo, e dentro de Teu critério perfeito”.\n\nQuerida amiga, a história de Ester nos mostra que realmente vale a pena confiar em Deus, custe o que custar. Por isso, quero convidá-la a tomar uma decisão: como Ester, coloque toda sua vida à disposição de Deus para que Ele cumpra em você Seus propósitos em benefício da humanidade. Você descobrirá o significado de sua vida. Você vai se sentir útil, e seu coração será repleto de alegria e contentamento.\n\n## Para estudar na Bíblia\n\n> Por que Hamã odiava tanto Mordecai e, consequentemente, os judeus? Ester 3:1-5.\n\n> O que Hamã procurou fazer ao descobrir que Mordecai não se prostrava diante dele? Ester 3:6.\n\n> Para se vingar de Mordecai, que decreto Hamã pediu que o rei Assuero assinasse? Ester 3:8-10.\n\n> Qual o pedido feito por Ester ao seu povo? Ester 4:16.\n\n> Que convite Ester fez para o rei e Hamã? Ester 5: 1-4.\n\n> Que pedido Ester fez ao rei Assuero? Ester 7:3-5.\n\n> Qual foi o destino de Hamã quando o rei ficou sabendo que ele tramara para matar Ester e o povo Judeu? Ester 7:9, 10.\n\n> O que dizia o edito do rei Assuero que possibilitou os judeus vencerem seus inimigos? Ester 8:10-13.\n\n## Aprendendo com Ester\n\n1. Deus opera Seu poder e glória por meio de acontecimentos pelo mundo e usa líderes na terra por meio de Seu filho, Jesus.\n2. O Senhor é glorificado nos momentos cruciais; quando nada é possível aos olhos humanos, Deus se manifesta!\n3. A forma como vemos o Altíssimo determinará como reagiremos quando a vida for difícil.\n\n## Oração do dia\n\nDeus, Tua palavra me mostra quão imenso Tu és e que podes me salvar de qualquer coisa que eu enfrente. Quero conhecer a Tua grandeza e ver a Tua glória. Me ajude a entregar nas Tuas mãos qualquer coisa que me afaste do Senhor. Em nome de Jesus.\nAmém."}, {"titulo": "Eva, mãe de todos os seres humanos", "refs": "Gênesis 1 e 2", "conteudo": "Não poderíamos encerrar o estudo sobre mulheres da Bíblia sem falar de Eva, a mãe de toda a raça humana. Na semana da criação, Deus disse: “Façamos o ser humano à nossa imagem, conforme a nossa semelhança. Tenha ele domínio sobre os peixes do mar, sobre as aves dos céus, sobre os animais domésticos, sobre toda a terra e sobre todos os animais que rastejam pela terra” (Gênesis 1:26).\n\nAdão recebeu a tarefa de supervisionar toda a criação, e ele observou que todos os animais tinham um par, menos ele. Os animais formavam casais, mas Adão estava sozinho. Deus, então, declarou que não era bom que o homem ficasse só. “O Senhor Deus disse ainda: — Não é bom que o homem esteja só; farei para ele uma auxiliadora que seja semelhante a ele” (Gênesis 2:18).\n\nDa costela de Adão, Deus criou a mulher e a apresentou como esposa para ele, atingindo assim o ponto máximo da criação. Eva não foi uma ideia tardia ou repentina, mas uma parte indispensável do plano de Deus. Segundo o plano de Deus, Adão e Eva foram criados à Sua imagem e semelhança.\n\nEva foi uma mulher privilegiada pela sua singularidade. Imagino Eva sendo uma mulher de uma beleza deslumbrante, criada à imagem de um Deus perfeito. Eva foi criada com parte da costela de Adão, e com o propósito de completar o que faltava no homem, pois ele estava só. E Deus fez exatamente o que ele precisava: uma auxiliadora idônea, que só a mulher poderia ser.\n\nPorém, Gênesis 3 faz o relato do momento mais triste da humanidade, quando a serpente apareceu no jardim e, com astúcia e mentiras, iniciou um diálogo com Eva para enganá-la e levá-la a pecar. O apóstolo Paulo diz que Eva foi seduzida, iludida pelas palavras da serpente. 2 Coríntios 11:3 declara: “Temo que, assim como a serpente, com a sua astúcia, enganou Eva, assim também a mente de vocês seja corrompida e se afaste da simplicidade e pureza devidas a Cristo”.\n\nInfelizmente, Eva resolveu dar ouvidos à serpente, desobedecendo às ordens do Senhor Deus. E não só isso, Adão também concordou com sua decisão assumindo a mentira como verdade. Da desobediência deles, a maldição do pecado contaminou a criação de Deus.\n\nCulpada! Foi o veredicto pronunciado por Deus depois que a mulher deu ouvidos ao tentador, comeu do fruto proibido e envolveu o marido em sua rebeldia. “Culpada” foi também a única palavra que ecoou no coração e na mente entristecidos daquela mulher. Não houve questionamentos quanto a sua culpa. Ela jamais poderia contestar!\n\nAs consequências dessa história, já conhecemos. Eva e seu esposo precisavam agora sair do jardim. Já não havia a possibilidade de permanecer na presença de um Deus Santo. As consequências do pecado foram avassaladoras e alcançaram não somente a família de Adão, mas também toda a humanidade.\n\nO que antes era bom, agora se tornou sofrimento. As consequências do pecado podem ser vistas no relato de Gênesis 3:16: “E à mulher ele disse: — Aumentarei em muito os seus sofrimentos na gravidez; com dor você dará à luz filhos. O seu desejo será para o seu marido, e ele a governará”.\n\nO trabalho do homem seria realizado com fadiga e muito cansaço: “E a Adão disse: — Por ter dado ouvidos à voz de sua mulher e comido da árvore que eu havia ordenado que não comesse, maldita é a terra por sua causa; em fadigas você obterá dela o sustento durante os dias de sua vida” (Gênesis 3:17).\n\nMas o pior de tudo foi a entrada da morte, pois o homem já não poderia mais viver eternamente. E é nesta triste situação da queda que brilha a luz da graça de nosso Deus misericordioso, pois Ele nos prometeu a libertação através de um Salvador, nascido da mulher. Esse Libertador reverteria a maldição do pecado.\n\nPara nós, é significativo saber que o Salvador prometido ao mundo nasceria de uma mulher. Não por acaso, o nome Eva significa “origem da vida”. De Eva, ou seja, da mulher, Deus providenciou vida, quando estávamos mortos por causa do pecado e suas consequências.\n\nAmiga, devemos agradecer a Deus, pois somos todas filhas de Eva e privilegiadas, pois temos um Salvador. Podemos sonhar com a vida eterna e, mesmo não merecendo, podemos desfrutar da certeza de que Ele nos ama e nos alcança com Sua graça. Essa é a maravilha de Deus.\n\nEle mudou a sorte de Eva. Ela não precisava mais andar de cabeça baixa, envergonhada. Pela promessa de Deus, ela podia olhar para o futuro com fé, sabendo que o Deus restaurador de todas as coisas reverteria sua tristeza em alegria, seu choro em sorriso, sua vergonha em honra, seu pecado em salvação.\n\nDeus poderia providenciar a vinda de Seu Filho ao mundo de outra forma, mas Ele preferiu usar a mulher para acolher em seu ventre o Salvador do mundo, para redimi-la e valorizá-la. Você, querida mulher, tem valor inestimável e pode transmitir e oferecer vida a outras pessoas. Talvez você pergunte: “mas como?”\n\nQuerida amiga, você oferece vida quando se esforça para ajudar outras pessoas; você compartilha vida espiritual quando fala de Jesus para alguém; você é a vida de seu lar quando leva alegria e o brilho de um sorriso a quem precisa; você transmite vida física e emocional a seus filhos; você também transmite vida eterna a seus filhos quando ensina a eles o evangelho de Jesus Cristo.\n\nEu quero fazer um convite a você. Decida se alimentar espiritualmente, aprofundando suas raízes no amor de Deus. Lembre-se: a vida de Eva é proveniente de Deus, e a sua também. O Senhor foi a força da vida de Eva, e será a sua força também. Você deseja aceitá-Lo como seu Deus e seu Salvador hoje mesmo?\n\n## Para estudar na Bíblia\n\n> O que Deus disse sobre a formação da mulher? Gênesis 2:18.\n\n> Como Adão reconheceu a importância e o significado de Eva para ele? Gênesis 2:23.\n\n> Que ordem Deus nos deixou e que demonstra que o casamento é indissolúvel? Gênesis 2:24.\n\n> O que disse a serpente para Eva a fim de enganá-la? Gênesis 3:4, 5.\n\n> Que a mulher fez e que acarretou tantas consequências para a humanidade? Gênesis 3:6.\n\n> Qual foi a resposta de Adão ao ouvir a voz de Deus? O que ele sentiu? Gênesis 3:10.\n\n> Com que palavras Deus nos prometeu um Salvador através da mulher? Gênesis 3:15.\n\n## Aprendendo com Eva\n\n1. Ela era uma mulher agradecida por poder confiar em Deus, apesar de seus tropeços e quedas no passado.\n2. Eva podia entregar nas mãos de Deus qualquer dificuldade ou problema que estivesse enfrentado.\n3. Era agradecida por poder entregar nas mãos de Deus tudo o que viesse acontecer no futuro.\n\n## Oração do dia\n\nSenhor, obrigada por me prometer um futuro, apesar do que eu fiz no passado.\nObrigada por me usar em Teu grande plano do Reino, assim como Eva, que errou e encontrou perdão e graça. Dê-me olhos para eu ser assim como Tu me vês: perdoada, acolhida e Tua. Em nome de Jesus.\nAmém."}], "prova": [{"pergunta": "Que passo Ana deu em sua tristeza por não ter filhos? 1 Samuel 1:9-11", "opcoes": ["Desistiu de ir a Siló e ficou em casa.", "Orou ao Senhor chorando muito e fez um voto de dedicar o filho a Ele.", "Discutiu com Penina diante de todos.", "Pediu a Elcana que mandasse Penina embora."], "correta": 1, "grupo": "Estudo 1 · Ana, mulher de oração"}, {"pergunta": "Quem se dirigiu a Ana enquanto ela orava no templo? 1 Samuel 1:12-14", "opcoes": ["O sacerdote Eli, que achou que ela estivesse embriagada.", "O menino Samuel.", "Penina, para zombar dela.", "Um anjo do Senhor."], "correta": 0, "grupo": "Estudo 1 · Ana, mulher de oração"}, {"pergunta": "Com que palavras Ana abriu seu coração sincero? 1 Samuel 1:15-16", "opcoes": ["“Deixe-me em paz, pois não é da sua conta.”", "“Vim apenas cumprir a tradição da minha família.”", "“Sou mulher atribulada de espírito; tenho derramado a minha alma perante o Senhor.”", "“Já desisti de pedir um filho.”"], "correta": 2, "grupo": "Estudo 1 · Ana, mulher de oração"}, {"pergunta": "O que o cântico de Ana declara sobre Deus? 1 Samuel 2:1-11", "opcoes": ["Que Deus está distante e não Se importa com os fracos.", "Que só os poderosos são ouvidos por Deus.", "Que a força humana é o que garante a vitória.", "Que ninguém é santo como o Senhor e não há rocha como o nosso Deus."], "correta": 3, "grupo": "Estudo 1 · Ana, mulher de oração"}, {"pergunta": "O que a igreja fazia por Pedro enquanto ele estava preso? Atos 12:5", "opcoes": ["Planejava uma fuga.", "Fazia oração incessante a Deus por ele.", "Pedia a Herodes que o soltasse.", "Nada, pois todos tinham fugido."], "correta": 1, "grupo": "Estudo 2 · Rode, serva fiel"}, {"pergunta": "Como Pedro saiu da prisão? Atos 12:6-11", "opcoes": ["Os soldados se distraíram e ele fugiu.", "Herodes mudou de ideia e o soltou.", "Um anjo do Senhor o libertou: as correntes caíram e o portão de ferro se abriu sozinho.", "Os amigos pagaram a fiança."], "correta": 2, "grupo": "Estudo 2 · Rode, serva fiel"}, {"pergunta": "Quem atendeu à porta da casa de Maria quando Pedro bateu? Atos 12:13", "opcoes": ["Uma criada chamada Rode.", "A própria Maria, mãe de João Marcos.", "O apóstolo Tiago.", "Um dos soldados."], "correta": 0, "grupo": "Estudo 2 · Rode, serva fiel"}, {"pergunta": "Como Rode reagiu quando os outros disseram que ela estava louca? Atos 12:15", "opcoes": ["Pediu desculpas e ficou calada.", "Voltou a dormir.", "Concordou que era apenas o anjo de Pedro.", "Continuou afirmando com insistência que era Pedro."], "correta": 3, "grupo": "Estudo 2 · Rode, serva fiel"}, {"pergunta": "Qual foi a reação de Davi quando soube que Nabal se recusou a alimentar seus homens? 1 Samuel 25:12-13", "opcoes": ["Desistiu e procurou comida em outro lugar.", "Mandou todos pegarem a espada e subiu com cerca de quatrocentos homens.", "Foi pedir ajuda ao rei Saul.", "Perdoou Nabal na mesma hora."], "correta": 1, "grupo": "Estudo 3 · Abigail, a bela corajosa"}, {"pergunta": "Como o servo descreveu Nabal ao falar com Abigail? 1 Samuel 25:14-17", "opcoes": ["Um homem tão mau (filho de Belial) que ninguém conseguia falar com ele.", "Um homem generoso e sábio.", "Um homem doente e cansado.", "Um amigo fiel de Davi."], "correta": 0, "grupo": "Estudo 3 · Abigail, a bela corajosa"}, {"pergunta": "Que suprimentos Abigail levou a Davi? 1 Samuel 25:18", "opcoes": ["Apenas um pouco de água.", "Ouro e prata.", "Duzentos pães, dois odres de vinho, cinco ovelhas preparadas, trigo tostado, cem cachos de passas e duzentas pastas de figos.", "Armas para os homens de Davi."], "correta": 2, "grupo": "Estudo 3 · Abigail, a bela corajosa"}, {"pergunta": "O que aconteceu com Nabal cerca de dez dias depois? 1 Samuel 25:38", "opcoes": ["Fez as pazes com Davi.", "Mudou-se para outra cidade.", "Tornou-se rei de Israel.", "O Senhor o feriu, e ele morreu."], "correta": 3, "grupo": "Estudo 3 · Abigail, a bela corajosa"}, {"pergunta": "Que instrução Débora deu a Baraque? Juízes 4:6-7", "opcoes": ["Reunir dez mil homens no monte Tabor, pois Deus entregaria Sísera em suas mãos.", "Fazer um acordo de paz com Jabim.", "Fugir para o deserto.", "Esperar até que Sísera fosse embora."], "correta": 0, "grupo": "Estudo 4 · Débora, uma mulher notável"}, {"pergunta": "Que pedido incomum Baraque fez a Débora? Juízes 4:8", "opcoes": ["Que ela lhe desse uma espada nova.", "Que ela fosse sozinha à batalha.", "“Se você for comigo, irei; mas, se você não for comigo, não irei.”", "Que ela pedisse ajuda ao Egito."], "correta": 2, "grupo": "Estudo 4 · Débora, uma mulher notável"}, {"pergunta": "Qual foi o resultado da batalha? Juízes 4:14-16", "opcoes": ["Israel foi derrotado.", "O Senhor derrotou Sísera, todos os seus carros e todo o seu exército diante de Baraque.", "Os dois exércitos fizeram um acordo.", "Ninguém chegou a lutar."], "correta": 1, "grupo": "Estudo 4 · Débora, uma mulher notável"}, {"pergunta": "De acordo com o cântico de Débora, quem a fez dominar sobre os poderosos? Juízes 5:13", "opcoes": ["Sua própria força.", "O rei Jabim.", "Seu marido, Lapidote.", "O Senhor."], "correta": 3, "grupo": "Estudo 4 · Débora, uma mulher notável"}, {"pergunta": "Com que palavras o anjo Gabriel se dirigiu a Maria? Lucas 1:28", "opcoes": ["“Alegre-se, muito favorecida! O Senhor está com você.”", "“Você foi escolhida por ser a mais rica de Nazaré.”", "“Fuja, pois Herodes a procura.”", "“Você deve ir ao templo agora.”"], "correta": 0, "grupo": "Estudo 5 · Maria, mãe de Jesus"}, {"pergunta": "Que nome deveria ser dado ao filho de Maria? Lucas 1:30-33", "opcoes": ["Emanuel.", "João.", "Jesus.", "Davi."], "correta": 2, "grupo": "Estudo 5 · Maria, mãe de Jesus"}, {"pergunta": "Por que o Menino seria chamado Filho de Deus? Lucas 1:35", "opcoes": ["Porque nasceria em Belém.", "Porque o Espírito Santo viria sobre Maria e o poder do Altíssimo a envolveria.", "Porque José era da família de Davi.", "Porque seria educado no templo."], "correta": 1, "grupo": "Estudo 5 · Maria, mãe de Jesus"}, {"pergunta": "Qual foi a resposta de Maria ao anjo? Lucas 1:38", "opcoes": ["“Não aceito essa missão.”", "“Preciso pensar e consultar José.”", "“Isso é impossível.”", "“Aqui está a serva do Senhor; que aconteça comigo conforme a sua palavra.”"], "correta": 3, "grupo": "Estudo 5 · Maria, mãe de Jesus"}, {"pergunta": "O que José fez ao saber que Maria estava grávida? Mateus 1:18-20", "opcoes": ["Pensou em deixá-la secretamente, mas um anjo, em sonho, lhe disse para recebê-la como esposa.", "Denunciou Maria às autoridades.", "Mudou-se para o Egito sozinho.", "Não deu importância ao assunto."], "correta": 0, "grupo": "Estudo 5 · Maria, mãe de Jesus"}, {"pergunta": "O que Rute disse a Noemi? Rute 1:16", "opcoes": ["“Vou voltar para a casa da minha mãe.”", "“O seu povo é o meu povo, e o seu Deus é o meu Deus.”", "“Procure outra pessoa para cuidar de você.”", "“Só irei se você me der uma herança.”"], "correta": 1, "grupo": "Estudo 6 · Rute, mulher virtuosa"}, {"pergunta": "O que Rute propôs fazer para conseguir alimento? Rute 2:2", "opcoes": ["Pedir esmolas na porta da cidade.", "Vender as roupas de Noemi.", "Ir ao campo apanhar espigas atrás dos ceifeiros.", "Voltar para Moabe."], "correta": 2, "grupo": "Estudo 6 · Rute, mulher virtuosa"}, {"pergunta": "Que palavras de bênção Boaz disse a Rute? Rute 2:12", "opcoes": ["“O Senhor lhe retribua; sob as asas do Deus de Israel você veio buscar refúgio.”", "“Volte para o seu povo.”", "“Você não pode trabalhar no meu campo.”", "“Você terá de pagar pelas espigas.”"], "correta": 0, "grupo": "Estudo 6 · Rute, mulher virtuosa"}, {"pergunta": "O que aconteceu com Boaz e Rute? Rute 4:10-11", "opcoes": ["Boaz foi embora de Belém.", "Rute voltou para Moabe.", "Boaz se casou com outra mulher.", "Boaz tomou Rute como esposa, e o povo e os anciãos foram testemunhas e os abençoaram."], "correta": 3, "grupo": "Estudo 6 · Rute, mulher virtuosa"}, {"pergunta": "Por que Hamã ficou tão irado com Mordecai? Ester 3:1-5", "opcoes": ["Porque Mordecai roubou seus bens.", "Porque Mordecai não se ajoelhava nem se prostrava diante dele.", "Porque Mordecai queria ser rei.", "Porque Mordecai o insultou em público."], "correta": 1, "grupo": "Estudo 7 · Ester, a beleza de ser útil"}, {"pergunta": "Qual foi o pedido de Ester ao seu povo? Ester 4:16", "opcoes": ["Que jejuassem por ela três dias, sem comer nem beber.", "Que fugissem da Pérsia.", "Que pegassem em armas.", "Que oferecessem presentes ao rei."], "correta": 0, "grupo": "Estudo 7 · Ester, a beleza de ser útil"}, {"pergunta": "Que convite Ester fez ao rei e a Hamã? Ester 5:1-4", "opcoes": ["Para uma caçada.", "Para visitar o templo.", "Para um banquete que ela havia preparado.", "Para uma viagem a Jerusalém."], "correta": 2, "grupo": "Estudo 7 · Ester, a beleza de ser útil"}, {"pergunta": "Qual foi o destino de Hamã? Ester 7:9-10", "opcoes": ["Foi promovido.", "Fugiu para outro país.", "Foi perdoado pelo rei.", "Foi enforcado na forca que havia preparado para Mordecai."], "correta": 3, "grupo": "Estudo 7 · Ester, a beleza de ser útil"}, {"pergunta": "O que o novo decreto do rei permitiu aos judeus? Ester 8:10-13", "opcoes": ["Reunir-se e defender a própria vida contra os inimigos.", "Sair da Pérsia para sempre.", "Deixar de pagar impostos.", "Escolher um novo rei."], "correta": 0, "grupo": "Estudo 7 · Ester, a beleza de ser útil"}, {"pergunta": "O que Deus disse antes de formar a mulher? Gênesis 2:18", "opcoes": ["“A mulher será serva do homem.”", "“Não é bom que o homem esteja só; farei para ele uma auxiliadora que lhe seja semelhante.”", "“O homem já tem os animais como companhia.”", "“A mulher deverá cuidar do jardim sozinha.”"], "correta": 1, "grupo": "Estudo 8 · Eva, mãe de todos os seres humanos"}, {"pergunta": "Como Adão reconheceu Eva? Gênesis 2:23", "opcoes": ["“Esta é uma estranha para mim.”", "“Esta é igual aos animais.”", "“Esta, afinal, é osso dos meus ossos e carne da minha carne.”", "Ele não disse nada."], "correta": 2, "grupo": "Estudo 8 · Eva, mãe de todos os seres humanos"}, {"pergunta": "Que ordem mostra que o casamento é para toda a vida? Gênesis 2:24", "opcoes": ["O homem deixa pai e mãe, se une à sua mulher, e os dois se tornam uma só carne.", "O homem deve morar sempre com os pais.", "O casamento dura enquanto houver amor.", "Cada um deve viver para si mesmo."], "correta": 0, "grupo": "Estudo 8 · Eva, mãe de todos os seres humanos"}, {"pergunta": "O que a serpente disse a Eva para enganá-la? Gênesis 3:4-5", "opcoes": ["“Esse fruto é venenoso.”", "“Peça permissão a Deus primeiro.”", "“Adão não quer que você coma.”", "“É certo que vocês não morrerão… vocês serão como Deus.”"], "correta": 3, "grupo": "Estudo 8 · Eva, mãe de todos os seres humanos"}, {"pergunta": "Como Deus prometeu um Salvador por meio da mulher? Gênesis 3:15", "opcoes": ["Prometendo um novo jardim.", "Dizendo que a descendência da mulher feriria a cabeça da serpente.", "Dando a Eva um anjo da guarda.", "Mandando o casal construir uma arca."], "correta": 1, "grupo": "Estudo 8 · Eva, mãe de todos os seres humanos"}]},{"id": "est-educacao-financeira", "titulo": "Educação Financeira à Luz da Bíblia", "descricao": "Guia de Estudo Bíblico da Escola Bíblica Novo Tempo, do pastor Antonio Oliveira Tostes, em 12 capítulos sobre prosperidade, dívidas, orçamento familiar, reserva, investimentos, dízimo e generosidade.", "notaMinima": 7, "oficial": true, "licoes": [{"titulo": "Um guia seguro", "conteudo": "“Você está vendo alguém que é habilidoso naquilo que faz? Ele será posto diante de reis; não estará a serviço da plebe”. (Provérbios 22:29)\n\n## Salvação e libertação\n\nAo começar este guia de estudos sobre educação financeira, peço que abra a sua mente para novos ensinamentos vindos direto da Palavra de Deus.\n\nEm primeiro lugar, devemos lembrar que o maior objetivo de Deus é a nossa salvação e libertação desse mundo de pecado. Por isso, a Bíblia revela quem é Deus, quem somos nós, o que é o pecado que condena e a graça que nos salva.\n\nQuando falamos sobre finanças e prosperidade, devemos lembrar das palavras de Jesus que estão em Marcos 8:36: “Que aproveita ao homem ganhar o mundo inteiro e perder a sua alma?” Isso quer dizer que o foco de nossa vida deve ser o reino de Deus em dois tempos: hoje – o reino da graça –, e amanhã – o reino da glória.\n\nEm Mateus 6:33 Jesus diz: “Mas busquem em primeiro lugar o Reino de Deus e a sua justiça, e todas estas coisas lhes serão acrescentadas”.\n\nQuando o apóstolo Paulo exaltou a importância e utilidade da Bíblia, ele o fez da seguinte forma: “Toda a Escritura é inspirada por Deus e útil para o ensino, para a repreensão, para a correção, para a educação na justiça, a fim de que o homem de Deus seja perfeito e perfeitamente habilitado para toda boa obra” (2 Timóteo 3:16, 17).\n\nVeja que em 2 Timóteo 3:17, Deus deseja que sejamos “habilitados para toda boa obra”. Ou seja, enquanto estivermos nesta Terra, poderemos ser bons filhos, pais, cidadãos e profissionais; ter boa saúde e uma vida financeira saudável e próspera.\n\nCreio que este pensamento condiz com as palavras de Jesus, em João 10:10, na segunda parte, que diz: “Eu vim para que tenham vida, e a tenham em abundância”.\n\nPodemos, sim, viver aqui na Terra com abundância, e não existe nenhum pecado em viver em fartura na questão financeira, pois podemos “conquistar o mundo”, desde que não percamos a nossa salvação e coloquemos como prioridade o reino de Deus e Sua justiça, que é Cristo (Jeremias 23:6).\n\nEssas palavras de Cristo em João 10:10 foram antecedidas pela informação que tem a ver com a questão material, quando disse que “o ladrão vem para roubar... Eu vim para que tenham vida e a tenham em abundância”.\n\nA Bíblia nos ensina como cuidar das nossas finanças, pois também é um livro de educação financeira. As promessas de Deus não se aplicam apenas à nossa vida espiritual, aplicam-se também à material. Por isso, devemos manter nossas mentes abertas para entendermos que muitas passagens das escrituras trazem ensinamentos ligados a dinheiro e finanças.\n\nComo exemplo, o texto de Filipenses 4:13 declara: “Tudo posso Naquele que me fortalece”. Deus pode fortalecer você, não apenas para que cresça espiritualmente, vença as tentações e provas da vida. O Senhor também pode fortalecêlo para que você cuide bem das suas finanças, seja um poupador e investidor inteligente e alcance riqueza e prosperidade, que são promessas bíblicas. Comece hoje com este Guia de Estudos uma nova jornada e que Deus abençoe você.", "refs": "Mateus 6:33 · 2 Timóteo 3:16-17 · João 10:10"}, {"titulo": "Prosperidade à luz da Bíblia", "conteudo": "“Lâmpada para os meus pés é a tua palavra, e luz para os meus caminhos”. (Salmo 119:105)\n\n## A busca pelo dinheiro\n\nTodos os dias, milhões de trabalhadores saem de suas casas para uma realidade incontestável: a busca pelo dinheiro.\n\nSeja para o sustento de suas famílias, pagar seus estudos, ou realizar seus desejos pessoais. Todos estão o tempo todo em busca do necessário para satisfazer suas necessidades.\n\nInfelizmente, o apego ao dinheiro se tornou uma maldição desde o início da nossa história, porque ele passou a ocupar o lugar errado na escala de valores da vida do ser humano. E essa busca incessante pelo dinheiro traz a disseminação das mais terríveis atrocidades: guerras, corrupção, criminalidade, destruição dos casamentos, das famílias e a degradação da humanidade.\n\nÉ por este motivo que o apóstolo Paulo, em 1 Timóteo 6:10, declara que o “amor ao dinheiro é a raiz de todos os males”. Outro texto que tem a ver com o dinheiro está em Marcos 10:25, que diz: “É mais fácil um camelo passar pelo fundo de uma agulha do que um rico entrar no reino de Deus”.\n\nA Bíblia conta que, certa vez, um jovem rico foi ao encontro de Jesus e manifestou seu desejo de segui-Lo. O relato bíblico diz que Jesus amou aquele jovem, então, deu-lhe o conselho: “Vá, venda tudo o que tem, dê o dinheiro aos pobres e você terá um tesouro no céu; depois, venha e siga-me” (Marcos 10:21).\n\nAo dar esse conselho, Jesus não estava se referindo apenas às necessidades dos pobres, mas também à salvação daquele jovem. O dinheiro era um deus em sua vida, e, enquanto ele não se desfizesse dele, jamais haveria espaço para Jesus em seu coração.\n\nAplica-se ao coração do homem a conhecida “lei da impenetrabilidade”, que estabelece que dois corpos não podem ocupar o mesmo espaço ao mesmo tempo. Não é possível haver dois deuses em nossa vida. Ou a entregamos para Cristo, ou a nós mesmos dedicando-nos apenas aos nossos interesses e desejos pessoais.\n\nSe considerarmos apenas estas três passagens bíblicas citadas, que falam sobre ser rico e o dinheiro, podemos chegar à conclusão equivocada de que, se quisermos alcançar a graça de Deus e nos salvar, devemos nos livrar do dinheiro e ser pobres. Mas este pensamento está totalmente errado.\n\nO problema não está no dinheiro, mas, sim, na forma como lidamos com ele, o lugar que ocupa em nossa escala de valores e como ele está sendo usado.\n\nA partir do momento em que tratarmos o dinheiro na clareza da Palavra do Senhor, dentro da Sua orientação e sendo fiéis, ele se tornará uma bênção em nossa vida. Amar o dinheiro é errado, portanto é pecado. Pois quando amamos valores monetários, estamos fazendo disso uma pedra de tropeço. Mas ter dinheiro não é pecado, muito pelo contrário: se utilizarmos segundo o ensinamento das Escrituras Sagradas, ele será uma bênção para nós e para nosso semelhante.\n\nEm 1 Timóteo 6:17-19, o apóstolo Paulo amplia a visão sobre dinheiro, dando um conselho muito sábio aos ricos: “Exorta aos ricos do presente século que não sejam orgulhosos, nem depositem a sua esperança na instabilidade da riqueza, mas em Deus, que tudo nos proporciona ricamente para nosso aprazimento; que pratiquem o bem, sejam ricos de boas obras, generosos em dar e prontos a repartir; que acumulem para si mesmos tesouros, sólido fundamento para o futuro, a fim de se apoderarem da verdadeira vida.”\n\nPaulo não diz que os ricos devem se desfazer do dinheiro, mas sim que devem colocá-los no lugar certo em suas vidas. Ou seja, o foco não pode ser o dinheiro e a riqueza; deve ser Deus e devemos usar o dinheiro para acumular tesouros no céu, fazendo boas obras, repartindo com os mais necessitados.\n\nJesus deixou um conselho, em Mateus 6:19- 21: “Não acumulem tesouros sobre a terra, onde as traças e a ferrugem corroem e onde ladrões escavam e roubam; mas ajuntem tesouros no céu, onde as traças e a ferrugem não corroem, e onde ladrões não escavam, nem roubam. Porque, onde estiver o seu tesouro, aí estará também o seu coração.”\n\nUma vez que compreendemos os ensinamentos bíblicos sobre o dinheiro e seu uso, ele trará felicidade para nós, nossa família e ao próximo.\n\nPrecisamos entender que a riqueza e prosperidade são bênçãos concedidas por Deus. O salmista declara, no Salmo 112:1-3: “Aleluia! Bem-aventurado o homem que teme ao Senhor e se compraz nos Seus mandamentos. A sua descendência será poderosa na terra; será abençoada a geração dos justos. Na sua casa há prosperidade e riqueza, e a sua justiça permanece para sempre”.\n\nVisto que a riqueza está nos planos de Deus, o que deve ser feito para acumular tesouros no Céu? Em primeiro lugar, usar essa riqueza para glorificar o nome do Senhor. Um cristão rico é um exemplo digno de ser seguido, pois a sua fidelidade a Deus mostra ao mundo que é possível ser rico e estar se preparando para o céu.\n\nOutra forma de honrar o nome do Senhor é ser fiel e generoso através dos dízimos, ofertas e doações (Provérbios 3:9). Essa fidelidade traz recursos que patrocinam a pregação do evangelho, fortalecem a igreja e satisfazem as necessidades dos pobres, abrindo portas para a pregação do evangelho, levando muito mais pessoas a conhecerem a Deus.\n\nNa parábola do Bom Samaritano, Jesus conta que este homem, depois de acolher o seu próximo, que estava agonizando, e cuidar de seus ferimentos, levou-o a uma hospedaria e, com seus recursos, pagou as despesas para que ele fosse bem cuidado. O texto está em Lucas 10:34, 35 e diz assim: “E, aproximando-se, fez curativos nos ferimentos dele, aplicando-lhes óleo e vinho. Depois, colocou aquele homem sobre o seu próprio animal, levou-o para uma hospedaria e tratou dele. No dia seguinte, separou dois denários e os entregou ao hospedeiro, dizendo:\n\n‘Cuide deste homem. E, se você gastar algo a mais, farei o reembolso quando eu voltar.’”\n\nO que dizer do exemplo de José? Ele foi vendido por seus irmãos, aprisionado e escravizado, mas jamais deixou de ser fiel a Deus. Devido à sua fidelidade, José foi usado por Deus como um instrumento e tornou-se um exemplo para todos nós. Através de sua vida, o Egito tornouse a nação mais rica da terra naquela época e os povos de todas as cidades vinham para comprar alimentos. Graças a essa fidelidade demonstrada por José, a vida das gerações anteriores à de Jesus foi preservada e ainda concedeu aos seus irmãos a oportunidade de reconhecerem o seu pecado, se arrependerem e serem perdoados. Uma das belas descrições de José é encontrada em Gênesis 39:2-4, que diz:\n\n“O SENHOR Deus estava com José, que veio a ser homem próspero e estava na casa de seu dono egípcio. Potifar viu que o SENHOR estava com José e que tudo o que ele fazia o SENHOR prosperava em suas mãos. Assim, José achou favor diante dos olhos de seu dono e o servia. E ele pôs José por mordomo de sua casa e lhe passou às mãos tudo o que tinha”.\n\n## Elimine pensamentos negativos e errados\n\nPara entendermos os planos de Deus para nossa vida, no que diz respeito ao dinheiro e sermos pessoas prósperas, temos que eliminar de nossa mente pensamentos negativos e errados, como achar que “os ricos não entrarão no Céu”, que “dinheiro é sujo”, que “investir e juntar dinheiro é só para os ricos”, que “o dinheiro vai fazer com que você mude e se torne uma pessoa gananciosa”, e assim por diante.\n\nBoa parte dessas afirmações são ditas por pessoas que querem apenas justificar o seu fracasso na vida material. Esses conceitos são como bloqueadores para que tenhamos uma vida de prosperidade financeira. Deus ama Seus filhos e deseja que eles sejam prósperos. Ele aprecia que sejam fiéis nos dízimos e ofertas, que paguem suas contas em dia, que não se endividem, que vivam com dignidade e que deem um bom testemunho. Mas para que isso aconteça, é necessário conhecer os conselhos que a Bíblia tem para o cuidado com as nossas finanças, e é exatamente isso que vamos analisar neste Guia de Estudo.", "refs": "1 Timóteo 6:10 · Marcos 10:21-25 · Mateus 6:19-21"}, {"titulo": "Promessas de sabedoria e prosperidade", "conteudo": "“Nenhuma promessa falhou de todas as boas palavras que o SENHOR havia falado à casa de Israel; tudo se cumpriu”. (Josué 21:45)\n\n## Decisões e escolhas\n\nUm dos sábios conselhos bíblicos para os dias difíceis que estamos vivendo, onde o pecado se propaga de forma tão indiscriminada, encontra-se nas palavras do apóstolo Paulo em Romanos 12:2, que diz: “E não vivam conforme os padrões deste mundo, mas deixem que Deus os transforme pela renovação da mente, para que possam experimentar qual é a boa, agradável e perfeita vontade de Deus”.\n\nTambém em Filipenses 4:8, Paulo declara: “Finalmente, irmãos, tudo o que é verdadeiro, tudo o que é respeitável, tudo o que é justo, tudo o que é puro, tudo o que é amável, tudo o que é de boa fama, se alguma virtude há e se algum louvor existe, seja isso o que ocupe o pensamento de vocês”.\n\nA Bíblia afirma que os nossos pensamentos e a nossa mente definem as nossas decisões e escolhas. Se alimentarmos a nossa mente com tudo aquilo que está em harmonia com os ensinamentos do Senhor, estamos preparando o caminho para uma vida de prosperidade, conforme as promessas que encontramos em Sua Palavra.\n\nPensamentos conduzem a sentimentos, sentimentos levam a ações, e essas ações produzem resultados. Se queremos saber qual a vontade de Deus para nossa vida, devemos “alimentar” a nossa mente com tudo aquilo que é bom, puro e saudável.\n\nA mente é como um arquivo, e quando nos deparamos com as mais diversas situações da vida, onde temos que decidir e escolher, iremos até esses “arquivos” buscar aquilo que irá direcionar e orientar nossas decisões e escolhas.\n\nSe nosso “arquivo” é alimentando pelas imundices deste mundo de pecado, como a sensualidade, violência, poluição, trapaças, atitudes desonestas, exposição ao que é mal, nocivo, degradante, por imagens e sons barulhentos e pervertidos, nossas reações estarão longe de estar em conformidade com a vontade do Senhor. Mas se alimentarmos nossa mente com a Palavra de Deus e Suas promessas, iremos alcançar prosperidade, paz, bênçãos e misericórdia.\n\nÉ fundamental eliminarmos todos os pensamentos nocivos e negativos em relação ao dinheiro que, porventura, estejam em nossa mente e trocar esses pensamentos pelas palavras positivas que encontramos nas Escrituras Sagradas, principalmente em Suas promessas.\n\nQue tal alimentarmos nossas mentes com palavras construtivas, que nos motivem a acreditar que a riqueza e prosperidade também podem ser parte de nossa vida?\n\nEscreva versos e promessas ligadas à vida material em sua agenda de trabalho, coloque no espelho do seu quarto ou em outro lugar bem visível. Leia e repita, mudando sua mente, para que ela esteja alimentada de pensamentos positivos em relação ao dinheiro e à riqueza.\n\n## Vejamos algumas promessas oferecidas por Deus\n\n• Forças para adquirir riquezas (Deuteronômio 8:17-18; 1 Crônicas 29:12);\n• Trabalho e poder para ganhar dinheiro e gozar dos resultados (Eclesiastes 5:19);\n• Felicidade com a prosperidade e a riqueza (Salmos 112:1-3);\n• Companhia nos grandes desafios (Josué 1:8);\n• Sustento e fortalecimento (Isaías 41:10; Salmos 55:22; Salmos 37:25; 1 Pedro 5:7; Salmos 40:17);\n• Realização dos planos (Jeremias 29:11; Salmos 37:4; Jó 42:1-2; Provérbios 16:3);\n• Renovação das forças (Isaías 40:31);\n• Suprirá todas as nossas necessidades (Filipenses 4:19; Salmos 34:9,10; Salmos 136:25);\n• Tudo que fizer, será bem-sucedido (Salmos 1:3);\n\nDeus pode nos dar saúde, sabedoria, domínio próprio, segurança, proteção, que são ingredientes importantes para a busca da prosperidade. Temos que alimentar nossa mente com esta certeza e, uma vez que façamos a nossa parte, Deus é fiel e fará a parte Dele.\n\nEm Deuteronômio 28:1-13, encontramos uma lista de bênçãos materiais que Deus quer nos dar na saúde, no cuidado dos filhos, na proteção dos nossos deslocamentos, no fruto do nosso trabalho, no resultado de nossos investimentos etc.\n\nPrecisamos entender, no entanto, que essas promessas de bênçãos são condicionais. Note em Deuteronômio 28 o que está escrito nos versos 1, 2 e 13:\n\n“Se vocês ouvirem atentamente a voz do SENHOR, seu Deus, tendo o cuidado de guardar todos os seus mandamentos [...], o SENHOR, seu Deus, exaltará vocês sobre todas as nações da terra”.\n\n“Se ouvirem a voz do SENHOR, seu Deus, sobre vocês virão e os alcançarão todas estas bênçãos.”\n\n“O SENHOR os porá por cabeça e não por cauda [...] se obedecerem aos mandamentos do SENHOR, seu Deus”.\n\nA Bíblia diz que o homem mais rico e próspero que passou por essa Terra foi o Rei Salomão. O fato de Salomão ter se desviado dos caminhos de Deus por um período de sua vida, não o torna um mau exemplo a ser seguido.\n\nA propósito, grandes nomes da história bíblica são de homens que cometeram erros, e as Escrituras não ocultam seus erros, exatamente para nos mostrar o poder redentor da graça de Deus. Além de Salomão, poderíamos incluir Abraão, Jacó, Davi, Jonas, Pedro e tantos outros.\n\nTalvez o motivo que levou Salomão a ser um homem tremend
