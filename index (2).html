<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ministério Pessoal · IASD Aldeota</title><style>body{margin:0}</style></head><body><title>Ministério Pessoal Aldeota</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
[hidden]{display:none!important}
.fab{position:fixed;right:18px;bottom:18px;z-index:40;display:flex;gap:8px;align-items:center;background:#25a244;color:#fff;border:0;border-radius:999px;padding:12px 18px;font:600 15px "Source Sans 3",sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.2);cursor:pointer}.fab .count{background:#ffd200;color:#002c66;border-radius:999px;padding:0 7px;font-size:12px}@media(max-width:600px){.fab span{display:none}}
.main-inner{padding-bottom:80px}
/* Layout: barra lateral azul Novo Tempo com logomarcas brancas + área de trabalho clara; no celular a barra vira cabeçalho com abas roláveis */
:root{
  --nt-navy:#002c66;      /* azul profundo Novo Tempo */
  --nt-blue:#004394;      /* azul Novo Tempo */
  --nt-sky:#2a73d6;       /* azul claro de apoio */
  --gold:#ffd200;         /* amarelo Novo Tempo */
  --bg:#f3f6fb;
  --surface:#ffffff;
  --surface-2:#eaf0f8;
  --fg:#13223a;
  --muted:#5a6b85;
  --line:#d6dfec;
  --ok:#1d8a52; --ok-bg:#e3f4ea;
  --warn:#a76200; --warn-bg:#fdf1db;
  --bad:#b5352b; --bad-bg:#fbe6e4;
  --info-bg:#e2edfb;
  --side-bg:var(--nt-blue); --side-fg:#e8f0ff; --side-muted:#a9c2ea;
  --shadow:0 1px 2px rgba(0,44,102,.06),0 4px 16px rgba(0,44,102,.06);
  --f-display:"Sora","Segoe UI",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1424;--surface:#121e33;--surface-2:#1a2a45;--fg:#e6edf8;--muted:#9aabc6;--line:#263a5c;
  --nt-blue:#5d9df0;--nt-sky:#7ab4f5;--ok:#5cc98d;--ok-bg:#143325;--warn:#f0b75a;--warn-bg:#3a2a10;--bad:#f08a80;--bad-bg:#3a1a18;--info-bg:#15304f;
  --side-bg:#03204a;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1424;--surface:#121e33;--surface-2:#1a2a45;--fg:#e6edf8;--muted:#9aabc6;--line:#263a5c;
  --nt-blue:#5d9df0;--nt-sky:#7ab4f5;--ok:#5cc98d;--ok-bg:#143325;--warn:#f0b75a;--warn-bg:#3a2a10;--bad:#f08a80;--bad-bg:#3a1a18;--info-bg:#15304f;
  --side-bg:#03204a;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.55rem;font-weight:700}
h2{font-size:1.15rem;font-weight:600}
h3{font-size:1rem;font-weight:600}
p{margin:0}
a{color:var(--nt-blue)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--nt-sky);outline-offset:2px}

/* Estrutura */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100%}
.side{background:var(--side-bg);color:var(--side-fg);display:flex;flex-direction:column;gap:20px;padding-block:22px;padding-inline:16px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand-logos{display:flex;gap:12px;align-items:center;flex:none}
.brand-logos img{display:block;height:42px;width:auto}
.brand-logos .sep{width:1px;height:34px;background:rgba(255,255,255,.35)}
.brand-text b{display:block;font:600 14px/1.2 var(--f-display);color:#fff}
.brand-text span{font-size:12px;color:var(--side-muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--side-fg);text-decoration:none;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.08)}
.nav a.on{background:var(--gold);color:#002c66;font-weight:600}
.nav svg{width:18px;height:18px;flex:none;opacity:.9}
.nav .count{margin-left:auto;background:var(--gold);color:#002c66;border-radius:99px;font-size:11px;font-weight:700;padding:0 7px}
.nav a.on .count{background:#002c66;color:#fff}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--side-muted)}
.side-foot .who{color:#fff;font-weight:600}
.side-foot .pts{color:var(--gold);font-weight:700}
.side-foot button{background:transparent;border:1px solid rgba(255,255,255,.3);color:var(--side-fg);border-radius:8px;padding:6px 10px;cursor:pointer}
.main{min-width:0;padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.main-inner{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.beta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--info-bg);border:1px solid var(--line);border-radius:var(--r);padding:8px 14px;font-size:13px;color:var(--muted)}
.beta b{color:var(--fg)}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.page-head p{color:var(--muted);margin-top:4px;max-width:65ch}
.eyebrow{font:600 11px/1 var(--f-display);text-transform:uppercase;letter-spacing:.09em;color:var(--nt-blue)}

/* Peças */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat .n{font:700 1.8rem/1.1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--nt-blue)}
.stat .l{font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;color:var(--fg);white-space:nowrap}
.btn:hover{border-color:var(--nt-blue)}
.btn.primary{background:var(--nt-blue);border-color:var(--nt-blue);color:#fff}
.btn.primary:hover{background:var(--nt-navy)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#002c66}
.btn.wa{background:#1f9d57;border-color:#1f9d57;color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--info-bg);color:var(--nt-blue)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font:600 12px/1.2 var(--f-body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface-2);padding:10px 12px;white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
tr:hover td{background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.chat{display:grid;gap:8px;max-height:50vh;overflow:auto;padding:6px 2px;align-content:start}
.bubble{max-width:84%;padding:9px 12px;border-radius:12px;background:var(--surface-2);font-size:14.5px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;justify-self:start}
.bubble.mine{justify-self:end;background:var(--info-bg);border:1px solid var(--line)}
.bubble.reg{border:1px dashed var(--line)}
.bubble small{display:block;font-size:11.5px;color:var(--muted);margin-top:4px;white-space:normal}
.evento{justify-self:center;text-align:center;font-size:12.5px;color:var(--muted);max-width:92%;overflow-wrap:anywhere}
.evento::before{content:"• ";color:var(--nt-sky)}
.diag-q{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.diag-q:first-child{border-top:0;padding-top:0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:8px}
.opt{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:9px 11px;cursor:pointer;font-size:14.5px;background:var(--surface)}
.opt:has(input:checked){border-color:var(--nt-sky);background:var(--info-bg)}
.opt input{margin-top:3px;flex:none}
.perfil{display:grid;gap:6px;background:var(--surface-2);border-radius:var(--r);padding:14px}
.perfil li{margin-left:18px}
.rec{border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px;background:var(--surface)}
.sala{word-break:break-all;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--surface-2);border-radius:8px;padding:10px 12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=date],input[type=time],input[type=number],input[type=search],input[type=url],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-weight:400;color:var(--fg);font-size:15px}
textarea{min-height:90px;resize:vertical;line-height:1.5}
.form{display:grid;gap:12px}
.form .two,.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.hint{font-size:12px;color:var(--muted);font-weight:400}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--nt-blue);border-color:var(--nt-blue)}
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--nt-blue)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--surface-2);color:var(--nt-blue);display:grid;place-items:center;font:600 13px/1 var(--f-display);flex:none}
.person{display:flex;align-items:center;gap:10px;min-width:0}
.person b{display:block;font-weight:600}
.person span{font-size:12px;color:var(--muted)}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}

/* Trilha em etapas */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,128px),1fr));gap:10px;counter-reset:st}
.step{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px;align-content:start;position:relative}
.step .num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 13px/1 var(--f-display);background:var(--surface-2);color:var(--muted)}
.step b{font-size:14px;line-height:1.3}
.step.done .num{background:var(--ok);color:#fff}
.step.now{border-color:var(--nt-blue);box-shadow:0 0 0 2px color-mix(in srgb,var(--nt-blue) 25%,transparent)}
.step.now .num{background:var(--gold);color:#002c66}
.step .st{font-size:12px;color:var(--muted)}
.next{display:grid;gap:12px;border-left:4px solid var(--gold)}
.study{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center}
.step-dot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:700 15px/1 var(--f-display);background:var(--surface-2);color:var(--muted);border:2px solid var(--line)}
.step-dot.going{border-color:var(--nt-sky);color:var(--nt-blue)}
.step-dot.done{background:var(--ok);border-color:var(--ok);color:#fff}
.lesson-list{display:grid;gap:6px}
.lesson-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.lesson-item:hover{border-color:var(--nt-blue)}
.lesson-item .chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;flex:none}
.lesson-item.read .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.reader{max-width:68ch}
.reader .refs{font-size:13px;color:var(--nt-blue);font-weight:600;margin-block:6px 14px}
.reader .body p+p{margin-top:12px}
.reader .body{font-size:16.5px;line-height:1.65}
.reader .body h3{font-size:1.05rem;margin-top:22px;color:var(--nt-blue)}
.reader .body .qbox{background:var(--info-bg);border-left:4px solid var(--nt-blue);border-radius:6px;padding:10px 14px;font-weight:600;margin-top:14px}
.reader .body .qbox small{display:block;font:600 11px/1.2 var(--f-display);text-transform:uppercase;letter-spacing:.08em;color:var(--nt-blue);margin-bottom:4px}
.reader .body .decisao{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border-radius:6px;padding:8px 12px;margin-top:6px}
.reader .body .decisao span:first-child{width:18px;height:18px;border:2px solid var(--nt-blue);border-radius:4px;flex:none;margin-top:4px}
.q-grupo{font-size:.95rem;color:var(--nt-blue);margin-top:10px}
.q{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;background:var(--surface)}
.q label{display:flex;gap:8px;align-items:flex-start;font-weight:400;cursor:pointer;padding:6px 8px;border-radius:6px}
.q label:hover{background:var(--surface-2)}
.result{border-radius:var(--r);padding:18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.result.ok{background:var(--ok-bg)}
.result.bad{background:var(--bad-bg)}
.result .score{font:700 2.4rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.cert-img{width:100%;border:1px solid var(--line);border-radius:8px;display:block}
.medal{width:46px;height:46px;border-radius:50%;background:var(--gold);color:#002c66;display:grid;place-items:center;font:700 18px/1 var(--f-display);flex:none}
.rank{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.rank:first-child{border-top:0}
.rank .pos{font:700 14px/1 var(--f-display);color:var(--muted);text-align:center}
.tutor{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}

/* Aniversário */
.bday{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.bday:first-child{border-top:0}
.cake{width:42px;height:42px;border-radius:10px;background:var(--gold);color:#002c66;display:grid;place-items:center;font:700 13px/1.05 var(--f-display);text-align:center}
.cake small{display:block;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.msg-preview{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:14px;font-size:14.5px;line-height:1.55}

/* Entrada */
.auth{min-height:100%;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.auth-hero{background:radial-gradient(120% 90% at 0% 0%,#1d5fc0 0%,#004394 50%,#002456 100%);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;gap:30px;position:relative;overflow:hidden}
.auth-hero:after{content:"";position:absolute;right:-120px;bottom:-120px;width:380px;height:380px;border-radius:50%;border:56px solid rgba(255,210,0,.16)}
.auth-hero h1{font-size:clamp(1.8rem,3.4vw,2.6rem);line-height:1.1;max-width:16ch;color:#fff}
.auth-hero p{color:#c9dbf5;max-width:42ch;margin-top:12px;font-size:16px}
.auth-hero .verse{font-size:14px;color:#c9dbf5;border-left:3px solid #ffd200;padding-left:12px;max-width:44ch;position:relative;z-index:1}
.auth-hero .brand-logos img{height:58px}
.auth-hero .brand-logos .sep{height:46px}
.auth-form{display:grid;place-items:center;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.auth-form .card{width:100%;max-width:440px;padding:28px}
.demo{font-size:13px;background:var(--surface-2);border-radius:8px;padding:10px 12px;color:var(--muted)}
.demo code{font-size:12.5px;color:var(--fg)}
.links{display:grid;gap:6px;font-size:14px}

/* Janelas e avisos */
.modal-bg{position:fixed;inset:0;background:rgba(6,20,45,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:620px;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{max-width:900px}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.modal-b{padding:20px;display:grid;gap:14px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--nt-navy);color:#fff;padding:10px 18px;border-radius:99px;font-weight:600;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.editor-block{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;background:var(--surface)}
.opt-row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center}
.logo-prev{background:var(--nt-blue);border-radius:10px;padding:12px;display:inline-flex}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;height:auto;z-index:20;padding-block:12px 0;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .brand-logos img{height:34px}
  .nav{flex-direction:row;overflow-x:auto;margin-inline:-4px;padding-bottom:8px}
  .nav a{white-space:nowrap;padding:7px 10px;font-size:14px}
  .nav svg{display:none}
  .side-foot{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:16px;margin:0;flex-direction:row;align-items:center}
  .side-foot .who,.side-foot .role,.side-foot .pts{display:none}
  .brand-text{display:none}
  .auth{grid-template-columns:minmax(0,1fr)}
  .auth-hero{padding:28px 20px}
  .study,.tutor{grid-template-columns:auto minmax(0,1fr)}
  .study>.row,.tutor>.row{grid-column:1/-1}
  .bday{grid-template-columns:auto minmax(0,1fr)}
  .bday>.row{grid-column:1/-1}
}
@media (prefers-reduced-motion:no-preference){.btn,.nav a,.lesson-item{transition:background .15s,border-color .15s}}
</style>

<div id="app"></div>
<div id="modal-root"></div>

<script>
(function(){
"use strict";
/* ---------- versão online (Supabase) ---------- */

const TABELAS = ["profiles","interessados","conversas","agendamentos","progresso","pontos","estudos","config"];

function linhaDe(tab, o){
  const tira = (obj, ks) => { const r = { ...obj }; ks.forEach(k=>delete r[k]); return r; };
  if(tab==="profiles") return { id:o.id, papel:o.papel, email:o.email, nome:o.nome, interessado_id:o.interessadoId||null, data:tira(o,["id","papel","email","nome","interessadoId","senha","_virtual"]) };
  if(tab==="interessados") return { id:o.id, obreiro_id:o.obreiroId||null, user_id:o._uid||null, data:tira(o,["id","_uid"]) };
  if(tab==="conversas") return { id:o.id, interessado_id:o.interessadoId, data:tira(o,["id"]) };
  if(tab==="agendamentos") return { id:o.id, interessado_id:o.interessadoId, obreiro_id:o.obreiroId||null, data:tira(o,["id"]) };
  if(tab==="progresso") return { id:o.pessoaId+":"+o.estudoId, pessoa_id:o.pessoaId, estudo_id:o.estudoId, aprovado:!!o.aprovado, data:tira(o,["_virtual"]) };
  if(tab==="pontos") return { id:o.id, pessoa_id:o.pessoaId, data:tira(o,["id"]) };
  if(tab==="estudos") return { id:o.id, data:o };
  if(tab==="config") return { id:"geral", data:o };
}
function objDe(tab, r){
  if(tab==="profiles") return { ...r.data, id:r.id, papel:r.papel, email:r.email||"", nome:r.nome||"", interessadoId:r.interessado_id||undefined };
  if(tab==="interessados") return { ...novoInteressado({}), ...r.data, id:r.id, obreiroId:r.obreiro_id||"", _uid:r.user_id||null };
  if(tab==="conversas") return { ...r.data, id:r.id, interessadoId:r.interessado_id };
  if(tab==="agendamentos") return { ...r.data, id:r.id, interessadoId:r.interessado_id, obreiroId:r.obreiro_id||"" };
  if(tab==="progresso") return { lidas:[], tentativas:[], ...r.data, pessoaId:r.pessoa_id, estudoId:r.estudo_id, aprovado:r.aprovado };
  if(tab==="pontos") return { ...r.data, id:r.id, pessoaId:r.pessoa_id };
}
async function buscarTudo(tab){
  const out = []; for(let de=0;;de+=1000){
    const { data, error } = await sb.from(tab).select("*").range(de, de+999);
    if(error) throw error; out.push(...data); if(data.length<1000) break;
  } return out;
}
function estudosBase(){ const base = estudosExemplo(); ESTUDOS_OFICIAIS.forEach(e=>{ if(!base.some(x=>x.id===e.id)) base.unshift(JSON.parse(JSON.stringify(e))); }); return base; }
async function carregarOnline(){
  const { data:{ session } } = await sb.auth.getSession();
  const cfgRow = (await sb.from("config").select("*").eq("id","geral").maybeSingle()).data;
  const cfg = { logoIgreja:"", logoNT:"", linkBase:"", mensagem:MSG_PADRAO, ...(cfgRow?.data||{}) };
  const removidos = cfg.estudosRemovidos || []; delete cfg.estudosRemovidos;
  const estRows = (await sb.from("estudos").select("*")).data || [];
  let estudos = estudosBase(); estRows.forEach(r=>{ const k=estudos.findIndex(e=>e.id===r.id); if(k>=0) estudos[k]=r.data; else estudos.push(r.data); });
  estudos = estudos.filter(e=>!removidos.includes(e.id));
  const novoD = { versao:2, exemplo:false, convExemplo:true, formacaoExemplo:true, obreiroTeste:true, config:cfg, estudosRemovidos:removidos,
    usuarios:[], interessados:[], estudos, progresso:[], agendamentos:[], pontos:[], conversas:[] };
  Object.keys(SNAP).forEach(k=>delete SNAP[k]); TABELAS.forEach(t=>SNAP[t]={});
  estudosBase().forEach(e=>{ SNAP.estudos[e.id] = JSON.stringify(linhaDe("estudos", e)); });
  estRows.forEach(r=>{ SNAP.estudos[r.id] = JSON.stringify(linhaDe("estudos", r.data)); });
  SNAP.config.geral = JSON.stringify(linhaDe("config", { ...cfg, estudosRemovidos:removidos }));
  if(session){
    const [pf, it, cv, ag, pg, pt] = await Promise.all(["profiles","interessados","conversas","agendamentos","progresso","pontos"].map(buscarTudo));
    const mapa = { profiles:["usuarios",pf], interessados:["interessados",it], conversas:["conversas",cv], agendamentos:["agendamentos",ag], progresso:["progresso",pg], pontos:["pontos",pt] };
    Object.entries(mapa).forEach(([tab,[col,rows]])=>{ rows.forEach(r=>{ const o=objDe(tab,r); novoD[col].push(o); SNAP[tab][linhaDe(tab,o).id] = JSON.stringify(linhaDe(tab,o)); }); });
    const eu = novoD.usuarios.find(u=>u.id===session.user.id);
    if(eu && eu.papel==="interessado"){
      const { data:tut } = await sb.rpc("tutores_disponiveis");
      (tut||[]).forEach(t=>{
        if(!novoD.usuarios.some(u=>u.id===t.id)) novoD.usuarios.push({ id:t.id, nome:t.nome, papel:"obreiro", igreja:t.igreja||"", email:"", telefone:"", _virtual:true });
        [CURSO_FORMACAO.id, ...(t.estudos||[])].forEach(eid=>novoD.progresso.push({ pessoaId:t.id, estudoId:eid, lidas:[], tentativas:[], aprovado:true, _virtual:true }));
        for(let k=0;k<(t.carga||0);k++) novoD.interessados.push({ id:"_carga-"+t.id+"-"+k, obreiroId:t.id, _virtual:true, nome:"", concluidos:[] });
      });
    }
  }
  D = novoD; ultimaCarga = Date.now();
  me = session ? (usuario(session.user.id) || null) : null;
  if(session && !me) toast("Seu cadastro ainda não foi encontrado. Fale com a coordenação.");
}
function colecoes(){
  return [["profiles", D.usuarios], ["interessados", D.interessados], ["conversas", D.conversas], ["agendamentos", D.agendamentos],
    ["progresso", D.progresso], ["pontos", D.pontos], ["estudos", me?.papel==="admin" ? D.estudos : []], ["config", me?.papel==="admin" ? [{ ...D.config, estudosRemovidos:D.estudosRemovidos||[] }] : []]];
}
function agendarSync(){ if(!ONLINE || !me) return; syncPendente = true; clearTimeout(syncTimer); syncTimer = setTimeout(sincronizar, 600); }
async function sincronizar(){
  if(syncRodando){ agendarSync(); return; }
  syncRodando = true; syncPendente = false; const erros = [];
  try{
    for(const [tab, lista] of colecoes()){
      const vistos = new Set(); const novos = [], alterados = [];
      for(const o of lista){
        if(o._virtual) continue;
        if(tab==="profiles" && me.papel!=="admin" && o.id!==me.id) { vistos.add(o.id); continue; }
        const r = linhaDe(tab, o); vistos.add(r.id); const j = JSON.stringify(r);
        if(SNAP[tab][r.id] === j) continue;
        (SNAP[tab][r.id]===undefined ? novos : alterados).push([r, j]);
      }
      for(let k=0;k<novos.length;k+=400){
        const lote = novos.slice(k,k+400);
        const { error } = tab==="config" || tab==="estudos" ? await sb.from(tab).upsert(lote.map(x=>x[0])) : await sb.from(tab).insert(lote.map(x=>x[0]));
        if(error) erros.push([tab,error]); lote.forEach(([r,j])=>SNAP[tab][r.id]=j);
      }
      for(const [r,j] of alterados){
        const { id, ...resto } = r; const { error } = await sb.from(tab).update(resto).eq("id", id);
        if(error) erros.push([tab,error]); SNAP[tab][r.id]=j;
      }
      if(tab!=="estudos" && tab!=="config"){
        const sumiram = Object.keys(SNAP[tab]).filter(id=>!vistos.has(id));
        for(let k=0;k<sumiram.length;k+=200){ const lote=sumiram.slice(k,k+200); const { error } = await sb.from(tab).delete().in("id", lote); if(error) erros.push([tab,error]); lote.forEach(id=>delete SNAP[tab][id]); }
      }
    }
  }catch(e){ erros.push(["rede", e]); }
  syncRodando = false;
  const graves = erros.filter(([t,e])=>!((t==="conversas"||t==="pontos") && /row-level|42501/.test((e.message||"")+(e.code||""))));
  if(graves.length){ console.warn(graves); toast("Algumas alterações não foram salvas. Verifique a internet e tente de novo."); }
  if(syncPendente) agendarSync();
}
async function recarregarOnline(){
  if(!ONLINE || !me || syncPendente || syncRodando) return;
  if($("#modal-root").innerHTML || document.activeElement?.matches("input,textarea,select")) return;
  try{ await carregarOnline(); render(); }catch(e){ console.warn(e); }
}
async function entrarOnline(email, senha){
  const { error } = await sb.auth.signInWithPassword({ email, password:senha });
  if(error) return /confirm/i.test(error.message) ? "Confirme seu e-mail antes de entrar (veja a mensagem que enviamos)." : "E-mail ou senha incorretos.";
  await carregarOnline(); if(!me) return "Seu cadastro não foi encontrado. Fale com a coordenação.";
  location.hash = nav()[0][0]; render(); return null;
}
async function cadastrarOnline(v, papel){
  const email = v.email.trim(); const tel = soDigitos(v.telefone).replace(/^55(?=\d{10,11}$)/,"");
  const dados = { telefone:v.telefone, nascimento:v.nascimento, origem:"link", criadoEm:agoraISO(), ...(papel==="obreiro"?{ igreja:(v.igreja||"").trim() }:{}) };
  const { data, error } = await sb.auth.signUp({ email, password:v.senha, options:{ data:{ papel, nome:v.nome.trim(), dados } } });
  if(error) return /registered|already/i.test(error.message) ? "Já existe um cadastro com este e-mail. Use “Entrar”." : (/password/i.test(error.message) ? "A senha precisa ter pelo menos 6 caracteres." : "Não foi possível cadastrar: "+error.message);
  if(!data.session) return "CONFIRMAR";
  if(papel==="interessado"){
    const ni = novoInteressado({ nome:v.nome.trim(), telefone:tel, email, nascimento:v.nascimento, bairro:v.bairro, origem:"site" });
    const { id, ...resto } = ni;
    const { data:iid, error:e2 } = await sb.rpc("vincular_interessado", { tel, mail:email, novo_id:id, dados:resto });
    if(e2) console.warn(e2);
    await carregarOnline();
    const i = interessado(iid); if(i){ Object.assign(i, { nome:i.nome||v.nome.trim(), nascimento:i.nascimento||v.nascimento, bairro:i.bairro||v.bairro }); registrar(i.id, `${primeiroNome(v.nome)} fez a inscrição pelo link`); me.interessadoId = i.id; salvar(); }
  } else await carregarOnline();
  location.hash = nav()[0][0]; render();
  toast(papel==="interessado"?"Inscrição feita. Agora escolha o seu obreiro!":"Cadastro criado. Bem-vindo à sua trilha!");
  return null;
}
async function criarContaPeloAdmin(v, papel){
  const aux = supabase.createClient(SUPA.url, SUPA.key, { auth:{ persistSession:false, autoRefreshToken:false, detectSessionInUrl:false, storageKey:"mp-aux" } });
  const { error } = await aux.auth.signUp({ email:v.email.trim(), password:v.senha, options:{ data:{ papel:papel==="admin"?"obreiro":papel, nome:v.nome.trim(), dados:{ telefone:v.telefone, nascimento:v.nascimento, igreja:(v.igreja||"").trim(), origem:"admin", criadoEm:agoraISO() } } } });
  if(error) return /registered|already/i.test(error.message) ? "Este e-mail já está em uso." : error.message;
  await carregarOnline();
  if(papel==="admin"){ const u = D.usuarios.find(x=>x.email.toLowerCase()===v.email.trim().toLowerCase()); if(u){ u.papel="admin"; salvar(); } }
  return null;
}

async function iniciarOnline(){
  sb = supabase.createClient(SUPA.url, SUPA.key);
  sb.auth.onAuthStateChange((ev)=>{ if(ev==="PASSWORD_RECOVERY") setTimeout(modalNovaSenha, 300); });
  if(/access_token|type=recovery|error_description/.test(location.hash)) history.replaceState(null, "", location.pathname+location.search);
  await carregarOnline();
  setInterval(recarregarOnline, 30000);
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && Date.now()-ultimaCarga>10000) recarregarOnline(); });
  window.addEventListener("beforeunload", e=>{ if(syncPendente||syncRodando){ e.preventDefault(); e.returnValue=""; } });
  render();
}

const ESTUDOS_OFICIAIS = [{"id": "est-ensinos-jesus", "titulo": "Ensinos de Jesus", "descricao": "Curso bíblico da Escola Bíblica Novo Tempo em 18 lições: o que Jesus ensinou sobre as Escrituras, a salvação, a oração, Sua volta, o sábado, o batismo e outros temas.", "notaMinima": 7, "oficial": true, "licoes": [{"titulo": "O que Jesus ensinou sobre as Escrituras", "refs": "João 5:39 · Mateus 22:29 · Mateus 5:17; 7:12 · 2 Pedro 1:21 · João 17:17", "conteudo": "JESUS chamou os escritos sagrados de Sua época de “Escrituras” (Mateus 21:42). Elas também podem ser chamadas de “escritura da verdade” (Daniel 10:21); “palavras de vida” (Atos 7:38, ARC); “Santas Escrituras” (Romanos 1:2, ARC); “sagradas letras” (2 Timóteo 3:15); ou ainda “palavra de Deus” (Efésios 6:17). Popularmente, é conhecida como Bíblia Sagrada. Escrita em um período superior a 1.500 anos, por cerca de 40 escritores que viveram em épocas e circunstâncias diferentes, é a fonte de verdade e o manual de Deus para nós. Hoje aprenderemos mais sobre o livro sagrado.\n\n## Aprendendo juntos\n\n> 1. De acordo com Jesus, o que pode ser encontrado nas Escrituras? João 5:39.\n\nNo fim da história deste mundo, todo ser humano receberá ou a vida eterna ou a morte eterna. Para nos ajudar a fazer a escolha certa, Deus nos deixou um manual, um guia prático: a Bíblia. Nela encontramos todas as orientações necessárias para tomar posse da vida eterna.\n\n> 2. Que repreensão severa Jesus fez aos líderes religiosos em Seu tempo? Mateus 22:29.\n\nJesus era um profundo conhecedor das Escrituras. Desde Sua infância, tinha afinidade com os ensinos sagrados. Com 12 anos de idade, já discutia no templo com os doutores da lei (Lucas 2:42, 46). Quanto tentado por Satanás, no deserto, demonstrou Seu conhecimento da Palavra ao responder: “Está escrito” (Lucas 4:4, 8).\n\n## A Bíblia de Jesus\n\nNos dias de Cristo, ainda não existiam os livros que compõem o Novo Testamento. Os primeiros escritos a serem produzidos foram as cartas de Paulo, cerca de 20 anos após a morte de Jesus.\n\n> 3. Qual era a Bíblia que Jesus usava? Mateus 5:17; 7:12.\n\nA expressão “Lei” era usada para designar os cinco livros escritos por Moisés, também chamados de Pentateuco. Já “profetas” é uma referência aos demais livros. Ao todo, o Antigo Testamento é composto de 39 livros.\n\n> 4. Quem levou os profetas a escrever o livro sagrado? 2 Pedro 1:21.\n\nA Bíblia foi produzida por cerca de 40 escritores inspirados pelo Espírito Santo. Por isso, Deus é seu Autor. Foi Ele quem escolheu e inspirou esses homens santos para registrarem as histórias, ensinos e conselhos que deveriam ser preservados para as gerações futuras. Ele não só inspirou os profetas. Jesus disse que Ele também nos conduziria à toda verdade (João 16:13) e nos faria lembrar das coisas ensinadas por Jesus (João 14:26). Logo, Ele é o autor das Escrituras e também o Professor.\n\n## As línguas originais da Bíblia\n\nO Antigo Testamento foi quase todo escrito em hebraico, e o Novo Testamento, em grego. A língua hebraica foi a língua dos hebreus ou israelitas. Já o grego do Novo Testamento é chamado de koinê, que significa “língua comum do povo”.\n\nHá ainda uma terceira língua na Bíblia, o aramaico. Era a língua dos arameus, que viviam principalmente na Mesopotâmia e na Síria. Foi adotada pelos assírios, babilônios e persas, além de ser falada no tempo de Cristo. No Antigo Testamento, encontramos o aramaico na expressão “Jegar-Saaduta” (Gênesis 31:47), em Jeremias 10:11, nos trechos de Esdras 4:8 a 6:18, 7:12 a 16 e 22 a 26 e em Daniel 2:4 a 7:28.\n\n## Divisão da Bíblia em capítulos e versículos\n\nA divisão em capítulos, usada nas edições modernas da Bíblia, tem sido atribuída a Stephen Langton, arcebispo de Cantuária e professor da Universidade de Paris, falecido em 1228. Já a divisão em versículos numerados foi feita por Robert Estienne, famoso impressor francês do século 16. Ele fez a separação numérica dos versículos do Antigo Testamento em 1548, e do Novo Testamento, em 1551.\n\n> 5. Segundo Jesus, qual é a fonte da verdade? João 17:17.\n\nJesus foi claro em estabelecer a Palavra de Deus como norma ou padrão da verdade. Muitos segmentos religiosos e filosóficos têm outras fontes como norma de verdade. Os budistas acreditam nos ensinos de Buda. Os muçulmanos acreditam no Alcorão; os espíritas kardecistas, nos escritos de Alan Kardec. Os mórmons creem nos escritos de Joseph Smith. No entanto, o cristianismo, para ser autêntico, deve lançar mão somente da Bíblia como única autoridade e norma de fé e prática.\n\n> 6. Quais são os benefícios trazidos pelo estudo da Bíblia? 2 Timóteo 3:15-17.\n\nO salmista Davi comparou a Palavra de Deus a uma lâmpada (Salmo 119:105). A luz da Palavra de Deus afasta a escuridão do mal e do pecado.\n\n## Como as pessoas recebem a Palavra de Deus\n\nJesus ensinou por meio de muitas parábolas. Na parábola do semeador (Mateus 13), Ele apresenta uma semente como símbolo dos princípios do reino de Deus colocados no coração humano. Os tipos de solo da parábola representam a disposição do coração em aceitar e assimilar esses princípios na vida.\n\n> 7. Quais são os tipos de solo apresentados na parábola? O que eles significam? Mateus 13.\n\n> Versos 4 e 19:\n\n> Versos 5, 20 e 21:\n\n> Versos 7 e 22:\n\n> Versos 8 e 23:\n\n> 8. Por quanto tempo a Palavra de Deus teria validade? Mateus 24:35; Isaías 40:8.\n\nAlguns creem que o Antigo Testamento perdeu seu valor. Contudo, os evangelhos revelam que Jesus recorria constantemente às Escrituras do Antigo Testamento como investidas de autoridade máxima. Quando tentado pelo diabo a aliviar Sua fome, Jesus resistiu, citando Deuteronômio 8:3: “Não só de pão viverá o homem.” Assim, a Palavra de Deus permanece para sempre!\n\n> 9. Sobre quem Cristo pronunciou uma bênção especial? Lucas 11:28.\n\nPromessa semelhante é feita em Apocalipse 1:3: “Bem-aventurados aqueles que leem e aqueles que ouvem as palavras da profecia e guardam as coisas nela escritas”. Não basta apenas ouvir as orientações da Bíblia. Precisamos, pela graça de Deus, obedecer ao que está revelado e, então, alcançaremos a verdadeira felicidade.\n\n## Conclusão\n\nDevemos aceitar as Santas Escrituras como a infalível revelação de Deus. Nenhum cristão crescerá em graça sem o hábito da leitura e a obediência aos ensinos do livro de Deus.\n\n## Minha decisão\n\n[ ] Creio que a Bíblia é a Palavra de Deus, inspirada pelo Espírito Santo.\n\n[ ] Desejo aceitá-la como regra de fé e prática.\n\n[ ] Prometo, pela graça de Deus, estudar e praticar seus ensinos."}, {"titulo": "O que Jesus ensinou sobre a salvação", "refs": "Gênesis 6:5; Salmo 51:5; Mateus 15:19 · João 3:16 · João 12:47 · João 10:15; 1 Pedro 2:24 · Lucas 15:4-7", "conteudo": "JESUS veio a este mundo com uma missão clara: buscar e salvar o que se havia perdido (Lucas 19:10). Ele veio resgatar a humanidade da morte eterna. Em Seu nascimento, o anjo havia dito a José: “e Lhe porás o nome de Jesus, porque Ele salvará o seu povo dos pecados deles” (Mateus 1:21). Em Sua apresentação no templo, cerca de 40 dias após Seu nascimento, o piedoso Simeão declarou: “Agora, Senhor, podes despedir em paz o Teu servo, [...] porque os meus olhos já viram a Tua salvação” (Lucas 2:29, 30). A grande missão de Jesus é salvar.\n\n## Aprendendo juntos\n\nA Bíblia informa que todos pecaram (Romanos 5:12), e, sendo o salário do pecado a morte (Romanos 6:23), o destino certo de todo ser humano seria esse. Entretanto, para que tivéssemos uma segunda chance, Jesus interveio. Ele Se dispôs a morrer em nosso lugar e, dessa maneira, salvar-nos da condenação do pecado e nos garantir o direito à vida eterna.\n\n> 1. Qual é a situação da natureza humana após o pecado? Gênesis 6:5; Salmo 51:5; Mateus 15:19.\n\nJesus ensinou que o coração humano é corrupto e está cheio de morte, adultério, prostituição, etc. O pecado estabeleceu uma separação entre a criatura e seu Criador (Isaías 59:2). Para vencer esse abismo, Jesus deveria vir ao mundo, tornando-Se o elo entre Deus e a humanidade (João 14:6). Por Sua divindade, Jesus liga-Se a Deus, e, por Sua humanidade, liga-Se a nós.\n\n> 2. Que plano Deus estabeleceu para salvar o ser humano da morte eterna? João 3:16.\n\n“Vindo, porém, a plenitude do tempo, Deus enviou Seu Filho, nascido de mulher” (Gálatas 4:4). Jesus veio assumir os pecados do ser humano e morrer em seu lugar. Esse não foi um plano tardio, pois Deus não foi pego de surpresa pelo pecado. Antes mesmo que a humanidade fosse criada, um plano havia sido elaborado caso ela caísse. Por isso, a Bíblia ensina que Jesus, o Cordeiro de Deus, foi morto antes mesmo da fundação do mundo (1 Pedro 1:19-20; Apocalipse 13:8).\n\n> 3. Como Jesus definiu Sua missão? João 12:47.\n\nJesus veio a este mundo porque a humanidade precisava ser salva da morte eterna. Foi um ato de amor maravilhoso. Deixar as cortes celestiais e toda a Sua glória, assumir nossa frágil natureza e morrer numa rude cruz – tudo Ele fez por amor. Se isso não sensibilizar nosso coração, nada mais o fará.\n\n> 4. O que Jesus fez por nós na cruz? João 10:15; 1 Pedro 2:24.\n\nAté mesmo a eternidade será insuficiente para agradecermos a Jesus tudo o que fez por nós. Assumindo nossa culpa, teve que morrer nossa morte. Impressiona mais ainda o fato de Jesus fazer isso mesmo sabendo que muitos não reconheceriam esse sacrifício. Quantas pessoas vivem hoje como se não houvesse a história da cruz! Você já parou para pensar nisso? Em Cristo, porém, temos profunda união com Deus. Por Sua vida justa e morte substitutiva, somos justificados e aceitos pelo Pai.\n\n> 5. O que Jesus ensinou sobre a alegria no Céu quando um pecador é salvo? Lucas 15:4-7.\n\nCom Jesus, a história sempre tem um final feliz. Mesmo sem fazer esforço, apenas balindo em desespero, a ovelha foi salva. Essa parábola nos ensina que Jesus é o Pastor que sempre vem. Em nosso desespero, quando clamamos por socorro, Ele virá ao nosso encontro. Curará nossas feridas, nos colocará nos ombros e nos levará em segurança para casa.\n\nOutro ensino da parábola é que há festa no Céu quando um filho ou filha volta para o lar. Essa alegria foi sentida por Jesus. O profeta Isaías declara: “Ele [Jesus] verá o fruto do penoso trabalho de Sua alma e ficará satisfeito” (Isaías 53:11).\n\n> 6. A salvação depende de nossas obras? Efésios 2:8, 9; Gálatas 2:16.\n\nSomos salvos pela graça de Deus independentemente das boas obras, ou seja, de nossas boas ações. Essa salvação é recebida pela fé em Cristo como o prometido “Cordeiro de Deus”. Isso é fé na justiça de Cristo que nos é imputada, fé em Seus méritos, plenamente suficientes para nos perdoar e salvar. Paulo confessou: “longe esteja de mim gloriar-me, senão na cruz de nosso Senhor Jesus Cristo” (Gálatas 6:14).\n\n> 7. Como o ser humano pode alcançar a salvação? Atos 16:31; 1 João 5:11, 12.\n\nA Bíblia estabelece um claro contraste entre o verdadeiro e o falso caminho da salvação. Paulo declara: “Ora, ao que trabalha, o salário não é considerado como favor, e sim como dívida. Mas, ao que não trabalha, porém crê naquele que justifica o ímpio, a sua fé lhe é atribuída como justiça” (Romanos 4:4, 5). Essa é a questão crucial – ninguém precisa de obras para ser justificado. Devemos apenas crer e confiar em Cristo.\n\n> 8. Se somos salvos somente pela graça, qual o valor das obras na vida cristã? Efésios 2:10; Tiago 2:17.\n\nHá dois erros muito comuns atualmente. O primeiro é acreditar que nossas obras podem, de alguma forma, contribuir para nossa salvação. A Bíblia ensina que aquele que procura se tornar santo pelas próprias obras está tentando o impossível (Jeremias 13:23; Isaías 64:6). O erro oposto, e não menos perigoso, é achar que a crença em Cristo nos isenta da observância da lei de Deus e das exigências do evangelho. Somos salvos pela graça, mas os que não estiverem em Cristo serão julgados pelas obras (Mateus 12:36; 16:27; Apocalipse 20:12). Na cena do “Grande Julgamento”, Jesus deixou claro que os salvos praticavam boas obras. Ou seja, o resultado natural de ser salvo por Jesus é a prática de boas obras (Mateus 25:37-40). Jesus deixou claro que, quando estamos ligados a Ele, será impossível não dar frutos (João 15:5, 8).\n\n## Conclusão\n\nAntes mesmo que o ser humano pecasse, Deus havia estabelecido um plano para resgatá-lo. Jesus viria ao mundo para morrer em seu lugar. Somos salvos exclusivamente pela graça de Jesus. Quando o pecador, pela fé, aceita a Cristo como seu Salvador pessoal, a justiça de Cristo lhe é imputada e substitui sua vida de pecado. O resultado da habitação de Cristo no coração é a prática das boas obras, como um \"fruto do Espírito\" (Gálatas 5:22, 23). A grande notícia do evangelho é que não fomos nós que escolhemos Cristo, mas Ele nos escolheu e nos destinou à salvação (João 15:16; 1 Tessalonicenses 5:9).\n\n## Minha decisão\n\n[ ] Agora que compreendi o maravilhoso plano da salvação, desejo confiar unicamente nos méritos de Cristo para ser salvo.\n\n[ ] Desejo, pela habitação Dele em meu coração, produzir os frutos de arrependimento e assim glorificar Seu nome."}, {"titulo": "O que Jesus ensinou sobre a santificação", "refs": "João 17:17 · 1 Tessalonicenses 4:3 · João 15:5, 7 · Hebreus 12:14 · Romanos 1:7; Filipenses 1:1", "conteudo": "JESUS foi reconhecido como o “Santo de Deus” (João 6:69; Lucas 1:35; 4:34).\n\nNinguém podia apontar um único pecado Nele (João 8:46). João escreveu que Jesus Se manifestou para tirar os pecados do mundo e que “Nele não há pecado” (1 João 3:5, NVI). A Bíblia é clara em ensinar: “Segui a paz com todos e a santificação, sem a qual ninguém verá o Senhor” (Hebreus 12:14). Como alcançar essa santidade?\n\n## Aprendendo juntos\n\nEm nossa última lição, aprendemos que a Bíblia apresenta a salvação em três tempos: passado, presente e futuro. O que Jesus fez por nós na cruz, no passado, foi trazer a justificação, que nos liberta da penalidade do pecado. O que Jesus faz por nós no presente é a obra de santificação, que nos liberta do poder do pecado. O que Jesus fará por nós no futuro é chamado de glorificação, quando finalmente seremos livres da presença do pecado. Hoje vamos aprender mais sobre a santificação.\n\n## Uma oração especial\n\n> 1. Que oração Jesus fez pelos discípulos? João 17:17.\n\nQuando estudamos a Palavra de Deus, a verdade, o Espírito Santo atua no coração e nos ajuda a purificar tudo o que não é santificado. É o Espírito que nos convence do pecado e nos transforma à imagem e semelhança de Cristo. Isso é santificação.\n\n> 2. De acordo com Paulo, qual é a vontade de Deus para Seus filhos? 1 Tessalonicenses 4:3.\n\nO sentido básico de santificar é “colocar à parte”, “separar”, como ilustrado pelo sétimo dia da criação. Quando Deus separou o sábado dos outros dias, Ele o abençoou e santificou, isto é, separou dos outros seis dias (Gênesis 2:1-3; Êxodo 20:8-11).\n\n> 3. Que metáfora Jesus usou para falar de santificação? João 15:5, 7.\n\nAssim como os ramos precisam estar unidos à videira para sobreviver e frutificar, o crente precisa estar unido a Cristo. Separados Dele, não temos vida. Essa união acontece, na prática, quando passamos tempo em oração e em estudo de Sua palavra. Neste exato momento, enquanto estuda a Bíblia, você está conectado à Videira.\n\n> 4. Por que precisamos da santificação? Hebreus 12:14.\n\nSer “santo” é ser separado do mundo para Deus. Logo, a santificação não é uma simples melhora do nosso comportamento moral ou boas ações sociais. A santificação bíblica é viver os princípios do reino de Deus motivado pela operação constante do Espírito Santo em nós. Essa operação tem por objetivo a honra e a glória de Deus (1 Coríntios 6:19, 20).\n\n> 5. Como Paulo chama os membros da igreja, a quem ele dirige suas cartas? Romanos 1:7; Filipenses 1:1.\n\nOs crentes dessas igrejas são tratados como “santos’’ porque estão “em Cristo” e não por haverem alcançado um estado de ausência de pecado. Se justificação é aquilo que Deus faz por nós, santificação é aquilo que Deus faz em nós. Na justificação, Deus nos considera justos; por outro lado, na santificação, Ele nos torna justos. Embora não exista nenhum mérito humano nessa obra, a santificação exige de cada pessoa uma entrega completa e diária à vontade de Deus e o afastamento de hábitos e atitudes que levam à prática do pecado.\n\n> 6. De quem é a obra de santificar? 1 Tessalonicenses 5:23.\n\nA fim de capacitar a pessoa para a experiência da santificação, Deus concede Seu Espírito. Agora, cheios do Espírito, não andamos mais “segundo a carne, mas segundo o Espírito” (Romanos 8:4). À medida que caminhamos, nossa fé aumenta e nossa transformação progride. Desse modo, obtemos novas vitórias sobre os poderes das trevas.\n\n> 7. Como Paulo enfatizou aos cristãos de Roma sua obrigação total para com Deus? Romanos 12:1, 2.\n\nO simples conhecimento da verdade não é suficiente para o desenvolvimento do caráter. Com o conhecimento deve vir a obediência. Saber o que é certo e não praticar não nos fará crescer em santidade. Quando aceitamos a Cristo como Salvador e Senhor e submetemos nossa vontade à Dele, então crescemos em graça.\n\nO desenvolvimento do caráter envolve dois elementos: (1) a escolha consciente de fazer o que é correto de acordo com a luz recebida e (2) a obediência à consciência. Logo, a vontade do cristão desempenha um papel importante na santificação. Antes da conversão, nossa vontade estava mais sujeita a influência de Satanás, entretanto, ao aceitarmos Cristo como Senhor e Salvador, devemos conscientemente entregar e submeter nossa vontade egoísta à vontade de Cristo e de Seu Espírito.\n\n> 8. Qual o conselho que o apóstolo Pedro nos dá? 2 Pedro 3:18.\n\nO crescimento não é automático, quer físico, quer espiritual. Ambos requerem alimento, bebida e exercício. Isso significa que devemos manter comunhão com Cristo, por meio da oração e da leitura da Bíblia, para nos alimentarmos (João 6:56). Precisamos ainda exercitar nossa fé, testemunhando de Cristo a outros (Lucas 8:38, 39). Esse é o caminho para o crescimento espiritual e a santificação.\n\n## Conclusão\n\nSantificação não deve ser confundida com impecabilidade. A natureza carnal com a qual nascemos só nos será arrancada na glorificação, no momento da volta de Jesus. Pecamos porque somos pecadores. Essa é a tendência natural de todo ser humano. Logo, a verdadeira santidade só pode ser alcançada pela perseverança em estar ao lado de Cristo. Desse modo, a vida sem pecado de Jesus nos é atribuída como um presente, e somos salvos por Seus merecimentos.\n\n## Minha decisão\n\n[ ] Desejo me relacionar com Cristo por meio da oração e do Estudo da Bíblia, levando uma vida de santidade e constante crescimento com Jesus.\n\n[ ] Desejo abrir meu coração à influência do Espírito Santo e permitir que Ele me transforme diariamente à imagem de Cristo.\n\n[ ] Desejo exercitar minha fé, partilhando as verdades da Bíblia que tenho aprendido."}, {"titulo": "O que Jesus ensinou sobre o Espírito Santo", "refs": "João 14:16, 17 · João 7:39; 20:22; Atos 2:4 · João 14:26; 16:8, 13 · Lucas 11:13 · Atos 5:32", "conteudo": "JESUS foi concebido pelo Espírito Santo (Mateus 1:18), batizado com o Espírito (Marcos 1:9, 10), conduzido pelo Espírito (Lucas 4:1) e executou Seus milagres por meio do Espírito (Mateus 12:28). Esses são alguns exemplos de que a missão de Jesus e a missão do Espírito Santo eram totalmente interdependentes. Depois da ascensão de Jesus, o Espírito Santo veio à Terra para estar com os fiéis até que Jesus voltasse novamente (João 14:1-3, 16). Hoje aprenderemos mais sobre o Espírito Santo.\n\n## Aprendendo juntos\n\nA Bíblia revela que o Espírito Santo é uma Pessoa, e não uma força ou poder impessoal (Atos 15:28). Possui os mesmos atributos da Divindade, pois é Deus (Atos 5:3, 4). No Antigo Testamento, Ele é descrito participando na criação da Terra (Gênesis 1:2), agindo no coração humano (Gênesis 6:3) e habilitando certos indivíduos para tarefas especiais (Juízes 6:34). Também foi prometido para os últimos dias (Joel 2:28; Atos 2:15-17).\n\n> 1. Que promessa Jesus fez aos discípulos? João 14:16, 17.\n\nA notícia da partida de Jesus trouxe incerteza ao coração dos discípulos. Eles ainda não compreendiam como ela ocorreria. Depois de anos na companhia do Mestre, não aceitavam a ideia de Sua ausência. Jesus, porém, não os deixaria órfãos. Ele fez a promessa de enviar “outro Consolador”, o Espírito Santo. A expressão “outro”, usada por Jesus, indica alguém igual a Ele. O Espírito não só estaria com os discípulos, mas habitaria neles. Cheios do Espírito, estariam seguros para os grandes desafios que os aguardavam.\n\n> 2. Quando Jesus cumpriu Sua promessa de enviar o Espírito Santo? João 7:39; 20:22; Atos 2:4.\n\nA plenitude do Espírito Santo não poderia ser concedida a não ser depois que Jesus tivesse completado Sua missão. Sua morte na cruz e ressurreição ao terceiro dia faziam parte do plano da salvação. Faltava ainda mais um passo – o Pai aceitar o sacrifício do Filho em favor do ser humano pecador. Quando o sacrifício vicário (ou substitutivo) de Jesus foi aceito por Deus, Jesus foi glorificado, e o Espírito, enviado à Terra. Pedro afirmou: “Exaltado, pois, à destra de Deus, tendo recebido do Pai a promessa do Espírito Santo, derramou isto que vedes e ouvis” (Atos 2:33).\n\n> 3. Qual seria a obra do Espírito Santo? João 14:26; 16:8, 13.\n\nO Espírito, o Consolador, seria enviado para ensinar toda a verdade e nos fazer lembrar do que Jesus havia ensinado. Ele não somente apresenta a verdade sobre Cristo, mas traz a própria presença de Cristo. Dessa maneira, tanto o Pai quanto o Filho fazem morada no coração daquele que crê (João 14:23). Assim, a única forma pela qual podemos permanecer em Cristo é por meio do Espírito.\n\n> 4. Qual a disposição de Deus em dar-nos Seu Espírito? Lucas 11:13.\n\nO Espírito Santo é a maior dádiva que o Céu pode conceder aos seres humanos.\n\nDevemos orar com tanto fervor pela descida do Espírito Santo como os discípulos oraram no dia de Pentecostes. Se eles necessitaram fazer isso naquele tempo, hoje precisamos muito mais. O grande desejo do Senhor é nos dar Seu Espírito, pois é por meio do Espírito que Deus habita em nós (1 Coríntios 3:16).\n\n> 5. A quem Deus concede exclusivamente Seu Espírito? Atos 5:32.\n\nO Espírito Santo é dado a todo seguidor de Cristo quando o coração é inteiramente entregue para Sua habitação. Paulo escreveu a ordem: “Enchei-vos do Espírito” (Efésios 5:18), e essa ordem também é uma promessa de seu cumprimento. Se buscarmos colocar nossa vida em harmonia com a vontade de Deus, se nos humilharmos e confessarmos nossa dependência, o Espírito virá em resposta às nossas orações.\n\n> 6. Segundo Jesus, para qual pecado não há perdão? Mateus 12:31, 32.\n\nJesus ensinou que uma das funções do Espírito seria convencer os homens do pecado (João 16:8, 9). O arrependimento ou tristeza pelo pecado só pode ocorrer pela ação do Espírito no coração. Logo, o pecado contra o Espírito Santo é a recusa persistente de atender a Seus convites para o arrependimento. Deus sempre está disposto a aceitar o arrependimento, pois “é rico em perdoar” (Isaías 55:7), mas o próprio ser humano, pela dureza do coração e apego ao pecado, se coloca fora do alcance da graça de Deus.\n\n## Conclusão\n\nApós a ascensão de Cristo, os discípulos esperavam ansiosos pelo cumprimento de Sua promessa de enviar o Espírito. Ao transpor as portas celestiais, Jesus foi entronizado em meio à adoração dos anjos (Salmo 24:7-10). Tão logo essa cerimônia foi concluída, o Espírito Santo desceu sobre os discípulos como prova da autoridade de Jesus como Sacerdote e Rei, e todo o poder no Céu e na Terra lhe foi dado.\n\nJesus não fechou o reservatório do Céu depois de derramar Seu Espírito no Pentecostes. Temos, hoje, o privilégio de sermos batizados com o mesmo poder. O Céu está repleto dos tesouros de Sua graça, e os que vão a Deus com fé podem reivindicar tudo o que Ele prometeu.\n\n## Minha decisão\n\n[ ] Creio no Deus Espírito Santo como o Consolador, meu amigo e ajudador.\n\n[ ] Desejo abrir meu coração à influência Dele e ouvir Seus amáveis conselhos e ensinos.\n\n[ ] Buscarei receber Seu batismo diário e ajudar outros a conhecer mais de Jesus."}, {"titulo": "O que Jesus ensinou sobre a oração", "refs": "Lucas 11:1 · Lucas 11:2-4 · Mateus 6:5-8 · Mateus 21:22", "conteudo": "JESUS era um homem de oração. Ele gostava de buscar um local solitário para esses momentos agradáveis de comunhão com o Pai (Marcos 6:46; Lucas 5:16). Às vezes, passava a noite toda orando (Lucas 6:12). Também gostava de orar pelos discípulos (João 17:8, 9). Ele orou, inclusive, por todos nós (João 17:20).\n\nSendo Jesus nosso exemplo em todas as coisas, devemos orar como Ele orava.\n\nConsiderando que o Filho de Deus sentia a necessidade de orar, quanto mais devemos nós, fracos e pecadores mortais que somos, sentir a necessidade de constante oração!\n\n## Aprendendo juntos\n\nAs orações de Cristo e Seu hábito de comunhão com Deus impressionavam muito os discípulos. Certa ocasião, eles O encontraram concentrado, em oração. Parecendo inconsciente da presença deles, continuou orando em alta voz. O coração dos discípulos foi tocado profundamente.\n\n> 1. Que pedido os discípulos fizeram a Jesus? Lucas 11:1.\n\nOs discípulos sentiram a necessidade de orar. Então, Jesus passou a ensinar sobre como deveriam orar. Instruiu-os a apresentar suas necessidades cotidianas a Deus e lançar sobre Ele todas as suas preocupações. A certeza que Jesus lhes deu, de que suas petições seriam ouvidas, constitui também uma realidade para nós, hoje.\n\n> 2. Que oração Jesus ensinou aos discípulos? Lucas 11:2-4.\n\nCorrespondendo ao pedido, Cristo proferiu a \"oração do Senhor\", tal como a dera no Sermão do Monte (Mateus 6:9-13). Essa é uma oração-modelo e apresenta elementos que devem estar presentes em todas as nossas orações. Devemos nos aproximar de Deus com ações de graças, falar de nossas necessidades, confessar os pecados que cometemos e rogar por misericórdia, em harmonia com Sua promessa.\n\n## Tipos de oração\n\n> 3. Que tipo de oração Jesus ensinou no Sermão do Monte? Mateus 6:5-8.\n\nA oração secreta só deve ser ouvida por Jesus. Devemos formar o hábito de ter um lugar tranquilo para esses momentos de comunhão. Ao orarmos, devemos abrir nosso coração a Deus como a um amigo, falando de nossas vitórias e derrotas, perdas e ganhos, alegrias e tristezas. Lembre-se: Deus não é um Pai que deseja ouvir somente boas notícias de Seus filhos, sem Se interessar por seus problemas. O Senhor deseja que falemos de tudo o que acontece em nossa vida. A promessa de Jesus é: “teu Pai, que vê em secreto, te recompensará” (Mateus 6:18).\n\n> 4. Que promessa maravilhosa Jesus fez com relação às nossas petições? Mateus 21:22.\n\nÉ maravilhoso saber que Deus Se inclina de Seu trono para ouvir o clamor do oprimido. Foi com essa certeza que Davi e Daniel desenvolveram o hábito de orar três vezes ao dia (Salmo 55:17; Daniel 6:10). Eles viam em cada dificuldade um chamado à oração. Devemos fazer o mesmo.\n\n## Condições para a oração ser atendida\n\nHá certas condições sob as quais podemos esperar que Deus ouça nossas orações. Vamos examinar algumas delas:\n\nPrimeira condição: Sentir a necessidade de auxílio (Mateus 7:7, 8) Os que reconhecem sua necessidade e anelam por Deus podem estar certos de que serão satisfeitos. O coração tem de estar aberto à influência do Espírito; do contrário, a bênção de Deus não pode ser obtida. Somos tão carentes do cuidado de Deus como um bebê é carente da atenção e do cuidado dos pais.\n\nSegunda condição: Orar com fé (Marcos 11:24) Jesus elogiou muitos que foram curados por sua fé (Lucas 18:42) e criticou a falta de fé até mesmo dos discípulos (Lucas 8:25). Tiago ensinou que, quando pedimos sem fé, seremos como as ondas do mar, impelidas e agitadas pelo vento (Tiago 1:6). De fato, a Bíblia é clara em ensinar que “sem fé é impossível agradar a Deus” (Hebreus 11:6). Por isso, também devemos orar com fé.\n\nTerceira condição: Obedecer aos mandamentos (João 15:7) Todas as dádivas são prometidas sob a condição de obediência. Quem desobedece à lei tem sua oração recusada pelo Céu (Provérbios 28:9). Deus tem um Céu cheio de bênçãos para aqueles que cooperarem com Ele. Todos quantos Lhe são obedientes podem pedir o cumprimento de Suas promessas. O apóstolo João ensinou: “E aquilo que pedimos Dele recebemos, porque guardamos os Seus mandamentos” (1 João 3:22).\n\nQuarta condição: Perdoar os que nos ofendem (Marcos 11:25, 26) Jesus ensinou na oração-modelo: “Perdoa-nos as nossas dívidas, assim como nós temos perdoado aos nossos devedores” (Mateus 6:12). Se esperamos que nossas orações sejam atendidas, devemos perdoar aos outros do mesmo modo e na mesma medida em que esperamos ser perdoados.\n\nQuinta condição: Pedir segundo a vontade divina (Mateus 26:42) O apóstolo João ensinou esta mesma verdade: “E esta é a confiança que temos para com Ele: que, se pedirmos alguma coisa segundo a Sua vontade, Ele nos ouve” (1 João 5:14). Somos tão falíveis que, às vezes, pedimos coisas que não seriam uma bênção. Deus, contudo, é tão bondoso, que só atende o que sabe ser para nosso benefício. Sexta condição: Perseverar e não esmorecer (Lucas 18:1-7) A perseverança na oração também é uma condição para que ela seja atendida.\n\nDevemos orar sempre se quisermos crescer na fé e na experiência. Paulo aconselhou: “Perseverai na oração, vigiando com ações de graças“ (Colossenses 4:2).\n\nSétima condição: Orar em nome de Jesus (João 14:13) Orar em nome de Jesus é mais do que simplesmente mencionar-Lhe o nome no começo e no fim da oração. É orar segundo o sentimento e o espírito de Jesus, ao mesmo tempo em que cremos em Suas promessas e descansamos em Sua graça. Cristo mesmo declarou: “Tudo quanto pedirdes em Meu nome, isso farei, a fim de que o Pai seja glorificado no Filho” (João 14:13).\n\n## Conclusão\n\nDeus tem três formas de responder às nossas orações: SIM, NÃO ou ESPERE.\n\nA resposta sempre será SIM quando todas as condições forem preenchidas e o que pedimos for o melhor para nós. A resposta será NÃO quando o que pedimos não for o melhor para nós. Tiago escreveu: “Pedis e não recebeis, porque pedis mal, para esbanjardes em vossos prazeres” (Tiago 4:3). Deus é muito sábio, por isso jamais comete um erro. Ao mesmo tempo, por Seu amor infinito, jamais vai deixar de abençoar os que são sinceros. A resposta será ESPERE quando Deus desejar provar nossa fé ou experimentar a sinceridade de nosso desejo. Talvez ainda não seja a hora de recebermos o que pedimos, mas a bênção virá mais à frente.\n\n## Minha decisão\n\n[ ] Agora que compreendi mais sobre a oração, decido confiar inteiramente no Deus que ouve as orações.\n\n[ ] Decido que, além das orações familiares e públicas, irei reservar tempo todos os dias para ter momentos de oração particular.\n\n[ ] Desejo, pela graça de Cristo, preencher todas as condições para que minhas orações sejam atendidas."}, {"titulo": "O que Jesus ensinou sobre o perdão", "refs": "Romanos 3:10, 23 · Salmo 51:1, 2, 10 · Salmo 130:4; Marcos 2:7 · João 20:23; Efésios 4:32 · Atos 2:38", "conteudo": "JESUS praticou o perdão de modo abrangente em Seu ministério terrestre. Ele disse dezenas de vezes: “Estão perdoados os teus pecados” (Mateus 9:2; Lucas 5:20). Mesmo na hora da morte, sofrendo os tormentos da crucifixão, Sua oração foi: “Pai, perdoa-lhes, porque não sabem o que fazem” (Lucas 23:34).\n\nAssim como precisa do oxigênio para respirar, o ser humano depende do perdão de Deus. Precisamos dele a cada instante. Como, porém, o perdão divino pode ser alcançado? E quando ofendo alguém ou sou ofendido – a quem devo pedir perdão?\n\nNeste estudo, encontraremos respostas.\n\n## Aprendendo juntos\n\n> 1. Em que situação se encontra o ser humano? Romanos 3:10, 23.\n\nComo alguém pode ser justo diante de Deus? É unicamente por meio de Cristo que alcançamos harmonia com Deus. Mas como devemos chegar a Cristo? Muitos fazem hoje a mesma pergunta que a multidão fez no dia de Pentecostes quando, convencida do pecado, clamou: “Que faremos?” (Atos 2:37). A resposta de Pedro foi: “Arrependeivos” (Atos 2:38). Noutra ocasião, disse: “Arrependei-vos [...] e convertei-vos para serem cancelados os vossos pecados” (Atos 3:19).\n\n> 2. Que oração Davi fez depois de haver pecado contra Deus? Salmo 51:1, 2, 10.\n\nA oração de Davi, depois do maior erro de sua vida, ilustra a natureza da verdadeira tristeza pelo pecado. Seu arrependimento foi sincero e profundo. Ele não fez nenhum empenho por atenuar a culpa. Não foi o desejo de escapar ao juízo que lhe inspirou a oração. Davi reconheceu a enormidade de sua transgressão, viu a contaminação de seu ser e sentiu nojo do pecado. Não suplicava unicamente o perdão, mas também um coração puro. Desejava a alegria da santidade e estar, mais uma vez, em harmonia com Deus.\n\n> 3. Quem somente pode perdoar pecados? Salmo 130:4; Marcos 2:7.\n\nNenhum ser humano tem o poder de perdoar pecados. Somente Deus, por meio de Cristo, aquele que nunca pecou, pode nos conceder perdão e paz de espírito. O ensino de que algum ser humano tem poder de perdoar pecados não está em harmonia com a Bíblia. Nenhuma ação humana é capaz de conseguir o perdão. Somente Deus, em Jesus Cristo, pode perdoar nossos pecados. Por isso, devemos nos aproximar Dele com o coração verdadeiramente arrependido.\n\n> 4. Só Jesus perdoa ou o ser humano também pode perdoar? João 20:23; Efésios 4:32.\n\nO perdão tem duas dimensões. Se é verdade que todo pecado deve ser confessado a Deus (dimensão vertical), também é verdade que devemos buscar o perdão quando ofendemos alguém (dimensão horizontal). Jesus mesmo ensinou: “Se teu irmão pecar contra ti, repreende-o; se ele se arrepender, perdoa-lhe. Se, por sete vezes no dia, pecar contra ti e, sete vezes, vier ter contigo, dizendo: Estou arrependido, perdoa-lhe” (Lucas 17:3, 4).\n\n## Condições para o perdão\n\n> 5. O que é necessário, segundo a Bíblia, para se alcançar a remissão dos pecados? Atos 2:38.\n\nO arrependimento é a primeira condição para o perdão. Contudo, muitos não vão a Cristo porque ainda não se sentem arrependidos. O arrependimento não é produzido por um exercício mental, mas somente quando se permite a atuação do Espírito Santo no coração, nos convencendo dos erros e da necessidade de mudança. Assim como não podemos alcançar perdão sem Cristo, também não podemos nos arrepender sem que o Espírito Santo nos convença do pecado.\n\n> 6. Depois de arrependido, o que o pecador deve fazer? 1 João 1:9.\n\nUma vez arrependidos, devemos apresentar a Deus nossa confissão de modo claro e específico. Se fizermos isso, seremos lavados por Jesus, e Seu sangue nos purificará de toda injustiça. Somente Ele pode realizar essa obra. Cristo derramou Seu sangue precioso para nos purificar, porque não pode haver remissão de pecados sem derramamento de sangue (Hebreus 9:22).\n\n> 7. Que condição Jesus apresentou para o perdão de nossos pecados? Mateus 6:12.\n\nApós terminar a oração-modelo, Jesus ainda declarou: “Se, porém, não perdoardes aos homens [as suas ofensas], tampouco vosso Pai vos perdoará as vossas ofensas” (Mateus 6:15). Quem não está disposto a exercer misericórdia para com os que lhe ofendem não pode obter misericórdia de Deus. É egoísmo humano desejar o perdão divino sem estar disposto a oferecer o perdão às outras pessoas.\n\n> 8. Quantas vezes devo perdoar a quem me ofende? Mateus 18:21, 22.\n\nOs mestres antigos limitavam o exercício do perdão a três ofensas, no máximo.\n\nPedro, que professava seguir os ensinos de Cristo, ampliou-o até sete, número que indica perfeição. Cristo, porém, ensinou que nunca devemos nos cansar de perdoar. Não “até sete”, Ele disse, “mas até setenta vezes sete”, ou seja, devemos perdoar aqueles que nos ofendem tantas vezes quanto Deus nos perdoa.\n\n## Conclusão\n\nSomente Jesus tem o poder de perdoar nossos pecados. Por isso, podemos nos aproximar Dele com confiança, para recebermos o alívio de que tanto precisamos. Contudo, muitos esperam merecer a graça e o perdão de Deus, tentando fazer boas ações. Não reconhecem sua pecaminosidade e incapacidade. Somente quando descobrimos que não possuímos nada que nos qualifica para o Céu, o Espírito cria em nós um desejo de mudança.\n\n## Minha decisão\n\n[ ] Creio que somente Jesus pode perdoar meus pecados.\n\n[ ] Desejo confessar a Ele minhas culpas e confiar em Sua misericórdia para alcançar o perdão.\n\n[ ] Decido, a partir de hoje, perdoar aqueles que me ofenderem, assim como Jesus me perdoou."}, {"titulo": "O que Jesus ensinou sobre o dinheiro", "refs": "Mateus 23:23 · Gênesis 14:20 · Números 18:21 · 1 Coríntios 9:13, 14 · Salmo 96:8; Malaquias 3:8", "conteudo": "JESUS falou amplamente sobre o amor ao dinheiro em Seus ensinos. Depois do tema “reino de Deus”, o Mestre falou mais sobre dinheiro do que de qualquer outro assunto. Para Cristo, as riquezas podem sufocar a espiritualidade, tornando-se um deus rival, que costuma enfeitiçar seus adoradores. Sendo que o dinheiro é parte do nosso dia a dia, como podemos viver sem fazer dele um ídolo? Jesus ensinou duas maneiras práticas e sistemáticas: os atos de dizimar e de ofertar.\n\n## Aprendendo juntos\n\nO ato de dizimar – A palavra dízimo significa “décima parte”. Ele é santo e pertence ao Senhor (Levítico 27:30). Ao devolvermos a Deus o dízimo das nossas rendas, reconhecemos que todas as coisas pertencem a Ele e participamos do cumprimento da missão de pregar o evangelho a todo o mundo (Salmo 24:1; Ageu 2:8; Mateus 24:14). Dizimar é um ato de adoração e honra a Deus. A Bíblia diz em Provérbios 3:9: “Honra ao S com os teus bens e com as primícias de toda a tua renda”.\n\n> 1. Cristo aprovou a devolução do dízimo? Mateus 23:23.\n\nJesus aprovou a devolução do dízimo, mas ressaltou que esse ato deve ser feito com amor e justiça, sem hipocrisia. Em Lucas 18:10-14, Jesus contou a história do fariseu que se orgulhava de devolver o dízimo, enquanto desprezava o pobre publicano. O fariseu foi reprovado por Jesus, pois sua motivação e suas ações eram erradas. O verdadeiro sentimento que deve nos mover na devolução do dízimo é a dependência total de Deus, sabendo que nada temos e que tudo pertence a Ele.\n\n> 2. Qual é o primeiro exemplo na Bíblia de alguém devolvendo o dízimo? Gênesis 14:20.\n\nAbraão entregou a Melquisedeque o dízimo de tudo o que possuía. Melquisedeque era rei de Salém e “sacerdote do Deus Altíssimo”. Esse foi um ato de reconhecimento da soberania divina. Em Deuteronômio 14:22 e 23, a Bíblia diz: “Certamente darás os dízimos de todo o fruto das tuas sementes, que ano após ano se recolher do campo. E, perante o S, teu Deus, no lugar que escolher para ali fazer habitar o Seu nome, comerás os dízimos do teu cereal, do teu vinho, do teu azeite e os primogênitos das tuas vacas e das tuas ovelhas; para que aprendas a temer o S, teu Deus, todos os dias.”\n\n> 3. Como o dízimo era usado em Israel? Números 18:21.\n\nQuando lemos o capítulo 2 de Números, descobrimos que a tribo de Levi não recebeu herança, porque Deus separou essa tribo para o serviço religioso em tempo integral (Números 1:53). Deus era a sua herança, Aquele que proveria suas necessidades (Deuteronômio 18:2). A tribo de Levi passou, então, a sobreviver dos dízimos do povo de Israel.\n\n> 4. O que Paulo afirma sobre o sustento do ministério evangélico? 1 Coríntios 9:13, 14.\n\nAssim como ocorria com a tribo de Levi, os pastores e obreiros que trabalham em tempo integral na obra da pregação do evangelho também devem viver dos dízimos. Deus deu orientação especial quanto a isso. Ele não quer que Sua obra seja prejudicada por falta de recursos. A parte que Deus reservou para Si não deve ser desviada para outro propósito. O ato de ofertar – Assim como o dízimo deve ser levado para a igreja, as ofertas voluntárias também devem ser conduzidas à presença de Deus. O dízimo reflete nossa fidelidade a Deus.\n\n> 5. Além do dízimo, o que mais devemos trazer ao Senhor? Salmo 96:8; Malaquias 3:8.\n\nAs ofertas expressam nossa gratidão por tudo o que Ele nos dá. O dízimo é um percentual definido (10%). As ofertas são proporcionais às bênçãos divinas, segundo o valor que o doador tiver proposto em seu coração (Deuteronômio 16:17; 2 Coríntios 9:7).\n\n> 6. Para Jesus, qual é a essência da verdadeira oferta? Lucas 21:1-4.\n\nDar uma oferta a Deus não é reflexo automático de nossa entrega a Ele. Tanto a viúva pobre quanto homens ricos deram ofertas voluntárias para manter os serviços do templo. Então, qual foi a diferença entre eles? Os ricos deram o que lhes sobrava e o fizeram somente por formalismo religioso. A viúva pobre, apesar de ter dado apenas duas moedas, deu tudo o que possuía. Para Deus, não é a quantia dada que importa, mas o nível de entrega ao Senhor que torna a oferta aceitável diante Dele. A dádiva da viúva estava firmada na certeza de que Deus proveria todas as suas necessidades. Sua oferta vinha do íntimo de seu ser. Para ela, pouco importava o que sobraria. Na verdade, ela não entregou tudo o que tinha. Entregou tudo o que ela era. Isso é sacrifício.\n\n> 7. Que sentimento devemos ter ao entregar os dízimos e as ofertas? 2 Coríntios 9:7.\n\nTudo o que temos e somos vem das mãos bondosas de Deus. Como deveríamos ser gratos pelas bênçãos que recebemos! Essa mesma gratidão deve ser demonstrada por meio de nossas ofertas, com alegria no coração (2 Coríntios 8:5).\n\n## Conclusão\n\nDeus faz uma linda promessa aos fiéis nos dízimos e nas ofertas: abrir as “janelas do Céu” e derramar “bênçãos sem medida” (Malaquias 3:10). Ao contrário do que ocorreu no dilúvio, em que as “janelas do céu” derramaram o juízo divino (Gênesis 7:11), Deus tem derramado um “dilúvio de bênçãos” sobre justos e até mesmo injustos (Mateus 5:45). Porém, é certo que a fidelidade a Deus é um exercício espiritual que traz mais benefícios ao doador. E Deus ainda derrama outras bênçãos! Você deseja isso? Então, seja fiel na devolução dos dízimos e das ofertas.\n\n## Minha decisão\n\n[ ] Aceito que os dízimos e as ofertas fazem parte do plano divino para manutenção de Sua obra.\n\n[ ] Decido devolver, de forma sistemática, a décima parte de todas as minhas rendas para o Senhor.\n\n[ ] Decido devolver, de forma sistemática, minhas ofertas ao Senhor, como expressão de minha gratidão pelas bênçãos recebidas Dele."}, {"titulo": "O que Jesus ensinou sobre Sua volta", "refs": "João 14:1-3 · Mateus 24:27; Apocalipse 1:7 · Mateus 25:31 · Mateus 16:27; Apocalipse 22:12 · 1 Coríntios 15:51-53", "conteudo": "JESUS voltará em glória e majestade! Essa tem sido a bem-aventurada, feliz esperança dos crentes ao longo de milênios. Enoque, o sétimo depois de Adão, já aguardava esse evento (Judas 14). Jó, o primeiro livro da Bíblia a ser escrito, registra as seguintes palavras: “Porque eu sei que o meu Redentor vive e por fim Se levantará sobre a terra” (Jó 19:25). Servos de Deus como Abraão (Hebreus 11:8-10), Davi (Salmo 50:2-4), Isaías (25:8, 9) e Habacuque (3:3-13) nutriam a mesma esperança. De fato, a segunda vinda de Cristo é o clímax do evangelho e do plano da salvação.\n\n## Aprendendo juntos\n\n> 1. Antes de Sua partida, que promessa Jesus fez aos discípulos? João 14:1-3.\n\nAntes de subir ao Céu, Jesus confortou os discípulos com a promessa de Seu retorno. A segunda vinda de Jesus é a nota tônica das Sagradas Escrituras. Esse glorioso acontecimento é mencionado 300 vezes no Novo Testamento e mais de 1.500 vezes em toda a Bíblia. Toda informação foi dada para que não restasse dúvidas sobre a importância e proximidade do evento.\n\n## Como será a volta de Jesus\n\n> 2. Jesus ensinou que Sua volta seria um evento secreto? Mateus 24:27; Apocalipse 1:7.\n\nNão há nada de secreto no retorno de Jesus a este mundo. Será um evento literal, visível e audível. Quarenta dias após a ressurreição, quando Cristo retornava ao Céu, anjos declararam aos discípulos: “Varões galileus, por que estais olhando para as alturas? Esse Jesus que dentre vós foi assunto ao céu virá do modo como O vistes subir” (Atos 1:11). Se, antes de subir, Jesus era um ser pessoal, que podia ser visto (João 20:16) e tocado (João 20:27), que comeu peixe e mel (Lucas 24:42, 43), tudo isso indica que Sua vinda será tão literal e pessoal quanto foi Sua partida.\n\n> 3. Quem acompanhará Jesus em Sua volta? Mateus 25:31.\n\nMilhares de anjos servem a Deus de dia e de noite. Na visão de Daniel sobre o trono de Deus, o profeta descreve que \"milhares de milhares O serviam\" (Daniel 7:10). Todos esses seres celestiais, comissionados por Deus para ajudar na salvação da humanidade (Hebreus 1:13, 14), virão com Jesus naquele dia. Eles terão a missão de reunir as famílias separadas pela morte (Mateus 24:31). Pais reencontrarão os filhos, filhos abraçarão os pais, cônjuges reencontrarão seus amados, irmão encontrará irmão e, por toda a eternidade, as pessoas viverão unidas e felizes.\n\n## Objetivos da volta de Jesus\n\n> 4. Qual será um dos objetivos da volta de Jesus? Mateus 16:27; Apocalipse 22:12.\n\nAlguns ensinam que a recompensa – salvação ou perdição – ocorre assim que a pessoa morre. Esse ensino, porém, não é apoiado pela Bíblia. Na cena do grande julgamento descrita por Jesus é ensinado claramente que a recompensa só será dada no dia de Sua vinda (Mateus 25:31-46).\n\n## Consequências da volta de Jesus\n\nO segundo advento de Cristo afetará as duas grandes divisões da humanidade – aqueles que aceitaram a Jesus e a salvação por Ele oferecida estarão de um lado, e aqueles que a rejeitaram, de outro.\n\n> 5. O que acontecerá com os justos que estiverem vivos? 1 Coríntios 15:51-53.\n\nUm grupo de salvos não provará a morte. Eles são descritos em Apocalipse 7 e 14. São chamados de 144 mil. Receberam o selo de Deus na fronte (testa); passaram pela grande tribulação (Daniel 12:1; Apocalipse 7:13, 14), na qual ocorrerá a “angústia de Jacó” (Jeremias 30:5-7), lavaram suas vestes e as alvejaram no sangue do Cordeiro e por fim serão glorificados, ou seja, em um momento, num abrir e fechar de olhos, desaparecerão todos os vestígios do pecado, e eles receberão um corpo incorruptível e imortal.\n\n> 6. O que acontecerá com os ímpios que estiverem vivos? 2 Tessalonicenses 2:8.\n\nMuitos ímpios morrerão durante os eventos finais da história. Porém, aqueles que estiverem vivos por ocasião da segunda vinda morrerão com o esplendor de Cristo e todos os fenômenos que ocorrerão. Em seu desespero, tentarão se esconder nas cavernas e nas rochas das montanhas. Eles dirão aos montes e rochedos: “Caí sobre nós e escondeinos da face Daquele que Se assenta no trono e da ira do Cordeiro” (Apocalipse 6:16). Contudo, essa é a primeira morte, porém ainda resta para eles uma segunda – a morte eterna (Apocalipse 21:8).\n\n> 7. O que acontecerá com os justos que estiverem mortos? 1 Tessalonicenses 4:15, 16.\n\nJesus comparou a morte a um sono (Lucas 8:52; João 11:11). O Apocalipse chama de bem-aventurados os que morrem no Senhor (Apocalipse 14:13). Na volta de Cristo, é hora de eles despertarem. Paulo declara que Jesus descerá dos céus, e os mortos em Cristo ressuscitarão. Eles saem dos túmulos transformados, ou seja, com um corpo incorruptível e imortal. Nunca mais sentirão as dores ou consequências do pecado.\n\n> 8. O que acontecerá com os ímpios que estiverem mortos? João 5:28, 29; Apocalipse 20:5.\n\nOs ímpios mortos não ressuscitarão na volta de Jesus, porém, apenas mil anos depois dela. Essa é chamada a segunda ressurreição, assinalada pela condenação. Eles ressuscitarão da mesma forma que desceram à sepultura, serão enganados por Satanás e tentarão invadir a cidade santa, a Nova Jerusalém, que desceu do Céu. Quando, porém, marcharem pela superfície da terra, descerá fogo dos céus e os destruirá para sempre (Apocalipse 20:7-9).\n\n## Os sinais da volta de Jesus\n\n> 9. Que sinais preditos por Jesus indicariam Sua vinda? Lucas 21:25, 26.\n\n
